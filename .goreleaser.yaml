# GoReleaser v2 (pinned 2.18.2, ADR-067). One tag builds five binaries, five archives with
# completions, checksums.txt, an SPDX SBOM per archive and a two-platform image on GHCR, into a
# DRAFT GitHub release that only the founder publishes. checksums.txt and the image are signed with
# keyless cosign (GitHub OIDC; no key or secret is stored), which writes the repository and workflow
# identity into the public Sigstore log. release.yml passes --skip=sign only if the repository is
# ever private again. scripts/install.sh checks the signature when cosign is installed.
#
#   make release-check      # a local snapshot, twice, compared byte for byte (nothing is pushed)
version: 2
project_name: deedglass

before:
  hooks:
    - go mod verify
    - ./scripts/completions.sh

builds:
  - id: deedglass
    main: ./cmd/deedglass
    binary: deedglass
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    # -trimpath, then scripts/gcflags.sh's flags, in its order (TestReleaseGcflags checks it).
    flags:
      - -trimpath
      - -gcflags=github.com/deedglass/deedglass/cmd/deedglass/...=-l
      - -gcflags=github.com/deedglass/deedglass/internal/scan=-l
      - -gcflags=github.com/deedglass/deedglass/ee/scanfull=-l
      - -gcflags=github.com/deedglass/deedglass/internal/setup=-l
      - -gcflags=github.com/deedglass/deedglass/internal/doctor=-l
      - -gcflags=github.com/deedglass/deedglass/internal/connector/postgres/setup=-l
      - -gcflags=github.com/deedglass/deedglass/internal/learn/sim=-l
      - -gcflags=github.com/deedglass/deedglass/internal/ledger/fake=-l
      - -gcflags=github.com/deedglass/deedglass/internal/installlinks=-l
      - -gcflags=github.com/deedglass/deedglass/internal/cli/...=-l
      - -gcflags=github.com/deedglass/deedglass/internal/store/migrate=-l
      - -gcflags=github.com/deedglass/deedglass/internal/mcp/snippet=-l
      - -gcflags=github.com/deedglass/deedglass/internal/securitypack/...=-l
      - -gcflags=github.com/deedglass/deedglass/ee/securitypack=-l
      - -gcflags=github.com/deedglass/deedglass/internal/securitypackapi=-l
      - -gcflags=github.com/deedglass/deedglass/internal/weekly/...=-l
      - -gcflags=github.com/deedglass/deedglass/internal/weeklyapi=-l
      - -gcflags=github.com/deedglass/deedglass/ee/agency=-l
      - -gcflags=github.com/deedglass/deedglass/internal/mailer=-l
      - -gcflags=github.com/deedglass/deedglass/internal/caught=-l
      - -gcflags=github.com/deedglass/deedglass/internal/observe=-l
      - -gcflags=github.com/deedglass/deedglass/internal/observeapi=-l
      - -gcflags=github.com/deedglass/deedglass/ee/undosession=-l
      - -gcflags=github.com/deedglass/deedglass/internal/undoapi=-l
      - -gcflags=github.com/deedglass/deedglass/internal/witness/undo=-l
      - -gcflags=github.com/deedglass/deedglass/internal/shellguard=-l
      - -gcflags=github.com/deedglass/deedglass/internal/play=-l
      - -gcflags=github.com/deedglass/deedglass/internal/packs=-l
      - -gcflags=github.com/deedglass/deedglass/internal/agentscript=-l
      - -gcflags=github.com/deedglass/deedglass/internal/connector/github=-l
      - -gcflags=github.com/deedglass/deedglass/internal/connector/stripe=-l
      - -gcflags=github.com/deedglass/deedglass/internal/connector/slack=-l
      - -gcflags=github.com/deedglass/deedglass/internal/connector/gmail=-l
      - -gcflags=github.com/deedglass/deedglass/internal/connector/notion=-l
      - -gcflags=github.com/deedglass/deedglass/internal/connector/fhir=-l
      - -gcflags=github.com/deedglass/deedglass/internal/connectorapi=-l
      - -gcflags=github.com/deedglass/deedglass/internal/mcp/bridge=-l
      - -gcflags=github.com/deedglass/deedglass/internal/store/learnstore=-l
      - -gcflags=github.com/deedglass/deedglass/internal/approve/...=-l
      - -gcflags=github.com/deedglass/deedglass/internal/notify/...=-l
    ldflags:
      - -s -w
      - -X github.com/deedglass/deedglass/internal/buildinfo.Version={{ .Version }}
      - -X github.com/deedglass/deedglass/internal/buildinfo.Commit={{ .FullCommit }}
      - -X github.com/deedglass/deedglass/internal/buildinfo.Date={{ .CommitDate }}
      - -X github.com/deedglass/deedglass/internal/buildinfo.Modified={{ if .IsGitDirty }}true{{ else }}false{{ end }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: deedglass
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "deedglass_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - ee/LICENSE # the binary includes ee/ (FSL-1.1-ALv2); docs/description_test.go keeps it listed
      - README.md
      - CHANGELOG.md
      - completions/*
    builds_info:
      mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archives
    artifacts: archive

signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, "--bundle=${signature}", "${artifact}", "--yes"]
    artifacts: checksum

dockers_v2:
  - id: deedglass
    ids: [deedglass]
    images: [ghcr.io/deedglass/deedglass]
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    dockerfile: Dockerfile.release
    labels:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"

docker_signs:
  - id: images
    cmd: cosign
    artifacts: manifests
    args: [sign, "${artifact}@${digest}", "--yes"]

release:
  draft: true
  prerelease: auto
  github:
    owner: deedglass
    name: deedglass
  name_template: "Deedglass {{ .Version }}"
  # The install script rides along with each release, so `curl …/releases/latest/download/install.sh`
  # comes from the same downloads as the archive (QA-1; raw.githubusercontent.com can stall for
  # minutes on some networks).
  extra_files:
    - glob: ./scripts/install.sh

changelog:
  disable: true

homebrew_casks:
  - name: deedglass
    ids: [deedglass]
    repository:
      owner: deedglass
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: '{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}'
    homepage: https://deedglass.com
    description: The execution and accountability layer for AI agents
    license: Apache-2.0 AND FSL-1.1-ALv2
    completions:
      bash: completions/deedglass.bash
      zsh: completions/deedglass.zsh
      fish: completions/deedglass.fish
    # No post-install hook that clears macOS's quarantine attribute (audit M-05): the binaries aren't
    # notarized yet, so Gatekeeper's first-run check stays the user's call.
