# Test cases for acme-demo-approvals.yaml (S22: make demo-approvals-on). Run them with:
#   deedglass policy test examples/demo/policies/acme-demo-approvals.yaml
# They are acme-demo.cases.yaml's, except that a status update now waits for a person.
policy: acme-demo-approvals.yaml
defaults:
  agent: { name: claude-desktop }
  time: 2026-10-05T10:00:00Z
cases:
  # The native Postgres connector (S17, gateway mode): postgres.query, execute, call, describe
  - name: the native connector's read runs
    input: { tool: { name: postgres.query, connector_type: postgres }, sql: "SELECT id, status FROM orders ORDER BY id DESC LIMIT 5" }
    expect: { decision: allow, rule: allow-order-reads }
  - name: the native connector's status update waits for a person
    input: { tool: { name: postgres.execute, connector_type: postgres }, sql: "UPDATE orders SET status = 'shipped' WHERE id = $1" }
    expect: { decision: require_approval, rule: orders-writes-need-approval }
  - name: another agent's status update still runs, witnessed at L2
    input: { agent: { name: claude-code }, tool: { name: postgres.execute, connector_type: postgres }, sql: "UPDATE public.orders SET status = 'shipped' WHERE id = 42" }
    expect: { decision: allow, rule: allow-order-status-updates }
  - name: the demo's order 42 waits for a person, then Postgres witnesses it (S22)
    input: { tool: { name: postgres.execute, connector_type: postgres }, sql: "UPDATE public.orders SET status = 'shipped' WHERE id = 42" }
    expect: { decision: require_approval, rule: orders-writes-need-approval, approval: { required: 1, approvers: [role:admin], expires_in: 30m } }
  - name: a status update of every order through the native connector never runs
    input: { tool: { name: postgres.execute, connector_type: postgres }, sql: "UPDATE public.orders SET status = 'shipped'" }
    expect: { decision: deny, rule: block-unscoped-writes }
  - name: two status updates in one call through the native connector never run
    input: { tool: { name: postgres.execute, connector_type: postgres }, sql: "UPDATE orders SET status = 'shipped' WHERE id = 42; UPDATE orders SET status = 'shipped' WHERE id = 43" }
    expect: { decision: deny, rule: block-schema-changes }
  - name: a DROP through the native connector gets the brand's sentence
    input: { tool: { name: postgres.execute, connector_type: postgres }, sql: "DROP TABLE public.orders" }
    expect:
      decision: deny
      rule: block-destructive-sql
      message: 'Blocked by policy "block-destructive-sql": DROP is never allowed for agents.'
  - name: an ALTER through the native connector is a schema change
    input: { tool: { name: postgres.execute, connector_type: postgres }, sql: "ALTER TABLE public.orders ADD COLUMN note text" }
    expect: { decision: deny, rule: block-schema-changes }
  - name: how many orders are pending runs through the native connector
    input: { tool: { name: postgres.query, connector_type: postgres }, sql: "SELECT count(*) FROM public.orders WHERE status = 'pending'" }
    expect: { decision: allow, rule: allow-order-reads }
  - name: a refund through the native connector waits for a person
    input: { tool: { name: postgres.execute, connector_type: postgres }, sql: "INSERT INTO refunds (id, order_id, amount_cents, reason, created_at) VALUES (999, 42, 500, 'damaged', now())" }
    expect: { decision: require_approval, rule: orders-writes-need-approval }
  - name: an update across two tables through the native connector waits for a person
    input: { tool: { name: postgres.execute, connector_type: postgres }, sql: "UPDATE orders SET status = 'refunded' FROM refunds WHERE refunds.order_id = orders.id AND refunds.id = 7" }
    expect: { decision: require_approval, rule: orders-writes-need-approval }
  - name: the native connector never deletes orders
    input: { tool: { name: postgres.execute, connector_type: postgres }, sql: "DELETE FROM orders WHERE id = 42" }
    expect: { decision: deny, rule: no-deletes-on-orders }
  - name: the native connector never runs DROP
    input: { tool: { name: postgres.execute, connector_type: postgres }, sql: "DROP TABLE orders" }
    expect: { decision: deny, rule: block-destructive-sql }
  - name: shipping an order through the controlled function runs
    input: { tool: { name: postgres.call, connector_type: postgres }, args: { function: public.ship_order, args: { p_order_id: 42 } } }
    expect: { decision: allow, rule: allow-ship-order }
  - name: describing the schema runs
    input: { tool: { name: postgres.describe, connector_type: postgres } }
    expect: { decision: allow, rule: allow-schema-browsing }
  # The orders database (proxy mode through deedglass mcp wrap --connector-type postgres)
  - name: the five newest orders run
    input: { tool: { name: orders.execute_sql, connector_type: postgres }, sql: "SELECT id, status, total_cents FROM public.orders ORDER BY created_at DESC LIMIT 5" }
    expect: { decision: allow, rule: allow-order-reads }
  - name: a count of cancelled orders runs
    input: { tool: { name: orders.execute_sql, connector_type: postgres }, sql: "SELECT count(*) FROM public.orders WHERE status = 'cancelled'" }
    expect: { decision: allow, rule: allow-order-reads }
  - name: DROP never runs, with the brand's sentence
    input: { tool: { name: orders.execute_sql, connector_type: postgres }, sql: "DROP TABLE refunds" }
    expect:
      decision: deny
      rule: block-destructive-sql
      message: 'Blocked by policy "block-destructive-sql": DROP is never allowed for agents.'
  - name: a DROP hidden behind a comment never runs
    input: { tool: { name: orders.execute_sql, connector_type: postgres }, sql: "/* cleanup */ drop table public.refunds" }
    expect: { decision: deny, rule: block-destructive-sql }
  - name: a DROP smuggled after a read is refused as multi-statement
    input: { tool: { name: orders.execute_sql, connector_type: postgres }, sql: "SELECT 1; DROP TABLE refunds" }
    expect: { decision: deny, rule: block-schema-changes }
  - name: a read smuggling an update is refused as multi-statement
    input: { tool: { name: orders.execute_sql, connector_type: postgres }, sql: "SELECT 1; UPDATE public.orders SET status = 'shipped' WHERE id = 42" }
    expect: { decision: deny, rule: block-schema-changes }
  - name: ALTER is a schema change
    input: { tool: { name: orders.execute_sql, connector_type: postgres }, sql: "ALTER TABLE public.orders ADD COLUMN note text" }
    expect: { decision: deny, rule: block-schema-changes }
  - name: GRANT is a privilege change
    input: { tool: { name: orders.execute_sql, connector_type: postgres }, sql: "GRANT ALL ON public.orders TO PUBLIC" }
    expect: { decision: deny, rule: block-schema-changes }
  - name: a DO block is server code
    input: { tool: { name: orders.execute_sql, connector_type: postgres }, sql: "DO $$ BEGIN PERFORM 1; END $$" }
    expect: { decision: deny, rule: block-schema-changes }
  - name: UPDATE without WHERE never runs
    input: { tool: { name: orders.execute_sql, connector_type: postgres }, sql: "UPDATE public.orders SET status = 'shipped'" }
    expect: { decision: deny, rule: block-unscoped-writes, reason_contains: WHERE }
  - name: DELETE without WHERE never runs
    input: { tool: { name: orders.execute_sql, connector_type: postgres }, sql: "DELETE FROM public.orders" }
    expect: { decision: deny, rule: block-unscoped-writes }
  - name: deleting the cancelled orders never runs
    input: { tool: { name: orders.execute_sql, connector_type: postgres }, sql: "DELETE FROM orders WHERE status = 'cancelled'" }
    expect:
      decision: deny
      rule: no-deletes-on-orders
      message: "Blocked by policy \"no-deletes-on-orders\": Agents never delete orders. Set the status to 'cancelled' instead."
  - name: a delete inside a CTE is still a delete
    input: { tool: { name: orders.execute_sql, connector_type: postgres }, sql: "WITH d AS (DELETE FROM public.refunds WHERE id = 1 RETURNING id) SELECT count(*) FROM d" }
    expect: { decision: deny, rule: no-deletes-on-orders }
  - name: marking order 42 as shipped waits for a person
    input: { tool: { name: orders.execute_sql, connector_type: postgres }, sql: "UPDATE orders SET status = 'shipped' WHERE id = 42" }
    expect: { decision: require_approval, rule: orders-writes-need-approval, approval: { required: 1, approvers: [role:admin], expires_in: 30m } }
  - name: an INSERT waits for a person
    input: { tool: { name: orders.execute_sql, connector_type: postgres }, sql: "INSERT INTO public.refunds (order_id, amount_cents, reason) VALUES (42, 500, 'demo')" }
    expect: { decision: require_approval, rule: orders-writes-need-approval }
  - name: listing schemas runs
    input: { tool: { name: orders.list_schemas, connector_type: postgres }, args: {} }
    expect: { decision: allow, rule: allow-schema-browsing }
  - name: listing objects runs
    input: { tool: { name: orders.list_objects, connector_type: postgres }, args: { schema_name: public } }
    expect: { decision: allow, rule: allow-schema-browsing }
  - name: object details run
    input: { tool: { name: orders.get_object_details, connector_type: postgres }, args: { schema_name: public, object_name: orders } }
    expect: { decision: allow, rule: allow-schema-browsing }
  - name: a plain EXPLAIN runs
    input: { tool: { name: orders.explain_query, connector_type: postgres }, sql: "SELECT * FROM public.orders WHERE id = 42" }
    expect: { decision: allow, rule: allow-plain-explain }
  - name: EXPLAIN with analyze true runs the statement, so it is denied
    input: { tool: { name: orders.explain_query, connector_type: postgres }, sql: "SELECT * FROM public.orders WHERE id = 42", args: { analyze: true } }
    expect: { decision: deny }
  - name: EXPLAIN ANALYZE of a DELETE in the SQL text is denied
    input: { tool: { name: orders.explain_query, connector_type: postgres }, sql: "EXPLAIN ANALYZE DELETE FROM public.orders WHERE id = 42" }
    expect: { decision: deny }
  - name: other orders tools fall to the default deny
    input: { tool: { name: orders.analyze_db_health, connector_type: postgres }, args: {} }
    expect: { decision: deny, code: policy_denied }
  - name: the 31st call in a minute is over the agent budget
    input: { tool: { name: orders.execute_sql, connector_type: postgres }, sql: "SELECT 1", usage: { calls_minute: 30 } }
    expect: { decision: deny, code: budget_exceeded }
  # The everything upstream (the MCP gateway)
  - name: everything echo runs
    input: { tool: { name: everything.echo, connector_type: mcp_http }, args: { message: hello } }
    expect: { decision: allow, rule: allow-everything-demo-tools }
  - name: everything get-env is denied by default (it would show the server's environment)
    input: { tool: { name: everything.get-env, connector_type: mcp_http }, args: {} }
    expect: { decision: deny }
  # The fake connector
  - name: a fake echo runs
    input: { tool: fake.echo, args: { message: hello } }
    expect: { decision: allow, rule: allow-fake }
  # Reads
  - name: reading a file in the demo folder runs
    input: { tool: scratch.read_text_file, args: { path: /tmp/deedglass-demo/allowed/hello.txt } }
    expect: { decision: allow, rule: allow-scratch-reads }
  - name: reading several files runs
    input: { tool: scratch.read_multiple_files, args: { paths: [/tmp/deedglass-demo/allowed/hello.txt] } }
    expect: { decision: allow, rule: allow-scratch-reads }
  - name: listing a directory runs
    input: { tool: scratch.list_directory, args: { path: /tmp/deedglass-demo } }
    expect: { decision: allow, rule: allow-scratch-reads }
  - name: file info runs
    input: { tool: scratch.get_file_info, args: { path: /tmp/deedglass-demo/allowed/hello.txt } }
    expect: { decision: allow, rule: allow-scratch-reads }
  - name: searching runs
    input: { tool: scratch.search_files, args: { path: /tmp/deedglass-demo, pattern: hello } }
    expect: { decision: allow, rule: allow-scratch-reads }
  - name: the directory tree runs
    input: { tool: scratch.directory_tree, args: { path: /tmp/deedglass-demo } }
    expect: { decision: allow, rule: allow-scratch-reads }
  # Writes
  - name: writing inside allowed runs
    input: { tool: scratch.write_file, args: { path: /tmp/deedglass-demo/allowed/notes.txt, content: hi } }
    expect: { decision: allow, rule: scratch-writes-in-allowed }
  - name: editing inside allowed runs
    input: { tool: scratch.edit_file, args: { path: /tmp/deedglass-demo/allowed/notes.txt, edits: [] } }
    expect: { decision: allow, rule: scratch-writes-in-allowed }
  - name: writing outside allowed is blocked
    input: { tool: scratch.write_file, args: { path: /tmp/deedglass-demo/outside.txt, content: test } }
    expect:
      decision: deny
      rule: scratch-writes-only-in-allowed
      code: policy_denied
      message: 'Blocked by policy "scratch-writes-only-in-allowed": Agents may only write inside /tmp/deedglass-demo/allowed.'
  - name: a .. traversal out of allowed is blocked
    input: { tool: scratch.write_file, args: { path: /tmp/deedglass-demo/allowed/../outside.txt, content: x } }
    expect: { decision: deny, rule: scratch-writes-only-in-allowed }
  - name: the allowed folder itself without a trailing slash is not a file inside it
    input: { tool: scratch.write_file, args: { path: /tmp/deedglass-demo/allowed, content: x } }
    expect: { decision: deny, rule: scratch-writes-only-in-allowed }
  - name: a look-alike prefix is blocked
    input: { tool: scratch.write_file, args: { path: /tmp/deedglass-demo/allowed-not/x.txt, content: x } }
    expect: { decision: deny, rule: scratch-writes-only-in-allowed }
  - name: a write with no path is blocked
    input: { tool: scratch.write_file, args: { content: x } }
    expect: { decision: deny, rule: scratch-writes-only-in-allowed }
  - name: editing outside allowed is blocked
    input: { tool: scratch.edit_file, args: { path: /etc/hosts, edits: [] } }
    expect: { decision: deny, rule: scratch-writes-only-in-allowed }
  # Undo (S23): a person's undo through the console system agent waits for another person.
  - name: an undo waits for a countersign
    input:
      tool: postgres.undo
      agent: { name: console }
      args: { undoes: act_01jb8m2x7k4q9r3t5v6w8y0z1a, plan_digest: "sha256:c0a4", allow_triggers: false, reason: Trigger bug touched 300 extra orders. }
    expect: { decision: require_approval, rule: undo-needs-approval, approval: { required: 1 }, verify: L2 }
  # Everything else
  - name: moving a file is denied by default
    input: { tool: scratch.move_file, args: { source: /tmp/deedglass-demo/allowed/a, destination: /tmp/deedglass-demo/b } }
    expect: { decision: deny, code: policy_denied }
  - name: creating a directory is denied by default
    input: { tool: scratch.create_directory, args: { path: /tmp/deedglass-demo/new } }
    expect: { decision: deny }
