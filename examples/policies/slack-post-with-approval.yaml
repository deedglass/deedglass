# slack-post-with-approval · a Deedglass starter policy
#
# Reads and reactions run freely. Agents post on their own only in the channels
# you allow-list; a message anywhere else waits for a human. A message that
# notifies a whole channel (<!channel>, <!here> or <!everyone>) always waits for
# a human, even in an allow-listed channel. Anything not named here, like
# deleting messages, is refused by the default.
#
# Edit the channel list in "allow-listed-channels". List a channel by its name
# and by its id (like C0AGENTUPD), because agents may send either. Then check
# your change:
#   deedglass policy test examples/policies/slack-post-with-approval.yaml
deedglass: policy/v1
name: slack-post-with-approval
description: Agents post on their own in allow-listed channels. Everywhere else waits for a human.

defaults:
  decision: deny
  reason: No rule allows this action. Add a rule in Console › Policies to allow it.
  verify: L0

rules:
  - id: slack-reads
    match: { tool: ["slack.get_*", "slack.list_*", "slack.search_*"] }
    decision: allow
  - id: reactions
    match: { tool: [slack.add_reaction, slack.remove_reaction] }
    decision: allow
  - id: no-broadcast-mentions
    match: { tool: [slack.post_message, slack.update_message, slack.schedule_message] }
    when: >-
      has(args.text) && (args.text.contains("<!channel>") || args.text.contains("<!here>")
      || args.text.contains("<!everyone>"))
    decision: require_approval
    reason: Messages that notify a whole channel wait for a human. An admin can approve in Console › Approvals.
    approval: { approvers: [role:admin], required: 1, expires_in: 1h }
    notify: [slack]
    verify: L1
  - id: allow-listed-channels
    match: { tool: [slack.post_message, slack.update_message, slack.schedule_message] }
    when: args.channel in ["#agent-updates", "C0AGENTUPD"]
    decision: allow
    verify: L1
  - id: other-channels-need-approval
    match: { tool: [slack.post_message, slack.update_message, slack.schedule_message] }
    decision: require_approval
    reason: Posts outside the allow-listed channels wait for a human. An admin can approve in Console › Approvals, or add the channel in Console › Policies.
    approval: { approvers: [role:admin], required: 1, expires_in: 1h }
    notify: [slack]
    verify: L1
