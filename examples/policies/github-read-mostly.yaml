# github-read-mostly · a Deedglass starter policy
#
# Reads run freely. Agents can open issues, comment, create branches, commit to
# feature branches and open pull requests. Commits and pull requests that target
# main, master or a release branch wait for a human, and so does closing an issue.
# Merging, deleting branches and other destructive actions never run.
#
# To adapt it, edit the protected branch names in
# "protected-branch-writes-need-approval" and "pull-requests-to-main-need-approval"
# (for example, add "develop"). Then check your change:
#   deedglass policy test examples/policies/github-read-mostly.yaml
deedglass: policy/v1
name: github-read-mostly
description: Reads, issues and feature branches run. Protected branches wait for a human. Merges never run.

defaults:
  decision: deny
  reason: No rule allows this action. Add a rule in Console › Policies to allow it.
  verify: L0

rules:
  - id: github-reads
    match: { tool: ["github.get_*", "github.list_*", "github.search_*"] }
    decision: allow
  - id: issues-and-comments
    description: Opening, editing and commenting on issues. Closing one is handled below.
    match: { tool: [github.create_issue, github.update_issue, github.add_issue_comment] }
    when: '!has(args.state) || args.state != "closed"'
    decision: allow
    verify: L1
  - id: branches
    match: { tool: github.create_branch }
    decision: allow
  - id: protected-branch-writes-need-approval
    description: A commit with no branch goes to the default branch, so it counts as protected.
    match: { tool: github.create_or_update_file }
    when: '!has(args.branch) || args.branch in ["main", "master"] || args.branch.startsWith("release/")'
    decision: require_approval
    reason: Commits to main, master or a release branch wait for a human. Commit to a feature branch instead, or ask an admin to approve in Console › Approvals.
    approval: { approvers: [role:admin], required: 1, expires_in: 2h }
    notify: [slack]
    verify: L1
  - id: feature-branch-writes
    match: { tool: github.create_or_update_file }
    decision: allow
    verify: L1
  - id: pull-requests-to-main-need-approval
    description: Opening a pull request into a protected branch, or retargeting one there.
    match: { tool: [github.create_pull_request, github.update_pull_request] }
    when: >-
      (tool.name == "github.create_pull_request" && !has(args.base))
      || (has(args.base) && (args.base in ["main", "master"] || args.base.startsWith("release/")))
    decision: require_approval
    reason: Pull requests into main, master or a release branch wait for a human. An admin can approve in Console › Approvals.
    approval: { approvers: [role:admin], required: 1, expires_in: 2h }
    notify: [slack]
    verify: L1
  - id: pull-requests
    match: { tool: [github.create_pull_request, github.update_pull_request] }
    decision: allow
    verify: L1
  - id: no-merges-or-branch-deletes
    match: { tool: [github.merge_pull_request, github.delete_branch] }
    decision: deny
    reason: Merging and deleting branches stay with humans on GitHub.
  - id: closing-issues-needs-approval
    match: { tool: github.update_issue }
    when: has(args.state) && args.state == "closed"
    decision: require_approval
    reason: Closing an issue waits for a human. An admin can approve in Console › Approvals.
    approval: { approvers: [role:admin], required: 1, expires_in: 24h }
    verify: L1
  - id: block-other-destructive
    match: { side_effect: destructive }
    decision: deny
    reason: Destructive changes stay with people. Make this change on GitHub, or ask an admin to add a rule in Console › Policies.
    notify: [slack]
