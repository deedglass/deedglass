# acme-sim, version 3 · the replay demo for the simulated Acme store
#
# Insights replays the simulated week against this version to show what it would have decided.
# Nothing here is a real store: the agents, customers and amounts are made up.
#
# Version 1 with two changes: a single-row status update of an order runs on its own (witnessed
# at L2) instead of waiting for a person, and the refund limit drops from $100.00 to $75.00, so
# some refunds version 1 allowed would be refused.
#
# Amounts are in minor units, the way Stripe takes them: 2400 is $24.00.
#
#   deedglass policy test examples/sim/acme-sim.v3.yaml --require-coverage --voice
deedglass: policy/v1
name: acme-sim
description: Simulated Acme store (deedglass dev simulate), version 3. Order status updates run on their own and the refund limit is $75.00.

defaults:
  decision: deny
  reason: No rule allows this action. Add a rule in Console › Policies to allow it.

budgets:
  # All agents together refund at most $4,000.00 a day (the org's calendar day). The support
  # bot's usual day is about $1,800.00 of refunds, well under 80% of this cap; the simulator's
  # budget_pressure incident adds refunds until a day reaches 95% of it. Refunds this policy
  # denies never count, because a deny drops its reservation.
  - id: refunds-per-day
    description: At most $4,000.00 of refunds a day, across every agent in the org.
    match: { tool: stripe.create_refund }
    per: org
    window: day
    max_spend: "4000.00 usd"
    measure: 'has(args.amount) && type(args.amount) == int ? args.amount : 0'

rules:
  # DROP and TRUNCATE anywhere in the SQL, or a DELETE with no WHERE, never run.
  - id: block-destructive-sql
    match: { tool: "postgres.*" }
    when: '"drop" in sql.kinds || "truncate" in sql.kinds || (sql.unbounded_write && "delete" in sql.write_kinds)'
    decision: deny
    reason: DROP, TRUNCATE and DELETE without a WHERE clause are never allowed for agents.

  # Replaces refund-limit: a refund over $75.00 (version 1 said $100.00), or one without a
  # whole-number amount, never runs.
  - id: refund-limit-strict
    match: { tool: stripe.create_refund }
    when: '!has(args.amount) || type(args.amount) != int || args.amount <= 0 || args.amount > minor("75.00 usd")'
    decision: deny
    reason: Refunds over $75.00 are never made by agents. A person can refund it in the Stripe Dashboard.

  # Every other refund runs, inside the daily cap above.
  - id: allow-refunds
    match: { tool: stripe.create_refund }
    decision: allow

  # Replaces approve-order-updates: a single-statement update of public.orders alone, with a
  # WHERE clause, runs on its own, and Postgres witnesses it at L2. Other order writes fall
  # through to the rules below.
  - id: allow-order-status-updates
    description: Single-order status changes run; Postgres witnesses every one.
    match: { tool: postgres.execute }
    when: >-
      sql.kind == "update" && sql.tables == ["public.orders"] && sql.tables_complete
      && !sql.unbounded_write && !sql.multi && !sql.cte_write && size(sql.unknown_functions) == 0
    decision: allow
    verify: L2

  # Other single-statement inserts and updates with a WHERE clause run, like the inventory
  # reservations the ops agent makes.
  - id: allow-db-writes
    match: { tool: postgres.execute }
    when: >-
      sql.kind in ["insert", "update"] && !sql.multi && !sql.ambiguous && !sql.unbounded_write
      && !sql.cte_write
    decision: allow

  # Plain reads run.
  - id: allow-db-reads
    match: { tool: postgres.query }
    when: sql.category == "read" && !sql.writes
    decision: allow

  # Drafts wait in Gmail for a person to send them.
  - id: allow-gmail-drafts
    match: { tool: gmail.create_draft }
    decision: allow

  # Slack posts run in any channel in version 1.
  - id: allow-slack-posts
    match: { tool: slack.post_message }
    decision: allow

  # Appending blocks to a Notion page runs.
  - id: allow-notion-appends
    match: { tool: notion.append_block }
    decision: allow
  # github.merge_pr and every other tool fall to the default deny.
