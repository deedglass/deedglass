# deedglass.example.yaml: every setting Deedglass reads, with its default. Copy it to
# deedglass.yaml and keep only what you change. The environment wins over this file; see
# docs/CONFIG.md for precedence.
#
# Rules for deedglass.yaml:
#   - Keys are the DEEDGLASS_* names without the prefix, in lowercase.
#   - No anchors, aliases or merge keys; one document; at most 64 KiB.
#   - Secrets don't belong here. Prod refuses them; set them in the environment instead.
#     (vault_key, api_key_pepper, resend_api_key, anthropic_api_key, api_key, and a
#     database_url that contains a password.)

# dev or prod. Prod ignores .env and .deedglass/dev-secrets.json and refuses unsafe settings.
# env: dev

# The control-plane Postgres URL. Prod needs sslmode=require or verify-full to a remote host.
# A URL without a password may live here; one with a password goes in the environment.
# database_url: postgres://deedglass_app@127.0.0.1:55432/deedglass?sslmode=disable

# The migrator role's URL, used only by `deedglass migrate` (dev falls back to database_url).
# migrate_database_url: postgres://deedglass_migrator@127.0.0.1:55432/deedglass?sslmode=disable

# Where the API, the Gate and the Console listen.
# listen: 127.0.0.1:8080

# The URL people and agents use to reach this server. Prod needs https.
# base_url: http://127.0.0.1:8080

# The seal key file (deedglass keys gen creates one).
# seal_key_file: .deedglass/seal.key

# An ML-DSA-65 seal key file (deedglass keys rotate --alg ML-DSA-65). With it, deeds carry a
# second, post-quantum seal beside Ed25519 (deed v2).
# seal_pq_key_file: .deedglass/keys/sk_….json

# debug, info, warn or error.
# log_level: info

# invite or closed.
# signup: invite

# The From address of sign-in and invite emails. Required with the Resend API key (set that in the
# environment, never here).
# mail_from: "Deedglass <signin@example.com>"
# The Claude model that rewords Insights suggestions, when an org turns phrasing on and
# DEEDGLASS_ANTHROPIC_API_KEY is set (S28).
# anthropic_model: claude-sonnet-5-5

# Proxies whose X-Forwarded-For is believed, as CIDRs.
# trusted_proxies: [10.0.0.0/8]

# Dev only: let connectors reach private networks and loopback. Prod refuses it. Cloud metadata
# and reserved addresses stay unreachable even with it (docs/NETWORK_EGRESS.md).
# allow_private_networks: false

# Private networks connectors may reach in any env, as CIDRs (S16). Never metadata, reserved,
# IPv4-embedding or loopback ranges. Deedglass's own database needs its exact address (/32).
# egress_allow_cidrs: 10.20.0.0/16,10.30.0.0/16

# A separate listener for Prometheus metrics at /metrics. Off when unset; keep it on localhost.
# metrics_listen: 127.0.0.1:9464

# Alert when a Postgres replication slot holds more WAL than this many MB.
# slot_lag_alert_mb: 512
# Dev only: decoder runners stop reading after their current poll (tests of late evidence). Refused in prod.
# decoder_pause: false
# Lockdown mode for every org on this server: the strictest setup (docs/LOCKDOWN.md).
# lockdown: false

# Client commands (CLI, mcp, SDKs): the server to talk to.
# server: https://api.deedglass.com
# mcp serve: a file holding the agent key (0600), when DEEDGLASS_API_KEY is unset.
# api_key_file: /home/you/.deedglass/agent-orders-db-agent.key

# The CLI's terminal mark (docs/CLI.md, "Banner and quiet mode"). It never shows in pipes,
# CI or --json. These are usually set in the shell, not here.
# no_banner: false
# theme: auto   # auto, light or dark
# no_anim: false
# no_star: false   # the GitHub star note after a scan (at most once per machine)

# Pro licence (docs/LICENSING.md). Only deedglass licence and scan --full read these; free
# commands never open the licence. Usually set in the shell, not here.
# licence_file: .deedglass/licence.json
# no_network: false        # never call Dodo Payments or deedglass.com
# licence_mode: live       # live, or test for Dodo test-mode keys
# licence_server: https://deedglass.com

# The Gate (docs/GATE.md). These settings live only in this file, never in the environment;
# docs/CONFIG.md has the ranges. Uncomment the section line and the lines you change.
# gate:
#   # How long POST /v1/actions waits for a gateway action before it answers 202 processing (at most 25s).
#   wait_timeout: 10s
#   # How long a connector call may run. Past it, the outcome is unknown and the deed says UNVERIFIABLE.
#   execute_timeout: 30s
#   # Proxy mode: how long the edge has to report a result before the action is sealed UNVERIFIABLE.
#   edge_result_timeout: 10m
#   # The largest args object POST /v1/actions accepts, in bytes (at most 262144, 256 KiB).
#   max_args_bytes: 262144
#   # The largest tool result stored on the action, in bytes. Larger results keep only their digest.
#   max_result_bytes: 262144
#   worker:
#     # Witness jobs one instance runs at once.
#     concurrency: 4
#     # Attempts per witness job that can't run before the Witness decides without it (witness_gave_up).
#     max_attempts: 8

# The Witness (docs/WITNESS.md, S19). File-only, like gate.
# witness:
#   # The longest an L1 read-back may hold the request path (100ms to 5s). Past it, the worker finishes it.
#   inline_budget: 1500ms
#   # The worker's limit for one read-back job.
#   readback_timeout: 10s
#   # The largest witness_detail, in bytes; beyond it, diff rows and evidence are cut and counted.
#   max_detail_bytes: 65536

# The decoder (docs/DECODER.md, S20): reads what each witnessed Postgres database committed.
# File-only, like gate. A connector opts in with witness.enabled: true in its own config.
# decoder:
#   enabled: true
#   transport: peek
#   # How often a runner reads its slot while an action waits for L2 evidence, and otherwise.
#   poll_active: 100ms
#   poll_idle: 1s
#   # Rows one read asks for; whole transactions always come in full.
#   batch_changes: 5000
#   # Row changes per transaction whose before and after images are kept (counts cover all).
#   max_images_per_tx: 1000
#   heartbeat_interval: 10s
#   heartbeat_deadline: 60s
#   lease: 15s
#   reconcile_interval: 60s
#   # How long frames (with row images) are kept; unattributed and forged-marker frames stay 30 days.
#   retention: 168h

# MCP (docs/MCP.md, S15). File-only, like gate.
# mcp:
#   # Browser origins allowed to call /mcp/* (scheme and host only). Empty: none but the server's own.
#   allowed_origins: []
#   # Method families forwarded to upstreams and logged (never sealed): resources, prompts, completion.
#   passthrough: []
#   # How tools/list spells tools: safe (postgres_query, deedglass_check_approval; the default,
#   # accepted by the Anthropic and OpenAI APIs) or dotted (postgres.query, the listing in 0.7 and
#   # earlier; deprecated). tools/call takes either spelling, and policies keep the dotted names.
#   tool_names: safe
#   # Remote MCP servers the gateway fronts at /mcp/<name>. https only (http needs
#   # allow_private_networks in dev). Header values come from the environment, never this file, and
#   # the variable names can't start with DEEDGLASS_.
#   upstreams:
#     everything:
#       url: https://mcp.example.com/mcp
#       headers_from_env: {Authorization: EVERYTHING_MCP_AUTH}
#       timeout: 30s
#       tools_ttl: 30s

# Approvals (docs/APPROVALS.md, S22). File-only.
# approvals:
#   # When neither the rule nor the policy's defaults set expires_in. Timeout means no.
#   default_expires_in: 30m
#   # The connector's estimate (Postgres: EXPLAIN, never ANALYZE) while the approval is prepared.
#   estimate_timeout: 500ms
#   context_max_bytes: 32768
#   # Emailed links work once, for one person, never past the approval's expiry.
#   link_max_ttl: 24h
#   link_status_window: 15m
#   max_recipients: 20

# Webhooks (docs/WEBHOOKS.md, S22). File-only.
# webhooks:
#   timeout: 10s
#   # Retries after the first attempt: 30s, 2m, 10m, 30m, 1h, 3h, 6h, 12h (±20%), then dead.
#   max_attempts: 8
#   disable_after: 72h
#   max_endpoints_per_org: 16

# Head timestamps (docs/TIMESTAMPS.md, TY-03). File-only and off by default: with no TSA and no
# transparency service listed, nothing is timestamped and no request goes out.
# timestamps:
#   # RFC 3161 TSAs, comma-separated. Each timestamp asks every one; min_tsa must answer.
#   tsa_urls: https://tsa-one.example/tsr, https://tsa-two.example/tsr
#   min_tsa: 2
#   # Optional: a transparency service (IETF SCITT) and its public key as a JWK file.
#   scitt_url: https://ts.example
#   scitt_key_file: .deedglass/scitt-key.jwk
#   # Each tar.gz export timestamps its last deed and carries timestamps.json.
#   at_export: true
#   timeout: 10s
