# CI on push to main and on pull requests (plan §9.1: while the repo is private, GitHub Free has about
# 2,000 Actions minutes a month, so push/PR runs lint + unit + one PG 18.6 integration job only; the
# 16.15/17.11/18.6 matrix is in pg-matrix.yml, on demand and nightly).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # banned-words also checks every commit message
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go.mod and go.sum tidy and verified
        run: go mod tidy -diff && go mod verify
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: no-cgo build of the binary
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/deedglass
      - name: test vectors unchanged
        working-directory: testdata
        run: sha256sum --quiet -c SHA256SUMS
      - name: rename guard (retired identifiers, ADR-012)
        run: scripts/rename_guard.sh
      - name: banned words (files and commit messages)
        run: scripts/banned_words.sh --commits HEAD

  integration-pg18:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6
        command: postgres -c wal_level=logical -c max_slot_wal_keep_size=2GB
        env:
          POSTGRES_PASSWORD: deedglass-ci-throwaway
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - name: apply sql/001-004 and run the smoke checks
        env:
          DEEDGLASS_IT_THROWAWAY: "1"
          PSQL: docker exec -i ${{ job.services.postgres.id }} psql
          PGUSER: postgres
        run: scripts/integration.sh
