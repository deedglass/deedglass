# MCP Registry (VIRAL-3). Publishes server.json to registry.modelcontextprotocol.io as
# io.github.deedglass/deedglass. GitHub OIDC shows the deedglass org owns the namespace, so no
# login or secret is needed. The registry checks that the npm package named in server.json
# (deedglass@<version>) carries the same mcpName, so it runs only once npm serves that version.
# release.yml calls it after publish-npm on every vX.Y.Z tag (not release candidates), so the entry
# follows npm; run it by hand (gh workflow run mcp-registry.yml) to republish the current server.json.
name: mcp-registry

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mcp-publisher v1.8.1 (checksum pinned)
        run: |
          curl -fsSLo mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Wait until npm serves the version server.json names, with the same mcpName (up to 10 min)
        run: |
          v="$(jq -r .version server.json)"; want="$(jq -r .name server.json)"
          for i in $(seq 1 40); do
            got="$(npm view "deedglass@$v" mcpName 2>/dev/null || true)"
            [ "$got" = "$want" ] && exit 0
            echo "npm doesn't serve deedglass@$v with mcpName $want yet (got '${got}'); try $i of 40"
            sleep 15
          done
          exit 1
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
