# Release (S35, ADR-067). Runs only when the founder pushes a tag vX.Y.Z or vX.Y.Z-rc.N.
#
#   verify       the tagged commit is on main, then make ci, integration on PG 18.6, the attack suite
#                (its result records the tag), fuzz-regress, audit and the docs build. No secret is
#                available to this job.
#   release      GoReleaser: 5 binaries, 5 archives, checksums.txt, an SPDX SBOM per archive and a
#                linux/amd64 + linux/arm64 image on GHCR, into a DRAFT GitHub release. Prereleases
#                never move latest or X.Y. While the repository is private nothing is signed:
#                keyless signing and GitHub artifact attestations write the repository and workflow
#                identity into a public log (and attestations need a public repo on the Free plan).
#                grype scans the image SBOM and fails on fixable high or critical findings.
#   sdk-build    npm pack and the Python wheel and sdist, attached to the draft release.
#   npm-stage    every release: scripts/npm-publish.mjs stages the seven npm packages from this run's
#                GoReleaser archives (checked against checksums.txt) and the SDK tarball, packs them
#                and prints the publish plan. Read-only; nothing reaches npm.
#   publish-npm  OFF unless the repository variable DEEDGLASS_PUBLISH_NPM is 'true'; environment npm,
#                whose deployment policy allows v* tags only (npm checks the repository, workflow and
#                environment, never the ref; see docs/RELEASING.md). Publishes the staged packages in
#                order (the five platform packages, the deedglass wrapper, @deedglass/sdk) over npm
#                trusted publishing (GitHub OIDC, no token), with provenance when the repository is
#                public; skips a package@version npm already has (a platform package only when it holds
#                this run's binary); a prerelease goes to the next dist-tag.
#   publish-pypi OFF unless DEEDGLASS_PUBLISH_PYPI is 'true'; environment pypi (trusted publishing,
#                v* tags only, like npm).
#   deploy-docs  OFF unless DEEDGLASS_DEPLOY_DOCS is 'true'; needs the CLOUDFLARE_API_TOKEN secret.
#
# scripts/check-workflows.sh (in make ci) fails if a gate, an environment or the on-main check
# disappears, if a job outside release, publish-npm and publish-pypi asks for id-token: write, if any
# job gets write-all, or if a uses: line isn't pinned to a full commit SHA.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the tagged commit is on main (a tag on an unmerged branch publishes nothing)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git rev-parse -q --verify refs/remotes/origin/main >/dev/null || git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo "✕ $TAG ($(git rev-parse --short HEAD)) isn't on main. Next: merge it after green CI, then tag main."; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: the tag, CHANGELOG.md and the SDK versions agree
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/check-versions.sh "$TAG"
      - name: make ci
        run: make ci PY=python3
      - name: integration on PostgreSQL 18.6 (Docker)
        run: DEEDGLASS_IT_MODE=docker make integration
      - name: the attack suite, recorded against this tag
        env:
          DEEDGLASS_IT_ATTACK_VERSION: ${{ github.ref_name }}
        run: DEEDGLASS_IT_MODE=docker make attack
      - name: fuzz corpus replay
        run: make fuzz-regress
      - name: supply-chain audit
        run: make audit
      - name: docs build
        run: make docs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attack-results
          path: attack/results/latest.json

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    outputs:
      private: ${{ steps.vis.outputs.private }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: the Console, embedded in the binary
        run: make web-build
      - id: vis
        name: is the repository public
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: echo "private=$PRIVATE" >> "$GITHUB_OUTPUT"
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.vis.outputs.private == 'false'
        with:
          cosign-release: v3.1.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
      - name: goreleaser (signing only when public)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.2
          args: >-
            release --clean --release-notes ${{ runner.temp }}/notes.md
            ${{ steps.vis.outputs.private == 'false' && ' ' || '--skip=sign' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: the archives and checksums.txt, for npm-stage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archives
          if-no-files-found: error
          path: |
            dist/checksums.txt
            dist/deedglass_*.tar.gz
            dist/deedglass_*.zip
      - name: image SBOM
        env:
          TAG: ${{ github.ref_name }}
        run: syft "ghcr.io/deedglass/deedglass:${TAG#v}" -o spdx-json="$RUNNER_TEMP/image.sbom.json"
      - name: grype (fail on fixable high or critical)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: ${{ runner.temp }}/image.sbom.json
          grype-version: v0.120.0
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: build provenance (GitHub artifact attestations, public repository only)
        if: steps.vis.outputs.private == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

  sdk-build:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: npm pack @deedglass/sdk
        working-directory: sdk/typescript
        run: mkdir -p "$RUNNER_TEMP/sdk" && npm ci --ignore-scripts --no-audit --no-fund && npm run build && npm pack --pack-destination "$RUNNER_TEMP/sdk"
      - name: wheel and sdist
        run: make py-build PY=python3 && cp sdk/python/dist/* "$RUNNER_TEMP/sdk/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-packages
          path: ${{ runner.temp }}/sdk/
      - name: attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/sdk/* --repo "$GITHUB_REPOSITORY" --clobber

  npm-stage:
    needs: [release, sdk-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archives
          path: ${{ runner.temp }}/archives
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-packages
          path: ${{ runner.temp }}/pkgs
      - name: stage the seven packages (versions agree, archives match checksums.txt, binaries, npm pack)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          node scripts/npm-publish.mjs stage --version="$v" --archives="$RUNNER_TEMP/archives" \
            --sdk="$RUNNER_TEMP/pkgs/deedglass-sdk-$v.tgz" --out="$RUNNER_TEMP/npm"
      - name: the publish plan (a dry run; no npm, no registry)
        run: node scripts/npm-publish.mjs publish --out="$RUNNER_TEMP/npm" --dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/npm/plan.json
            ${{ runner.temp }}/npm/tgz/

  publish-npm:
    needs: [release, npm-stage]
    if: vars.DEEDGLASS_PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm
      - name: npm 11.5.1 or later (trusted publishing over OIDC; no token)
        run: npm install -g npm@11.21.0
      - name: publish in order, skipping what npm has (a prerelease goes to the next tag, never latest)
        env:
          PROVENANCE: ${{ needs.release.outputs.private == 'false' }}
        run: node scripts/npm-publish.mjs publish --out="$RUNNER_TEMP/npm" --provenance="$PROVENANCE"

  publish-pypi:
    needs: sdk-build
    if: vars.DEEDGLASS_PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-packages
          path: pkgs
      - name: keep only the Python distributions
        run: mkdir -p dist && cp pkgs/*.whl pkgs/*.tar.gz dist/ && ls dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  deploy-docs:
    needs: verify
    if: vars.DEEDGLASS_DEPLOY_DOCS == 'true' && !contains(github.ref_name, '-rc.')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: docs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: build docs.deedglass.com
        run: make docs
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy docs-site/dist --project-name deedglass-docs --branch main
