# Release (S35, ADR-067). Runs only when the founder pushes a tag vX.Y.Z or vX.Y.Z-rc.N.
#
#   verify       make ci, integration on PG 18.6, the attack suite (its result records the tag),
#                fuzz-regress, audit and the docs build. No secret is available to this job.
#   release      GoReleaser: 5 binaries, 5 archives, checksums.txt, an SPDX SBOM per archive and a
#                linux/amd64 + linux/arm64 image on GHCR, into a DRAFT GitHub release. Prereleases
#                never move latest or X.Y. While the repository is private nothing is signed:
#                keyless signing and GitHub artifact attestations write the repository and workflow
#                identity into a public log (and attestations need a public repo on the Free plan).
#                grype scans the image SBOM and fails on fixable high or critical findings.
#   sdk-build    npm pack and the Python wheel and sdist, attached to the draft release.
#   publish-npm  OFF unless the repository variable DEEDGLASS_PUBLISH_NPM is 'true'; environment npm.
#   publish-pypi OFF unless DEEDGLASS_PUBLISH_PYPI is 'true'; environment pypi (trusted publishing).
#   deploy-docs  OFF unless DEEDGLASS_DEPLOY_DOCS is 'true'; needs the CLOUDFLARE_API_TOKEN secret.
#
# scripts/check-workflows.sh (in make ci) fails if a gate or an environment disappears, if any job
# gets write-all, or if a uses: line isn't pinned to a full commit SHA.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: the tag, CHANGELOG.md and the SDK versions agree
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/check-versions.sh "$TAG"
      - name: make ci
        run: make ci PY=python3
      - name: integration on PostgreSQL 18.6 (Docker)
        run: DEEDGLASS_IT_MODE=docker make integration
      - name: the attack suite, recorded against this tag
        env:
          DEEDGLASS_IT_ATTACK_VERSION: ${{ github.ref_name }}
        run: DEEDGLASS_IT_MODE=docker make attack
      - name: fuzz corpus replay
        run: make fuzz-regress
      - name: supply-chain audit
        run: make audit
      - name: docs build
        run: make docs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attack-results
          path: attack/results/latest.json

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    outputs:
      private: ${{ steps.vis.outputs.private }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: the Console, embedded in the binary
        run: make web-build
      - id: vis
        name: is the repository public
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: echo "private=$PRIVATE" >> "$GITHUB_OUTPUT"
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.vis.outputs.private == 'false'
        with:
          cosign-release: v3.1.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
      - name: goreleaser (signing only when public)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: >-
            release --clean --release-notes ${{ runner.temp }}/notes.md
            ${{ steps.vis.outputs.private == 'false' && ' ' || '--skip=sign' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: image SBOM
        env:
          TAG: ${{ github.ref_name }}
        run: syft "ghcr.io/deedglass/deedglass:${TAG#v}" -o spdx-json="$RUNNER_TEMP/image.sbom.json"
      - name: grype (fail on fixable high or critical)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: ${{ runner.temp }}/image.sbom.json
          grype-version: v0.120.0
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: build provenance (GitHub artifact attestations, public repository only)
        if: steps.vis.outputs.private == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

  sdk-build:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: npm pack @deedglass/sdk
        working-directory: sdk/typescript
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build && npm pack --pack-destination "$RUNNER_TEMP/sdk"
      - name: wheel and sdist
        run: make py-build PY=python3 && cp sdk/python/dist/* "$RUNNER_TEMP/sdk/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-packages
          path: ${{ runner.temp }}/sdk/
      - name: attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/sdk/* --repo "$GITHUB_REPOSITORY" --clobber

  publish-npm:
    needs: sdk-build
    if: vars.DEEDGLASS_PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-packages
          path: pkgs
      - name: npm 11.5.1 or later (trusted publishing over OIDC; no token)
        run: npm install -g npm@11.21.0
      - name: publish (a prerelease goes to the next tag, never latest)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          dist=latest
          case "$TAG" in *-rc.*) dist=next ;; esac
          npm publish pkgs/deedglass-sdk-*.tgz --access public --tag "$dist"

  publish-pypi:
    needs: sdk-build
    if: vars.DEEDGLASS_PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-packages
          path: pkgs
      - name: keep only the Python distributions
        run: mkdir -p dist && cp pkgs/*.whl pkgs/*.tar.gz dist/ && ls dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  deploy-docs:
    needs: verify
    if: vars.DEEDGLASS_DEPLOY_DOCS == 'true' && !contains(github.ref_name, '-rc.')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: docs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: build docs.deedglass.com
        run: make docs
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy docs-site/dist --project-name deedglass-docs --branch main
