# PostgreSQL version matrix (spec 20_ §0 #12: CI covers 16.15 / 17.11 / 18.6). Runs only on demand and
# nightly while the repo is private (GitHub Free private-minutes rule, plan §9.1). Gate evidence may
# also come from a local `make matrix` run logged in EXPERIMENT_LOG.md.
#
# Each run covers the sql/ smoke, the control-plane roles and migrations, and the Go integration
# suites (go test -tags integration): scripts/integration.sh runs them because DEEDGLASS_IT_ADMIN_URL
# is set. Actions are pinned to commit SHAs and images to index digests (ADR-024).
name: pg-matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *" # 02:00 IST

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg: "16.15"
            image: postgres:16.15@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
          - pg: "17.11"
            image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
          - pg: "18.6"
            image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    name: integration (PostgreSQL ${{ matrix.pg }})
    services:
      postgres:
        image: ${{ matrix.image }}
        command: postgres -c wal_level=logical -c max_slot_wal_keep_size=2GB
        env:
          POSTGRES_PASSWORD: deedglass-ci-throwaway
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: sql/001-004 smoke, control-plane roles and migrations, and Go integration suites on PostgreSQL ${{ matrix.pg }}
        env:
          DEEDGLASS_IT_THROWAWAY: "1"
          PSQL: docker exec -i ${{ job.services.postgres.id }} psql
          PGUSER: postgres
          DEEDGLASS_IT_ADMIN_URL: postgres://postgres:deedglass-ci-throwaway@127.0.0.1:5432/postgres?sslmode=disable
        run: scripts/integration.sh
