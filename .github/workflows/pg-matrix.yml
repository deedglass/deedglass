# PostgreSQL version matrix (spec 20_ §0 #12: CI covers 16.15 / 17.11 / 18.6). Runs only on demand and
# nightly while the repo is private (GitHub Free private-minutes rule, plan §9.1). Gate evidence may
# also come from a local `make matrix` run logged in EXPERIMENT_LOG.md.
name: pg-matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *" # 02:00 IST

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pg: ["16.15", "17.11", "18.6"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        command: postgres -c wal_level=logical -c max_slot_wal_keep_size=2GB
        env:
          POSTGRES_PASSWORD: deedglass-ci-throwaway
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: sql/001-004 smoke, control-plane migrations and Go integration suites on PostgreSQL ${{ matrix.pg }}
        env:
          DEEDGLASS_IT_THROWAWAY: "1"
          PSQL: docker exec -i ${{ job.services.postgres.id }} psql
          PGUSER: postgres
          DEEDGLASS_IT_ADMIN_URL: postgres://postgres:deedglass-ci-throwaway@127.0.0.1:5432/postgres?sslmode=disable
        run: scripts/integration.sh
