# TY-10: the independent verifiers (verifiers/python, verifiers/js), written from spec/ alone, must
# reach the same verdict as `deedglass verify` on every release bundle (testdata/release-bundles, the
# 2046 test), on tampered copies of each, and on every deed vector (testdata/deeds). Not a required
# check yet: it lives outside ci.yml, whose jobs .github/required-checks.txt names exactly
# (scripts/check-workflows.sh). Make it required by moving the job into ci.yml and the list.
name: independent-verifiers

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: independent-verifiers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-verifiers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - name: build this tree's deedglass
        run: go build -o "$RUNNER_TEMP/deedglass" ./cmd/deedglass
      - name: three verifiers agree on every release bundle, its tampered copies and every vector
        run: python3 verifiers/crosscheck.py "$RUNNER_TEMP/deedglass"
