name: I ran it
description: Tell us how a first run went. The most useful issue you can file.
labels: ["i-ran-it"]
body:
  - type: dropdown
    id: what
    attributes: { label: What you ran, multiple: true, options: [Quickstart (deedglass init), Claude Code, Cursor, Claude Desktop, TypeScript SDK, Python SDK, deedglass scan, The browser playground, Other] }
    validations: { required: true }
  - type: input
    id: os
    attributes: { label: Operating system }
    validations: { required: true }
  - type: dropdown
    id: install
    attributes: { label: Install method, options: [npx, Docker image, Release binary, Homebrew, go install, Built from source] }
    validations: { required: true }
  - type: input
    id: blocked
    attributes: { label: Minutes to the first blocked action, placeholder: "about 4" }
  - type: input
    id: verified
    attributes: { label: Minutes to the first verified action, placeholder: "about 7" }
  - type: textarea
    id: confused
    attributes: { label: What confused you }
  - type: textarea
    id: broke
    attributes: { label: What broke }
  - type: dropdown
    id: quote
    attributes:
      label: "May we quote you?"
      description: "Only the exact sentence you approve, with your name or anonymously."
      options:
        - "No"
        - "Yes, anonymously"
        - "Yes, with my name (we'll confirm the sentence first)"
    validations:
      required: true
