name: Docs problem
description: A page is wrong, unclear or missing something.
labels: ["documentation", "area: docs"]
body:
  - type: markdown
    attributes:
      value: "**Security problem? Don't file it here.** Report it privately: https://github.com/deedglass/deedglass/security/advisories/new ([SECURITY.md](https://github.com/deedglass/deedglass/blob/main/SECURITY.md)). Thank you. Docs fixes are some of the most useful issues, and often make a good first pull request: say so below if you'd like to fix it yourself."
  - type: input
    id: page
    attributes: { label: Page, description: "A link to the page or the file in docs/.", placeholder: "https://docs.deedglass.com/quickstart/ or docs/OBSERVE.md" }
    validations: { required: true }
  - type: textarea
    id: problem
    attributes: { label: "What's wrong or missing", description: "Quote the sentence if you can, and say what you expected to read." }
    validations: { required: true }
  - type: dropdown
    id: fix
    attributes: { label: "Would you like to fix it?", options: ["Yes, I'll open a pull request", "Maybe, with some pointers", "No, just reporting it"] }
