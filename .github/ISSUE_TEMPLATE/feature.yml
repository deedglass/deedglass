name: Feature request
description: A problem Deedglass could solve.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "**Security problem? Don't file it here.** Report it privately: https://github.com/deedglass/deedglass/security/advisories/new ([SECURITY.md](https://github.com/deedglass/deedglass/blob/main/SECURITY.md)). Remove secrets (keys start with dg_, sk_, xox) from anything you paste."
  - type: textarea
    id: problem
    attributes: { label: The problem, description: "What are you trying to do, and what gets in the way? Start here, before the idea." }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: Your idea, description: "How you'd like it to work. Optional." }
  - type: textarea
    id: today
    attributes: { label: What you do today, description: "Your workaround, if any." }
