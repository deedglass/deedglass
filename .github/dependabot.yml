# Weekly, grouped updates with few open pull requests (S37). A new dependency still needs an ADR;
# Dependabot only bumps the ones already approved.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups: { go: { patterns: ["*"] } }
  - package-ecosystem: npm
    directories: [/web, /docs-site, /sdk/typescript, /web/verify]
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups: { npm: { patterns: ["*"] } }
    # @types/node follows the oldest Node each package supports (sdk/typescript >= 22.12, web >= 24),
    # so a newer major would let tsc accept APIs those runtimes don't have (S38, PR #1).
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /sdk/python
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups: { python: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: docker
    directories: [/, /examples/demo]
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
