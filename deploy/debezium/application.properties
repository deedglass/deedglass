# Debezium Server: MySQL source, HTTP sink (one POST per event). TY-05, docs/WITNESS_DEBEZIUM.md.
debezium.sink.type=http
# debezium.sink.http.url comes from DEBEZIUM_SINK_HTTP_URL (compose.yaml).
debezium.sink.http.retries=5
debezium.sink.http.retry.interval.ms=500

debezium.source.connector.class=io.debezium.connector.mysql.MySqlConnector
debezium.source.database.hostname=mysql
debezium.source.database.port=3306
debezium.source.database.user=debezium
# debezium.source.database.password comes from DEBEZIUM_SOURCE_DATABASE_PASSWORD.
debezium.source.database.server.id=184054
debezium.source.topic.prefix=shop
debezium.source.database.include.list=shop
debezium.source.snapshot.mode=no_data
debezium.source.include.query=true
debezium.source.provide.transaction.metadata=true
debezium.source.decimal.handling.mode=string
debezium.source.binary.handling.mode=hex
debezium.source.offset.storage.file.filename=data/offsets.dat
debezium.source.offset.flush.interval.ms=0
debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=data/schema_history.dat

debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false

# The HTTP sink sends each record's Connect headers and, in 3.3.1, keeps adding them to every later
# request (a receiver with a header limit then answers 431). The witness reads only the body.
debezium.transforms=noheaders
debezium.transforms.noheaders.type=org.apache.kafka.connect.transforms.DropHeaders
debezium.transforms.noheaders.headers=__debezium.context.connectorLogicalName,__debezium.context.taskId,__debezium.context.connectorName
