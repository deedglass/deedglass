# TY-05: MySQL 8.4 and Debezium Server for the foreign change-feed witness (docs/WITNESS_DEBEZIUM.md).
# Debezium Server has no file sink, so it posts each change event to an HTTP receiver on the host
# (DEBEZIUM_SINK_URL); the live test (make debezium-it) runs that receiver and writes the events as
# JSON lines. Ports are free localhost ports chosen by the caller; never 8080 or 55432.
# Synthetic data only. Images pinned by digest (ADR-024).
name: ${DEBEZIUM_PROJECT:-deedglass-debezium}
services:
  mysql:
    image: mysql:8.4.6@sha256:6752fee1ed70df146fe22d5d1656deee79463f780a24cb7e67c807f2f07d7dc5
    environment:
      MYSQL_ROOT_PASSWORD: ${DEBEZIUM_MYSQL_ROOT_PASSWORD:?set by scripts/debezium_mysql.sh}
      MYSQL_DATABASE: shop
      DEBEZIUM_MYSQL_PASSWORD: ${DEBEZIUM_MYSQL_PASSWORD:?set by scripts/debezium_mysql.sh}
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --binlog-rows-query-log-events=ON
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    volumes:
      - ./mysql:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DEBEZIUM_MYSQL_PORT:-0}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 2s
      timeout: 5s
      retries: 90
  debezium:
    image: quay.io/debezium/server:3.3.1.Final@sha256:406fc67e1ddeaf93529cda34451666f6b2d1d01c03879db5e5a60498284f12bb
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DEBEZIUM_SINK_HTTP_URL: ${DEBEZIUM_SINK_URL:?set by the live test}
      DEBEZIUM_SOURCE_DATABASE_PASSWORD: ${DEBEZIUM_MYSQL_PASSWORD:?set by scripts/debezium_mysql.sh}
    volumes:
      - ./application.properties:/debezium/config/application.properties:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${DEBEZIUM_HEALTH_PORT:-0}:8080"
