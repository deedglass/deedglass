  #   ports:
  #     - "127.0.0.1:8080:8080"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  # verifier:                                   # TODO(G3): separate process and credentials
  #   image: txv:dev
  #   command: ["txv", "verifier", "run"]
  #   environment:
  #     TXV_DATABASE_URL: postgres://txv_verifier@postgres:5432/txv   # REPLICATION role
  #   volumes:
  #     - txv-verifier:/var/lib/txv            # SQLite store, statement key (0600)
  #   ports:
  #     - "127.0.0.1:8081:8081"                # GET /v1/status/{intent_hash}
  #   depends_on:
