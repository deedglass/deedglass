# Local development stack: PostgreSQL 18.6 only, for now.
# `deedglass serve` (the API, the Gate and the Console) joins this file in S03. Local, throwaway use
# only: the password below is a local default.
#
#   docker compose -f deploy/docker-compose.yml up -d postgres
#   (until S02's `deedglass migrate` exists, `make integration DEEDGLASS_IT_MODE=docker` runs its
#    own throwaway container and applies sql/001-004)
name: deedglass

services:
  postgres:
    image: postgres:18.6
    # wal_level=logical needs a restart to change, so it is set at start.
    # max_slot_wal_keep_size must be finite: a stalled Witness must never fill the disk.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_slot_wal_keep_size=2GB"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DEEDGLASS_DEV_PG_PASSWORD:-deedglass-local-only}
      POSTGRES_DB: deedglass
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - deedglass-pgdata:/var/lib/postgresql   # the 18.x image keeps PGDATA under /var/lib/postgresql/18/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deedglass"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  deedglass-pgdata:
