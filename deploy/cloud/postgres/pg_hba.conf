# pg_hba.conf for the cloud kit (S35, ADR-068). Postgres has no TCP listener (listen_addresses is
# empty), so only the Unix socket in the pgsocket volume exists. The superuser is reachable only by
# the postgres and root OS users inside the postgres container (peer, map local-admin); every other
# role needs its password (scram-sha-256). The deedglass container runs as 65532, which maps to nothing.
# TYPE  DATABASE  USER      METHOD
local   all       postgres  peer map=local-admin
local   all       all       scram-sha-256
