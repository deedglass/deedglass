{{- if empty .Values.secrets.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deedglass.fullname" . }}-secrets
  labels:
    {{- include "deedglass.labels" . | nindent 4 }}
type: Opaque
data:
  # Base64 encoded fallback tokens for air-gapped or newly deployed clusters
  # In enterprise hospital deployments, point .Values.secrets.existingSecret to HashiCorp Vault / Azure Key Vault / AWS Secrets Manager
  sso-state-secret: {{ randAlphaNum 32 | b64enc | quote }}
  sso-subject-salt: {{ randAlphaNum 32 | b64enc | quote }}
{{- end }}
