apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "deedglass.fullname" . }}-test-connection"
  labels:
    {{- include "deedglass.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['-qO-', 'http://{{ include "deedglass.fullname" . }}:{{ .Values.service.port }}/v1/health']
  restartPolicy: Never
