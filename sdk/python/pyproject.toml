[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "deedglass"
dynamic = ["version"]
description = "Python SDK for Deedglass, the execution and accountability layer for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Deedglass" }]
keywords = ["agents", "ai", "mcp", "policy", "audit", "langchain", "claude"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.28.1,<0.29"]

[project.optional-dependencies]
crypto = ["cryptography>=46,<51"]
langchain = ["langchain>=1.0,<2", "langchain-core>=1.0,<2"]
openai-agents = ["openai-agents>=0.23,<1"]
crewai = ["crewai>=1.15,<2"]
claude-agent-sdk = ["claude-agent-sdk>=0.2.160,<0.3"]
all = ["deedglass[crypto,langchain,openai-agents,crewai,claude-agent-sdk]"]

[project.urls]
Homepage = "https://deedglass.com"
Documentation = "https://docs.deedglass.com/sdk/python"
Source = "https://github.com/deedglass/deedglass"
Changelog = "https://github.com/deedglass/deedglass/blob/main/sdk/python/CHANGELOG.md"

[tool.hatch.version]
path = "src/deedglass/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/deedglass"]

[tool.hatch.build.targets.sdist]
include = ["src/deedglass", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "S311", "UP007", "UP045"]

[tool.ruff.format]
exclude = ["src/deedglass/_errors_gen.py", "src/deedglass/verify/_*_gen.py"]

[tool.ruff.lint.per-file-ignores]
"src/deedglass/_errors_gen.py" = ["E501"]
"src/deedglass/verify/_*_gen.py" = ["E501"]
"tests/**" = ["SIM108", "S105", "S106", "S108", "B017", "B905", "PT011", "PT017", "PT018", "SIM117", "S603", "S607", "RUF012", "E501"]

[tool.mypy]
strict = true
python_version = "3.10"
warn_unreachable = true
files = ["src/deedglass"]

[[tool.mypy.overrides]]
module = ["langchain.*", "langchain_core.*", "claude_agent_sdk.*", "agents.*", "crewai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["demo: runs against make demo-up (skipped unless DEEDGLASS_PY_DEMO=1)"]
addopts = "-q"

[tool.coverage.run]
source = ["deedglass"]
branch = false
omit = ["*/langchain/*", "*/claude_agent_sdk/*", "*/openai_agents/*", "*/crewai/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
