        doesn't exist. A Console session (viewer and up) or an org admin key (`admin` scope); agent
        keys get 403 `insufficient_scope` ("Agents cannot read or test policies. Use the Console or
        an admin key.").
      tags: [Policies]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/PolicyRef"
      responses:
        "200":
          description: The policy.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        default:
          $ref: "#/components/responses/Error"
  /v1/policies/{id}/versions:
    get:
      operationId: listPolicyVersions
      summary: List a policy's versions
      description: >-
        Newest first, without `source` (get one version to read it). Each version's `status` says
        whether it is enforced, in shadow or inactive. A Console session (viewer and up) or an org
        admin key (`admin` scope); agent keys get 403 `insufficient_scope` ("Agents cannot read or
        test policies. Use the Console or an admin key.").
      tags: [Policies]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/PolicyRef"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of versions.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyVersionList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createPolicyVersion
      summary: Push a new version of a policy
      description: >-
        201 with the new version, which is not active until you activate it. Versions never
        change. Content identical to an existing version (the same `version_hash`) saves nothing:
        the answer is 200 with that version. The YAML's name must be the policy's name; another
        name is 400 `validation_failed` on `source` (push it as a new policy). A source that
        doesn't compile is 400 `policy_invalid` with `diagnostics`. Bodies up to 1 MiB. An admin+
        Console session (with the `Deedglass-CSRF` header) or an org admin key; agent keys get 403
        `insufficient_scope` ("Agents cannot read or test policies. Use the Console or an admin
        key.").
      tags: [Policies]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/PolicyRef"
      requestBody:
        $ref: "#/components/requestBodies/PolicySource"
      responses:
        "201":
          description: The new version.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyVersion"
        "200":
          description: The content is identical to this existing version; nothing was saved.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyVersion"
        default:
          $ref: "#/components/responses/Error"
  /v1/policies/{id}/versions/{v}:
    get:
      operationId: getPolicyVersion
      summary: Get one version of a policy, with its source
      description: >-
        By version number or `pv_` id; the body includes `source`, the YAML exactly as pushed. A
        malformed `{v}` is 400 `validation_failed` on `v`. A Console session (viewer and up) or an
        org admin key (`admin` scope); agent keys get 403 `insufficient_scope` ("Agents cannot read
        or test policies. Use the Console or an admin key.").
      tags: [Policies]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/PolicyRef"
        - $ref: "#/components/parameters/PolicyVersionRef"
      responses:
        "200":
          description: The version, with its source.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyVersion"
        default:
          $ref: "#/components/responses/Error"
  /v1/policies/{id}/versions/{v}/activate:
    post:
      operationId: activatePolicyVersion
      summary: Enforce a version, or run it in shadow
      description: >-
        `enforce` makes the version the org's deciding policy and replaces the one enforced before
        (`previous`); `shadow` records its decisions alongside without deciding. Every instance
        picks up the change within 2 s. Every activation seals an admin deed (`deeds`); promoting
        the shadow version to enforce seals two, the shadow ending and then the version enforced.
        Enforcing the version that is already enforced, or shadowing the enforced version, is 409
        `conflict`. Enforcing a policy with the `default_allow` warning needs
        `acknowledge_warnings: ["default_allow"]`; without it the answer is 400
        `validation_failed` on `acknowledge_warnings`. An admin+ Console session (with the
        `Deedglass-CSRF` header) or an org admin key; agent keys get 403 `insufficient_scope`
        ("Agents cannot read or test policies. Use the Console or an admin key.").
      tags: [Policies]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/PolicyRef"
        - $ref: "#/components/parameters/PolicyVersionRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode, reason]
              properties:
                mode: {type: string, enum: [enforce, shadow]}
                reason: {type: string, minLength: 3, maxLength: 280, description: One line, 3 to 280 characters. It goes into the deed.}
                acknowledge_warnings:
                  type: array
                  description: Warning codes the version carries that you accept, like `default_allow`.
                  items: {type: string}
            example: {mode: enforce, reason: Guard the orders database before the pilot.}
      responses:
        "200":
          description: The activation, with the deeds that sealed it.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyActivation"
        default:
          $ref: "#/components/responses/Error"
  /v1/policies/{id}/versions/{v}/deactivate:
    post:
      operationId: deactivatePolicyVersion
      summary: Switch off the shadow policy
      description: >-
        Ends the version's shadow activation and seals an admin deed. Only the shadow version can
        be switched off: the enforced one is 409 `conflict` (activate another version instead), and
        a version that isn't the shadow policy is 409 `conflict`. The reason is required (3 to 280
        characters). An admin+ Console session (with the `Deedglass-CSRF` header) or an org admin
        key; agent keys get 403 `insufficient_scope` ("Agents cannot read or test policies. Use the
        Console or an admin key.").
      tags: [Policies]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/PolicyRef"
        - $ref: "#/components/parameters/PolicyVersionRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 3, maxLength: 280, description: One line, 3 to 280 characters. It goes into the deed.}
            example: {reason: Shadow run finished; v3 matched the review.}
      responses:
        "200":
          description: The activation, now ended, with the deed.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyActivation"
        default:
          $ref: "#/components/responses/Error"
  /v1/policies/{id}/versions/{v}/replay:
    post:
      operationId: createReplay
      summary: Replay a policy version over past actions
      description: >-
        Queues a replay (S27): every decision recorded in the window is evaluated again under this
        version, in shadow mode, and compared with a baseline. A replay never runs a tool, never
        reserves a budget or touches usage, never seals a deed and never emits an action event.
        The baseline is the decisions recorded at the time (`recorded`, the default) or another
        version of the same policy evaluated over the same inputs (`version`), which separates your
        change from everything else that differed at the time. The answer is 202 with the replay
        object (`status: queued`); a runner on any instance picks it up (one running replay per
        org), and `GET /v1/replays/{id}` shows its progress and, once it `succeeded`, its result.
        The same inputs, version and sqlguard version give the same `result_digest`. The window
        defaults to the last 7 days (`to` defaults to now, `from` to 7 days before `to`); `from`
        must be before `to` and the window at most 90 days (400 `replay_window_invalid`). More
        than 1,000,000 actions in the window is 400 `replay_too_large`, and nothing is queued. An
        unknown policy or version is 404 `not_found`; a `{v}` that isn't a number is 400
        `validation_failed`. Each org starts at most 10 replays an hour (429 `rate_limited`, with
        `Retry-After`). Bodies up to 16 KiB. An admin+ Console session (with the `Deedglass-CSRF`
        header) or an org admin key (`admin` scope); agent keys get 403 `insufficient_scope`
        ("Agent keys can't read Insights. Use the Console or an org admin key.").
      tags: [Insights]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/PolicyRef"
        - {name: v, in: path, required: true, description: The version number to replay, like 3., schema: {type: integer, minimum: 1}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayRequest"
            examples:
              recorded:
                summary: The last 8 days, against the decisions recorded at the time
                value: {"from": "2026-09-26T07:03:15Z", "to": "2026-10-04T07:03:15Z"}
              version:
                summary: Against version 2 of the same policy, over the same inputs
                value: {"from": "2026-09-26T07:03:15Z", "to": "2026-10-04T07:03:15Z", "baseline": {"type": "version", "version": 2}}
      responses:
        "202":
          description: The replay, queued.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Replay"
              examples:
                queued:
                  summary: acme-sim v3 queued over 5,890 actions
                  value:
                    {"object": "replay", "id": "rpl_01m42vjp4z65td5hkdkcefczms", "status": "queued", "purpose": "manual",
                     "candidate": {"policy": "pol_01m42v9q4bjwfqmk8bd58vzkdh", "name": "acme-sim", "version": 3, "version_id": "pv_01m42vcmkk193cy009pdzt4c6s",
                                   "version_hash": "sha256:3d09f641a6d5f6962ef719d05a59c6cea0362d950ea6f920418b01125b6bbb7b"},
                     "baseline": {"type": "recorded", "version": 0},
                     "window": {"from": "2026-09-26T07:03:15Z", "to": "2026-10-04T07:03:15Z"},
                     "progress": {"processed": 0, "total": 5890, "percent": 0},
                     "requested_by": {"type": "api_key", "id": "key_01m42vbv2s105agpkrzjpnhzpa"},
                     "attempts": 0, "created_at": "2026-10-04T07:03:15.359342Z", "started_at": null, "finished_at": null, "error": null}
        "400":
          description: '`replay_window_invalid`, `replay_too_large` or `validation_failed`.'
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                window:
                  summary: from is after to
                  value:
                    error:
                      type: invalid_request_error
                      code: replay_window_invalid
                      message: The window must start before it ends, and it can be at most 90 days long. Send from before to.
                      param: to
                      request_id: req_01m42vk215p3bfyp3xasewttq4
                      doc_url: https://docs.deedglass.com/errors/replay_window_invalid
                too_large:
                  summary: More than 1,000,000 actions in the window
                  value:
                    error:
                      type: invalid_request_error
                      code: replay_too_large
                      message: This replay covers 1,240,512 actions; the limit is 1,000,000. Narrow the window with from and to.
                      param: null
                      request_id: req_01m42vk3a7c9e1g3j5m7p9s1v3
                      doc_url: https://docs.deedglass.com/errors/replay_too_large
        "403":
          description: An agent key (`insufficient_scope`), or a viewer session (`insufficient_role`).
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  type: permission_error
                  code: insufficient_scope
                  message: Agent keys can't read Insights. Use the Console or an org admin key.
                  param: null
                  request_id: req_01m42vk4b8d0f2h4k6n8q0t2w4
                  doc_url: https://docs.deedglass.com/errors/insufficient_scope
        "404":
          description: No such policy, or no such version of it.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  type: invalid_request_error
                  code: not_found
                  message: "No version 7 of acme-sim. Versions 1 to 3 exist. List them: deedglass policy versions acme-sim"
                  param: version
                  request_id: req_01m42vk5c9e1g3j5m7p9s1v3x5
                  doc_url: https://docs.deedglass.com/errors/not_found
        "429":
          description: This org started 10 replays in the last hour.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Retry-After:
              description: Seconds to wait (300).
              schema: {type: integer}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  type: rate_limit_error
                  code: rate_limited
                  message: This org started 10 replays in the last hour. Try again later, or narrow the window of the ones running.
                  param: null
                  request_id: req_01m42vk6d0f2h4k6n8q0t2w4y6
                  doc_url: https://docs.deedglass.com/errors/rate_limited
        default:
          $ref: "#/components/responses/Error"
  /v1/policies/lint:
    post:
      operationId: lintPolicy
      summary: Check a policy's YAML without saving it
      description: >-
        Compiles the source and reports every error and warning. The answer is 200 even when the
        policy is invalid: `valid` says so, and `errors` lists why. Nothing is saved and nothing
        is sealed, so `Idempotency-Key` is ignored. Limited to 60 requests a minute per person or
        key (429 `rate_limited`), with a 2 s timeout and bodies up to 1 MiB. A Console session
        (viewer and up, with the `Deedglass-CSRF` header) or an org admin key (`admin` scope);
        agent keys get 403 `insufficient_scope` ("Agents cannot read or test policies. Use the
        Console or an admin key.").
      tags: [Policies]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source]
              properties:
                source: {type: string, description: The policy YAML.}
                voice: {type: boolean, default: false, description: Also check reasons against the brand voice (`reason_style` warnings).}
            example: {source: "deedglass: policy/v1\nname: postgres-safe\n…"}
      responses:
        "200":
          description: The lint result, valid or not.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyLintResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/policies/evaluate:
    post:
      operationId: evaluatePolicy
      summary: Dry-run one action against a policy
      description: >-
        Evaluates one case input against the org's active policies (the default), a stored version
        or a source, and returns the decision with its facts and, with `explain`, the trace. When a
        shadow policy is active, `shadow` holds its decision too. It never reserves usage and
        writes nothing: usage counts as zero unless the input gives it. An `agent.id` from another
        org is 404 `not_found`; leave it out to use a local agent. Limited to 60 requests a minute
        per person or key (429 `rate_limited`), with a 2 s timeout and bodies up to 1 MiB.
        `Idempotency-Key` is ignored. A Console session (viewer and up, with the `Deedglass-CSRF`
        header) or an org admin key (`admin` scope); agent keys get 403 `insufficient_scope`
        ("Agents cannot read or test policies. Use the Console or an admin key.").
      tags: [Policies]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [input]
              properties:
                policy:
                  description: Which policy decides. Leave it out for the active policies.
                  oneOf:
                    - {type: string, const: active}
                    - type: object
                      additionalProperties: false
                      required: [id, version]
                      properties:
                        id: {type: string, description: A `pol_` id or the policy's name.}
                        version: {type: integer, minimum: 1}
                    - type: object
                      additionalProperties: false
                      required: [source]
                      properties:
                        source: {type: string, description: A policy YAML, compiled for this call only.}
                input:
                  type: object
                  description: >-
                    The action, in the case-input format (docs/POLICY_LANGUAGE.md §6.2): `tool`,
                    `args` (or the `sql` shorthand), and optionally `agent`, `org`, `user`,
                    `session`, `request`, `time`, `usage` and `anomaly`.
                explain: {type: boolean, default: false, description: Include the trace.}
            example:
              input: {tool: postgres.execute, sql: "DELETE FROM public.orders"}
              explain: true
      responses:
        "200":
          description: The decision.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDecision"
        default:
          $ref: "#/components/responses/Error"
  /v1/policies/test:
    post:
      operationId: testPolicy
      summary: Run test cases against a policy
      description: >-
        Runs a cases file against a source, or against a stored version (`policy` and `version`),
        and reports each case and the rule coverage. Send `source` or `policy` with `version`, not
        both. It never reserves usage and writes nothing. Limited to 60 requests a minute per
        person or key (429 `rate_limited`), with a 2 s timeout and bodies up to 2 MiB.
        `Idempotency-Key` is ignored. A Console session (viewer and up, with the `Deedglass-CSRF`
        header) or an org admin key (`admin` scope); agent keys get 403 `insufficient_scope`
        ("Agents cannot read or test policies. Use the Console or an admin key.").
      tags: [Policies]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cases]
              properties:
                source: {type: string, description: A policy YAML. Not with policy.}
                policy: {type: string, description: A stored policy, by `pol_` id or name. Needs version.}
                version: {type: integer, minimum: 1, description: The stored version's number, with policy.}
                cases:
                  description: >-
                    A cases file as a YAML string, or a list of cases (each with `name`, `input`
                    and `expect`), or an object with `cases`.
                  oneOf:
                    - type: string
                    - type: array
                      items: {type: object}
                    - type: object
            example:
              policy: postgres-safe
              version: 3
              cases:
                - name: deletes never run
                  input: {tool: postgres.execute, sql: "DELETE FROM public.orders"}
                  expect: {decision: deny, rule: block-destructive-sql}
      responses:
        "200":
          description: The test result.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyTestResult"
        default:
          $ref: "#/components/responses/Error"
  /.well-known/oauth-protected-resource:
    get:
      operationId: getProtectedResourceMetadata
      summary: Show the protected-resource metadata for the API
      description: >-
        Public and not versioned. The RFC 9728 protected-resource metadata for the server as a
        whole. `authorization_servers` is absent on purpose: Deedglass v1 takes pre-issued API keys
        as bearer tokens and has no authorization server to list; v2 adds the org's issuer.
        Readable cross-origin and cached for an hour. It never reads the database.
      tags: [MCP]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      responses:
        "200":
          description: The metadata document.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Cache-Control:
              schema:
                type: string
                const: public, max-age=3600
            Access-Control-Allow-Origin:
              schema:
                type: string
                const: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedResourceMetadata"
              example:
                resource: https://api.deedglass.com
                resource_name: Deedglass
                bearer_methods_supported: [header]
                scopes_supported: ["actions:execute", "actions:read", "deeds:read"]
                resource_documentation: https://docs.deedglass.com/mcp/authorization
        default:
          $ref: "#/components/responses/Error"
  /.well-known/oauth-protected-resource/mcp/{connector}:
    get:
      operationId: getMCPResourceMetadata
      summary: Show the protected-resource metadata for a connector's MCP endpoint
      description: >-
        Public and not versioned. The RFC 9728 metadata for `/mcp/{connector}`, at the
        path-inserted URL that the endpoint's bearer challenges name in `resource_metadata`. The
        document is the same for every well-formed connector id and never reads the database; a
        malformed id is 404 `not_found`. `authorization_servers` is absent on purpose, as in the
        root document. Readable cross-origin and cached for an hour.
      tags: [MCP]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      parameters:
        - name: connector
          in: path
          required: true
          description: The upstream's connector name (`mcp.upstreams.<name>`), or a connector id (`con_…`) from S16.
          schema:
            type: string
            pattern: "^([a-z][a-z0-9-]{1,31}|con_[0-7][0-9a-hjkmnp-tv-z]{25})$"
      responses:
        "200":
          description: The metadata document.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Cache-Control:
              schema:
                type: string
                const: public, max-age=3600
            Access-Control-Allow-Origin:
              schema:
                type: string
                const: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedResourceMetadata"
              example:
                resource: https://api.deedglass.com/mcp/con_01k67c04kxevyex3pjyqe0t45d
                resource_name: Deedglass Gate
                bearer_methods_supported: [header]
                scopes_supported: ["actions:execute"]
                resource_documentation: https://docs.deedglass.com/mcp/authorization
        default:
          $ref: "#/components/responses/Error"
  /.well-known/oauth-protected-resource/mcp/native:
    get:
      operationId: getNativeMCPResourceMetadata
      summary: Show the protected-resource metadata for the native MCP endpoint
      description: >-
        Public and not versioned. The RFC 9728 metadata for `/mcp/native`, at the path-inserted URL
        that the endpoint's bearer challenges name in `resource_metadata`. It never reads the
        database. `authorization_servers` is absent on purpose, as in the root document. Readable
        cross-origin and cached for an hour.
      tags: [MCP]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      responses:
        "200":
          description: The metadata document.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Cache-Control:
              schema:
                type: string
                const: public, max-age=3600
            Access-Control-Allow-Origin:
              schema:
                type: string
                const: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedResourceMetadata"
              example:
                resource: https://api.deedglass.com/mcp/native
                resource_name: Deedglass Gate
                bearer_methods_supported: [header]
                scopes_supported: ["actions:execute"]
                resource_documentation: https://docs.deedglass.com/mcp/authorization
        default:
          $ref: "#/components/responses/Error"
  /mcp/{connector}:
    post:
      operationId: mcpConnector
      summary: Send an MCP message to an upstream MCP server through the Gate
      description: >-
        The MCP Streamable HTTP gateway (S15) for one upstream MCP server configured under
        `mcp.upstreams.<connector>` in deedglass.yaml. Deedglass runs every allowed `tools/call`
        itself (gateway mode) and holds the upstream's credentials. A POST-only JSON-RPC endpoint,
        sessionless and dual-era: 2026-07-28 requests carry `_meta`
        `io.modelcontextprotocol/protocolVersion` and the `MCP-Protocol-Version`, `Mcp-Method` and
        (for `tools/call`, `resources/read`, `prompts/get`) `Mcp-Name` headers, and any
        `Mcp-Param-*` a tool's `x-mcp-header` declares; a missing or different header is 400 with
        JSON-RPC `-32020`, an unsupported version 400 with `-32022` and `data.supported`. Legacy
        clients (2025-11-25, 2025-06-18, 2025-03-26) open with `initialize`; no `Mcp-Session-Id` is
        minted, and one sent is ignored. Notifications get 202 with no body. An unknown method is
        404 (modern) or 200 (legacy) with `-32601`. Responses are `application/json` with
        `Cache-Control: no-store`; an `Accept` without `application/json` is 406. Errors before the
        message is read are JSON-RPC errors without an id whose `data` names the Deedglass error
        `code`, `doc_url` and `request_id`: 401 with `WWW-Authenticate: Bearer realm="deedglass",
        resource_metadata="<base>/.well-known/oauth-protected-resource/mcp/<connector>",
        scope="actions:execute"`, 413 over 4 MiB, 415 for another `Content-Type`, 429 beyond 32
        requests in flight per agent. A browser `Origin` other than the server's own or one in
        `mcp.allowed_origins` gets 403. A stopped or suspended agent's `tools/call` is recorded and
        sealed, and answered as an `isError` tool result. GET and DELETE get 405 with `Allow:
        POST`. `Idempotency-Key` is ignored. An agent key with `actions:execute`. JSON-RPC is not
        modelled here; see docs/MCP.md.
      tags: [MCP]
      security: [{bearerAuth: []}]
      x-deedglass-auth: agent_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - name: connector
          in: path
          required: true
          description: The upstream's connector name (`mcp.upstreams.<name>`), or a connector id (`con_…`) from S16.
          schema:
            type: string
            pattern: "^([a-z][a-z0-9-]{1,31}|con_[0-7][0-9a-hjkmnp-tv-z]{25})$"
      requestBody:
        $ref: "#/components/requestBodies/MCPMessage"
      responses:
        "403":
          $ref: "#/components/responses/MCPOriginRefused"
        "200":
          $ref: "#/components/responses/MCPResponse"
        "202":
          description: A notification was accepted. No body.
        "400":
          $ref: "#/components/responses/MCPRequestRefused"
        default:
          $ref: "#/components/responses/Error"
  /mcp/native:
    post:
      operationId: mcpNative
      summary: Send an MCP message to the Gate's native tools
      description: >-
        Deedglass as an MCP server (S15): the org's native connectors' tools, named
        `<connector>.<tool>` (`fake.echo` in dev; `postgres.*` and others as connectors arrive),
        filtered per agent by the active policy, plus `deedglass_check_approval`. The same
        sessionless, dual-era protocol rules as `/mcp/{connector}`; `deedglass mcp serve` bridges
        stdio clients to it. An agent key with `actions:execute`.
      tags: [MCP]
      security: [{bearerAuth: []}]
      x-deedglass-auth: agent_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      requestBody:
        $ref: "#/components/requestBodies/MCPMessage"
      responses:
        "403":
          $ref: "#/components/responses/MCPOriginRefused"
        "200":
          $ref: "#/components/responses/MCPResponse"
        "202":
          description: A notification was accepted. No body.
        "400":
          $ref: "#/components/responses/MCPRequestRefused"
        default:
          $ref: "#/components/responses/Error"
  /login:
    get:
      operationId: loginPage
      summary: The sign-in page
      tags: [Pages]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      responses:
        "200":
          description: HTML, with a strict Content-Security-Policy.
          content:
            text/html:
              schema: {type: string}
        default:
          $ref: "#/components/responses/Error"
  /auth/confirm:
    get:
      operationId: confirmPage
      summary: The page a sign-in link opens
      description: >-
        The token is in the URL fragment (`#t=…`), which browsers never send to servers; the page
        shows what the link does and signs in only when the person clicks. Fetching this page uses
        nothing, so mail scanners that open links can't sign anyone in.
      tags: [Pages]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      responses:
        "200":
          description: HTML, with a strict Content-Security-Policy.
          content:
            text/html:
              schema: {type: string}
        default:
          $ref: "#/components/responses/Error"
  /app:
    get:
      operationId: consoleIndex
      summary: The Console's Overview page
      description: >-
        The Console is static HTML embedded in the binary; pages hold no data (they read the API).
        Without a valid session the answer is `302` to `/login?next=/app`. Served with
        `Cache-Control: no-cache`, a content-hash `ETag` and the Console's Content-Security-Policy
        (docs/CONSOLE.md).
      tags: [Pages]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      responses:
        "200":
          description: HTML, with the Console's Content-Security-Policy.
          content:
            text/html:
              schema: {type: string}
        "302":
          description: No valid session; `Location` is `/login?next=` with this path.
          headers:
            Location:
              schema: {type: string}
        default:
          $ref: "#/components/responses/Error"
  /app/{path...}:
    get:
      operationId: consolePage
      summary: A Console page or asset
      description: >-
        Pages (`/app/actions`, `/app/actions/act_…`, `/app/settings/…`) redirect to
        `/login?next=<path and query>` (`302`) without a valid session; `next` is kept only when it
        is a plain path under `/app`. An unknown page or an id with the wrong prefix serves the
        Console's 404 page, which never echoes the path. Assets (`/app/_astro/…`, fonts, icons)
        are public and immutable, sent precompressed by `Accept-Encoding`. `/app/_kit` is 404 in
        prod.
      tags: [Pages]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      parameters:
        - {name: "path...", in: path, required: true, description: The page or asset path under /app., schema: {type: string}}
      responses:
        "200":
          description: HTML, CSS, JavaScript, a font or an image.
          content:
            text/html:
              schema: {type: string}
        "302":
          description: No valid session; `Location` is `/login?next=` with this path and query.
          headers:
            Location:
              schema: {type: string}
        "404":
          description: The Console's 404 page.
          content:
            text/html:
              schema: {type: string}
        default:
          $ref: "#/components/responses/Error"
  /auth/assets/{file}:
    get:
      operationId: authAsset
      summary: The sign-in pages' stylesheet and script
      tags: [Pages]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      parameters:
        - {name: file, in: path, required: true, schema: {type: string, enum: [tokens.css, auth.css, auth.js]}}
      responses:
        "200":
          description: CSS or JavaScript.
          content:
            text/css:
              schema: {type: string}
            text/javascript:
              schema: {type: string}
        default:
          $ref: "#/components/responses/Error"
  /v1/connectors:
    get:
      operationId: listConnectors
      summary: List connectors
      description: >-
        Live connectors, oldest id first, each with its tools, the credential's metadata (never a
        value) and the last test result. A viewer+ Console session or an org admin key.
      tags: [Connectors]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of connectors.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createConnector
      summary: Add a connector
      description: >-
        Validates and normalizes the config, checks `base_url` through the egress rules (400
        `destination_blocked` for metadata, reserved, loopback or private addresses that aren't
        allowed), and seals `connector.created` with the type, name and config hash. Names are
        `^[a-z][a-z0-9-]{1,31}$`, unique among live connectors; `deedglass`, `mcp`, `native` (and
        `fake` outside dev) are reserved. A taken name is 409 `conflict`. Credentials are set
        separately. An admin+ Console session (with `Deedglass-CSRF`) or an org admin key.
      tags: [Connectors]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, name, config]
              properties:
                type: {type: string, description: "A connector type from GET /v1/connector-types (rest in S16)."}
                name: {type: string, pattern: "^[a-z][a-z0-9-]{1,31}$"}
                description: {type: string, maxLength: 500}
                config: {type: object, description: "The type's config (docs/CONNECTORS.md). At most 64 KiB."}
      responses:
        "201":
          description: The connector, with the id of its admin deed.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"
        default:
          $ref: "#/components/responses/Error"
  /v1/connectors/{id}:
    get:
      operationId: getConnector
      summary: Get a connector
      description: By `con_…` id or by name. A viewer+ Console session or an org admin key.
      tags: [Connectors]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/ConnectorRef"
      responses:
        "200":
          description: The connector.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateConnector
      summary: Update a connector
      description: >-
        Replaces `description`, `status` (`active` or `disabled`) or the whole `config`. With
        `expected_config_hash`, a config that changed meanwhile is 409 `conflict`. A change seals
        `connector.updated`; the next call uses the new config. An admin+ Console session or an org
        admin key.
      tags: [Connectors]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/ConnectorRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                description: {type: string, maxLength: 500}
                status: {type: string, enum: [active, disabled]}
                config: {type: object}
                expected_config_hash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
      responses:
        "200":
          description: The connector after the change.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteConnector
      summary: Delete a connector
      description: >-
        Soft-deletes the connector and crypto-shreds its credential (the data key is destroyed).
        409 `conflict` while an action on it is executing. Seals `connector.deleted` (and
        `connector.credentials_removed` when it had one). An admin+ Console session or an org admin
        key.
      tags: [Connectors]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/ConnectorRef"
      responses:
        "200":
          description: The deletion.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorDeleted"
        default:
          $ref: "#/components/responses/Error"
  /v1/connectors/{id}/credentials:
    put:
      operationId: setConnectorCredentials
      summary: Store a connector's credentials
      description: >-
        Write-only. Encrypts the secret with a fresh data key (AES-256-GCM envelope,
        docs/VAULT.md) as version n+1, replacing (and crypto-shredding) the previous one, and seals
        `connector.credentials_updated` with the kind, version and key id only. The body is never
        logged or stored for replay; errors name the `param`, never a value. The kind must be one the
        type takes and match the config's `auth.kind`. An admin+ Console session or an org admin
        key. 503 `vault_unavailable` when the server has no key ring.
      tags: [Connectors]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/ConnectorRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, secret]
              properties:
                kind: {type: string, enum: [bearer, header, basic, query, dsn, fields]}
                secret:
                  type: object
                  description: "bearer {token} · header {value} · basic {username, password} · query {value} · dsn {dsn, witness_dsn?} · fields {any}. At most 16 KiB."
                  additionalProperties: {type: string}
      responses:
        "200":
          description: The credential's metadata.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteConnectorCredentials
      summary: Delete a connector's credentials
      description: >-
        Removes the credential, which crypto-shreds it, and seals `connector.credentials_removed`.
        Removing nothing answers `deleted: true` with no deed. An admin+ Console session or an org
        admin key.
      tags: [Connectors]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/ConnectorRef"
      responses:
        "200":
          description: The credential, now unset.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        default:
          $ref: "#/components/responses/Error"
  /v1/connectors/{id}/test:
    post:
      operationId: testConnector
      summary: Test a connector
      description: >-
        Answers "will this work?" without changing anything: the config, the credential, the
        destination (resolved and classified), TLS, and the config's test request (a GET or a HEAD)
        with the credential. Records the result as the connector's `health`. At most 10 runs per
        minute per connector (429 `rate_limited`). An admin+ Console session or an org admin key.
      tags: [Connectors]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/ConnectorRef"
      responses:
        "200":
          description: The checks.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorTest"
        default:
          $ref: "#/components/responses/Error"
  /v1/connectors/{id}/initialized:
    post:
      operationId: recordConnectorInitialized
      summary: Record a Postgres database setup
      description: >-
        What `deedglass connector postgres init` calls after it applied a setup plan in one
        transaction: seals the admin deed `connector.postgres_initialized` with the plan's sha256,
        its change count, the database, the server version, the provider and the roles it created.
        Never the plan's SQL, a password or a verifier. Postgres connectors only. An admin+ Console
        session or an org admin key.
      tags: [Connectors]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ConnectorRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan_sha256, changes, database, server_version, provider]
              properties:
                plan_sha256: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
                changes: {type: integer, minimum: 1, maximum: 10000}
                database: {type: string, maxLength: 63}
                server_version: {type: string, example: "18.6"}
                provider: {type: string, enum: [local, rds, aurora, supabase, neon, cloudsql, azure, postgres]}
                roles_created:
                  type: array
                  items: {type: string, enum: [deedglass_owner, deedglass_agent, deedglass_witness]}
      responses:
        "201":
          description: The sealed setup record.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorSetup"
        default:
          $ref: "#/components/responses/Error"
  /v1/connectors/{id}/decoder:
    get:
      operationId: getConnectorDecoder
      summary: Show a connector's decoder
      description: >-
        What the decoder reads from this connector's database (S20): its slot, status and health,
        the WAL positions and lag, the watched tables, the frame counters per class and the most
        recent frames (`?recent=N`, 0 to 50, default 10; no row images). A witnessed connector that
        no runner has picked up yet shows `pending`. A connector that isn't witnessed is 409
        `witness_not_configured`. A viewer+ Console session or an org admin key; agent keys get 403
        `insufficient_scope`.
      tags: [Connectors]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/ConnectorRef"
        - name: recent
          in: query
          required: false
          schema: {type: integer, minimum: 0, maximum: 50, default: 10}
      responses:
        "200":
          description: The decoder.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decoder"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: dropConnectorDecoder
      summary: Drop a connector's slot
      description: >-
        Stops the connector's decoder, drops its replication slot (as the witness role), seals the
        admin deed `decoder.slot_dropped` and marks the decoder `dropped`. Actions still waiting for
        L2 evidence on this connector become evidence gaps. The next sync creates a new slot: a new
        baseline, and reconcile records any action in the gap as `missing`. The body must confirm
        the connector's name. 409 `conflict` while another process reads the slot; 409
        `witness_not_configured` for a connector that isn't witnessed. An admin+ Console session or
        an org admin key.
      tags: [Connectors]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/ConnectorRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm]
              properties:
                confirm: {type: string, description: "The connector's name, typed to confirm.", example: postgres}
      responses:
        "200":
          description: The slot is dropped, with the deed.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecoderDropped"
        default:
          $ref: "#/components/responses/Error"
  /v1/observe/sessions:
    post:
      operationId: openObserveSession
      summary: Open a watched session
      description: >-
        Observe mode (S50). Opens a watched session on a Postgres connector whose
        `witness.observe.enabled` is true: every transaction Postgres commits on the connector's
        watched tables while the session is open, and that no Deedglass action claimed, belongs to
        it. Nothing about the agent changes; only the database's change log is read. `agent` links
        an agent record for display only and attributes nothing. 409 `observe_not_enabled` when the
        connector's observe mode is off. A signed-in admin or owner (with `Deedglass-CSRF`) or an
        org admin key; agent keys get 403 `insufficient_scope`.
      tags: [Observe]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [connector]
              properties:
                connector: {type: string, description: The connector's name or `con_` id.}
                label: {type: string, minLength: 1, maxLength: 80, description: A name for the session (one line).}
                agent: {type: string, description: An agent's name or `agt_` id, shown beside the session; it attributes nothing.}
      responses:
        "201":
          description: The open session.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObserveSession"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listObserveSessions
      summary: List watched sessions
      description: >-
        This org's watched sessions, newest first, without their transactions. Filter by
        `connector` (name or id), `state` and `caught`. A Console session (viewer and up) or an org
        admin key; agent keys get 403 `insufficient_scope`.
      tags: [Observe]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: connector, in: query, required: false, description: The connector's name or `con_` id., schema: {type: string}}
        - {name: state, in: query, required: false, description: Only this state., schema: {type: string, enum: [open, closing, sealed, undoing, undone]}}
        - {name: caught, in: query, required: false, description: Only sessions with (true) or without (false) a caught item., schema: {type: boolean}}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of sessions.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                type: object
                required: [object, data, has_more, next_cursor]
                properties:
                  object: {type: string, const: list}
                  data: {type: array, items: {$ref: "#/components/schemas/ObserveSession"}}
                  has_more: {type: boolean}
                  next_cursor: {type: [string, "null"]}
        default:
          $ref: "#/components/responses/Error"
  /v1/observe/sessions/{id}:
    get:
      operationId: getObserveSession
      summary: Get a watched session
      description: >-
        One session with its transactions, newest first; the newest `diff_frames` (default 20,
        at most 100) carry their first 20 changed rows. A watched session has no level and no
        Matches or Doesn't match verdict: `observed` says so. Another org's session is 404.
      tags: [Observe]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: id, in: path, required: true, description: The session (`obs_…`)., schema: {type: string}}
        - {name: diff_frames, in: query, required: false, description: How many transactions carry a diff (0 to 100; default 20)., schema: {type: integer, minimum: 0, maximum: 100}}
      responses:
        "200":
          description: The session.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObserveSession"
        default:
          $ref: "#/components/responses/Error"
  /v1/observe/sessions/{id}/close:
    post:
      operationId: closeObserveSession
      summary: Close a watched session
      description: >-
        Moves an open session to `closing`. Deedglass seals it (the admin deed
        `observe.session_sealed`: ids, counts and digests only) once the decoder has passed the
        close time, at most 30 seconds later, or flags `decoder_behind` and keeps attaching late
        transactions for up to 10 minutes. Closing a session that is already closing or sealed
        answers it as it is.
      tags: [Observe]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, description: The session (`obs_…`)., schema: {type: string}}
      responses:
        "200":
          description: The session.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObserveSession"
        default:
          $ref: "#/components/responses/Error"
  /v1/observe/sessions/{id}/frames/{dtx}/exclude:
    post:
      operationId: excludeObserveFrame
      summary: Leave a transaction out of a session's undo
      description: >-
        `{"excluded": true}` leaves one transaction out of the session's undo (another writer's,
        for example); `false` puts it back. Only while the session is sealed and before an undo
        starts (409 `conflict` otherwise). Each change seals `observe.frame_excluded`, and the
        undo's record lists what was left out.
      tags: [Observe]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, description: The session (`obs_…`)., schema: {type: string}}
        - {name: dtx, in: path, required: true, description: The transaction (`dtx_…`)., schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [excluded]
              properties:
                excluded: {type: boolean}
      responses:
        "200":
          description: The session.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObserveSession"
        default:
          $ref: "#/components/responses/Error"
  /v1/observe/sessions/{id}/undo_preview:
    get:
      operationId: previewObserveUndo
      summary: Preview a session's undo
      description: >-
        Free. Plans the undo of every included transaction, newest first, from the row images
        Postgres committed, and runs S23's checks without a lock; it never executes. `conflicts`
        counts rows that changed again after the session (any conflict blocks the run). `sql` is
        the same plan as SQL you review and run yourself, in one transaction, each statement
        guarded by the values the session left; `refusals` say why there is no SQL (a TRUNCATE,
        images past the cap, sensitive columns, expired frames).
      tags: [Observe]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: id, in: path, required: true, description: The session (`obs_…`)., schema: {type: string}}
        - {name: allow_triggers, in: query, required: false, description: Let triggers fire again (the triggers check is then a warning)., schema: {type: boolean}}
        - {name: steps_limit, in: query, required: false, description: Steps to list, 1 to 1000 (default undo.preview_steps, 20)., schema: {type: integer, minimum: 1, maximum: 1000}}
      responses:
        "200":
          description: The preview.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObserveUndoPreview"
        default:
          $ref: "#/components/responses/Error"
  /v1/observe/sessions/{id}/undo:
    post:
      operationId: createObserveUndo
      summary: Undo a watched session in one step
      description: >-
        Pro (`undo_session`): 403 `pro_required` without it, naming the free path. Previews again,
        refuses `undo_conflict` (rows changed after the session), `undo_unavailable` (with
        `error.checks`), `undo_plan_stale` (the plan changed since the preview) or `already_undone`,
        then sends the undo through the Gate as an action of the org's `console` system agent:
        tool `<connector>.undo_session`, policy (the starter rule asks for a countersign), one
        transaction in Postgres, an L2 witness against the plan's exact footprint, and its own
        deed. The answer is the action object (202 `pending_approval`, or 200 once sealed).
      tags: [Observe]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, description: The session (`obs_…`)., schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan_digest, reason]
              properties:
                plan_digest: {type: string, pattern: "^sha256:[0-9a-f]{64}$", description: The preview's plan_digest.}
                reason: {type: string, minLength: 1, maxLength: 280}
                allow_triggers: {type: boolean}
                wait: {type: number, minimum: 0, maximum: 25, description: Seconds to wait for the outcome.}
      responses:
        "200":
          description: The undo action, sealed.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"
        "202":
          description: The undo action, waiting (usually for a countersign).
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"
        default:
          $ref: "#/components/responses/Error"
