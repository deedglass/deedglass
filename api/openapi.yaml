        or null. Data per kind: `chain_broken` {seq, deed, code, checked, checked_at};
        `org_stopped` {since, by, reason}; `slot_invalidated` {connector, connector_id, status,
        status_reason}; `slot_lagging` {connector, connector_id, lag_bytes, threshold_bytes};
