          $ref: "#/components/responses/Error"
  /v1/actions/{id}:
    get:
      operationId: getAction
      summary: Show one action, its events and deeds
      description: >-
        The action plus its payloads (`request`, `result`, and with `?expand[]=witness.detail` the
        witness detail; `null` once retention removed them, see `payload_pruned_at`), up to 200 events in order, and the deeds about it
        (the action deed and any amendments). An id from another org is 404 `not_found`, exactly
        like an id that doesn't exist. Requires `actions:read`. With `?wait=` (0 to 25 seconds)
        it long-polls: it answers when the action is settled (sealed, or waiting for a person),
        when its state changes, or when the wait ends. An action already `pending_approval` when
        the wait starts waits for its next change, which is how `next_action.poll_url` waits for a
        person's decision. For an agent key a Stop ends the wait at once with the stop error, and
        each agent may hold 20 open waits per instance (the 21st is 429 `rate_limited`, with
        `Retry-After: 1`).
      tags: [Ledger]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: id, in: path, required: true, description: The action id (`act_…`)., schema: {type: string}}
        - {name: wait, in: query, required: false, description: 'Seconds to long-poll, 0 to 25, sent once. `0` (the default) answers at once.', schema: {type: number, minimum: 0, maximum: 25}}
        - name: "expand[]"
          in: query
          required: false
          description: >-
            `request`, `result`, `events` or `witness.detail`, repeatable. The first three are
            accepted for the SDKs (this response always carries them); `witness.detail` adds the
            full witness_detail v1 as `witness.detail`, with passes and notes (S19). Any other
            value, or any other query parameter, is 400 `validation_failed`.
          schema:
            type: array
            items: {type: string, enum: [request, result, events, witness.detail]}
          style: form
          explode: true
      responses:
        "200":
          description: The action.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionDetail"
        default:
          $ref: "#/components/responses/Error"
  /v1/actions/{id}/cancel:
    post:
      operationId: cancelAction
      summary: Cancel an action waiting for approval
      description: >-
        Only from `pending_approval`: the action goes `cancelled`, then sealed, its approval is
        cancelled and its budget reservation goes back. From any other state the answer is 409
        `conflict`: "This action is already executing, so it can't be cancelled." while it runs,
        and "This action has already finished, so there is nothing to cancel." once it ended. The
        agent's own key (with `actions:execute`), an admin+ Console session (with the
        `Deedglass-CSRF` header) or an org admin key. Another agent's action is 404 `not_found`,
        exactly like an id that doesn't exist.
      tags: [Gate]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, description: The action id (`act_…`)., schema: {type: string}}
      responses:
        "200":
          description: "The action, `status: cancelled`, sealed."
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"
        "404":
          description: '`not_found`: no such action in this org, or (for an agent key) another agent''s.'
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: '`conflict`: the action isn''t waiting for approval.'
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  type: invalid_request_error
                  code: conflict
                  message: This action is already executing, so it can't be cancelled.
                  param: null
                  request_id: req_01k6w4a3d5f7h9k1n3q5s7v9x1
                  doc_url: https://docs.deedglass.com/errors/conflict
        default:
          $ref: "#/components/responses/Error"
  /v1/actions/{id}/undo/preview:
    post:
      operationId: previewUndo
      summary: Preview an undo
      description: >-
        Plans the undo of a Postgres write from what Postgres committed (the decoder's row
        images, never the agent's report), and runs the twelve safety checks without taking a
        lock. It writes nothing. `available` is true when no check failed; `steps.data` holds the
        first 20 steps (`?steps_limit=` up to 1,000); `policy` is a dry run for the `console`
        system agent. A signed-in admin or owner (with `Deedglass-CSRF`) or an org admin key;
        agent keys get 403 `insufficient_scope`. Another org's action is 404 `not_found`.
      tags: [Gate]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - {name: id, in: path, required: true, description: The action to undo (`act_…`)., schema: {type: string}}
        - {name: steps_limit, in: query, required: false, description: Steps to list, 1 to 1000 (default undo.preview_steps, 20)., schema: {type: integer, minimum: 1, maximum: 1000}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                allow_triggers: {type: boolean, description: Let triggers fire again (the triggers check is then a warning).}
      responses:
        "200":
          description: The preview.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UndoPreview"
        default:
          $ref: "#/components/responses/Error"
  /v1/actions/{id}/undo:
    post:
      operationId: createUndo
      summary: Undo an action
      description: >-
        Previews again, refuses `undo_unavailable` (409, with `error.checks`), `undo_plan_stale`
        (409, the plan changed since the preview) or `already_undone` (409), then sends the undo
        through the Gate as an action of the org's `console` system agent on behalf of the person:
        tool `<connector>.undo`, policy (the starter rule asks for a countersign), approval, one
        transaction in Postgres with the ledger row and the marker, an L2 witness against the
        plan's exact footprint, and its own sealed deed. The answer is the action object (202
        `pending_approval` with `next_action`, or 200 once sealed), with `undo.undoes`. A row
        that changed after the plan was made fails the undo with `undo_conflict` as its
        `execution.error_code`: Postgres rolled it back and nothing was changed.
      tags: [Gate]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, description: The action to undo (`act_…`)., schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan_digest, reason]
              properties:
                plan_digest: {type: string, pattern: "^sha256:[0-9a-f]{64}$", description: The preview's plan_digest.}
                reason: {type: string, minLength: 1, maxLength: 280, description: Why; the approver and the Ledger read it.}
                allow_triggers: {type: boolean}
                wait: {type: number, minimum: 0, maximum: 25, description: Seconds to wait for the outcome (gate.wait_timeout by default).}
      responses:
        "200":
          description: The undo action, sealed.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"
        "202":
          description: The undo action, waiting for a person's countersign (or still running).
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"
        "409":
          description: '`undo_unavailable`, `undo_plan_stale` or `already_undone`.'
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  type: invalid_request_error
                  code: undo_plan_stale
                  message: The rows changed since you previewed this undo. Preview it again and use the new plan.
                  param: plan_digest
                  request_id: req_01k6w4a3d5f7h9k1n3q5s7v9x1
                  doc_url: https://docs.deedglass.com/errors/undo_plan_stale
        default:
          $ref: "#/components/responses/Error"
  /v1/actions/{id}/result:
    post:
      operationId: reportActionResult
      summary: Report the result of a proxy-mode action
      description: >-
        Proxy mode only: after `POST /v1/actions` answered `status: authorized`, the edge runs the
        tool and reports what it returned here, once, before `next_action.deadline`
        (`gate.edge_result_timeout`, 10 minutes by default). Deedglass records the result as the
        edge's word (witness method `edge_reported`, level L0), then seals. Send `result`, or
        `result_digest` alone for a result too large to send; when both are sent the digest must
        match (sha256 of the result's RFC 8785 form), else 400 `validation_failed`. Errors: 404
        `not_found` (also for another agent's action, so ids can't be probed); 409 `conflict` for a
        gateway action, an action not yet authorized, a second report ("A result was already
        reported for this action."), or a report after the deadline ("This action was already
        sealed as UNVERIFIABLE because its result arrived after the deadline."). The same agent's
        key, with `actions:execute`.
      tags: [Gate]
      security: [{bearerAuth: []}]
      x-deedglass-auth: agent_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, description: The action id (`act_…`)., schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdgeResult"
            example:
              status: succeeded
              started_at: "2026-10-05T04:20:11.020Z"
              finished_at: "2026-10-05T04:20:11.061Z"
              result: {content: [{type: text, text: Wrote 5 bytes to /tmp/deedglass-demo/allowed/notes.txt}], isError: false}
              error_code: null
              error_message: null
      responses:
        "200":
          description: The action, witnessed and sealed.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"
        "400":
          description: >-
            `validation_failed`: `status`, the times, `error_code`, a result over
            `gate.max_result_bytes`, or a `result_digest` that doesn't match `result`.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: '`not_found`: no such action in this org, or another agent''s.'
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: '`conflict`: not a proxy action, not authorized yet, already reported, or past its deadline.'
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  type: invalid_request_error
                  code: conflict
                  message: This action was already sealed as UNVERIFIABLE because its result arrived after the deadline.
                  param: null
                  request_id: req_01k6w4a3d5f7h9k1n3q5s7v9x1
                  doc_url: https://docs.deedglass.com/errors/conflict
        default:
          $ref: "#/components/responses/Error"
  /v1/tools:
    get:
      operationId: listTools
      summary: The native tools this agent may see
      description: >-
        The tools of the Gate's native connectors (the ones `/mcp/native` serves), named
        `<connector>.<tool>`, for SDKs and `deedglass mcp serve`: the built-ins and, since S18, the
        caller's org's own connectors of native types (`postgres.*`, REST connectors; up to 100;
        `mcp_http` connectors are served at `/mcp/{connector}` instead). Tools the active policy always
        denies to this agent are left out; `include_hidden=true` lists them too, with `visibility:
        hidden` (the same answer `POST /v1/tools/resolve` gives, so nothing secret). Every call is
        still decided by `POST /v1/actions`. An agent key with `actions:execute`.
      tags: [Gate]
      security: [{bearerAuth: []}]
      x-deedglass-auth: agent_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - name: include_hidden
          in: query
          required: false
          description: Also list the tools the policy always denies, with `visibility` hidden.
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: The tools, sorted by name. Not paginated (`has_more` is false).
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolList"
              example:
                object: list
                data:
                  - object: tool
                    name: fake.echo
                    connector: fake
                    title: Echo
                    description: Returns its arguments.
                    input_schema: {type: object, properties: {message: {type: string}}, additionalProperties: false}
                    side_effect: read
                    visibility: visible
                has_more: false
                next_cursor: null
                policy_version: pv_01k6w4a3d5f7h9k1n3q5s7v9x1
        default:
          $ref: "#/components/responses/Error"
  /v1/tools/resolve:
    post:
      operationId: resolveTools
      summary: Which of an edge's tools the policy always denies
      description: >-
        For MCP wrappers (`deedglass mcp wrap`, docs/MCP.md): send the tools an MCP server lists,
        and Deedglass answers, for each, whether the enforced policy denies every call to it from
        this agent (`hidden`) or might allow it (`visible`). It reads the policy's static structure
        only: the first rule whose `match` covers `<connector>.<name>` decides, a rule with a `when`
        can't be decided ahead of time and counts as visible, and with no covering rule the
        policy's default decides. Budgets and Stop are ignored, because they change from minute to
        minute. MCP `annotations` are never read. Hiding is a convenience for the model: every call
        still goes through `POST /v1/actions` and is decided there. Nothing is recorded. At most
        500 tools. An agent key with `actions:execute`.
      tags: [Gate]
      security: [{bearerAuth: []}]
      x-deedglass-auth: agent_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolResolveRequest"
            example:
              connector: scratch
              tools:
                - {name: read_text_file, digest: "sha256:1b0e5c1f8a7d6e4b3c2a19f0e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9"}
                - {name: move_file, digest: "sha256:a41c5c1f8a7d6e4b3c2a19f0e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9"}
      responses:
        "200":
          description: One `tool_visibility` per tool, in request order.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolVisibilityList"
              example:
                object: list
                data:
                  - {object: tool_visibility, name: read_text_file, tool: scratch.read_text_file, visibility: visible, rule_id: allow-scratch-reads, reason: null}
                  - {object: tool_visibility, name: move_file, tool: scratch.move_file, visibility: hidden, rule_id: null, reason: "No rule allows this tool, and the policy default is deny."}
                has_more: false
                next_cursor: null
                policy_version: pv_01k6w4a3d5f7h9k1n3q5s7v9x1
        "400":
          description: '`validation_failed`: the connector name, a tool name or digest, or more than 500 tools.'
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /v1/deeds:
    get:
      operationId: listDeeds
      summary: List deeds
      description: >-
        Deed envelopes by seq, oldest first (`order=desc` for newest first). Each item is a stored
        deed; `GET /v1/deeds/{id}` returns its exact canonical bytes. Requires `deeds:read`.
      tags: [Deeds]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/FromSeq"
        - $ref: "#/components/parameters/ToSeq"
        - {name: kind, in: query, required: false, description: 'A comma list of `action`, `admin`, `amendment`.', schema: {type: string}}
        - {name: action, in: query, required: false, description: 'An action id: its deed and any amendments.', schema: {type: string}}
        - {name: order, in: query, required: false, description: '`asc` (default) or `desc`.', schema: {type: string, enum: [asc, desc]}}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of deeds.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeedList"
        default:
          $ref: "#/components/responses/Error"
  /v1/deeds/{id}:
    get:
      operationId: getDeed
      summary: Get one deed's exact bytes
      description: >-
        The stored canonical JSON of the deed envelope, byte for byte, so its hash and seal check
        offline. Deeds never change: the response is cacheable forever and its `ETag` is the
        `body_hash`. With `Accept: application/cose` the deed comes as a COSE_Sign1 signed
        statement (RFC 9052; not an RFC 9942 transparency-service object). Requires `deeds:read`.
      tags: [Deeds]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: id, in: path, required: true, description: The deed id (`deed_…`)., schema: {type: string}}
        - {name: If-None-Match, in: header, required: false, description: The `ETag` of a copy you hold., schema: {type: string}}
      responses:
        "200":
          description: The deed.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            ETag:
              description: '`"sha256:<hex>"`: the deed''s `body_hash`.'
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: private, max-age=31536000, immutable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deed"
            application/cose:
              schema:
                type: string
                contentMediaType: application/cose
        "304":
          description: The copy named in `If-None-Match` is current.
        default:
          $ref: "#/components/responses/Error"
  /v1/deeds/files:
    post:
      operationId: sealFile
      summary: Seal a file you hold
      description: >-
        What `deedglass deeds seal-file` calls (S38): seals the admin deed `file.sealed` from a
        file's sha256, size, media type and label. The file itself never reaches the server; the
        CLI hashes it locally. The deed carries the label as `admin.reason` and `data_digest` over
        these four fields, so `deedglass verify <deed.json> --file <path>` checks the file against
        the deed offline. It seals the file's hash, size, type and label. It says nothing about
        whether the file's contents are right. An admin+ Console session or an org admin key;
        agent keys get 403 `insufficient_scope`.
      tags: [Deeds]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sha256, bytes, media_type, label]
              properties:
                sha256: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
                bytes: {type: integer, minimum: 0, maximum: 9007199254740991}
                media_type: {type: string, enum: [application/pdf, text/markdown, application/json, text/plain, text/html]}
                label: {type: string, minLength: 1, maxLength: 120, description: No line breaks or control characters.}
      responses:
        "201":
          description: The sealed file and its deed.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SealedFile"
        default:
          $ref: "#/components/responses/Error"
  /v1/deeds/export:
    get:
      operationId: exportDeeds
      summary: Export deeds as a bundle
      description: >-
        A streamed export bundle v1 (docs/BUNDLE_FORMAT.md): a deterministic tar.gz holding
        README.txt, keys.json, deeds.jsonl, manifest.json and manifest.seal.json, read from one
        database snapshot. Choose deeds by seq or by issued_at, at most 1,000,000 at a time; an
        empty range is 404 with where the chain ends. Check the file with `deedglass verify
        <file> --keys <this server>/.well-known/deedglass/keys.json`. Requires `deeds:read`.
        With `format=fhir-auditevent` or `format=fhir-provenance` (HC-P10) the same range is
        written as FHIR R4 NDJSON instead: one AuditEvent (IHE BALP profiles) per FHIR interaction,
        or one Provenance (HL7 AI Transparency AI Provenance) per successful FHIR write, with ids and
        digests only (docs/EXPORTS.md).
      tags: [Deeds]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/FromSeq"
        - $ref: "#/components/parameters/ToSeq"
        - {name: "issued_at[gte]", in: query, required: false, description: RFC 3339; inclusive. Not with from_seq or to_seq., schema: {type: string, format: date-time}}
        - {name: "issued_at[lt]", in: query, required: false, description: RFC 3339; exclusive., schema: {type: string, format: date-time}}
        - {name: format, in: query, required: false, description: "tar.gz (the default, a sealed bundle), fhir-auditevent or fhir-provenance (FHIR R4 NDJSON).", schema: {type: string, enum: [tar.gz, fhir-auditevent, fhir-provenance]}}
      responses:
        "200":
          description: The bundle, streamed; or FHIR R4 NDJSON for a fhir-* format.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Content-Disposition:
              description: '`attachment; filename="deedglass-<org>-<first>-<last>.tar.gz"`.'
              schema:
                type: string
          content:
            application/gzip:
              schema:
                type: string
                contentMediaType: application/gzip
            application/fhir+ndjson:
              schema:
                type: string
                contentMediaType: application/fhir+ndjson
        default:
          $ref: "#/components/responses/Error"
  /v1/security_pack/readiness:
    get:
      operationId: getSecurityPackReadiness
      summary: Read the security review readiness
      description: >-
        Free. The 24 questions of the security review pack with each one's status (`in_place`,
        `partly`, `not_set_up`, `not_applicable`, `cant_tell`) and, for a gap, the fix. No evidence
        and no document: those are the pack's (POST /v1/security_pack, Pro). Every status is
        computed from this org's own records; a question whose evidence can't be read is
        `cant_tell`, never `in_place`. The chain check here covers the last day (the pack checks the
        whole period). Agent keys get 403.
      tags: [Security pack]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: period_days, in: query, required: false, description: The window to count, 7 to 365 days (default 90)., schema: {type: integer, minimum: 7, maximum: 365}}
      responses:
        "200":
          description: The readiness view.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityPackReadiness"
        default:
          $ref: "#/components/responses/Error"
  /v1/security_pack:
    post:
      operationId: createSecurityPack
      summary: Build the security review pack
      description: >-
        Pro (`security_pack`): 403 `pro_required` without it, naming the free readiness view. Builds
        the pack from this org's own records for the period and answers the folder as a tar stream:
        `index.html` (print-ready, no script, no external request), `answers.md`, `answers.json`
        (security_pack v1), `records.tar.gz` (export bundle v1 for the period, unless `records` is
        false), `README.txt` and `pack.seal.json`, which holds a `file.sealed` deed over each of
        those files and the public seal keys, so `deedglass security-pack verify` checks the folder
        offline. With `aliases`, agent, connector and rule names become stable aliases and the
        mapping is written only to `aliases.private.json`. Each build seals new records, so an
        Idempotency-Key is ignored. Owners and admins only; agent keys get 403.
      tags: [Security pack]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                period_days: {type: integer, minimum: 7, maximum: 365, description: The window to count (default 90).}
                aliases: {type: boolean, description: Replace agent, connector and rule names with aliases (default false).}
                records: {type: boolean, description: Include the period's records as records.tar.gz (default true).}
      responses:
        "200":
          description: The pack folder as a tar stream (one directory, security-pack-<org>-<date>/).
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
            Content-Disposition:
              description: attachment; filename="security-pack.tar"
              schema:
                type: string
          content:
            application/x-tar:
              schema:
                type: string
                contentMediaType: application/x-tar
        default:
          $ref: "#/components/responses/Error"
  /v1/weekly:
    get:
      operationId: getWeekly
      summary: Read the weekly summary
      description: >-
        Free. "What your agents did this week": the org's actions by decision, agent and tool,
        Check results, the top three rules that blocked, approvals, undos, Stop, watched sessions,
        what Deedglass caught (each with its free way back) and the record chain check, counted from
        this org's own records. Integers, ids and the org's own agent, tool and rule names only;
        never arguments, results or row values. `email` is the signed-in person's Monday email
        setting (null for an org admin key). Agent keys get 403.
      tags: [Weekly]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: period, in: query, required: false, description: "A week like 2026-W43, a month like 2026-10, or current for this week so far (default: the last complete week, in the org's time zone).", schema: {type: string, maxLength: 16}}
      responses:
        "200":
          description: The weekly view.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyView"
        default:
          $ref: "#/components/responses/Error"
  /v1/weekly/email:
    post:
      operationId: setWeeklyEmail
      summary: Turn your Monday email on or off
      description: >-
        The signed-in person's own `weekly_email` setting in this org (on by default). Only owners
        receive the email, and only when the server has a mailer. Sessions only.
      tags: [Weekly]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [weekly_email]
              properties:
                weekly_email: {type: boolean}
      responses:
        "200":
          description: The setting now.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyEmailState"
        default:
          $ref: "#/components/responses/Error"
  /v1/clients:
    get:
      operationId: listClients
      summary: List your client orgs
      description: >-
        Pro (`agency`): 403 `pro_required` without it, naming the free single-org report. One row per
        org the signed-in person belongs to as owner or admin, with this period's actions, Doesn't
        match count, caught count, waiting approvals, Stop state, chain check and last activity.
        Each row is read in that org's own read-only transaction under its own row-level security,
        after the membership is checked there again; no query spans orgs. At most 200 a page.
      tags: [Weekly]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: period, in: query, required: false, description: "current (default: this week so far, UTC), a week like 2026-W43 or a month like 2026-10.", schema: {type: string, maxLength: 16}}
        - {name: exclude, in: query, required: false, description: An org slug or id to leave out (repeat it); usually the agency's own org., schema: {type: string, maxLength: 64}}
        - {name: limit, in: query, required: false, description: Rows per page, 1 to 200 (default 100)., schema: {type: integer, minimum: 1, maximum: 200}}
        - {name: cursor, in: query, required: false, description: next_cursor from the previous page., schema: {type: string, maxLength: 40}}
      responses:
        "200":
          description: The client orgs.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientList"
        default:
          $ref: "#/components/responses/Error"
  /v1/ledger/check:
    get:
      operationId: checkLedger
      summary: Check the deed chain
      description: >-
        Checks every deed in the range in seq order against this server's own seal keys: hashes,
        seals, links and seq continuity. A broken chain is a 200 result with `status: broken` and
        the first break, not an error. The check stops after 30 s or 2,000,000 deeds with `status:
        incomplete` and `next_from_seq`. Keep `head` somewhere outside Deedglass: it is how a
        deletion from the end of the chain becomes visible. Requires `deeds:read`.
      tags: [Ledger]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/FromSeq"
        - $ref: "#/components/parameters/ToSeq"
        - {name: "issued_at[gte]", in: query, required: false, description: RFC 3339; inclusive. Not with from_seq or to_seq., schema: {type: string, format: date-time}}
        - {name: "issued_at[lt]", in: query, required: false, description: RFC 3339; exclusive., schema: {type: string, format: date-time}}
      responses:
        "200":
          description: The result.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerCheck"
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/login:
    post:
      operationId: requestLogin
      summary: Ask for a sign-in link and code
      description: >-
        Public. Always 202 with the same body for every well-formed address, whether or not it has
        an account: the server never reads the database here, and a worker sends the email. The
        email carries one link (`/auth/confirm#t=…`, valid once for 15 minutes) and a 6-digit code
        for another device. Limits: 20 requests per IP and 5 per address per hour (429
        `rate_limited` with `Retry-After`).
      tags: [People]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: {type: string, maxLength: 254}
            example: {email: Priya@Acme.com}
      responses:
        "202":
          description: Accepted. The same for known and unknown addresses.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginRequest"
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/preview:
    post:
      operationId: previewLogin
      summary: See what a sign-in link would do, without using it
      description: >-
        Public. The confirm page calls this first and shows whose account and which org the link
        signs into, so nobody is signed in to an account they didn't expect (login CSRF). Nothing is
        consumed. An unknown, used, replaced or expired token is 400 `login_link_invalid`; 30
        failures per IP per hour are allowed.
      tags: [People]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: {type: string, minLength: 43, maxLength: 43}
            example: {token: OEVkbr-q18qimgaDkbcE5mnZqQ2a1zGG7_TgYq8PKFc}
      responses:
        "200":
          description: What the link does.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginPreview"
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/callback:
    post:
      operationId: completeLogin
      summary: Sign in with a link's token, or with an email address and code
      description: >-
        Public. Uses the token once (only while unused, not replaced by a newer email and not
        expired), accepts the invite when the link is one, and sets the session and CSRF cookies.
        With `email` and `code`, the code must belong to the newest email; each code allows 5
        attempts. Every miss is 400 `login_code_invalid` with the same message.
      tags: [People]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [token]
                  properties:
                    token: {type: string}
                - type: object
                  additionalProperties: false
                  required: [email, code]
                  properties:
                    email: {type: string}
                    code: {type: string, description: Six digits; spaces are ignored.}
            examples:
              link: {value: {token: OEVkbr-q18qimgaDkbcE5mnZqQ2a1zGG7_TgYq8PKFc}}
              code: {value: {email: priya@acme.com, code: "482913"}}
      responses:
        "200":
          description: Signed in. `Set-Cookie` carries `__Host-deedglass_session` and `__Host-deedglass_csrf`.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Set-Cookie:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Sign out
      description: >-
        Ends this session, or with `everywhere` every session of yours in every org, and expires the
        cookies. Needs the `Deedglass-CSRF` header.
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                everywhere: {type: boolean, default: false}
      responses:
        "204":
          description: Signed out.
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/switch-org:
    post:
      operationId: switchOrg
      summary: Switch to another org you belong to
      description: >-
        Issues a new session in the org (new cookies) and ends the current one. Needs the
        `Deedglass-CSRF` header.
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [org]
              properties:
                org: {type: string}
      responses:
        "200":
          description: The new session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
  /v1/me:
    get:
      operationId: getMe
      summary: Who is signed in
      description: The person, the session's org, their role there, the orgs they can switch to, and the CSRF token.
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      responses:
        "200":
          description: You.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMe
      summary: Change your name
      description: The name other members see. An empty string clears it. Needs the `Deedglass-CSRF` header.
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, maxLength: 80}
      responses:
        "200":
          description: You, updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
  /v1/org:
    get:
      operationId: getOrg
      summary: Get your org
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      responses:
        "200":
          description: The org.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateOrg
      summary: Change the org's name, time zone, payload retention or approval settings
      description: >-
        Admins and owners change `name` and `timezone`; only an owner may send `retention_days` or
        `settings` (an admin gets 403 `insufficient_role`). Only the fields and keys sent change;
        `settings.approvals` is merged into the stored settings. Seals one `org.updated` admin deed
        when something changed (data: `fields`, `timezone`, and the new `retention_days` and
        `approvals` when sent), none otherwise. Needs the `Deedglass-CSRF` header.
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                timezone: {type: string, description: An IANA time zone name such as Asia/Kolkata.}
                retention_days:
                  type: [integer, "null"]
                  minimum: 1
                  maximum: 3650
                  description: Owner only (S26). Days to keep action payloads; null goes back to the default of 90.
                settings:
                  type: object
                  additionalProperties: false
                  description: Owner only (S26). Unknown keys are 400 `validation_failed` with their path as `param`.
                  properties:
                    approvals:
                      type: object
                      additionalProperties: false
                      properties:
                        email_links: {type: string, enum: [decide, review]}
                        email_detail: {type: string, enum: [summary, full]}
                        self_countersign: {type: string, enum: [deny, allow]}
                    phi_mode:
                      type: boolean
                      description: >-
                        HC-P09. true: once an action is sealed and its checks are done, its stored request, result,
                        error message and witness detail keep ids and digests only; turning it on covers the org's
                        earlier actions that still hold payloads. false stops it for new actions and never brings
                        payloads back. Sealed in the org.updated deed.
            example: {timezone: Asia/Kolkata}
      responses:
        "200":
          description: The org, with the deed (null when nothing changed).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Org"
                  - type: object
                    required: [deed]
                    properties:
                      deed: {type: [string, "null"]}
        default:
          $ref: "#/components/responses/Error"
  /v1/org/members:
    get:
      operationId: listMembers
      summary: List the org's members
      description: Oldest first. Without `status`, invited and active members; `status=removed` lists people who were removed.
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: status, in: query, required: false, schema: {type: string, enum: [invited, active, removed]}}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: inviteMember
      summary: Invite someone
      description: >-
        Admins invite viewers and admins; only owners invite owners. Sends a one-time invite link,
        valid for 7 days, and seals `member.invited`. 201 for a new invite; 200 when the person was
        already invited (the old link stops working and a new one is sent); 409 `conflict` for an
        active member. Needs the `Deedglass-CSRF` header.
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: {type: string}
                role: {type: string, enum: [viewer, admin, owner]}
            example: {email: sam@acme.com, role: viewer}
      responses:
        "201":
          description: Invited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "200":
          description: Invited again, with a fresh link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        default:
          $ref: "#/components/responses/Error"
  /v1/org/members/{id}:
    patch:
      operationId: updateMember
      summary: Change a member's role
      description: >-
        Owners only. Seals `member.role_changed`. Demoting the last owner is 409 `last_owner`. The
        change applies on the member's next request. Needs the `Deedglass-CSRF` header.
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRF"
        - {name: id, in: path, required: true, description: The membership id (`mem_…`)., schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: {type: string, enum: [viewer, admin, owner]}
      responses:
        "200":
          description: The membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeMember
      summary: Remove a member, or leave
      description: >-
        Admins remove viewers and admins; owners remove anyone; removing yourself is leaving. The
        member's sessions in the org end at once. Seals `member.removed`. Removing the last owner is
        409 `last_owner`. Needs the `Deedglass-CSRF` header.
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRF"
        - {name: id, in: path, required: true, description: The membership id (`mem_…`)., schema: {type: string}}
      responses:
        "200":
          description: The membership, now removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        default:
          $ref: "#/components/responses/Error"
  /v1/agents:
    get:
      operationId: listAgents
      summary: List agents
      description: >-
        Oldest first. Filters combine with AND. Unknown parameters are refused. A Console session
        (viewer and up) or an org admin key (`admin` scope); agent keys get 403
        `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: status, in: query, required: false, schema: {type: string, enum: [active, suspended, stopped]}}
        - {name: label, in: query, required: false, description: 'One label as `key:value`, like `env:prod`.', schema: {type: string}}
        - {name: name, in: query, required: false, description: The exact agent name (the CLI resolves names this way)., schema: {type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$"}}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: "expand[]"
          in: query
          required: false
          description: >-
            `usage` (also `expand=usage`) adds `usage` (S11's counters: calls this minute, hour and
            org-local day, spend today) and `last_action_at` to each agent, read in one batch for a
            page. Never included by default; any other value is 400 `validation_failed`.
          schema:
            type: array
            items: {type: string, enum: [usage]}
          style: form
          explode: true
      responses:
        "200":
          description: A page of agents.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAgent
      summary: Create an agent
      description: >-
        Seals `agent.created`. The name (`^[a-z0-9][a-z0-9-]{1,62}$`, unique in the org) can't
        change later, because policies match on it; `console`, `system` and `deedglass` are
        reserved. At most 32 labels. Budgets are in minor units (cents for usd). `owner` defaults
        to the signed-in person. A taken name is 409 `conflict`. An admin+ Console session (with the
        `Deedglass-CSRF` header) or an org admin key; agent keys get 403 `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$", description: Immutable. Not console, system or deedglass.}
                description: {type: string, maxLength: 500}
                labels:
                  $ref: "#/components/schemas/Labels"
                budgets:
                  $ref: "#/components/schemas/Budgets"
                owner: {type: string, description: An active member's id (`usr_…`).}
            example:
              name: support-bot
              description: Answers refund tickets in Zendesk
              labels: {env: prod, team: support}
              budgets: {calls_per_minute: 60, calls_per_day: 5000, spend_per_day: {amount: 5000, currency: usd}}
      responses:
        "201":
          description: The agent, with the deed that sealed `agent.created`.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/agents/{id}:
    get:
      operationId: getAgent
      summary: Get an agent
      description: >-
        An id from another org is 404 `not_found`, like an id that doesn't exist. A Console session
        (viewer and up) or an org admin key; agent keys get 403 `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/AgentId"
        - name: "expand[]"
          in: query
          required: false
          description: >-
            `usage` (also `expand=usage`) adds `usage` (S11's counters: calls this minute, hour and
            org-local day, spend today) and `last_action_at` to each agent, read in one batch for a
            page. Never included by default; any other value is 400 `validation_failed`.
          schema:
            type: array
            items: {type: string, enum: [usage]}
          style: form
          explode: true
      responses:
        "200":
          description: The agent.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateAgent
      summary: Change an agent's description, labels, budgets, owner or intent mode
      description: >-
        Send only what changes. `labels` and `budgets` replace the whole map; `owner: ""` clears the
        owner. Names are immutable, so sending `name` is 422 `validation_failed`: to rename, create
        a new agent and move its keys. Seals `agent.updated` unless nothing changed (then `deed` is
        null). Changing `intent_mode` seals its own deed, `agent.intent_mode_changed` with `from`
        and `to`; setting it to `required` while the agent has no intent keys is 409 `conflict`
        (add a key first). An admin+ Console session (with the `Deedglass-CSRF` header) or an org
        admin key; agent keys get 403 `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                description: {type: string, maxLength: 500}
                labels:
                  $ref: "#/components/schemas/Labels"
                budgets:
                  $ref: "#/components/schemas/Budgets"
                owner: {type: string, description: An active member's id (`usr_…`), or "" to clear it.}
                intent_mode:
                  type: string
                  enum: ["off", optional, required]
                  description: >-
                    Signed intents (S09): off (headers ignored), optional (checked when sent) or
                    required (every call needs one).
            example: {labels: {env: prod, team: support, tier: "1"}}
      responses:
        "200":
          description: The agent, with the deed (null when nothing changed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/agents/{id}/suspend:
    post:
      operationId: suspendAgent
      summary: Suspend an agent
      description: >-
        A planned pause. New calls are refused with 403 `agent_suspended`; resume undoes it. Seals
        `agent.suspended`. Idempotent: suspending a suspended agent returns 200 unchanged with
        `deed: null`. Suspending a stopped agent is 409 `conflict`. An admin+ Console session (with
        the `Deedglass-CSRF` header) or an org admin key; agent keys get 403 `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        $ref: "#/components/requestBodies/OptionalReason"
      responses:
        "200":
          description: The agent, with the deed (null when it was already suspended).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/agents/{id}/resume:
    post:
      operationId: resumeAgent
      summary: Resume a suspended agent
      description: >-
        Seals `agent.resumed`. Idempotent: resuming an active agent returns 200 unchanged with
        `deed: null`. Resuming a stopped agent is 409 `conflict` (start it instead). An admin+
        Console session (with the `Deedglass-CSRF` header) or an org admin key; agent keys get 403
        `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        $ref: "#/components/requestBodies/OptionalReason"
      responses:
        "200":
          description: The agent, with the deed (null when it was already active).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/agents/{id}/stop:
    post:
      operationId: stopAgent
      summary: Stop an agent
      description: >-
        The emergency brake. Seals `agent.stopped`; every Deedglass instance refuses the agent's
        calls within 2 seconds, with 403 `agent_stopped`. Actions already running at a tool finish:
        Stop can't un-run them. The reason is optional and never shown to the agent. Idempotent:
        stopping a stopped agent returns 200 unchanged with `deed: null`. If the stop can't be
        recorded the answer is 500 `internal_error` and nothing changed; the API never says stopped
        unless it is. An admin+ Console session (with the `Deedglass-CSRF` header) or an org admin
        key; agent keys get 403 `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        $ref: "#/components/requestBodies/OptionalReason"
      responses:
        "200":
          description: The agent, now stopped, with the deed (null when it was already stopped).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResult"
              example:
                object: agent
                id: agt_01k633rrmh3bcz2p39gg4vp46q
                name: support-bot
                description: Answers refund tickets in Zendesk
                labels: {env: prod, team: support}
                budgets: {calls_per_minute: 60, calls_per_day: 5000, spend_per_day: {amount: 5000, currency: usd}}
                status: stopped
                status_reason: Refund loop in staging
                status_changed_at: "2026-10-03T14:02:09.000Z"
                status_changed_by: usr_01k6c9kb2zcjsyn7b8g2k1vqvp
                owner: usr_01k6c9kb2zcjsyn7b8g2k1vqvp
                active_keys: 1
                last_used_at: "2026-10-03T14:01:58.512Z"
                created_at: "2026-10-03T10:02:11.000Z"
                updated_at: "2026-10-03T14:02:09.000Z"
                intent_mode: "off"
                deed: deed_01k6vrddq2atgb2023qvhhct3g
        default:
          $ref: "#/components/responses/Error"
  /v1/agents/{id}/start:
    post:
      operationId: startAgent
      summary: Start a stopped agent
      description: >-
        Seals `agent.started`. The reason is required (3 to 280 characters, saying why it's safe now)
        and goes into the deed. Idempotent: starting an active agent returns 200 unchanged with
        `deed: null`. Starting a suspended agent is 409 `conflict` (resume it instead). While the
        org is stopped (Stop all), the agent stays refused with `org_stopped`. An admin+ Console
        session (with the `Deedglass-CSRF` header) or an org admin key; agent keys get 403
        `insufficient_scope`, so no agent can start itself.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        $ref: "#/components/requestBodies/RequiredReason"
      responses:
        "200":
          description: The agent, with the deed (null when it was already active).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/agents/{id}/keys:
    get:
      operationId: listAgentKeys
      summary: List an agent's API keys
      description: >-
        The agent's keys, newest first, revoked and expired ones included (at most 100). The secret
        is never shown. A Console session (viewer and up) or an org admin key; agent keys get 403
        `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: The keys, in one page.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAgentKey
      summary: Create an API key for an agent
      description: >-
        201. The `secret` is shown once, in this response; Deedglass stores only its hash. Replaying
        the same `Idempotency-Key` returns the same key with `"secret": null` and
        `Deedglass-Idempotent-Replayed: true`; if the first response was lost, roll or revoke that
        key. Scopes default to `actions:execute`, `actions:read` and `deeds:read`; agent keys can't
        hold `admin`. An agent has at most 10 active keys; the 11th is 409 `conflict`. Seals
        `api_key.created`. An admin+ Console session (with the `Deedglass-CSRF` header) or an org
        admin key; agent keys get 403 `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, maxLength: 64, description: A label for people, without line breaks.}
                mode: {type: string, enum: [live, test], default: live}
                scopes:
                  type: array
                  uniqueItems: true
                  items: {type: string, enum: ["actions:execute", "actions:read", "deeds:read", "actions:undo"]}
                  default: ["actions:execute", "actions:read", "deeds:read"]
            example: {name: prod runner, mode: live}
      responses:
        "201":
          description: The key, with its secret (null in a replay).
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/agents/{id}/intent-keys:
    get:
      operationId: listIntentKeys
      summary: List an agent's intent keys
      description: >-
        The Ed25519 public keys the agent signs intents with (at most two). A Console session
        (viewer and up) or an org admin key; agent keys get 403 `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: The intent keys, in one page.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentKeyList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: addIntentKey
      summary: Register an intent key for an agent
      description: >-
        201. Registers an Ed25519 public key the agent signs intents with. The key must pass the
        registration rules: 32 bytes, canonical encoding, on the curve and not of small order;
        otherwise the answer is 422 `validation_failed` with `param` set to `public_key`. A key
        whose `kid` is already registered, or a third key, is 409 `conflict`: an agent has at most
        two intent keys; two lets you rotate without downtime. Seals `agent.intent_key_added`. An
        admin+ Console session (with the `Deedglass-CSRF` header) or an org admin key; agent keys
        get 403 `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [public_key]
              properties:
                public_key:
                  type: string
                  pattern: "^ed25519:[A-Za-z0-9_-]{43}$"
                  description: '`ed25519:` and the 32-byte public key in base64url without padding.'
            example: {public_key: "ed25519:11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo"}
      responses:
        "201":
          description: The intent key, with the deed.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentKey"
        default:
          $ref: "#/components/responses/Error"
  /v1/agents/{id}/intent-keys/{kid}:
    delete:
      operationId: removeIntentKey
      summary: Remove an intent key
      description: >-
        Intents signed with the key are refused from now on. Removing the last key while the
        agent's `intent_mode` is `required` is 409 `conflict` (change the mode first); a `kid` the
        agent doesn't have is 404 `not_found`. Seals `agent.intent_key_removed`. An admin+ Console
        session (with the `Deedglass-CSRF` header) or an org admin key; agent keys get 403
        `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/IntentKid"
      responses:
        "200":
          description: The key is removed, with the deed.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentKeyDeleted"
        default:
          $ref: "#/components/responses/Error"
  /v1/keys/{id}/roll:
    post:
      operationId: rollKey
      summary: Roll an API key
      description: >-
        201. Creates a new key with the same agent, name, mode and scopes; its `secret` is shown
        once, and `previous` says when the old key stops working (`expires_in` seconds from now,
        0–604800, default 86400). Rolling a revoked or expired key is 409 `conflict`. Admin keys
        can't roll admin keys (403 `insufficient_role`), because that creates one. Replaying the
        same `Idempotency-Key` returns `"secret": null`. Seals `api_key.rolled`. An admin+ Console
        session (with the `Deedglass-CSRF` header) or an org admin key; agent keys get 403
        `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/KeyId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expires_in: {type: integer, minimum: 0, maximum: 604800, default: 86400, description: Seconds the old key keeps working.}
            example: {expires_in: 86400}
      responses:
        "201":
          description: The new key, with its secret and the old key's expiry.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyResult"
              example:
                object: api_key
                id: key_01k6jt6tgx72gjr876976xak5e
                agent: agt_01k633rrmh3bcz2p39gg4vp46q
                name: prod runner
                mode: live
                prefix: dg_live_0IDw6L5O
                scopes: ["actions:execute", "actions:read", "deeds:read"]
                secret: dg_live_0IDw6L5O_9hxevwY7nqdKIZZi5A2xlI2O2qn8znik
                expires_at: null
                last_used_at: null
                revoked_at: null
                rolled_from: key_01k6jz12ptrvg2zn5vts5xc1ay
                created_at: "2026-10-03T10:03:40.000Z"
                deed: deed_01k6vrddq2atgb2023qvhhct3g
                previous: {id: key_01k6jz12ptrvg2zn5vts5xc1ay, expires_at: "2026-10-04T10:03:40.000Z"}
        default:
          $ref: "#/components/responses/Error"
  /v1/keys/{id}/revoke:
    post:
      operationId: revokeKey
      summary: Revoke an API key
      description: >-
        The key stops working at once (401 `api_key_revoked`). Seals `api_key.revoked`. Idempotent:
        revoking a revoked key returns 200 with `deed: null`. An admin+ Console session (with the
        `Deedglass-CSRF` header) or an org admin key; agent keys get 403 `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/KeyId"
      requestBody:
        $ref: "#/components/requestBodies/OptionalReason"
      responses:
        "200":
          description: The key, now revoked, with the deed (null when it was already revoked).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/org/stop-all:
    post:
      operationId: stopAllAgents
      summary: Stop every agent in the org
      description: >-
        Turns on the org's Stop all: every agent's calls are refused with 403 `org_stopped`,
        whatever its own status, on every instance within 2 seconds. Seals `org.stopped_all`. The reason
        is optional. Idempotent: repeating it returns 200 unchanged with `deed: null`. If it can't be
        recorded the answer is 500 `internal_error` and nothing changed. An admin+ Console session
        (with the `Deedglass-CSRF` header) or an org admin key; agent keys get 403
        `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/OptionalReason"
      responses:
        "200":
          description: The org's Stop all state, with the deed (null when it was already on).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgStop"
        default:
          $ref: "#/components/responses/Error"
  /v1/org/start-all:
    post:
      operationId: startAllAgents
      summary: Turn off Stop all
      description: >-
        Owners only, in the Console: admin keys can't release the brake. The reason is required
        (3 to 280 characters) and goes into the deed. Agents stopped one by one stay stopped. Seals
        `org.started_all`. Idempotent: when Stop all is off, returns 200 unchanged with `deed: null`.
        Needs the `Deedglass-CSRF` header.
      tags: [Agents]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/RequiredReason"
      responses:
        "200":
          description: The org's Stop all state, now off, with the deed (null when it was already off).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgStop"
        default:
          $ref: "#/components/responses/Error"
  /v1/org/keys:
    get:
      operationId: listAdminKeys
      summary: List the org's admin keys
      description: Newest first, revoked ones included (at most 100). The secret is never shown. Admins and owners, in the Console only.
      tags: [Agents]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      responses:
        "200":
          description: The admin keys, in one page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAdminKey
      summary: Create an org admin key
      description: >-
        201. An admin key acts as the admin role (never owner) on the control plane: it can't call
        start-all, change roles or create admin keys, so admin keys can't keep access alive on their
        own. Its scopes are exactly `[admin]`. Admins and owners, in the Console only (or `deedglass
        org keys create` on the server). The `secret` is shown once; a replay returns `"secret":
        null`. Seals `api_key.created`. Needs the `Deedglass-CSRF` header.
      tags: [Agents]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, maxLength: 64}
                mode: {type: string, enum: [live, test], default: live}
                scopes:
                  type: array
                  description: Leave it out; admin keys always have exactly `[admin]`.
                  minItems: 1
                  maxItems: 1
                  items: {type: string, const: admin}
            example: {name: terraform}
      responses:
        "201":
          description: The admin key, with its secret (null in a replay).
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/whoami:
    get:
      operationId: whoami
      summary: Which key, agent and org this is
      description: >-
        Any API key. It skips the stop checks, so a stopped or suspended agent (or one in a stopped
        org) can learn its status here. It never includes a stop reason or who stopped the agent.
        For an org admin key, `agent` and `budgets` are null. An invalid, revoked or expired key is
        401 with `WWW-Authenticate: Bearer realm="deedglass", error="invalid_token"`.
      tags: [Agents]
      security: [{bearerAuth: []}]
      x-deedglass-auth: agent_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      responses:
        "200":
          description: The key's identity and statuses.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Whoami"
        default:
          $ref: "#/components/responses/Error"
  /v1/intents/verify:
    post:
      operationId: verifyIntent
      summary: Check a signed intent without acting
      description: >-
        A conformance check for SDK authors. It checks the `Deedglass-Intent` header in every intent
        mode (`off` included) exactly as the Gate will, consumes the nonce, and never acts: no tool
        is called. Without the header the answer is 422 `validation_failed` ("Send a
        Deedglass-Intent header to check."), except for an agent in `required` mode, which gets 403
        `intent_required`. Refusals are 403 `permission_error` with code `intent_invalid` (`param`
        names the field), `intent_replay` or `intent_required`; never 401. `Idempotency-Key` is
        ignored. An agent key with `actions:execute`.
      tags: [Intents]
      security: [{bearerAuth: []}]
      x-deedglass-auth: agent_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/DeedglassIntent"
        - $ref: "#/components/parameters/DeedglassOnBehalfOf"
        - $ref: "#/components/parameters/DeedglassSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tool, args]
              properties:
                tool:
                  type: string
                  pattern: '^[a-z][a-z0-9-]{1,31}\.[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
                  description: The tool the intent names, as `<connector>.<tool>`.
                args:
                  description: The arguments, any JSON value (use {} for none; at most 256 KiB).
            example: {tool: stripe.refund, args: {charge: ch_3QxZ8f2L, amount: 1200}}
      responses:
        "200":
          description: The intent passed every check, and its nonce is consumed.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentCheck"
        "403":
          description: >-
            The intent was refused: `intent_invalid` (`param` names the field), `intent_replay` or
            `intent_required`.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                intent_replay:
                  summary: The nonce was already used
                  value:
                    error:
                      type: permission_error
                      code: intent_replay
                      message: This signed intent was already used at 09:30:02 UTC. Sign a new intent, with a fresh nonce, for every call.
                      param: nonce
                      request_id: req_01j9zr3m5k8q2w7x4t6v0b1c9d
                      doc_url: https://docs.deedglass.com/errors/intent_replay
                intent_invalid:
                  summary: The arguments differ from the signed ones
                  value:
                    error:
                      type: permission_error
                      code: intent_invalid
                      message: The signed intent's args_digest doesn't match the arguments sent. Sign the exact arguments you send, canonicalized with RFC 8785.
                      param: args_digest
                      request_id: req_01j9zr3m5k8q2w7x4t6v0b1c9d
                      doc_url: https://docs.deedglass.com/errors/intent_invalid
        default:
          $ref: "#/components/responses/Error"
  /v1/approvals:
    get:
      operationId: listApprovals
      summary: List approvals
      description: >-
        Approvals in this org (S22). `?status=pending` lists the inbox, oldest expiry first; any
        other filter lists newest first. Filters: `status` (comma-separated: pending, approved,
        denied, expired, cancelled), `agent` (id or name), `tool`, with `limit` (1 to 100) and
        `cursor`. A viewer+ Console session or an org admin key sees the full object; an agent key
        sees only its own agent's approvals, in the agent view (no context, no approvers, no
        names, `countersigned` as a count).
      tags: [Approvals]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: status, in: query, required: false, schema: {type: string}}
        - {name: agent, in: query, required: false, schema: {type: string}}
        - {name: tool, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: cursor, in: query, required: false, schema: {type: string}}
      responses:
        "200":
          description: A list of approvals.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalList"
        default:
          $ref: "#/components/responses/Error"
  /v1/approvals/{id}:
    get:
      operationId: getApproval
      summary: Retrieve an approval
      description: >-
        One approval (S22). `?wait=0..25` is a long poll: it returns as soon as the status is no
        longer `pending`, or when the wait ends. An agent key reads only its own agent's approvals
        (the agent view); another agent's is 404 `not_found`.
      tags: [Approvals]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: id, in: path, required: true, description: The approval id (`apr_…`)., schema: {type: string}}
        - {name: wait, in: query, required: false, schema: {type: number, minimum: 0, maximum: 25}}
      responses:
        "200":
          description: The approval.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        default:
          $ref: "#/components/responses/Error"
  /v1/approvals/{id}/approve:
    post:
      operationId: approveApproval
      summary: Countersign an approval
      description: >-
        A person countersigns (S22): a Console session with the `Deedglass-CSRF` header. Any role may
        call it; the rule's approvers decide who is eligible, read live. The body names the context
        the person reviewed (`context_digest`; a different one is 409 `context_changed`). The first
        final decision wins (`approval_decided`); four-eyes counts distinct people
        (`already_countersigned`); the person the action runs on behalf of can't countersign
        (`self_approval`). Agent and admin keys are 403 `approval_needs_person`. The answer never
        waits for the tool: an approved action answers `action_status: processing`.
      tags: [Approvals]
      security: [{bearerAuth: []}, {sessionCookie: []}]
