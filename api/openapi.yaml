          shadow: null
    PolicyLintResult:
      type: object
      required: [object, file, valid, name, version_hash, rules, budgets, errors, warnings]
      description: What the compiler found. `valid` is false when `errors` is not empty.
      properties:
        object: {type: string, const: policy_lint_result}
        file: {type: string, description: Empty for the API.}
        valid: {type: boolean}
        name: {type: [string, "null"], description: The policy's name, when the YAML gives one.}
        version_hash: {type: [string, "null"], pattern: "^sha256:[0-9a-f]{64}$", description: Null when the policy is invalid.}
        rules: {type: integer, minimum: 0}
        budgets: {type: integer, minimum: 0}
        errors:
          type: array
          items:
            $ref: "#/components/schemas/PolicyDiagnostic"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/PolicyDiagnostic"
    PolicyTraceStep:
      type: object
      required: [step, result, detail]
      description: One line of an explain trace.
      properties:
        step: {type: string, enum: [stop, budget, rule, default]}
        id: {type: string, description: The rule or budget id.}
        line: {type: integer, minimum: 1, description: The rule's line in the policy file.}
        result: {type: string, enum: [pass, match, no_match, error, exceeded, reserved, not_evaluated]}
        detail: {type: string}
        cost: {type: integer, minimum: 0, description: The condition's CEL cost.}
    PolicyApproval:
      type: object
      required: [approvers, required, expires_in]
      description: Who approves and for how long.
      properties:
        approvers:
          type: array
          description: '`role:owner`, `role:admin` or `user:<email>`, sorted.'
          items: {type: string}
        required: {type: integer, minimum: 1}
        expires_in: {type: integer, minimum: 0, description: Seconds.}
    PolicyDecision:
      type: object
      required: [object, decision, code, source, rule_id, rule_line, reason, message, approval, verify, notify, budget, policy, shadow, facts, trace, errors, sqlguard_version, evaluated_in_us]
      description: >-
        A dry-run decision. Nothing ran and no usage was reserved. `shadow` is the shadow policy's
        decision for the same input, when one is active.
      properties:
        object: {type: string, const: policy_decision}
        decision: {type: string, enum: [allow, deny, require_approval]}
        code:
          type: [string, "null"]
          enum: [policy_denied, approval_required, budget_exceeded, agent_stopped, agent_suspended, org_stopped, policy_unavailable, null]
        source: {type: string, enum: [stop, budget, rule, default, builtin]}
        rule_id: {type: [string, "null"]}
        rule_line: {type: [integer, "null"], minimum: 1}
        reason: {type: [string, "null"]}
        message: {type: string, description: What the agent would see.}
        approval:
          anyOf:
            - $ref: "#/components/schemas/PolicyApproval"
            - type: "null"
        verify: {type: [string, "null"], enum: [L0, L1, L2, null]}
        notify:
          type: array
          items: {type: string}
        budget:
          type: [object, "null"]
          required: [id, per, window, limit, used, unit, resets_at, retry_after_s]
          description: The budget that decided; null otherwise.
          properties:
            id: {type: string}
            per: {type: string, enum: [agent, org]}
            window: {type: string, enum: [minute, hour, day]}
            limit: {type: integer, minimum: 0}
            used: {type: integer, minimum: 0}
            projected: {type: integer, minimum: 0, description: Used plus this action's measured amount, for a measured budget it would pass.}
            unit: {type: string, description: '`calls`, or a currency in minor units.'}
            resets_at: {type: string, format: date-time}
            retry_after_s: {type: integer, minimum: 0}
        policy:
          type: object
          required: [id, name, version, version_id, version_hash, mode]
          description: The policy that decided. `id`, `version` and `version_id` are null for a source sent with the request.
          properties:
            id: {type: [string, "null"]}
            name: {type: string}
            version: {type: [integer, "null"], minimum: 1}
            version_id: {type: [string, "null"]}
            version_hash: {type: string}
            mode: {type: string, enum: [enforce, shadow]}
        shadow:
          anyOf:
            - $ref: "#/components/schemas/PolicyDecision"
            - type: "null"
        facts:
          type: object
          required: [sql, time]
          description: >-
            The derived facts the rules saw. `sql` is the SQL classifier's report on `args.sql`
            (docs/SQLGUARD.md); `time` is the decision instant in the org's time zone (`now`,
            `hour`, `minute`, `weekday`, `date`).
          properties:
            sql: {type: object}
            time: {type: object}
        trace:
          type: array
          description: With `explain` only; otherwise empty.
          items:
            $ref: "#/components/schemas/PolicyTraceStep"
        errors:
          type: array
          items: {type: string}
        sqlguard_version: {type: string}
        evaluated_in_us: {type: integer, minimum: 1}
    PolicyCaseResult:
      type: object
      required: [name, pass, expected, got]
      description: One test case, what it expected and what the policy decided.
      properties:
        name: {type: string}
        line: {type: integer, minimum: 1}
        pass: {type: boolean}
        expected:
          type: object
          required: [decision]
          properties:
            decision: {type: string, enum: [allow, deny, require_approval]}
            rule: {type: string, description: 'A rule id, `default`, `budget:<id>` or `stop`.'}
            code: {type: string}
            reason_contains: {type: string}
            message: {type: string}
            verify: {type: string}
            approval:
              type: object
              properties:
                required: {type: integer}
                approvers: {type: array, items: {type: string}}
                expires_in: {type: integer}
            notify: {type: array, items: {type: string}}
        got:
          type: object
          required: [decision, rule, message]
          properties:
            decision: {type: string, enum: [allow, deny, require_approval]}
            rule: {type: string}
            code: {type: string}
            reason: {type: string}
            message: {type: string}
            verify: {type: string}
            approval:
              $ref: "#/components/schemas/PolicyApproval"
            notify: {type: array, items: {type: string}}
        problems:
          type: array
          description: 'Each difference, like "rule: expected block-destructive-sql, got allow-reads".'
          items: {type: string}
    PolicyRuleCoverage:
      type: object
      required: [id, cases]
      description: How many cases a rule or budget decided.
      properties:
        id: {type: string}
        line: {type: integer, minimum: 1}
        cases: {type: integer, minimum: 0}
    PolicyCoverage:
      type: object
      required: [rules, covered, total, uncovered, default, budgets]
      description: Which rules and budgets the cases reached.
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/PolicyRuleCoverage"
        covered: {type: integer, minimum: 0, description: Rules that decided at least one case.}
        total: {type: integer, minimum: 0}
        uncovered:
          type: array
          items: {type: string}
        default: {type: integer, minimum: 0, description: Cases the default decided.}
        budgets:
          type: array
          items:
            $ref: "#/components/schemas/PolicyRuleCoverage"
    PolicyTestResult:
      type: object
      required: [object, policy, version_hash, ok, passed, failed, skipped, cases, coverage, elapsed_us]
      description: The result of a test run. `ok` is true when every case passed.
      properties:
        object: {type: string, const: policy_test_result}
        policy: {type: string, description: The policy's name.}
        file: {type: string}
        cases_file: {type: string}
        version_hash:
          $ref: "#/components/schemas/Digest"
        ok: {type: boolean}
        passed: {type: integer, minimum: 0}
        failed: {type: integer, minimum: 0}
        skipped: {type: integer, minimum: 0}
        cases:
          type: array
          items:
            $ref: "#/components/schemas/PolicyCaseResult"
        coverage:
          $ref: "#/components/schemas/PolicyCoverage"
        elapsed_us: {type: integer, minimum: 0}
    ProtectedResourceMetadata:
      type: object
      additionalProperties: false
      required: [resource, resource_name, bearer_methods_supported, scopes_supported, resource_documentation]
      description: >-
        RFC 9728 protected-resource metadata. `authorization_servers` is absent on purpose in v1:
        Deedglass v1 takes pre-issued API keys as bearer tokens and has no authorization server to
        list; v2 adds the org's issuer.
      properties:
        resource: {type: string, description: The resource identifier (the API's base URL, or an MCP endpoint's URL).}
        resource_name: {type: string}
        bearer_methods_supported:
          type: array
          items: {type: string}
        scopes_supported:
          type: array
          items: {type: string}
        resource_documentation: {type: string, format: uri}
      examples:
        - resource: https://api.deedglass.com
          resource_name: Deedglass
          bearer_methods_supported: [header]
          scopes_supported: ["actions:execute", "actions:read", "deeds:read"]
          resource_documentation: https://docs.deedglass.com/mcp/authorization
