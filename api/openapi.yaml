  /v1/replays/{id}:
    get:
      operationId: getReplay
      summary: Retrieve a replay
      description: >-
        One replay (S27): its status, its progress and, once it `succeeded`, its result: the
        summary (`actions = evaluated + unknown`, `evaluated = unchanged + changed +
        rule_changed`), every decision transition from the baseline to the candidate with its
        rules, tools, the first 20 action ids and, for a transition out of `require_approval`,
        what people did with those actions (`human_outcome`), the same decisions reached by a
        different rule (`rule_changes`), the actions that couldn't be evaluated and why
        (`unknown`), the sqlguard versions recorded next to the current one, and `result_digest`.
        A failed replay carries `error`. An id that isn't one of this org's replays is 404
        `not_found`. A Console session (viewer and up) or an org admin key (`admin` scope); agent
        keys get 403 `insufficient_scope`.
