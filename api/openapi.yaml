      properties:
        object: {type: string, const: list}
        data:
          type: array
          items:
            $ref: "#/components/schemas/PolicyVersion"
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
    PolicyActivation:
      type: object
      required: [object, id, policy, name, mode, version, previous, promoted_from_shadow, acknowledged_warnings, reason, activated_by, activated_at, deactivated_at, deactivated_by, deeds]
      description: >-
        One activation of a version, as enforce or shadow, with the deeds that sealed it. `deeds`
        is in seal order: one deed, or two for a promote from shadow (the shadow ending, then the
        version enforced).
      properties:
        object: {type: string, const: policy_activation}
        id: {type: string, pattern: "^pa_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        policy: {type: string, pattern: "^pol_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        name: {type: string}
        mode: {type: string, enum: [enforce, shadow]}
        version:
          type: object
          required: [id, version, version_hash]
          properties:
            id: {type: string, pattern: "^pv_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
            version: {type: integer, minimum: 1}
            version_hash:
              $ref: "#/components/schemas/Digest"
        previous:
          type: [object, "null"]
          required: [policy, name, version]
          description: The activation this one replaced in the same mode; null when there was none.
          properties:
            policy: {type: string}
            name: {type: string}
            version: {type: integer, minimum: 1}
        promoted_from_shadow: {type: boolean, description: True when the version was the shadow policy and is now enforced.}
        acknowledged_warnings:
          type: array
          description: The warning codes accepted for this activation, sorted.
          items: {type: string}
        reason: {type: string, minLength: 3, maxLength: 280}
        activated_by:
          $ref: "#/components/schemas/PolicyActorRef"
        activated_at: {type: string, format: date-time}
        deactivated_at: {type: [string, "null"], format: date-time}
        deactivated_by:
          description: Who switched it off; null while it is live.
          anyOf:
            - $ref: "#/components/schemas/PolicyActorRef"
            - type: "null"
        deeds:
          type: array
          minItems: 1
          items: {type: string, pattern: "^deed_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
      examples:
        - object: policy_activation
          id: pa_01jb8p0z2b4d6f8h0k2n4q6s8v
          policy: pol_01jb8m2x7k4q9r3t5v6w8y0z1a
          name: postgres-safe
          mode: enforce
          version: {id: pv_01jb8m3c0d2f4g6h8j0k2m4n6p, version: 3, version_hash: "sha256:3e23e8160039594a33894f6564e1b1348bbd7a0088d42c4acb73eeaed59c009d"}
          previous: {policy: pol_01jb8m2x7k4q9r3t5v6w8y0z1a, name: postgres-safe, version: 2}
          promoted_from_shadow: true
          acknowledged_warnings: []
          reason: Guard the orders database before the pilot.
          activated_by: {object: user, id: usr_01k6c9kb2zcjsyn7b8g2k1vqvp}
          activated_at: "2026-10-06T11:40:02.000Z"
          deactivated_at: null
          deactivated_by: null
          deeds: [deed_01jb8p0y1a3c5e7g9j1m3p5r7t, deed_01k6vrddq2atgb2023qvhhct3g]
    PolicyActiveEntry:
      type: object
      required: [policy, name, version, version_id, version_hash, activation, activated_at, deed]
      description: One live activation in the active set.
      properties:
        policy: {type: string, pattern: "^pol_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        name: {type: string}
        version: {type: integer, minimum: 1}
        version_id: {type: string, pattern: "^pv_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
