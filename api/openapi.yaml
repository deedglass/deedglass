  /v1/insights/anomalies/{id}:
    get:
      operationId: getAnomaly
      summary: Retrieve an anomaly
      description: >-
        One anomaly episode (S27) with its evidence: the hourly points (at most 48), the baseline
        it was compared with, and up to 10 action ids. `active` is what `anomaly.active` sees now
        (it ends `anomaly_active_minutes` after the last finding); `status` is the review inbox and
        only a person moves it, except that an episode with no new occurrence for 14 days resolves
        itself (`resolved.by` is `system`, no deed). An id that isn't one of this org's anomalies
        is 404 `not_found`. A Console session (viewer and up) or an org admin key (`admin` scope);
        agent keys get 403 `insufficient_scope`.
      tags: [Insights]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: id, in: path, required: true, description: The anomaly id (`anm_…`)., schema: {type: string}}
      responses:
        "200":
          description: The anomaly.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Anomaly"
              examples:
                new_tool:
                  summary: ops-agent's first github.merge_pr
                  value:
                    {"object": "anomaly", "id": "anm_01m42vb270xzbzmgbgyantw49w", "agent": {"id": "agt_01m42v9q429q2mprzr6xakrx42", "name": "ops-agent"},
                     "kind": "new_tool", "tool": "github.merge_pr", "severity": "warn", "score": 2,
                     "title": "first github.merge_pr (write), 15:00 to 16:00 IST", "status": "open", "active": false,
                     "active_until": "2026-10-01T11:30:00Z", "window": {"start": "2026-10-01T09:30:00Z", "end": "2026-10-01T10:30:00Z"}, "occurrences": 1,
                     "evidence": {"hour": "15:00", "tool": "github.merge_pr", "side_effect": "write", "count": 2, "timezone": "IST",
                                  "points": [{"count": 2, "score": 2, "window_start": "2026-10-01T09:30:00.000Z", "window_end": "2026-10-01T10:30:00.000Z"}],
                                  "action_ids": ["act_01m42vadezkscmydd9pw910e3m", "act_01m42vadr0f89h5svfvms0pj10"],
                                  "window_start": "2026-10-01T09:30:00Z", "window_end": "2026-10-01T10:30:00Z", "history_hours": 99},
                     "detector_version": "1", "acknowledged": null, "resolved": null,
                     "created_at": "2026-10-04T06:59:05.192752Z", "updated_at": "2026-10-04T06:59:05.192752Z"}
        "404":
          description: No such anomaly in this org.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  type: invalid_request_error
                  code: not_found
                  message: "No anomaly anm_01m42vb27wzpyw0b2n6aycjxkx in this org. List them: GET /v1/insights/anomalies."
                  param: null
                  request_id: req_01m42vkfgev8q669w3tnnvbf4p
                  doc_url: https://docs.deedglass.com/errors/not_found
        default:
          $ref: "#/components/responses/Error"
  /v1/insights/anomalies/{id}/acknowledge:
    post:
      operationId: acknowledgeAnomaly
      summary: Acknowledge an anomaly
      description: >-
        Records who saw the episode (S27): `status` becomes `acknowledged` with `acknowledged.by`
        and `.at`. It changes nothing else: an active episode stays active until it expires, and
        no deed is sealed. Acknowledging an acknowledged episode answers it unchanged; a resolved
        one is 409 `conflict`. No body. An admin+ Console session (with the `Deedglass-CSRF`
        header) or an org admin key (`admin` scope); viewers get 403 `insufficient_role` and agent
        keys 403 `insufficient_scope`.
      tags: [Insights]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, description: The anomaly id (`anm_…`)., schema: {type: string}}
      responses:
        "200":
          description: The anomaly, acknowledged.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Anomaly"
              examples:
                acknowledged:
                  summary: Acknowledged by an admin
                  value:
                    {"object": "anomaly", "id": "anm_01m42vb285wmf0ay82683pp9m4", "agent": {"id": "agt_01m42v9q4500m4rfchvb8j53da", "name": "growth-agent"},
                     "kind": "off_hours", "tool": null, "severity": "warn", "score": 12,
                     "title": "12 calls, 02:00 to 03:00 IST · usually 0.2% of its calls at this hour", "status": "acknowledged", "active": false,
                     "active_until": "2026-10-02T22:30:00Z", "window": {"start": "2026-10-02T20:30:00Z", "end": "2026-10-02T21:30:00Z"}, "occurrences": 1,
                     "evidence": {"hour": "02:00", "count": 12, "writes": 12, "share": 0.0024, "timezone": "IST",
                                  "points": [{"count": 12, "score": 12, "window_start": "2026-10-02T20:30:00.000Z", "window_end": "2026-10-02T21:30:00.000Z"}],
                                  "action_ids": ["act_01m42vap394qwexdpmpazzgq31", "act_01m42vap52y8tmnrpbxak5gm5n", "act_01m42vap5e8em83fqr9x9j7eeg"],
                                  "window_start": "2026-10-02T20:30:00Z", "window_end": "2026-10-02T21:30:00Z", "history_hours": 134},
                     "detector_version": "1", "acknowledged": {"by": "usr_01m42v9p7c3e5g7j9m1q3s5v7x", "at": "2026-10-04T07:20:44.912310Z"}, "resolved": null,
                     "created_at": "2026-10-04T06:59:05.192752Z", "updated_at": "2026-10-04T07:20:44.912310Z"}
        "409":
          description: The anomaly is resolved.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  type: invalid_request_error
                  code: conflict
                  message: This anomaly is already resolved. Resolved anomalies stay in the history; a new finding opens a new one.
                  param: null
                  request_id: req_01m42vmd4e6g8j0m2p4r6t8v0x
                  doc_url: https://docs.deedglass.com/errors/conflict
        default:
          $ref: "#/components/responses/Error"
  /v1/insights/anomalies/{id}/resolve:
    post:
      operationId: resolveAnomaly
      summary: Resolve an anomaly
      description: >-
        Closes the episode (S27): `status` becomes `resolved`, any activity ends now (so
        `anomaly.active` turns false for it), and an `anomaly.resolved` admin deed is sealed with
        the reason (`resolved.deed`). `reason` is required, 3 to 280 characters with no control
        characters (400 `validation_failed` on `reason`). A resolved episode stays in the history;
        a later finding opens a new one. Resolving it again is 409 `conflict`. An admin+ Console
        session (with the `Deedglass-CSRF` header) or an org admin key (`admin` scope); viewers get
        403 `insufficient_role` and agent keys 403 `insufficient_scope`.
      tags: [Insights]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, description: The anomaly id (`anm_…`)., schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 3, maxLength: 280, description: One line, 3 to 280 characters. It goes into the deed.}
            example: {reason: The merge was the planned release; ops-agent now owns releases.}
      responses:
        "200":
          description: The anomaly, resolved, with the deed.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Anomaly"
              examples:
                resolved:
                  summary: Resolved with a reason
                  value:
                    {"object": "anomaly", "id": "anm_01m42vb270xzbzmgbgyantw49w", "agent": {"id": "agt_01m42v9q429q2mprzr6xakrx42", "name": "ops-agent"},
                     "kind": "new_tool", "tool": "github.merge_pr", "severity": "warn", "score": 2,
                     "title": "first github.merge_pr (write), 15:00 to 16:00 IST", "status": "resolved", "active": false,
                     "active_until": "2026-10-01T11:30:00Z", "window": {"start": "2026-10-01T09:30:00Z", "end": "2026-10-01T10:30:00Z"}, "occurrences": 1,
                     "evidence": {"hour": "15:00", "tool": "github.merge_pr", "side_effect": "write", "count": 2, "timezone": "IST",
                                  "points": [{"count": 2, "score": 2, "window_start": "2026-10-01T09:30:00.000Z", "window_end": "2026-10-01T10:30:00.000Z"}],
                                  "action_ids": ["act_01m42vadezkscmydd9pw910e3m", "act_01m42vadr0f89h5svfvms0pj10"],
                                  "window_start": "2026-10-01T09:30:00Z", "window_end": "2026-10-01T10:30:00Z", "history_hours": 99},
                     "detector_version": "1", "acknowledged": null,
                     "resolved": {"by": "usr_01m42v9p7c3e5g7j9m1q3s5v7x", "at": "2026-10-04T07:22:10.204118Z",
                                  "reason": "The merge was the planned release; ops-agent now owns releases.", "deed": "deed_01m42vmf6g8j0m2p4r6t8v0x2z"},
                     "created_at": "2026-10-04T06:59:05.192752Z", "updated_at": "2026-10-04T07:22:10.204118Z"}
        "400":
          description: No reason, or one outside 3 to 280 characters.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  type: invalid_request_error
                  code: validation_failed
                  message: A reason is required to resolve an anomaly. It goes into the sealed record.
                  param: reason
                  request_id: req_01m42vmg7h9k1n3q5s7v9x1z3b
                  doc_url: https://docs.deedglass.com/errors/validation_failed
        "403":
          description: A viewer session (`insufficient_role`), or an agent key (`insufficient_scope`).
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  type: permission_error
                  code: insufficient_role
                  message: Your role in Acme is Viewer, and resolving anomalies needs Admin. Ask an owner to change your role.
                  param: null
                  request_id: req_01m42vmh8j0m2p4r6t8v0x2z4c
                  doc_url: https://docs.deedglass.com/errors/insufficient_role
        "409":
          description: The anomaly is already resolved.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  type: invalid_request_error
                  code: conflict
                  message: This anomaly is already resolved. Resolved anomalies stay in the history; a new finding opens a new one.
                  param: null
                  request_id: req_01m42vmj9k1n3q5s7v9x1z3b5d
                  doc_url: https://docs.deedglass.com/errors/conflict
        default:
          $ref: "#/components/responses/Error"
  /v1/insights/settings:
    get:
      operationId: getInsightsSettings
      summary: Get Insights settings
      description: >-
        This org's Insights settings (S27): whether policies see anomaly facts (`anomaly_facts`,
        off by default: then every policy sees `anomaly.active` false), how long an episode stays
        active after its last finding (`anomaly_active_minutes`, 60), and how old the last
        detection pass may be before, with the facts on, every agent counts as anomalous
        (`anomaly_stale_after_minutes`, 15). `active_policy_reads_anomaly` says whether the
        enforced or shadow policy reads `anomaly.*`; `notice` is the sentence when it does but the
        facts are off. A Console session (viewer and up) or an org admin key (`admin` scope); agent
        keys get 403 `insufficient_scope`.
      tags: [Insights]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      responses:
        "200":
          description: The settings.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightsSettings"
              examples:
                defaults:
                  summary: The defaults
                  value: {"object": "insights_settings", "anomaly_facts": false, "anomaly_active_minutes": 60, "anomaly_stale_after_minutes": 15, "active_policy_reads_anomaly": false, "notice": null}
                notice:
                  summary: A policy reads anomaly facts, but they are off
                  value: {"object": "insights_settings", "anomaly_facts": false, "anomaly_active_minutes": 60, "anomaly_stale_after_minutes": 15, "active_policy_reads_anomaly": true,
                          "notice": "acme-sim v3 reads anomaly.active, but anomaly facts are off for this org, so it always sees false. Turn them on in Console › Insights › Settings."}
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateInsightsSettings
      summary: Change Insights settings
      description: >-
        Changes the fields you send and seals an `insights.settings_changed` admin deed with the
        reason, because the settings change what policies see (`deed` in the answer; absent when
        nothing changed, and then nothing is sealed).
        `reason` is required, 3 to 280 characters (400 `validation_failed` on `reason`);
        `anomaly_active_minutes` is 5 to 1,440 and `anomaly_stale_after_minutes` 10 to 240 (400
        `validation_failed` on the field). Unknown fields are 400. Bodies up to 16 KiB. An admin+
        Console session (with the `Deedglass-CSRF` header) or an org admin key (`admin` scope);
        viewers get 403 `insufficient_role` and agent keys 403 `insufficient_scope`.
      tags: [Insights]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsightsSettingsPatch"
            example: {anomaly_facts: true, reason: Let refund-approval-over-30 send anomalous agents to approval.}
      responses:
        "200":
          description: The settings after the change, with the deed when something changed.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightsSettings"
              examples:
                facts_on:
                  summary: Anomaly facts turned on
                  value: {"object": "insights_settings", "anomaly_facts": true, "anomaly_active_minutes": 60, "anomaly_stale_after_minutes": 15, "active_policy_reads_anomaly": true,
                          "notice": null, "deed": "deed_01m42vmk0m2p4r6t8v0x2z4c6e"}
        "400":
          description: A missing or bad field.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  type: invalid_request_error
                  code: validation_failed
                  message: anomaly_active_minutes must be 5 to 1,440.
                  param: anomaly_active_minutes
                  request_id: req_01m42vmm1p3r5t7w9y1a3c5e7g
                  doc_url: https://docs.deedglass.com/errors/validation_failed
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: dg_<mode>_<prefix>_<secret>
      description: >-
        An API key: `dg_live_` or `dg_test_`, an 8-character prefix, `_`, and a 32-character secret,
        all base62 (49 characters, like `dg_live_jJbEEMWk_o0Erxxf1kgtP2QjiJ79vzW31AjZqIch8`). Agent
        keys hold `actions:execute`, `actions:read` and `deeds:read` (the default) and may add
        `actions:undo`; org admin keys hold exactly `admin`. Create agent keys in Console › Agents
        and admin keys in Console › Settings. A 401 carries `WWW-Authenticate: Bearer
        realm="deedglass", error="invalid_token", error_description="…"`; a missing scope is 403
        `insufficient_scope` with `WWW-Authenticate: Bearer realm="deedglass",
        error="insufficient_scope", scope="…"`.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-deedglass_session
      description: >-
        A Console session. Requests that change state also send the `Deedglass-CSRF` header,
        matching the `__Host-deedglass_csrf` cookie.
  parameters:
    DeedglassVersion:
      name: Deedglass-Version
      in: header
      required: false
      description: >-
        The API version (YYYY-MM-DD). Leave it out to use your org's pinned version (public routes
        use the latest). An unknown version is 400 `api_version_invalid`.
      schema:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        examples: ["2026-10-01"]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        1 to 255 printable ASCII characters. A retry with the same key and body returns the stored
        response with `Deedglass-Idempotent-Replayed: true` for 24 hours.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, 1–100 (default 25).
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      required: false
      description: '`next_cursor` from the previous page, unchanged.'
      schema:
        type: string
    FromSeq:
      name: from_seq
      in: query
      required: false
      description: The first deed seq (inclusive).
      schema:
        type: integer
        minimum: 1
    ToSeq:
      name: to_seq
      in: query
      required: false
      description: The last deed seq (inclusive).
      schema:
        type: integer
        minimum: 1
    CSRF:
      name: Deedglass-CSRF
      in: header
      required: true
      description: >-
        The CSRF token from `GET /v1/me` (it equals the `__Host-deedglass_csrf` cookie). Every
        session request that changes state needs it; without it the answer is 403 `csrf_failed`.
      schema:
        type: string
    CSRFWithSession:
      name: Deedglass-CSRF
      in: header
      required: false
      description: >-
        Needed when the request uses a Console session (it changes state); without it the answer is
        403 `csrf_failed`. Not sent with an API key.
      schema:
        type: string
    AgentId:
      name: id
      in: path
      required: true
      description: The agent id (`agt_…`).
      schema:
        type: string
    ConnectorRef:
      name: id
      in: path
      required: true
      description: The connector's id (`con_…`) or its name.
      schema:
        type: string
    KeyId:
      name: id
      in: path
      required: true
      description: The API key id (`key_…`).
      schema:
        type: string
    IntentKid:
      name: kid
      in: path
      required: true
      description: The intent key's id, 32 lowercase hex characters.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    PolicyRef:
      name: id
      in: path
      required: true
      description: A pol_ id or the policy's name.
      schema:
        type: string
    PolicyVersionRef:
      name: v
      in: path
      required: true
      description: A version number, like 3, or a pv_ id.
      schema:
        type: string
    DeedglassIntent:
      name: Deedglass-Intent
      in: header
      required: false
      description: >-
        A signed intent: base64url of the intent's JCS bytes, `.`, and base64url of the 64-byte
        Ed25519 signature. The intent follows the schema `deedglass.intent/1`; the signature input
        is `"deedglass/intent/v1\n"` followed by the `intent_hash`. Clocks may differ by up to 60 s
        either way, and an intent lives at most 5 minutes. See docs/INTENTS.md.
      schema:
        type: string
        maxLength: 4096
    DeedglassOnBehalfOf:
      name: Deedglass-On-Behalf-Of
      in: header
      required: false
      description: >-
        The end user the agent acts for, in your own ids. At most once; a malformed or repeated
        header is 422 `validation_failed`.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._~:@/+=-]{1,256}$"
    DeedglassSession:
      name: Deedglass-Session
      in: header
      required: false
      description: >-
        The conversation or session the call belongs to, in your own ids. At most once; a malformed
        or repeated header is 422 `validation_failed`.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._~:@/+=-]{1,256}$"
  headers:
    DeedglassRequestId:
      description: This request's id. Quote it to support; it matches `error.request_id`.
      schema:
        type: string
        pattern: "^req_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    DeedglassVersion:
      description: The API version this response follows.
      schema:
        type: string
    DeedglassIdempotentReplayed:
      description: Present, and `true`, when the response is a stored one replayed for an Idempotency-Key.
      schema:
        type: string
        enum: ["true"]
  responses:
    Error:
      description: An error. Every error has this envelope; `doc_url` explains the code.
      headers:
        Deedglass-Request-Id:
          $ref: "#/components/headers/DeedglassRequestId"
        Deedglass-Version:
          $ref: "#/components/headers/DeedglassVersion"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    MCPOriginRefused:
      description: >-
        A browser `Origin` other than the server's own: a JSON-RPC error without an id
        (DNS-rebinding protection). A key without `actions:execute`, or a stopped or suspended
        agent, also gets 403, with the error envelope.
      headers:
        Deedglass-Request-Id:
          $ref: "#/components/headers/DeedglassRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JSONRPCError"
    MCPResponse:
      description: One JSON-RPC response (a result, or an error such as -32601 for a legacy unknown method).
      headers:
        Deedglass-Request-Id:
          $ref: "#/components/headers/DeedglassRequestId"
      content:
        application/json:
          schema:
            type: object
          example:
            jsonrpc: "2.0"
            id: 3
            result:
              resultType: complete
              content: [{type: text, text: "Echo: hello"}]
              isError: false
              _meta: {com.deedglass/action: act_01k6w4a3d5f7h9k1n3q5s7v9x1, com.deedglass/deed: deed_01k6w4a3d5f7h9k1n3q5s7v9x2}
    MCPRequestRefused:
      description: >-
        A header that doesn't match the body (-32020 HeaderMismatch), an unsupported protocol
        version (-32022 with data.supported and data.requested), a batch or a response (-32600), or
        JSON that can't be parsed (-32700).
      headers:
        Deedglass-Request-Id:
          $ref: "#/components/headers/DeedglassRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JSONRPCError"
          example:
            jsonrpc: "2.0"
            id: 3
            error: {code: -32020, message: 'Header mismatch: Mcp-Name is "echo" but the body names "delete_all". Send the same tool name in both.'}
  requestBodies:
    MCPMessage:
      required: true
      description: A JSON-RPC 2.0 message.
      content:
        application/json:
          schema:
            type: object
          example: {jsonrpc: "2.0", id: 1, method: tools/list}
    OptionalReason:
      required: false
      description: An optional reason. It goes into the deed and the Console; an agent never sees it.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              reason: {type: string, maxLength: 280, description: One line, at most 280 characters.}
          example: {reason: Refund loop in staging}
    RequiredReason:
      required: true
      description: Why it's safe now. It goes into the deed.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [reason]
            properties:
              reason: {type: string, minLength: 3, maxLength: 280, description: One line, 3 to 280 characters.}
          example: {reason: "Root cause fixed: refund threshold was 100x"}
    PolicySource:
      required: true
      description: The policy YAML, and optional notes kept with the version.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [source]
            properties:
              source: {type: string, description: The policy YAML (deedglass policy/v1), at most 256 KiB.}
              notes: {type: string, maxLength: 2000, description: Why this version exists. Kept with the version.}
          example: {source: "deedglass: policy/v1\nname: postgres-safe\n…", notes: Allow-list writes to public.orders for the pilot.}
  schemas:
    Approval:
      type: object
      description: >-
        A person's countersign on one action (S22). The agent view leaves out `context`,
        `approvers` and `denied_by`, and `countersigned` is a count.
      required: [object, id, action, agent, tool, status, rule_id, reason, required, countersigned, decision_reason, summary, context_digest, created_at, expires_at, decided_at, deed, livemode]
      properties:
        object: {type: string, enum: [approval]}
        id: {type: string}
        action: {type: string}
        agent: {type: object, properties: {id: {type: string}, name: {type: string}}}
        tool: {type: string}
        status: {type: string, enum: [pending, approved, denied, expired, cancelled]}
        rule_id: {type: [string, "null"]}
        reason: {type: [string, "null"]}
        required: {type: integer}
        approvers: {type: array, items: {type: string}}
        countersigned:
          oneOf:
            - {type: integer}
            - type: array
              items:
                type: object
                properties:
                  user: {type: object, properties: {id: {type: string}, name: {type: string}}}
                  at: {type: string}
                  via: {type: string, enum: [console, email_link, slack, cli_dev]}
                  reason: {type: [string, "null"]}
                  deed: {type: string}
        denied_by: {type: object, properties: {id: {type: string}, name: {type: string}}}
        decision_reason: {type: [string, "null"]}
        summary: {type: string}
        context: {type: object, description: The context snapshot v1 the person countersigns (docs/APPROVALS.md).}
        context_digest: {type: [string, "null"]}
        you:
          type: object
          properties:
            eligible: {type: boolean}
            can_decide: {type: boolean}
            why_not: {type: [string, "null"]}
        created_at: {type: string}
        expires_at: {type: string}
        decided_at: {type: [string, "null"]}
        deed: {type: [string, "null"]}
        livemode: {type: boolean}
        action_status: {type: string, description: Decide answers only.}
    ApprovalList:
      type: object
      required: [object, data, has_more, next_cursor]
      properties:
        object: {type: string, enum: [list]}
        data: {type: array, items: {$ref: "#/components/schemas/Approval"}}
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
    ApprovalVote:
      type: object
      additionalProperties: false
      required: [context_digest]
      properties:
        reason: {type: string, maxLength: 280, description: Required to deny. The agent sees it.}
        context_digest: {type: string, description: The digest of the context the person reviewed.}
    ApprovalLinkToken:
      type: object
      required: [token]
      properties:
        token: {type: string, description: The 43-character token from the link's fragment.}
    ApprovalLinkDecision:
      type: object
      required: [token, vote, context_digest]
      properties:
        token: {type: string}
        vote: {type: string, enum: [approve, deny]}
        reason: {type: string, maxLength: 280}
        context_digest: {type: string}
    ApprovalLinkPreview:
      type: object
      properties:
        object: {type: string, enum: [approval_link_preview]}
        approval: {$ref: "#/components/schemas/Approval"}
        review_only: {type: boolean}
        org_name: {type: string}
        time_zone: {type: string}
        agent_stopped: {type: boolean}
        sql: {type: string}
        console_url: {type: string}
        expires_clock: {type: string}
        decided_clock: {type: string}
        countersign_clocks: {type: array, items: {type: string}}
    ApprovalLinkStatus:
      type: object
      properties:
        object: {type: string, enum: [approval_link_status]}
        approval: {$ref: "#/components/schemas/Approval"}
        action: {type: object}
    Webhook:
      type: object
      required: [object, id, url, events, status, api_version, created_at]
      properties:
        object: {type: string, enum: [webhook]}
        id: {type: string}
        url: {type: string}
        events: {type: array, items: {type: string}}
        description: {type: [string, "null"]}
        status: {type: string, enum: [active, disabled]}
        disabled_reason: {type: [string, "null"]}
        api_version: {type: string}
        secret_hint: {type: [string, "null"]}
        secret: {type: string, description: The signing secret (whsec_…). In the create response only.}
        failing_since: {type: [string, "null"]}
        last_success_at: {type: [string, "null"]}
        created_at: {type: string}
        deed: {type: string}
    WebhookList:
      type: object
      properties:
        object: {type: string, enum: [list]}
        data: {type: array, items: {$ref: "#/components/schemas/Webhook"}}
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
    WebhookCreate:
      type: object
      required: [url, events]
      properties:
        url: {type: string, maxLength: 2048}
        events:
          type: array
          minItems: 1
          maxItems: 32
          description: Event types to receive (see Event.type), including `anomaly.detected` (S27).
          items: {type: string}
        description: {type: string, maxLength: 200}
    LoginRequest:
      type: object
      required: [object, email, expires_in, message]
      properties:
        object: {type: string, const: login_request}
        email: {type: string, description: The address, normalized.}
        expires_in: {type: integer, description: Seconds the link and code work for.}
        message: {type: string}
      examples:
        - object: login_request
          email: priya@acme.com
          expires_in: 900
          message: If priya@acme.com has a Deedglass account, a sign-in link and code are on their way.
    LoginPreview:
      type: object
      required: [object, purpose, email, org, role, invited_by, expires_at]
      properties:
        object: {type: string, const: login_preview}
        purpose: {type: string, enum: [login, invite]}
        email: {type: string}
        org:
          type: object
          required: [id, name]
          properties:
            id: {type: string}
            name: {type: string}
        role: {type: string, enum: [viewer, admin, owner]}
        invited_by:
          type: [object, "null"]
          required: [name, email]
          properties:
            name: {type: string}
            email: {type: string}
        expires_at: {type: string, format: date-time}
      examples:
        - object: login_preview
          purpose: login
          email: priya@acme.com
          org: {id: org_01k6h7kp6msmzrhdzwtcr3jnkp, name: Acme}
          role: owner
          invited_by: null
          expires_at: "2026-10-03T09:29:07.000Z"
    Me:
      type: object
      required: [object, user, org, membership, orgs, session, csrf_token]
      properties:
        object: {type: string, const: me}
        user:
          type: object
          required: [object, id, email, name, created_at]
          properties:
            object: {type: string, const: user}
            id: {type: string}
            email: {type: string}
            name: {type: string}
            created_at: {type: string, format: date-time}
        org:
          $ref: "#/components/schemas/Org"
        membership:
          type: object
          required: [object, id, role, status]
          properties:
            object: {type: string, const: membership}
            id: {type: string}
            role: {type: string, enum: [viewer, admin, owner]}
            status: {type: string}
        orgs:
          type: array
          items:
            type: object
            required: [id, name, role]
            properties:
              id: {type: string}
              name: {type: string}
              role: {type: string}
        session:
          type: object
          required: [id, idle_expires_at, expires_at]
          properties:
            id: {type: string}
            idle_expires_at: {type: string, format: date-time}
            expires_at: {type: string, format: date-time}
        csrf_token:
          type: [string, "null"]
          description: Send it back as the `Deedglass-CSRF` header on requests that change state.
      examples:
        - object: me
          user: {object: user, id: usr_01k6c9kb2zcjsyn7b8g2k1vqvp, email: priya@acme.com, name: Priya Raman, created_at: "2026-10-03T09:14:07.000Z"}
          org: {object: org, id: org_01k6h7kp6msmzrhdzwtcr3jnkp, name: Acme, slug: acme, timezone: Asia/Kolkata, status: active, created_at: "2026-10-03T09:14:07.000Z"}
          membership: {object: membership, id: mem_01k6zymkd83ftdv0mf9keseaz1, role: owner, status: active}
          orgs: [{id: org_01k6h7kp6msmzrhdzwtcr3jnkp, name: Acme, role: owner}]
          session: {id: ses_01k6ydnxs578tgcwjbknyjdh8m, idle_expires_at: "2026-10-03T21:14:07.000Z", expires_at: "2026-10-10T09:14:07.000Z"}
          csrf_token: M3q1c0Zb9xK2yV7wQ4nH8pT6rJ5sD1fG0aL3kE9uW2c
    Org:
      type: object
      required: [object, id, name, slug, timezone, status, created_at]
      properties:
        object: {type: string, const: org}
        id: {type: string}
        name: {type: string}
        slug: {type: string}
        timezone: {type: string}
        status: {type: string, enum: [active, disabled]}
        created_at: {type: string, format: date-time}
        retention_days:
          type: integer
          minimum: 1
          maximum: 3650
          description: >-
            GET and PATCH /v1/org only (S26, additive): how many days action payloads are kept, the
            org's setting or the default of 90. Omitted elsewhere.
        settings:
          type: object
          description: GET and PATCH /v1/org only (S26, additive), with defaults applied. Omitted elsewhere.
          required: [approvals]
          properties:
            approvals:
              type: object
              required: [email_links, email_detail, self_countersign]
              properties:
                email_links: {type: string, enum: [decide, review], description: Whether emailed approval links can decide (default) or only open the review page.}
                email_detail: {type: string, enum: [summary, full], description: How much of the request approval emails show (default summary).}
                self_countersign: {type: string, enum: [deny, allow], description: Whether the person an action runs on behalf of may countersign it (default deny).}
            simulated: {type: boolean, const: true, description: "Read only (S29, additive): present and true when the org was made by deedglass dev simulate; omitted otherwise. PATCH /v1/org refuses it."}
            phi_mode: {type: boolean, const: true, description: "HC-P09, additive: present and true when PHI mode is on (docs/PHI_MODE.md); omitted otherwise."}
        stop:
          type: object
          description: >-
            GET /v1/org only (additive): the Stop all overlay, which the Console's org-stopped
            banner reads. Omitted elsewhere.
          required: [stopped, stopped_at, stopped_by, reason]
          properties:
            stopped: {type: boolean}
            stopped_at: {type: [string, "null"], format: date-time}
            stopped_by: {type: [string, "null"], description: Who turned it on.}
            reason: {type: [string, "null"]}
    Membership:
      type: object
      required: [object, id, org, user, role, status, invited_by, invited_at, joined_at, removed_at, created_at]
      properties:
        object: {type: string, const: membership}
        id: {type: string}
        org: {type: string}
        user:
          type: object
          required: [id, email, name]
          properties:
            id: {type: string}
            email: {type: string}
            name: {type: string}
        role: {type: string, enum: [viewer, admin, owner]}
        status: {type: string, enum: [invited, active, removed]}
        invited_by: {type: [string, "null"]}
        invited_at: {type: [string, "null"], format: date-time}
        joined_at: {type: [string, "null"], format: date-time}
        removed_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        deed: {type: string, description: The admin deed this change sealed (on changes only).}
      examples:
        - object: membership
          id: mem_01k6f6evxjk5zr0t0kntw9ehx5
          org: org_01k6h7kp6msmzrhdzwtcr3jnkp
          user: {id: usr_01k6s2anqftp0685ngz82kyz6y, email: sam@acme.com, name: ""}
          role: viewer
          status: invited
          invited_by: usr_01k6c9kb2zcjsyn7b8g2k1vqvp
          invited_at: "2026-10-03T09:20:11.000Z"
          joined_at: null
          removed_at: null
          created_at: "2026-10-03T09:20:11.000Z"
          deed: deed_01k6vrddq2atgb2023qvhhct3g
    MembershipList:
      type: object
      required: [object, data, has_more, next_cursor]
      properties:
        object: {type: string, const: list}
        data:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
    Labels:
      type: object
      maxProperties: 32
      description: >-
        At most 32. Keys match `^[a-z0-9][a-z0-9._/-]{0,62}$`; values are up to 128 printable
        characters. Policies match on labels, so every change seals a deed.
      propertyNames:
        pattern: "^[a-z0-9][a-z0-9._/-]{0,62}$"
      additionalProperties:
        type: string
        maxLength: 128
    Budgets:
      type: object
      additionalProperties: false
      description: >-
        An agent's limits; a limit left out means none. Money is in minor units (cents for usd,
        paise for inr). Deedglass stores and checks them now; the Gate enforces them when it ships.
      properties:
        calls_per_minute: {type: integer, minimum: 1, maximum: 1000000}
        calls_per_day: {type: integer, minimum: 1, maximum: 100000000}
        spend_per_day:
          type: object
          additionalProperties: false
          required: [amount, currency]
          properties:
            amount: {type: integer, minimum: 0, maximum: 9007199254740991, description: Minor units.}
            currency: {type: string, pattern: "^[a-z]{3}$", description: Lowercase ISO 4217, like usd or inr.}
      examples:
        - calls_per_minute: 60
          calls_per_day: 5000
          spend_per_day: {amount: 5000, currency: usd}
    Agent:
      type: object
      required: [object, id, name, description, labels, budgets, status, status_reason, status_changed_at, status_changed_by, owner, active_keys, last_used_at, created_at, updated_at, intent_mode]
      properties:
        object: {type: string, const: agent}
        id: {type: string, pattern: "^agt_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        name: {type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$", description: Unique in the org and immutable.}
        description: {type: string, maxLength: 500}
        labels:
          $ref: "#/components/schemas/Labels"
        budgets:
          $ref: "#/components/schemas/Budgets"
        status: {type: string, enum: [active, suspended, stopped]}
        status_reason: {type: [string, "null"], maxLength: 280}
        status_changed_at: {type: [string, "null"], format: date-time}
        status_changed_by: {type: [string, "null"], description: '`usr_…`, `key_…` or `operator`.'}
        owner: {type: [string, "null"], description: The person responsible (`usr_…`).}
        active_keys: {type: integer, minimum: 0, maximum: 10}
        last_used_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        intent_mode:
          type: string
          enum: ["off", optional, required]
          description: >-
            Signed intents (S09): off (headers ignored), optional (checked when sent) or required
            (every call needs one).
        usage:
          $ref: "#/components/schemas/AgentUsage"
        last_action_at:
          type: [string, "null"]
          format: date-time
          description: With `?expand[]=usage` only. When the agent's newest action was created.
      examples:
        - object: agent
          id: agt_01k633rrmh3bcz2p39gg4vp46q
          name: support-bot
          description: Answers refund tickets in Zendesk
          labels: {env: prod, team: support}
          budgets: {calls_per_minute: 60, calls_per_day: 5000, spend_per_day: {amount: 5000, currency: usd}}
