                        "decisions": {"allow": 1194, "deny": 0, "require_approval": 0},
                        "approval": {"requested": 0, "approved": 0, "denied": 0, "expired": 0, "cancelled": 0, "pending": 0, "rate": null, "median_seconds": null, "p95_seconds": null},
