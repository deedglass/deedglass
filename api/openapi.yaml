  /v1/suggestions:
    get:
      operationId: listSuggestions
      summary: List suggestions
      description: >-
        Policy changes Insights proposes from the last 14 days of decisions (S28), ordered by
        impact (the actions whose decision the suggestion's replay would change), then by creation.
        `status` defaults to open and accepting; `all` lists every status. Nothing in a suggestion
        is applied until a person accepts it, and accepting only runs it in shadow. A Console
        session (viewer and up) or an org admin key (`admin` scope); agent keys get 403
        `insufficient_scope`.
      tags: [Insights]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: status, in: query, required: false, description: 'open (default: open and accepting), accepting, accepted, rejected, superseded or all.', schema: {type: string, enum: [open, accepting, accepted, rejected, superseded, all]}}
        - {name: kind, in: query, required: false, description: Only this kind., schema: {type: string, enum: [loosen, tighten, budget, explicit_rule, advisory]}}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of suggestions.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                type: object
                required: [object, data, has_more, next_cursor]
                properties:
                  object: {type: string, const: list}
                  data: {type: array, items: {$ref: "#/components/schemas/Suggestion"}}
                  has_more: {type: boolean}
                  next_cursor: {type: [string, "null"]}
        "400":
          description: A bad status, kind, limit or cursor (`validation_failed`).
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /v1/suggestions/generate:
    post:
      operationId: generateSuggestions
      summary: Generate suggestions now
      description: >-
        Runs a suggest pass now (the server also runs one a day after 03:00 org-local): it reads
        14 days of decisions against the enforced version, runs the six generators, patches the
        policy text, compiles it with every existing rule intact, replays the change against the
        same 14 days and drops anything its guard refuses (a loosening that would allow an action
        a person denied, or more actions than people approved). Open suggestions written for a
        version that is no longer enforced are superseded first. At most 10 are open at once.
        Answers a `learn_run`. No body. An admin+ Console session (with the `Deedglass-CSRF`
        header) or an org admin key; viewers get 403 `insufficient_role`, agent keys 403
        `insufficient_scope`; 409 `conflict` while another pass runs for the org.
      tags: [Insights]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The pass's result.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnRun"
        "409":
          description: Another pass is running for this org (`conflict`).
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /v1/suggestions/{id}:
    get:
      operationId: getSuggestion
      summary: Retrieve a suggestion
      description: >-
        One suggestion with its evidence, the policy change as a unified diff, the replay summary
        (the full replay is `GET /v1/replays/{replay.id}`), the risk note and its decision. An id
        that isn't one of this org's suggestions is 404 `not_found`. A Console session (viewer and
        up) or an org admin key; agent keys get 403.
      tags: [Insights]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: id, in: path, required: true, description: The suggestion id (`sug_…`)., schema: {type: string}}
      responses:
        "200":
          description: The suggestion.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suggestion"
        "404":
          description: No such suggestion in this org.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /v1/suggestions/{id}/accept:
    post:
      operationId: acceptSuggestion
      summary: Accept a suggestion into shadow
      description: >-
        Creates a policy version from the suggestion (origin `suggestion`, `suggestion_id` set; an
        identical version already stored is reused and `note` says so) and runs it in shadow next
        to the enforced version. Nothing is enforced: promote it later with
        `POST /v1/policies/{id}/versions/{v}/activate` and `mode: enforce`. Seals
        `policy.activated` (shadow) and `suggestion.accepted` (`deeds`, in that order). `reason` is
        optional (up to 280 characters). An org runs at most one version in shadow: 409
        `shadow_slot_taken` unless `replace_shadow` is true; 409 `suggestion_stale` when the
        enforced version changed since (the suggestion is superseded); 409 `suggestion_decided`
        when it was already decided; 409 `conflict` for advice. An admin+ Console session or an
        org admin key; viewers get 403 `insufficient_role`, agent keys 403 `insufficient_scope`.
      tags: [Insights]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, description: The suggestion id (`sug_…`)., schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: {type: string, maxLength: 280, description: Optional. It goes into both deeds.}
                replace_shadow: {type: boolean, default: false, description: Replace the version running in shadow now.}
            example: {reason: Ops approves these every time, replace_shadow: true}
      responses:
        "200":
          description: The suggestion, accepted, with the version it created and the deeds.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suggestion"
        "409":
          description: '`shadow_slot_taken`, `suggestion_stale`, `suggestion_decided`, or `conflict` for advice.'
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  type: invalid_request_error
                  code: shadow_slot_taken
                  message: "acme-sim v2 is already running in shadow. Promote or clear it first, or accept with replace_shadow: true to replace it."
                  param: replace_shadow
                  request_id: req_01m435q4ne4yj7meyd2bdz8kdm
                  doc_url: https://docs.deedglass.com/errors/shadow_slot_taken
        default:
          $ref: "#/components/responses/Error"
  /v1/suggestions/{id}/reject:
    post:
      operationId: rejectSuggestion
      summary: Reject a suggestion
      description: >-
        Closes an open suggestion and seals `suggestion.rejected` with the reason. `reason` is
        required, 3 to 280 characters (400 `validation_failed` on `reason`). Deedglass doesn't
        suggest the same change again for 30 days unless its main count doubles. 409
        `suggestion_decided` when it was already decided. An admin+ Console session or an org
        admin key.
      tags: [Insights]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, description: The suggestion id (`sug_…`)., schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 3, maxLength: 280, description: One line. It goes into the deed.}
            example: {reason: We review inventory writes by hand}
      responses:
        "200":
          description: The suggestion, rejected, with the deed.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suggestion"
        "400":
          description: No reason, or one outside 3 to 280 characters.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /v1/insights/stats:
    get:
      operationId: getInsightsStats
      summary: Get decision and verdict stats
      description: >-
        Counts and percentiles over this org's actions by decision time (S27), the same numbers
        `deedglass insights stats` prints: decisions, approvals (requested, outcomes, the approval
        rate `approved / (approved + denied)` and the wait), the deny rate (Stop decisions left
        out), verdicts and witnessed levels, latency, cost per currency, each budget's daily use,
        and one row per org-local day. Rates are rounded to 4 decimals and always come with their
        counts. The window is `window=7d` (the default) or `30d` ending now, or `from` and `to` in
        RFC 3339 (both; not with `window`; `from` before `to`, at most 90 days, else 400
        `replay_window_invalid`). `by` groups by `rule` (the deciding rule, with the policy
        versions that used it), `tool` or `agent` (default `none`: only `totals`). `agent` (an
        `agt_` id) and `tool` (a name or a glob like `stripe.*`) filter. `compare=previous` adds
        `trend` against the window of the same length just before: `delta_pct` for counts and
        `delta_pp` (percentage points) for rates, and only `previous: null` when that window has
        fewer than 20 actions. Days follow the org's time zone. `empty` is a sentence when the
        window has no actions. Answers are cached for 60 s per org and query (`Cache-Control:
        private, no-store`). Any other parameter, or one sent twice, is 400 `validation_failed`. A
        Console session (viewer and up) or an org admin key (`admin` scope); agent keys get 403
        `insufficient_scope`.
      tags: [Insights]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: window, in: query, required: false, description: '`7d` (default) or `30d`, ending now. Not with `from` and `to`.', schema: {type: string, enum: [7d, 30d], default: 7d}}
        - {name: from, in: query, required: false, description: The window's start (RFC 3339). Send `to` with it., schema: {type: string, format: date-time}, example: "2026-10-01T00:00:00Z"}
        - {name: to, in: query, required: false, description: The window's end (RFC 3339). Send `from` with it., schema: {type: string, format: date-time}, example: "2026-10-04T00:00:00Z"}
        - {name: by, in: query, required: false, schema: {type: string, enum: [rule, tool, agent, none], default: none}}
        - {name: agent, in: query, required: false, description: Only this agent's actions (`agt_…`)., schema: {type: string, maxLength: 64}}
        - {name: tool, in: query, required: false, description: 'A tool name, or a glob with `*` like `stripe.*`.', schema: {type: string, maxLength: 200}}
        - {name: compare, in: query, required: false, description: '`previous` adds `trend` against the window just before.', schema: {type: string, enum: [previous]}}
      responses:
        "200":
          description: The stats.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
            Cache-Control:
              schema: {type: string, const: "private, no-store"}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightsStats"
              examples:
                by_agent:
                  summary: Three days by agent, compared with the three days before (two groups and two days shown)
                  value:
                    {"object": "insights_stats", "window": {"from": "2026-10-01T00:00:00Z", "to": "2026-10-04T00:00:00Z", "days": 3},
                     "timezone": "Asia/Kolkata", "by": "agent", "filters": {"agent": null, "tool": null},
                     "totals": {"actions": 2554, "decisions": {"allow": 2373, "deny": 9, "require_approval": 172},
                                "approval": {"requested": 172, "approved": 170, "denied": 1, "expired": 1, "cancelled": 0, "pending": 0,
                                             "rate": 0.9942, "median_seconds": 1129, "p95_seconds": 6510},
                                "deny_rate": 0.0035, "verdicts": {"VERIFIED": 2508, "MISMATCH": 3, "UNVERIFIABLE": 13, "none": 30},
                                "levels": {"L0": 2037, "L1": 330, "L2": 157}, "executed": 2543, "mismatch_rate": 0.0012, "unverifiable_rate": 0.0051,
