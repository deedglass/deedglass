              schema:
                $ref: "#/components/schemas/ApprovalLinkStatus"
        default:
          $ref: "#/components/responses/Error"
  /v1/slack/interact:
    post:
      operationId: slackInteract
      summary: Slack interactivity (approve and deny from an approval card)
      description: >-
        Slack's Interactivity Request URL (S29). Not part of the JSON API: Slack posts a form body
        with one field, `payload` (Slack's JSON), signed with the app's signing secret. Deedglass
        routes by the payload's team and app ids, checks `X-Slack-Signature`
        (`v0=` + hex HMAC-SHA256 of `v0:{timestamp}:{body}`) with that org's secret, refuses a
        timestamp more than 300 seconds from now, and acts on one signature once. Every refusal
        before the signature verifies is a bare 401 with no body. A verified click answers 200 within
        2.5 seconds; refusals of the decision (not eligible, self, already decided, expired) reach
        the person as a message only they can see. A deny opens a form whose submission answers 200,
        or 200 with `{"response_action":"errors",…}` when the reason is missing.
      tags: [Approvals]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      parameters:
        - in: header
          name: X-Slack-Request-Timestamp
          required: true
          schema: {type: string, pattern: "^[0-9]{1,12}$"}
        - in: header
          name: X-Slack-Signature
          required: true
          schema: {type: string, pattern: "^v0=[0-9a-f]{64}$"}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  type: string
                  description: Slack's interaction payload (block_actions or view_submission) as JSON, at most 256 KiB.
      responses:
        "200":
          description: Received. The body is empty, or the deny form's field errors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  response_action: {type: string, enum: [errors]}
                  errors: {type: object, additionalProperties: {type: string}}
        "401":
          description: Refused (bad or missing signature, stale timestamp, unknown team or app, malformed body). No body.
        "429":
          description: Too many requests from this address. No body.
        default:
          $ref: "#/components/responses/Error"
  /approve:
