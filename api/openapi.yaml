openapi: 3.1.1
info:
  title: Deedglass API
  version: "2026-10-01"
  summary: The execution and accountability layer for AI agents.
  description: >-
    Deedglass sits between your AI agents and the tools they use, deciding what each agent may do,
    running it under control, and recording what actually happened as a signed deed.


    Every response carries `Deedglass-Request-Id` and the resolved `Deedglass-Version`. Errors use
    one envelope with a `doc_url` for every code. This document is written by hand; tests in
    `internal/httpx` fail when it and the mounted routes drift apart.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:8080
    description: A local server (make dev)
  - url: https://api.deedglass.com
    description: The cloud beta
tags:
  - name: People
    description: >-
      Signing in with an emailed link or code (no passwords), sessions, your org and its members
      (docs/IDENTITY.md).
  - name: Agents
    description: >-
      Agents, their API keys, Stop and Stop all (docs/AGENTS.md). Control-plane routes accept a
      Console session (by role) or an org admin key (`admin` scope). Agent keys get 403
      `insufficient_scope` on all of them: no agent key changes any agent, including its own. A 401
      carries `WWW-Authenticate: Bearer realm="deedglass", error="invalid_token",
      error_description="…"`; a 403 `insufficient_scope` carries `WWW-Authenticate: Bearer
      realm="deedglass", error="insufficient_scope", scope="…"`. Every change seals an admin deed.
  - name: Pages
    description: The server-rendered sign-in pages.
  - name: System
    description: Health, version and this document.
  - name: Ledger
    description: >-
      The searchable history of every action an agent took and every state change, and the deed
      chain check (docs/LEDGER.md).
  - name: Deeds
    description: >-
      Signed records of what agents did, and the public seal keys that check them offline
      (docs/DEED_SPEC.md).
  - name: Intents
    description: "Signed intents: the conformance check SDK authors run against Deedglass."
  - name: MCP
    description: "MCP authorization readiness: OAuth protected-resource metadata (RFC 9728) and the /mcp endpoints."
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Check the server and its database
      description: >-
        Public. The checks are cached for 1 s, so frequent probes don't load the database. The body
        shows statuses only; details go to the server log. Returns 503 when the database is
        unreachable or the server is draining.
      tags: [System]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      responses:
        "200":
          description: The server can serve requests (`status` is `ok` or `degraded`).
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database is unreachable (`down`) or the server is shutting down (`draining`).
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
  /v1/version:
    get:
      operationId: getVersion
      summary: Show the server's version and API versions
      tags: [System]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      responses:
        "200":
          description: This server's build and the API versions it serves.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        default:
          $ref: "#/components/responses/Error"
  /api/openapi.yaml:
    get:
      operationId: getOpenAPISpec
      summary: Download this document
      tags: [System]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      responses:
        "200":
          description: This OpenAPI document, exactly as embedded in the server.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/yaml:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /.well-known/deedglass/keys.json:
    get:
      operationId: getSealKeys
      summary: List the public seal keys
      description: >-
        Public and not versioned. Every seal key this deployment ever registered, oldest first, so
        any deed it sealed can be checked offline with `deedglass verify`. Retired keys stay listed;
        a deed is valid under a key when `activated_at ≤ issued_at < retired_at` and the key is not
        revoked. Readable cross-origin (`Access-Control-Allow-Origin: *`). Cached for 60 s on the
        server and 300 s by clients; send `If-None-Match` with the `ETag` to get 304. The server
        never returns a partial list: when it can't read the keys it answers 503
        `service_unavailable`.
      tags: [Deeds]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: The `ETag` of a copy you hold.
          schema:
            type: string
      responses:
        "200":
          description: The seal key set.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            ETag:
              description: '`"sha256:<hex>"` of the body.'
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: public, max-age=300
            Access-Control-Allow-Origin:
              schema:
                type: string
                const: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SealKeySet"
        "304":
          description: The copy named in `If-None-Match` is current.
          headers:
            ETag:
              description: '`"sha256:<hex>"` of the body.'
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /v1/actions:
    get:
      operationId: listActions
      summary: List actions
      description: >-
        Newest first, ordered by `(created_at, id)` descending, so rows added while you page only
        appear on a fresh first page. Filters combine with AND; list filters take a comma list
        (`verdict=MISMATCH,UNVERIFIABLE`). Unknown parameters are refused. A cursor is bound to the
        filters it was issued with: reuse it with different filters and the answer is 400
        `validation_failed` on `cursor`. Requires `actions:read` (viewer and up).
      tags: [Ledger]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: agent, in: query, required: false, description: An agent id (`agt_…`)., schema: {type: string, pattern: "^agt_[0-7][0-9a-hjkmnp-tv-z]{25}$"}}
        - {name: tool, in: query, required: false, description: 'A tool name, exact or a glob with `*` (`stripe.*`, `*.execute`); at most 200 bytes and three `*`.', schema: {type: string, maxLength: 200}}
        - {name: state, in: query, required: false, description: A comma list of lifecycle states (contract §5)., schema: {type: string}}
        - {name: decision, in: query, required: false, description: 'A comma list of `allow`, `deny`, `require_approval`.', schema: {type: string}}
        - {name: verdict, in: query, required: false, description: 'A comma list of `VERIFIED`, `MISMATCH`, `UNVERIFIABLE`.', schema: {type: string}}
        - {name: level, in: query, required: false, description: 'A comma list of `L0`, `L1`, `L2`.', schema: {type: string}}
        - {name: on_behalf_of, in: query, required: false, description: The exact on-behalf-of reference., schema: {type: string, maxLength: 256}}
        - {name: "created_at[gte]", in: query, required: false, description: RFC 3339; inclusive., schema: {type: string, format: date-time}}
        - {name: "created_at[lt]", in: query, required: false, description: RFC 3339; exclusive., schema: {type: string, format: date-time}}
        - {name: q, in: query, required: false, description: Text to find in the tool name or the error code (2 to 64 characters)., schema: {type: string, minLength: 2, maxLength: 64}}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of actions.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionList"
        default:
          $ref: "#/components/responses/Error"
  /v1/actions/{id}:
    get:
      operationId: getAction
      summary: Show one action, its events and deeds
      description: >-
        The action plus its payloads (`request`, `result`, `witness.detail`; `null` once retention
        removed them, see `payload_pruned_at`), up to 200 events in order, and the deeds about it
        (the action deed and any amendments). An id from another org is 404 `not_found`, exactly
        like an id that doesn't exist. Requires `actions:read`.
      tags: [Ledger]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: id, in: path, required: true, description: The action id (`act_…`)., schema: {type: string}}
      responses:
        "200":
          description: The action.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionDetail"
        default:
          $ref: "#/components/responses/Error"
  /v1/deeds:
    get:
      operationId: listDeeds
      summary: List deeds
      description: >-
        Deed envelopes by seq, oldest first (`order=desc` for newest first). Each item is a stored
        deed; `GET /v1/deeds/{id}` returns its exact canonical bytes. Requires `deeds:read`.
      tags: [Deeds]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/FromSeq"
        - $ref: "#/components/parameters/ToSeq"
        - {name: kind, in: query, required: false, description: 'A comma list of `action`, `admin`, `amendment`.', schema: {type: string}}
        - {name: action, in: query, required: false, description: 'An action id: its deed and any amendments.', schema: {type: string}}
        - {name: order, in: query, required: false, description: '`asc` (default) or `desc`.', schema: {type: string, enum: [asc, desc]}}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of deeds.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeedList"
        default:
          $ref: "#/components/responses/Error"
  /v1/deeds/{id}:
    get:
      operationId: getDeed
      summary: Get one deed's exact bytes
      description: >-
        The stored canonical JSON of the deed envelope, byte for byte, so its hash and seal check
        offline. Deeds never change: the response is cacheable forever and its `ETag` is the
        `body_hash`. With `Accept: application/cose` the deed comes as a COSE_Sign1 signed
        statement (RFC 9052; not an RFC 9942 transparency-service object). Requires `deeds:read`.
      tags: [Deeds]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: id, in: path, required: true, description: The deed id (`deed_…`)., schema: {type: string}}
        - {name: If-None-Match, in: header, required: false, description: The `ETag` of a copy you hold., schema: {type: string}}
      responses:
        "200":
          description: The deed.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            ETag:
              description: '`"sha256:<hex>"`: the deed''s `body_hash`.'
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: private, max-age=31536000, immutable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deed"
            application/cose:
              schema:
                type: string
                contentMediaType: application/cose
        "304":
          description: The copy named in `If-None-Match` is current.
        default:
          $ref: "#/components/responses/Error"
  /v1/deeds/export:
    get:
      operationId: exportDeeds
      summary: Export deeds as a bundle
      description: >-
        A streamed export bundle v1 (docs/BUNDLE_FORMAT.md): a deterministic tar.gz holding
        README.txt, keys.json, deeds.jsonl, manifest.json and manifest.seal.json, read from one
        database snapshot. Choose deeds by seq or by issued_at, at most 1,000,000 at a time; an
        empty range is 404 with where the chain ends. Check the file with `deedglass verify
        <file> --keys <this server>/.well-known/deedglass/keys.json`. Requires `deeds:read`.
      tags: [Deeds]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/FromSeq"
        - $ref: "#/components/parameters/ToSeq"
        - {name: "issued_at[gte]", in: query, required: false, description: RFC 3339; inclusive. Not with from_seq or to_seq., schema: {type: string, format: date-time}}
        - {name: "issued_at[lt]", in: query, required: false, description: RFC 3339; exclusive., schema: {type: string, format: date-time}}
      responses:
        "200":
          description: The bundle, streamed.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Content-Disposition:
              description: '`attachment; filename="deedglass-<org>-<first>-<last>.tar.gz"`.'
              schema:
                type: string
          content:
            application/gzip:
              schema:
                type: string
                contentMediaType: application/gzip
        default:
          $ref: "#/components/responses/Error"
  /v1/ledger/check:
    get:
      operationId: checkLedger
      summary: Check the deed chain
      description: >-
        Checks every deed in the range in seq order against this server's own seal keys: hashes,
        seals, links and seq continuity. A broken chain is a 200 result with `status: broken` and
        the first break, not an error. The check stops after 30 s or 2,000,000 deeds with `status:
        incomplete` and `next_from_seq`. Keep `head` somewhere outside Deedglass: it is how a
        deletion from the end of the chain becomes visible. Requires `deeds:read`.
      tags: [Ledger]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/FromSeq"
        - $ref: "#/components/parameters/ToSeq"
        - {name: "issued_at[gte]", in: query, required: false, description: RFC 3339; inclusive. Not with from_seq or to_seq., schema: {type: string, format: date-time}}
        - {name: "issued_at[lt]", in: query, required: false, description: RFC 3339; exclusive., schema: {type: string, format: date-time}}
      responses:
        "200":
          description: The result.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerCheck"
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/login:
    post:
      operationId: requestLogin
      summary: Ask for a sign-in link and code
      description: >-
        Public. Always 202 with the same body for every well-formed address, whether or not it has
        an account: the server never reads the database here, and a worker sends the email. The
        email carries one link (`/auth/confirm#t=…`, valid once for 15 minutes) and a 6-digit code
        for another device. Limits: 20 requests per IP and 5 per address per hour (429
        `rate_limited` with `Retry-After`).
      tags: [People]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: {type: string, maxLength: 254}
            example: {email: Priya@Acme.com}
      responses:
        "202":
          description: Accepted. The same for known and unknown addresses.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginRequest"
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/preview:
    post:
      operationId: previewLogin
      summary: See what a sign-in link would do, without using it
      description: >-
        Public. The confirm page calls this first and shows whose account and which org the link
        signs into, so nobody is signed in to an account they didn't expect (login CSRF). Nothing is
        consumed. An unknown, used, replaced or expired token is 400 `login_link_invalid`; 30
        failures per IP per hour are allowed.
      tags: [People]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: {type: string, minLength: 43, maxLength: 43}
            example: {token: OEVkbr-q18qimgaDkbcE5mnZqQ2a1zGG7_TgYq8PKFc}
      responses:
        "200":
          description: What the link does.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginPreview"
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/callback:
    post:
      operationId: completeLogin
      summary: Sign in with a link's token, or with an email address and code
      description: >-
        Public. Uses the token once (only while unused, not replaced by a newer email and not
        expired), accepts the invite when the link is one, and sets the session and CSRF cookies.
        With `email` and `code`, the code must belong to the newest email; each code allows 5
        attempts. Every miss is 400 `login_code_invalid` with the same message.
      tags: [People]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [token]
                  properties:
                    token: {type: string}
                - type: object
                  additionalProperties: false
                  required: [email, code]
                  properties:
                    email: {type: string}
                    code: {type: string, description: Six digits; spaces are ignored.}
            examples:
              link: {value: {token: OEVkbr-q18qimgaDkbcE5mnZqQ2a1zGG7_TgYq8PKFc}}
              code: {value: {email: priya@acme.com, code: "482913"}}
      responses:
        "200":
          description: Signed in. `Set-Cookie` carries `__Host-deedglass_session` and `__Host-deedglass_csrf`.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Set-Cookie:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Sign out
      description: >-
        Ends this session, or with `everywhere` every session of yours in every org, and expires the
        cookies. Needs the `Deedglass-CSRF` header.
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                everywhere: {type: boolean, default: false}
      responses:
        "204":
          description: Signed out.
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/switch-org:
    post:
      operationId: switchOrg
      summary: Switch to another org you belong to
      description: >-
        Issues a new session in the org (new cookies) and ends the current one. Needs the
        `Deedglass-CSRF` header.
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [org]
              properties:
                org: {type: string}
      responses:
        "200":
          description: The new session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
  /v1/me:
    get:
      operationId: getMe
      summary: Who is signed in
      description: The person, the session's org, their role there, the orgs they can switch to, and the CSRF token.
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      responses:
        "200":
          description: You.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMe
      summary: Change your name
      description: The name other members see. An empty string clears it. Needs the `Deedglass-CSRF` header.
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, maxLength: 80}
      responses:
        "200":
          description: You, updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
  /v1/org:
    get:
      operationId: getOrg
      summary: Get your org
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      responses:
        "200":
          description: The org.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateOrg
      summary: Change the org's name or time zone
      description: Admins and owners. Seals an `org.updated` admin deed when something changed. Needs the `Deedglass-CSRF` header.
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                timezone: {type: string, description: An IANA time zone name such as Asia/Kolkata.}
            example: {timezone: Asia/Kolkata}
      responses:
        "200":
          description: The org, with the deed (null when nothing changed).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Org"
                  - type: object
                    required: [deed]
                    properties:
                      deed: {type: [string, "null"]}
        default:
          $ref: "#/components/responses/Error"
  /v1/org/members:
    get:
      operationId: listMembers
      summary: List the org's members
      description: Oldest first. Without `status`, invited and active members; `status=removed` lists people who were removed.
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: status, in: query, required: false, schema: {type: string, enum: [invited, active, removed]}}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: inviteMember
      summary: Invite someone
      description: >-
        Admins invite viewers and admins; only owners invite owners. Sends a one-time invite link,
        valid for 7 days, and seals `member.invited`. 201 for a new invite; 200 when the person was
        already invited (the old link stops working and a new one is sent); 409 `conflict` for an
        active member. Needs the `Deedglass-CSRF` header.
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: {type: string}
                role: {type: string, enum: [viewer, admin, owner]}
            example: {email: sam@acme.com, role: viewer}
      responses:
        "201":
          description: Invited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "200":
          description: Invited again, with a fresh link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        default:
          $ref: "#/components/responses/Error"
  /v1/org/members/{id}:
    patch:
      operationId: updateMember
      summary: Change a member's role
      description: >-
        Owners only. Seals `member.role_changed`. Demoting the last owner is 409 `last_owner`. The
        change applies on the member's next request. Needs the `Deedglass-CSRF` header.
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRF"
        - {name: id, in: path, required: true, description: The membership id (`mem_…`)., schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: {type: string, enum: [viewer, admin, owner]}
      responses:
        "200":
          description: The membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeMember
      summary: Remove a member, or leave
      description: >-
        Admins remove viewers and admins; owners remove anyone; removing yourself is leaving. The
        member's sessions in the org end at once. Seals `member.removed`. Removing the last owner is
        409 `last_owner`. Needs the `Deedglass-CSRF` header.
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRF"
        - {name: id, in: path, required: true, description: The membership id (`mem_…`)., schema: {type: string}}
      responses:
        "200":
          description: The membership, now removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        default:
          $ref: "#/components/responses/Error"
  /v1/agents:
    get:
      operationId: listAgents
      summary: List agents
      description: >-
        Oldest first. Filters combine with AND. Unknown parameters are refused. A Console session
        (viewer and up) or an org admin key (`admin` scope); agent keys get 403
        `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: status, in: query, required: false, schema: {type: string, enum: [active, suspended, stopped]}}
        - {name: label, in: query, required: false, description: 'One label as `key:value`, like `env:prod`.', schema: {type: string}}
        - {name: name, in: query, required: false, description: The exact agent name (the CLI resolves names this way)., schema: {type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$"}}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of agents.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAgent
      summary: Create an agent
      description: >-
        Seals `agent.created`. The name (`^[a-z0-9][a-z0-9-]{1,62}$`, unique in the org) can't
        change later, because policies match on it; `console`, `system` and `deedglass` are
        reserved. At most 32 labels. Budgets are in minor units (cents for usd). `owner` defaults
        to the signed-in person. A taken name is 409 `conflict`. An admin+ Console session (with the
        `Deedglass-CSRF` header) or an org admin key; agent keys get 403 `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$", description: Immutable. Not console, system or deedglass.}
                description: {type: string, maxLength: 500}
                labels:
                  $ref: "#/components/schemas/Labels"
                budgets:
                  $ref: "#/components/schemas/Budgets"
                owner: {type: string, description: An active member's id (`usr_…`).}
            example:
              name: support-bot
              description: Answers refund tickets in Zendesk
              labels: {env: prod, team: support}
              budgets: {calls_per_minute: 60, calls_per_day: 5000, spend_per_day: {amount: 5000, currency: usd}}
      responses:
        "201":
          description: The agent, with the deed that sealed `agent.created`.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/agents/{id}:
    get:
      operationId: getAgent
      summary: Get an agent
      description: >-
        An id from another org is 404 `not_found`, like an id that doesn't exist. A Console session
        (viewer and up) or an org admin key; agent keys get 403 `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: The agent.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateAgent
      summary: Change an agent's description, labels, budgets, owner or intent mode
      description: >-
        Send only what changes. `labels` and `budgets` replace the whole map; `owner: ""` clears the
        owner. Names are immutable, so sending `name` is 422 `validation_failed`: to rename, create
        a new agent and move its keys. Seals `agent.updated` unless nothing changed (then `deed` is
        null). Changing `intent_mode` seals its own deed, `agent.intent_mode_changed` with `from`
        and `to`; setting it to `required` while the agent has no intent keys is 409 `conflict`
        (add a key first). An admin+ Console session (with the `Deedglass-CSRF` header) or an org
        admin key; agent keys get 403 `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                description: {type: string, maxLength: 500}
                labels:
                  $ref: "#/components/schemas/Labels"
                budgets:
                  $ref: "#/components/schemas/Budgets"
                owner: {type: string, description: An active member's id (`usr_…`), or "" to clear it.}
                intent_mode:
                  type: string
                  enum: ["off", optional, required]
                  description: >-
                    Signed intents (S09): off (headers ignored), optional (checked when sent) or
                    required (every call needs one).
            example: {labels: {env: prod, team: support, tier: "1"}}
      responses:
        "200":
          description: The agent, with the deed (null when nothing changed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/agents/{id}/suspend:
    post:
      operationId: suspendAgent
      summary: Suspend an agent
      description: >-
        A planned pause. New calls are refused with 403 `agent_suspended`; resume undoes it. Seals
        `agent.suspended`. Idempotent: suspending a suspended agent returns 200 unchanged with
        `deed: null`. Suspending a stopped agent is 409 `conflict`. An admin+ Console session (with
        the `Deedglass-CSRF` header) or an org admin key; agent keys get 403 `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        $ref: "#/components/requestBodies/OptionalReason"
      responses:
        "200":
          description: The agent, with the deed (null when it was already suspended).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/agents/{id}/resume:
    post:
      operationId: resumeAgent
      summary: Resume a suspended agent
      description: >-
        Seals `agent.resumed`. Idempotent: resuming an active agent returns 200 unchanged with
        `deed: null`. Resuming a stopped agent is 409 `conflict` (start it instead). An admin+
        Console session (with the `Deedglass-CSRF` header) or an org admin key; agent keys get 403
        `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        $ref: "#/components/requestBodies/OptionalReason"
      responses:
        "200":
          description: The agent, with the deed (null when it was already active).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/agents/{id}/stop:
    post:
      operationId: stopAgent
      summary: Stop an agent
      description: >-
        The emergency brake. Seals `agent.stopped`; every Deedglass instance refuses the agent's
        calls within 2 seconds, with 403 `agent_stopped`. Actions already running at a tool finish:
        Stop can't un-run them. The reason is optional and never shown to the agent. Idempotent:
        stopping a stopped agent returns 200 unchanged with `deed: null`. If the stop can't be
        recorded the answer is 500 `internal_error` and nothing changed; the API never says stopped
        unless it is. An admin+ Console session (with the `Deedglass-CSRF` header) or an org admin
        key; agent keys get 403 `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        $ref: "#/components/requestBodies/OptionalReason"
      responses:
        "200":
          description: The agent, now stopped, with the deed (null when it was already stopped).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResult"
              example:
                object: agent
                id: agt_01k633rrmh3bcz2p39gg4vp46q
                name: support-bot
                description: Answers refund tickets in Zendesk
                labels: {env: prod, team: support}
                budgets: {calls_per_minute: 60, calls_per_day: 5000, spend_per_day: {amount: 5000, currency: usd}}
                status: stopped
                status_reason: Refund loop in staging
                status_changed_at: "2026-10-03T14:02:09.000Z"
                status_changed_by: usr_01k6c9kb2zcjsyn7b8g2k1vqvp
                owner: usr_01k6c9kb2zcjsyn7b8g2k1vqvp
                active_keys: 1
                last_used_at: "2026-10-03T14:01:58.512Z"
                created_at: "2026-10-03T10:02:11.000Z"
                updated_at: "2026-10-03T14:02:09.000Z"
                intent_mode: "off"
                deed: deed_01k6vrddq2atgb2023qvhhct3g
        default:
          $ref: "#/components/responses/Error"
  /v1/agents/{id}/start:
    post:
      operationId: startAgent
      summary: Start a stopped agent
      description: >-
        Seals `agent.started`. The reason is required (3 to 280 characters, saying why it's safe now)
        and goes into the deed. Idempotent: starting an active agent returns 200 unchanged with
        `deed: null`. Starting a suspended agent is 409 `conflict` (resume it instead). While the
        org is stopped (Stop all), the agent stays refused with `org_stopped`. An admin+ Console
        session (with the `Deedglass-CSRF` header) or an org admin key; agent keys get 403
        `insufficient_scope`, so no agent can start itself.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        $ref: "#/components/requestBodies/RequiredReason"
      responses:
        "200":
          description: The agent, with the deed (null when it was already active).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/agents/{id}/keys:
    get:
      operationId: listAgentKeys
      summary: List an agent's API keys
      description: >-
        The agent's keys, newest first, revoked and expired ones included (at most 100). The secret
        is never shown. A Console session (viewer and up) or an org admin key; agent keys get 403
        `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: The keys, in one page.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAgentKey
      summary: Create an API key for an agent
      description: >-
        201. The `secret` is shown once, in this response; Deedglass stores only its hash. Replaying
        the same `Idempotency-Key` returns the same key with `"secret": null` and
        `Deedglass-Idempotent-Replayed: true`; if the first response was lost, roll or revoke that
        key. Scopes default to `actions:execute`, `actions:read` and `deeds:read`; agent keys can't
        hold `admin`. An agent has at most 10 active keys; the 11th is 409 `conflict`. Seals
        `api_key.created`. An admin+ Console session (with the `Deedglass-CSRF` header) or an org
        admin key; agent keys get 403 `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, maxLength: 64, description: A label for people, without line breaks.}
                mode: {type: string, enum: [live, test], default: live}
                scopes:
                  type: array
                  uniqueItems: true
                  items: {type: string, enum: ["actions:execute", "actions:read", "deeds:read", "actions:undo"]}
                  default: ["actions:execute", "actions:read", "deeds:read"]
            example: {name: prod runner, mode: live}
      responses:
        "201":
          description: The key, with its secret (null in a replay).
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/agents/{id}/intent-keys:
    get:
      operationId: listIntentKeys
      summary: List an agent's intent keys
      description: >-
        The Ed25519 public keys the agent signs intents with (at most two). A Console session
        (viewer and up) or an org admin key; agent keys get 403 `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: The intent keys, in one page.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentKeyList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: addIntentKey
      summary: Register an intent key for an agent
      description: >-
        201. Registers an Ed25519 public key the agent signs intents with. The key must pass the
        registration rules: 32 bytes, canonical encoding, on the curve and not of small order;
        otherwise the answer is 422 `validation_failed` with `param` set to `public_key`. A key
        whose `kid` is already registered, or a third key, is 409 `conflict`: an agent has at most
        two intent keys; two lets you rotate without downtime. Seals `agent.intent_key_added`. An
        admin+ Console session (with the `Deedglass-CSRF` header) or an org admin key; agent keys
        get 403 `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [public_key]
              properties:
                public_key:
                  type: string
                  pattern: "^ed25519:[A-Za-z0-9_-]{43}$"
                  description: '`ed25519:` and the 32-byte public key in base64url without padding.'
            example: {public_key: "ed25519:11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo"}
      responses:
        "201":
          description: The intent key, with the deed.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentKey"
        default:
          $ref: "#/components/responses/Error"
  /v1/agents/{id}/intent-keys/{kid}:
    delete:
      operationId: removeIntentKey
      summary: Remove an intent key
      description: >-
        Intents signed with the key are refused from now on. Removing the last key while the
        agent's `intent_mode` is `required` is 409 `conflict` (change the mode first); a `kid` the
        agent doesn't have is 404 `not_found`. Seals `agent.intent_key_removed`. An admin+ Console
        session (with the `Deedglass-CSRF` header) or an org admin key; agent keys get 403
        `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/IntentKid"
      responses:
        "200":
          description: The key is removed, with the deed.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentKeyDeleted"
        default:
          $ref: "#/components/responses/Error"
  /v1/keys/{id}/roll:
    post:
      operationId: rollKey
      summary: Roll an API key
      description: >-
        201. Creates a new key with the same agent, name, mode and scopes; its `secret` is shown
        once, and `previous` says when the old key stops working (`expires_in` seconds from now,
        0–604800, default 86400). Rolling a revoked or expired key is 409 `conflict`. Admin keys
        can't roll admin keys (403 `insufficient_role`), because that creates one. Replaying the
        same `Idempotency-Key` returns `"secret": null`. Seals `api_key.rolled`. An admin+ Console
        session (with the `Deedglass-CSRF` header) or an org admin key; agent keys get 403
        `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/KeyId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expires_in: {type: integer, minimum: 0, maximum: 604800, default: 86400, description: Seconds the old key keeps working.}
            example: {expires_in: 86400}
      responses:
        "201":
          description: The new key, with its secret and the old key's expiry.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyResult"
              example:
                object: api_key
                id: key_01k6jt6tgx72gjr876976xak5e
                agent: agt_01k633rrmh3bcz2p39gg4vp46q
                name: prod runner
                mode: live
                prefix: dg_live_0IDw6L5O
                scopes: ["actions:execute", "actions:read", "deeds:read"]
                secret: dg_live_0IDw6L5O_9hxevwY7nqdKIZZi5A2xlI2O2qn8znik
                expires_at: null
                last_used_at: null
                revoked_at: null
                rolled_from: key_01k6jz12ptrvg2zn5vts5xc1ay
                created_at: "2026-10-03T10:03:40.000Z"
                deed: deed_01k6vrddq2atgb2023qvhhct3g
                previous: {id: key_01k6jz12ptrvg2zn5vts5xc1ay, expires_at: "2026-10-04T10:03:40.000Z"}
        default:
          $ref: "#/components/responses/Error"
  /v1/keys/{id}/revoke:
    post:
      operationId: revokeKey
      summary: Revoke an API key
      description: >-
        The key stops working at once (401 `api_key_revoked`). Seals `api_key.revoked`. Idempotent:
        revoking a revoked key returns 200 with `deed: null`. An admin+ Console session (with the
        `Deedglass-CSRF` header) or an org admin key; agent keys get 403 `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/KeyId"
      requestBody:
        $ref: "#/components/requestBodies/OptionalReason"
      responses:
        "200":
          description: The key, now revoked, with the deed (null when it was already revoked).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/org/stop-all:
    post:
      operationId: stopAllAgents
      summary: Stop every agent in the org
      description: >-
        Turns on the org's Stop all: every agent's calls are refused with 403 `org_stopped`,
        whatever its own status, on every instance within 2 seconds. Seals `org.stopped_all`. The reason
        is optional. Idempotent: repeating it returns 200 unchanged with `deed: null`. If it can't be
        recorded the answer is 500 `internal_error` and nothing changed. An admin+ Console session
        (with the `Deedglass-CSRF` header) or an org admin key; agent keys get 403
        `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/OptionalReason"
      responses:
        "200":
          description: The org's Stop all state, with the deed (null when it was already on).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgStop"
        default:
          $ref: "#/components/responses/Error"
  /v1/org/start-all:
    post:
      operationId: startAllAgents
      summary: Turn off Stop all
      description: >-
        Owners only, in the Console: admin keys can't release the brake. The reason is required
        (3 to 280 characters) and goes into the deed. Agents stopped one by one stay stopped. Seals
        `org.started_all`. Idempotent: when Stop all is off, returns 200 unchanged with `deed: null`.
        Needs the `Deedglass-CSRF` header.
      tags: [Agents]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/RequiredReason"
      responses:
        "200":
          description: The org's Stop all state, now off, with the deed (null when it was already off).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgStop"
        default:
          $ref: "#/components/responses/Error"
  /v1/org/keys:
    get:
      operationId: listAdminKeys
      summary: List the org's admin keys
      description: Newest first, revoked ones included (at most 100). The secret is never shown. Admins and owners, in the Console only.
      tags: [Agents]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      responses:
        "200":
          description: The admin keys, in one page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAdminKey
      summary: Create an org admin key
      description: >-
        201. An admin key acts as the admin role (never owner) on the control plane: it can't call
        start-all, change roles or create admin keys, so admin keys can't keep access alive on their
        own. Its scopes are exactly `[admin]`. Admins and owners, in the Console only (or `deedglass
        org keys create` on the server). The `secret` is shown once; a replay returns `"secret":
        null`. Seals `api_key.created`. Needs the `Deedglass-CSRF` header.
      tags: [Agents]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, maxLength: 64}
                mode: {type: string, enum: [live, test], default: live}
                scopes:
                  type: array
                  description: Leave it out; admin keys always have exactly `[admin]`.
                  minItems: 1
                  maxItems: 1
                  items: {type: string, const: admin}
            example: {name: terraform}
      responses:
        "201":
          description: The admin key, with its secret (null in a replay).
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/whoami:
    get:
      operationId: whoami
      summary: Which key, agent and org this is
      description: >-
        Any API key. It skips the stop checks, so a stopped or suspended agent (or one in a stopped
        org) can learn its status here. It never includes a stop reason or who stopped the agent.
        For an org admin key, `agent` and `budgets` are null. An invalid, revoked or expired key is
        401 with `WWW-Authenticate: Bearer realm="deedglass", error="invalid_token"`.
      tags: [Agents]
      security: [{bearerAuth: []}]
      x-deedglass-auth: agent_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      responses:
        "200":
          description: The key's identity and statuses.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Whoami"
        default:
          $ref: "#/components/responses/Error"
  /v1/intents/verify:
    post:
      operationId: verifyIntent
      summary: Check a signed intent without acting
      description: >-
        A conformance check for SDK authors. It checks the `Deedglass-Intent` header in every intent
        mode (`off` included) exactly as the Gate will, consumes the nonce, and never acts: no tool
        is called. Without the header the answer is 422 `validation_failed` ("Send a
        Deedglass-Intent header to check."), except for an agent in `required` mode, which gets 403
        `intent_required`. Refusals are 403 `permission_error` with code `intent_invalid` (`param`
        names the field), `intent_replay` or `intent_required`; never 401. `Idempotency-Key` is
        ignored. An agent key with `actions:execute`.
      tags: [Intents]
      security: [{bearerAuth: []}]
      x-deedglass-auth: agent_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/DeedglassIntent"
        - $ref: "#/components/parameters/DeedglassOnBehalfOf"
        - $ref: "#/components/parameters/DeedglassSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tool, args]
              properties:
                tool:
                  type: string
                  pattern: '^[a-z][a-z0-9-]{1,31}\.[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
                  description: The tool the intent names, as `<connector>.<tool>`.
                args:
                  description: The arguments, any JSON value (use {} for none; at most 256 KiB).
            example: {tool: stripe.refund, args: {charge: ch_3QxZ8f2L, amount: 1200}}
      responses:
        "200":
          description: The intent passed every check, and its nonce is consumed.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentCheck"
        "403":
          description: >-
            The intent was refused: `intent_invalid` (`param` names the field), `intent_replay` or
            `intent_required`.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                intent_replay:
                  summary: The nonce was already used
                  value:
                    error:
                      type: permission_error
                      code: intent_replay
                      message: This signed intent was already used at 09:30:02 UTC. Sign a new intent, with a fresh nonce, for every call.
                      param: nonce
                      request_id: req_01j9zr3m5k8q2w7x4t6v0b1c9d
                      doc_url: https://docs.deedglass.com/errors/intent_replay
                intent_invalid:
                  summary: The arguments differ from the signed ones
                  value:
                    error:
                      type: permission_error
                      code: intent_invalid
                      message: The signed intent's args_digest doesn't match the arguments sent. Sign the exact arguments you send, canonicalized with RFC 8785.
                      param: args_digest
                      request_id: req_01j9zr3m5k8q2w7x4t6v0b1c9d
                      doc_url: https://docs.deedglass.com/errors/intent_invalid
        default:
          $ref: "#/components/responses/Error"
  /.well-known/oauth-protected-resource:
    get:
      operationId: getProtectedResourceMetadata
      summary: Show the protected-resource metadata for the API
      description: >-
        Public and not versioned. The RFC 9728 protected-resource metadata for the server as a
        whole. `authorization_servers` is absent on purpose: Deedglass v1 takes pre-issued API keys
        as bearer tokens and has no authorization server to list; v2 adds the org's issuer.
        Readable cross-origin and cached for an hour. It never reads the database.
      tags: [MCP]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      responses:
        "200":
          description: The metadata document.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Cache-Control:
              schema:
                type: string
                const: public, max-age=3600
            Access-Control-Allow-Origin:
              schema:
                type: string
                const: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedResourceMetadata"
              example:
                resource: https://api.deedglass.com
                resource_name: Deedglass
                bearer_methods_supported: [header]
                scopes_supported: ["actions:execute", "actions:read", "deeds:read"]
                resource_documentation: https://docs.deedglass.com/mcp/authorization
        default:
          $ref: "#/components/responses/Error"
  /.well-known/oauth-protected-resource/mcp/{connector}:
    get:
      operationId: getMCPResourceMetadata
      summary: Show the protected-resource metadata for a connector's MCP endpoint
      description: >-
        Public and not versioned. The RFC 9728 metadata for `/mcp/{connector}`, at the
        path-inserted URL that the endpoint's bearer challenges name in `resource_metadata`. The
        document is the same for every well-formed connector id and never reads the database; a
        malformed id is 404 `not_found`. `authorization_servers` is absent on purpose, as in the
        root document. Readable cross-origin and cached for an hour.
      tags: [MCP]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      parameters:
        - name: connector
          in: path
          required: true
          description: A connector id (`con_…`).
          schema:
            type: string
            pattern: "^con_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      responses:
        "200":
          description: The metadata document.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Cache-Control:
              schema:
                type: string
                const: public, max-age=3600
            Access-Control-Allow-Origin:
              schema:
                type: string
                const: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedResourceMetadata"
              example:
                resource: https://api.deedglass.com/mcp/con_01k67c04kxevyex3pjyqe0t45d
                resource_name: Deedglass Gate
                bearer_methods_supported: [header]
                scopes_supported: ["actions:execute"]
                resource_documentation: https://docs.deedglass.com/mcp/authorization
        default:
          $ref: "#/components/responses/Error"
  /.well-known/oauth-protected-resource/mcp/native:
    get:
      operationId: getNativeMCPResourceMetadata
      summary: Show the protected-resource metadata for the native MCP endpoint
      description: >-
        Public and not versioned. The RFC 9728 metadata for `/mcp/native`, at the path-inserted URL
        that the endpoint's bearer challenges name in `resource_metadata`. It never reads the
        database. `authorization_servers` is absent on purpose, as in the root document. Readable
        cross-origin and cached for an hour.
      tags: [MCP]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      responses:
        "200":
          description: The metadata document.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Cache-Control:
              schema:
                type: string
                const: public, max-age=3600
            Access-Control-Allow-Origin:
              schema:
                type: string
                const: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedResourceMetadata"
              example:
                resource: https://api.deedglass.com/mcp/native
                resource_name: Deedglass Gate
                bearer_methods_supported: [header]
                scopes_supported: ["actions:execute"]
                resource_documentation: https://docs.deedglass.com/mcp/authorization
        default:
          $ref: "#/components/responses/Error"
  /mcp/{connector}:
    post:
      operationId: mcpConnector
      summary: Send an MCP message to a connector's MCP endpoint
      description: >-
        The MCP Streamable HTTP endpoint (MCP 2026-07-28). Until the gateway ships (S15) it answers
        404 with a JSON-RPC error: `{"jsonrpc":"2.0","id":<the request id or null>,"error":{"code":-32601,"message":"The
        MCP gateway isn't enabled on this server."}}`. Without a key the answer is 401 with
        `WWW-Authenticate: Bearer realm="deedglass",
        resource_metadata="<base>/.well-known/oauth-protected-resource/mcp/<connector>",
        scope="actions:execute"`; a bad key adds `error="invalid_token"` and `error_description`. A
        key without `actions:execute` (an org admin key) gets 403 with `error="insufficient_scope"`,
        `scope` and `resource_metadata`; a stopped or suspended agent gets 403 without a Bearer
        error. A browser `Origin` other than the server's own gets 403 with a JSON-RPC error without
        an id (DNS-rebinding protection). GET and DELETE get 405 with `Allow: POST`.
        `Idempotency-Key` is ignored. An agent key with `actions:execute`.
      tags: [MCP]
      security: [{bearerAuth: []}]
      x-deedglass-auth: agent_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - name: connector
          in: path
          required: true
          description: A connector id (`con_…`).
          schema:
            type: string
            pattern: "^con_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      requestBody:
        $ref: "#/components/requestBodies/MCPMessage"
      responses:
        "403":
          $ref: "#/components/responses/MCPOriginRefused"
        "404":
          $ref: "#/components/responses/MCPNotEnabled"
        default:
          $ref: "#/components/responses/Error"
  /mcp/native:
    post:
      operationId: mcpNative
      summary: Send an MCP message to the native MCP endpoint
      description: >-
        The MCP Streamable HTTP endpoint (MCP 2026-07-28) for the Gate's native tools. Until the
        gateway ships (S15) it answers 404 with a JSON-RPC error:
        `{"jsonrpc":"2.0","id":<the request id or null>,"error":{"code":-32601,"message":"The
        MCP gateway isn't enabled on this server."}}`. Without a key the answer is 401 with
        `WWW-Authenticate: Bearer realm="deedglass",
        resource_metadata="<base>/.well-known/oauth-protected-resource/mcp/native",
        scope="actions:execute"`; a bad key adds `error="invalid_token"` and `error_description`. A
        key without `actions:execute` (an org admin key) gets 403 with `error="insufficient_scope"`,
        `scope` and `resource_metadata`; a stopped or suspended agent gets 403 without a Bearer
        error. A browser `Origin` other than the server's own gets 403 with a JSON-RPC error without
        an id (DNS-rebinding protection). GET and DELETE get 405 with `Allow: POST`.
        `Idempotency-Key` is ignored. An agent key with `actions:execute`.
      tags: [MCP]
      security: [{bearerAuth: []}]
      x-deedglass-auth: agent_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      requestBody:
        $ref: "#/components/requestBodies/MCPMessage"
      responses:
        "403":
          $ref: "#/components/responses/MCPOriginRefused"
        "404":
          $ref: "#/components/responses/MCPNotEnabled"
        default:
          $ref: "#/components/responses/Error"
  /login:
    get:
      operationId: loginPage
      summary: The sign-in page
      tags: [Pages]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      responses:
        "200":
          description: HTML, with a strict Content-Security-Policy.
          content:
            text/html:
              schema: {type: string}
        default:
          $ref: "#/components/responses/Error"
  /auth/confirm:
    get:
      operationId: confirmPage
      summary: The page a sign-in link opens
      description: >-
        The token is in the URL fragment (`#t=…`), which browsers never send to servers; the page
        shows what the link does and signs in only when the person clicks. Fetching this page uses
        nothing, so mail scanners that open links can't sign anyone in.
      tags: [Pages]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      responses:
        "200":
          description: HTML, with a strict Content-Security-Policy.
          content:
            text/html:
              schema: {type: string}
        default:
          $ref: "#/components/responses/Error"
  /app/:
    get:
      operationId: consolePage
      summary: The Console
      description: Until the Console ships, a plain page showing who is signed in.
      tags: [Pages]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      responses:
        "200":
          description: HTML.
          content:
            text/html:
              schema: {type: string}
        default:
          $ref: "#/components/responses/Error"
  /auth/assets/{file}:
    get:
      operationId: authAsset
      summary: The sign-in pages' stylesheet and script
      tags: [Pages]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      parameters:
        - {name: file, in: path, required: true, schema: {type: string, enum: [auth.css, auth.js]}}
      responses:
        "200":
          description: CSS or JavaScript.
          content:
            text/css:
              schema: {type: string}
            text/javascript:
              schema: {type: string}
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: dg_<mode>_<prefix>_<secret>
      description: >-
        An API key: `dg_live_` or `dg_test_`, an 8-character prefix, `_`, and a 32-character secret,
        all base62 (49 characters, like `dg_live_jJbEEMWk_o0Erxxf1kgtP2QjiJ79vzW31AjZqIch8`). Agent
        keys hold `actions:execute`, `actions:read` and `deeds:read` (the default) and may add
        `actions:undo`; org admin keys hold exactly `admin`. Create agent keys in Console › Agents
        and admin keys in Console › Settings. A 401 carries `WWW-Authenticate: Bearer
        realm="deedglass", error="invalid_token", error_description="…"`; a missing scope is 403
        `insufficient_scope` with `WWW-Authenticate: Bearer realm="deedglass",
        error="insufficient_scope", scope="…"`.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-deedglass_session
      description: >-
        A Console session. Requests that change state also send the `Deedglass-CSRF` header,
        matching the `__Host-deedglass_csrf` cookie.
  parameters:
    DeedglassVersion:
      name: Deedglass-Version
      in: header
      required: false
      description: >-
        The API version (YYYY-MM-DD). Leave it out to use your org's pinned version (public routes
        use the latest). An unknown version is 400 `api_version_invalid`.
      schema:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        examples: ["2026-10-01"]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        1 to 255 printable ASCII characters. A retry with the same key and body returns the stored
        response with `Deedglass-Idempotent-Replayed: true` for 24 hours.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, 1–100 (default 25).
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      required: false
      description: '`next_cursor` from the previous page, unchanged.'
      schema:
        type: string
    FromSeq:
      name: from_seq
      in: query
      required: false
      description: The first deed seq (inclusive).
      schema:
        type: integer
        minimum: 1
    ToSeq:
      name: to_seq
      in: query
      required: false
      description: The last deed seq (inclusive).
      schema:
        type: integer
        minimum: 1
    CSRF:
      name: Deedglass-CSRF
      in: header
      required: true
      description: >-
        The CSRF token from `GET /v1/me` (it equals the `__Host-deedglass_csrf` cookie). Every
        session request that changes state needs it; without it the answer is 403 `csrf_failed`.
      schema:
        type: string
    CSRFWithSession:
      name: Deedglass-CSRF
      in: header
      required: false
      description: >-
        Needed when the request uses a Console session (it changes state); without it the answer is
        403 `csrf_failed`. Not sent with an API key.
      schema:
        type: string
    AgentId:
      name: id
      in: path
      required: true
      description: The agent id (`agt_…`).
      schema:
        type: string
    KeyId:
      name: id
      in: path
      required: true
      description: The API key id (`key_…`).
      schema:
        type: string
    IntentKid:
      name: kid
      in: path
      required: true
      description: The intent key's id, 32 lowercase hex characters.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    DeedglassIntent:
      name: Deedglass-Intent
      in: header
      required: false
      description: >-
        A signed intent: base64url of the intent's JCS bytes, `.`, and base64url of the 64-byte
        Ed25519 signature. The intent follows the schema `deedglass.intent/1`; the signature input
        is `"deedglass/intent/v1\n"` followed by the `intent_hash`. Clocks may differ by up to 60 s
        either way, and an intent lives at most 5 minutes. See docs/INTENTS.md.
      schema:
        type: string
        maxLength: 4096
    DeedglassOnBehalfOf:
      name: Deedglass-On-Behalf-Of
      in: header
      required: false
      description: >-
        The end user the agent acts for, in your own ids. At most once; a malformed or repeated
        header is 422 `validation_failed`.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._~:@/+=-]{1,256}$"
    DeedglassSession:
      name: Deedglass-Session
      in: header
      required: false
      description: >-
        The conversation or session the call belongs to, in your own ids. At most once; a malformed
        or repeated header is 422 `validation_failed`.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._~:@/+=-]{1,256}$"
  headers:
    DeedglassRequestId:
      description: This request's id. Quote it to support; it matches `error.request_id`.
      schema:
        type: string
        pattern: "^req_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    DeedglassVersion:
      description: The API version this response follows.
      schema:
        type: string
    DeedglassIdempotentReplayed:
      description: Present, and `true`, when the response is a stored one replayed for an Idempotency-Key.
      schema:
        type: string
        enum: ["true"]
  responses:
    Error:
      description: An error. Every error has this envelope; `doc_url` explains the code.
      headers:
        Deedglass-Request-Id:
          $ref: "#/components/headers/DeedglassRequestId"
        Deedglass-Version:
          $ref: "#/components/headers/DeedglassVersion"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    MCPOriginRefused:
      description: >-
        A browser `Origin` other than the server's own: a JSON-RPC error without an id
        (DNS-rebinding protection). A key without `actions:execute`, or a stopped or suspended
        agent, also gets 403, with the error envelope.
      headers:
        Deedglass-Request-Id:
          $ref: "#/components/headers/DeedglassRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JSONRPCError"
    MCPNotEnabled:
      description: The MCP gateway isn't enabled on this server (until S15).
      headers:
        Deedglass-Request-Id:
          $ref: "#/components/headers/DeedglassRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JSONRPCError"
          example:
            jsonrpc: "2.0"
            id: 1
            error: {code: -32601, message: The MCP gateway isn't enabled on this server.}
  requestBodies:
    MCPMessage:
      required: true
      description: A JSON-RPC 2.0 message.
      content:
        application/json:
          schema:
            type: object
          example: {jsonrpc: "2.0", id: 1, method: tools/list}
    OptionalReason:
      required: false
      description: An optional reason. It goes into the deed and the Console; an agent never sees it.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              reason: {type: string, maxLength: 280, description: One line, at most 280 characters.}
          example: {reason: Refund loop in staging}
    RequiredReason:
      required: true
      description: Why it's safe now. It goes into the deed.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [reason]
            properties:
              reason: {type: string, minLength: 3, maxLength: 280, description: One line, 3 to 280 characters.}
          example: {reason: "Root cause fixed: refund threshold was 100x"}
  schemas:
    LoginRequest:
      type: object
      required: [object, email, expires_in, message]
      properties:
        object: {type: string, const: login_request}
        email: {type: string, description: The address, normalized.}
        expires_in: {type: integer, description: Seconds the link and code work for.}
        message: {type: string}
      examples:
        - object: login_request
          email: priya@acme.com
          expires_in: 900
          message: If priya@acme.com has a Deedglass account, a sign-in link and code are on their way.
    LoginPreview:
      type: object
      required: [object, purpose, email, org, role, invited_by, expires_at]
      properties:
        object: {type: string, const: login_preview}
        purpose: {type: string, enum: [login, invite]}
        email: {type: string}
        org:
          type: object
          required: [id, name]
          properties:
            id: {type: string}
            name: {type: string}
        role: {type: string, enum: [viewer, admin, owner]}
        invited_by:
          type: [object, "null"]
          required: [name, email]
          properties:
            name: {type: string}
            email: {type: string}
        expires_at: {type: string, format: date-time}
      examples:
        - object: login_preview
          purpose: login
          email: priya@acme.com
          org: {id: org_01k6h7kp6msmzrhdzwtcr3jnkp, name: Acme}
          role: owner
          invited_by: null
          expires_at: "2026-10-03T09:29:07.000Z"
    Me:
      type: object
      required: [object, user, org, membership, orgs, session, csrf_token]
      properties:
        object: {type: string, const: me}
        user:
          type: object
          required: [object, id, email, name, created_at]
          properties:
            object: {type: string, const: user}
            id: {type: string}
            email: {type: string}
            name: {type: string}
            created_at: {type: string, format: date-time}
        org:
          $ref: "#/components/schemas/Org"
        membership:
          type: object
          required: [object, id, role, status]
          properties:
            object: {type: string, const: membership}
            id: {type: string}
            role: {type: string, enum: [viewer, admin, owner]}
            status: {type: string}
        orgs:
          type: array
          items:
            type: object
            required: [id, name, role]
            properties:
              id: {type: string}
              name: {type: string}
              role: {type: string}
        session:
          type: object
          required: [id, idle_expires_at, expires_at]
          properties:
            id: {type: string}
            idle_expires_at: {type: string, format: date-time}
            expires_at: {type: string, format: date-time}
        csrf_token:
          type: [string, "null"]
          description: Send it back as the `Deedglass-CSRF` header on requests that change state.
      examples:
        - object: me
          user: {object: user, id: usr_01k6c9kb2zcjsyn7b8g2k1vqvp, email: priya@acme.com, name: Priya Raman, created_at: "2026-10-03T09:14:07.000Z"}
          org: {object: org, id: org_01k6h7kp6msmzrhdzwtcr3jnkp, name: Acme, slug: acme, timezone: Asia/Kolkata, status: active, created_at: "2026-10-03T09:14:07.000Z"}
          membership: {object: membership, id: mem_01k6zymkd83ftdv0mf9keseaz1, role: owner, status: active}
          orgs: [{id: org_01k6h7kp6msmzrhdzwtcr3jnkp, name: Acme, role: owner}]
          session: {id: ses_01k6ydnxs578tgcwjbknyjdh8m, idle_expires_at: "2026-10-03T21:14:07.000Z", expires_at: "2026-10-10T09:14:07.000Z"}
          csrf_token: M3q1c0Zb9xK2yV7wQ4nH8pT6rJ5sD1fG0aL3kE9uW2c
    Org:
      type: object
      required: [object, id, name, slug, timezone, status, created_at]
      properties:
        object: {type: string, const: org}
        id: {type: string}
        name: {type: string}
        slug: {type: string}
        timezone: {type: string}
        status: {type: string, enum: [active, disabled]}
        created_at: {type: string, format: date-time}
    Membership:
      type: object
      required: [object, id, org, user, role, status, invited_by, invited_at, joined_at, removed_at, created_at]
      properties:
        object: {type: string, const: membership}
        id: {type: string}
        org: {type: string}
        user:
          type: object
          required: [id, email, name]
          properties:
            id: {type: string}
            email: {type: string}
            name: {type: string}
        role: {type: string, enum: [viewer, admin, owner]}
        status: {type: string, enum: [invited, active, removed]}
        invited_by: {type: [string, "null"]}
        invited_at: {type: [string, "null"], format: date-time}
        joined_at: {type: [string, "null"], format: date-time}
        removed_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        deed: {type: string, description: The admin deed this change sealed (on changes only).}
      examples:
        - object: membership
          id: mem_01k6f6evxjk5zr0t0kntw9ehx5
          org: org_01k6h7kp6msmzrhdzwtcr3jnkp
          user: {id: usr_01k6s2anqftp0685ngz82kyz6y, email: sam@acme.com, name: ""}
          role: viewer
          status: invited
          invited_by: usr_01k6c9kb2zcjsyn7b8g2k1vqvp
          invited_at: "2026-10-03T09:20:11.000Z"
          joined_at: null
          removed_at: null
          created_at: "2026-10-03T09:20:11.000Z"
          deed: deed_01k6vrddq2atgb2023qvhhct3g
    MembershipList:
      type: object
      required: [object, data, has_more, next_cursor]
      properties:
        object: {type: string, const: list}
        data:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
    Labels:
      type: object
      maxProperties: 32
      description: >-
        At most 32. Keys match `^[a-z0-9][a-z0-9._/-]{0,62}$`; values are up to 128 printable
        characters. Policies match on labels, so every change seals a deed.
      propertyNames:
        pattern: "^[a-z0-9][a-z0-9._/-]{0,62}$"
      additionalProperties:
        type: string
        maxLength: 128
    Budgets:
      type: object
      additionalProperties: false
      description: >-
        An agent's limits; a limit left out means none. Money is in minor units (cents for usd,
        paise for inr). Deedglass stores and checks them now; the Gate enforces them when it ships.
      properties:
        calls_per_minute: {type: integer, minimum: 1, maximum: 1000000}
        calls_per_day: {type: integer, minimum: 1, maximum: 100000000}
        spend_per_day:
          type: object
          additionalProperties: false
          required: [amount, currency]
          properties:
            amount: {type: integer, minimum: 0, maximum: 9007199254740991, description: Minor units.}
            currency: {type: string, pattern: "^[a-z]{3}$", description: Lowercase ISO 4217, like usd or inr.}
      examples:
        - calls_per_minute: 60
          calls_per_day: 5000
          spend_per_day: {amount: 5000, currency: usd}
    Agent:
      type: object
      required: [object, id, name, description, labels, budgets, status, status_reason, status_changed_at, status_changed_by, owner, active_keys, last_used_at, created_at, updated_at, intent_mode]
      properties:
        object: {type: string, const: agent}
        id: {type: string, pattern: "^agt_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        name: {type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$", description: Unique in the org and immutable.}
        description: {type: string, maxLength: 500}
        labels:
          $ref: "#/components/schemas/Labels"
        budgets:
          $ref: "#/components/schemas/Budgets"
        status: {type: string, enum: [active, suspended, stopped]}
        status_reason: {type: [string, "null"], maxLength: 280}
        status_changed_at: {type: [string, "null"], format: date-time}
        status_changed_by: {type: [string, "null"], description: '`usr_…`, `key_…` or `operator`.'}
        owner: {type: [string, "null"], description: The person responsible (`usr_…`).}
        active_keys: {type: integer, minimum: 0, maximum: 10}
        last_used_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        intent_mode:
          type: string
          enum: ["off", optional, required]
          description: >-
            Signed intents (S09): off (headers ignored), optional (checked when sent) or required
            (every call needs one).
      examples:
        - object: agent
          id: agt_01k633rrmh3bcz2p39gg4vp46q
          name: support-bot
          description: Answers refund tickets in Zendesk
          labels: {env: prod, team: support}
          budgets: {calls_per_minute: 60, calls_per_day: 5000, spend_per_day: {amount: 5000, currency: usd}}
          status: active
          status_reason: null
          status_changed_at: null
          status_changed_by: null
          owner: usr_01k6c9kb2zcjsyn7b8g2k1vqvp
          active_keys: 0
          last_used_at: null
          created_at: "2026-10-03T10:02:11.000Z"
          updated_at: "2026-10-03T10:02:11.000Z"
          intent_mode: "off"
    AgentResult:
      allOf:
        - $ref: "#/components/schemas/Agent"
        - type: object
          required: [deed]
          properties:
            deed: {type: [string, "null"], description: The admin deed this change sealed; null when nothing changed.}
      examples:
        - object: agent
          id: agt_01k633rrmh3bcz2p39gg4vp46q
          name: support-bot
          description: Answers refund tickets in Zendesk
          labels: {env: prod, team: support}
          budgets: {calls_per_minute: 60, calls_per_day: 5000, spend_per_day: {amount: 5000, currency: usd}}
          status: active
          status_reason: null
          status_changed_at: null
          status_changed_by: null
          owner: usr_01k6c9kb2zcjsyn7b8g2k1vqvp
          active_keys: 0
          last_used_at: null
          created_at: "2026-10-03T10:02:11.000Z"
          updated_at: "2026-10-03T10:02:11.000Z"
          intent_mode: "off"
          deed: deed_01k6vrddq2atgb2023qvhhct3g
    AgentList:
      type: object
      required: [object, data, has_more, next_cursor]
      properties:
        object: {type: string, const: list}
        data:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
    OrgStop:
      type: object
      required: [object, org, stopped, stopped_at, stopped_by, reason, agents_affected, deed]
      description: The org's Stop all. While `stopped` is true, every agent in the org is refused with `org_stopped`.
      properties:
        object: {type: string, const: org_stop}
        org: {type: string, pattern: "^org_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        stopped: {type: boolean}
        stopped_at: {type: [string, "null"], format: date-time}
        stopped_by: {type: [string, "null"], description: '`usr_…`, `key_…` or `operator`.'}
        reason: {type: [string, "null"], maxLength: 280}
        agents_affected: {type: integer, minimum: 0}
        deed: {type: [string, "null"], description: The admin deed this change sealed; null when nothing changed.}
      examples:
        - object: org_stop
          org: org_01k6h7kp6msmzrhdzwtcr3jnkp
          stopped: true
          stopped_at: "2026-10-03T14:05:00.000Z"
          stopped_by: usr_01k6c9kb2zcjsyn7b8g2k1vqvp
          reason: Investigating unexpected refunds
          agents_affected: 7
          deed: deed_01k6vrddq2atgb2023qvhhct3g
    APIKey:
      type: object
      required: [object, id, agent, name, mode, prefix, scopes, expires_at, last_used_at, revoked_at, rolled_from, created_at]
      description: >-
        An agent key or an org admin key. The full key is `dg_<mode>_<prefix 8>_<secret 32>`, 49
        characters; it is shown once, as `secret`, when the key is created or rolled.
      properties:
        object: {type: string, const: api_key}
        id: {type: string, pattern: "^key_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        agent: {type: [string, "null"], description: The agent (`agt_…`); null for an org admin key.}
        name: {type: string, maxLength: 64}
        mode: {type: string, enum: [live, test]}
        prefix: {type: string, pattern: "^dg_(live|test)_[0-9A-Za-z]{8}$", description: 'How the key is displayed: `dg_live_jJbEEMWk_••••`.'}
        scopes:
          type: array
          items: {type: string, enum: ["actions:execute", "actions:read", "deeds:read", "actions:undo", admin]}
        expires_at: {type: [string, "null"], format: date-time, description: Set when the key was rolled.}
        last_used_at: {type: [string, "null"], format: date-time}
        revoked_at: {type: [string, "null"], format: date-time}
        rolled_from: {type: [string, "null"], description: The key this one replaced (`key_…`).}
        created_at: {type: string, format: date-time}
      examples:
        - object: api_key
          id: key_01k6jz12ptrvg2zn5vts5xc1ay
          agent: agt_01k633rrmh3bcz2p39gg4vp46q
          name: prod runner
          mode: live
          prefix: dg_live_jJbEEMWk
          scopes: ["actions:execute", "actions:read", "deeds:read"]
          expires_at: null
          last_used_at: "2026-10-03T14:01:58.512Z"
          revoked_at: null
          rolled_from: null
          created_at: "2026-10-03T10:03:40.000Z"
    APIKeyResult:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [deed]
          properties:
            secret:
              type: [string, "null"]
              pattern: "^dg_(live|test)_[0-9A-Za-z]{8}_[0-9A-Za-z]{32}$"
              description: >-
                The full key, on create and roll only, shown once. Null in an Idempotency-Key replay:
                Deedglass never stores it.
            deed: {type: [string, "null"], description: The admin deed this change sealed; null when nothing changed.}
            previous:
              type: object
              description: On roll only. The old key and when it stops working.
              required: [id, expires_at]
              properties:
                id: {type: string}
                expires_at: {type: [string, "null"], format: date-time}
      examples:
        - object: api_key
          id: key_01k6jz12ptrvg2zn5vts5xc1ay
          agent: agt_01k633rrmh3bcz2p39gg4vp46q
          name: prod runner
          mode: live
          prefix: dg_live_jJbEEMWk
          scopes: ["actions:execute", "actions:read", "deeds:read"]
          secret: dg_live_jJbEEMWk_o0Erxxf1kgtP2QjiJ79vzW31AjZqIch8
          expires_at: null
          last_used_at: null
          revoked_at: null
          rolled_from: null
          created_at: "2026-10-03T10:03:40.000Z"
          deed: deed_01k6vrddq2atgb2023qvhhct3g
    APIKeyList:
      type: object
      required: [object, data, has_more, next_cursor]
      properties:
        object: {type: string, const: list}
        data:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/APIKey"
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
    Whoami:
      type: object
      required: [object, org, agent, key, budgets]
      description: Never includes a stop reason or who stopped the agent.
      properties:
        object: {type: string, const: whoami}
        org:
          type: object
          required: [id, name, slug, stopped]
          properties:
            id: {type: string}
            name: {type: string}
            slug: {type: string}
            stopped: {type: boolean, description: True while Stop all is on.}
        agent:
          type: [object, "null"]
          description: Null for an org admin key.
          required: [id, name, status, labels]
          properties:
            id: {type: string}
            name: {type: string}
            status: {type: string, enum: [active, suspended, stopped]}
            labels:
              $ref: "#/components/schemas/Labels"
        key:
          type: object
          required: [id, prefix, mode, scopes, expires_at]
          properties:
            id: {type: string}
            prefix: {type: string}
            mode: {type: string, enum: [live, test]}
            scopes:
              type: array
              items: {type: string}
            expires_at: {type: [string, "null"], format: date-time}
        budgets:
          description: Null for an org admin key.
          anyOf:
            - $ref: "#/components/schemas/Budgets"
            - type: "null"
      examples:
        - object: whoami
          org: {id: org_01k6h7kp6msmzrhdzwtcr3jnkp, name: Acme, slug: acme, stopped: false}
          agent: {id: agt_01k633rrmh3bcz2p39gg4vp46q, name: support-bot, status: active, labels: {env: prod, team: support}}
          key: {id: key_01k6jt6tgx72gjr876976xak5e, prefix: dg_live_0IDw6L5O, mode: live, scopes: ["actions:execute", "actions:read", "deeds:read"], expires_at: null}
          budgets: {calls_per_minute: 60, calls_per_day: 5000, spend_per_day: {amount: 5000, currency: usd}}
    IntentKey:
      type: object
      required: [object, kid, agent, public_key, created_at, created_by]
      description: An Ed25519 public key an agent signs intents with. An agent has at most two.
      properties:
        object: {type: string, const: intent_key}
        kid: {type: string, pattern: "^[0-9a-f]{32}$", description: The key's id, 32 lowercase hex characters.}
        agent: {type: string, description: The agent (`agt_…`).}
        public_key: {type: string, pattern: "^ed25519:[A-Za-z0-9_-]{43}$"}
        created_at: {type: string, format: date-time}
        created_by: {type: string, description: '`usr_…`, `key_…` or `operator`.'}
        deed: {type: string, description: The admin deed this change sealed (on create only).}
      examples:
        - object: intent_key
          kid: 21fe31dfa154a261626bf854046fd227
          agent: agt_01k633rrmh3bcz2p39gg4vp46q
          public_key: ed25519:11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
          created_at: "2026-10-03T09:20:11.000Z"
          created_by: usr_01k6c9kb2zcjsyn7b8g2k1vqvp
          deed: deed_01k6vrddq2atgb2023qvhhct3g
    IntentKeyList:
      type: object
      required: [object, data, has_more, next_cursor]
      properties:
        object: {type: string, const: list}
        data:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/IntentKey"
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
    IntentKeyDeleted:
      type: object
      required: [object, kid, agent, deleted, deed]
      properties:
        object: {type: string, const: intent_key}
        kid: {type: string, pattern: "^[0-9a-f]{32}$"}
        agent: {type: string}
        deleted: {type: boolean, const: true}
        deed: {type: string, description: The admin deed this change sealed.}
      examples:
        - object: intent_key
          kid: 21fe31dfa154a261626bf854046fd227
          agent: agt_01k633rrmh3bcz2p39gg4vp46q
          deleted: true
          deed: deed_01k6vrddq2atgb2023qvhhct3g
    IntentCheck:
      type: object
      required: [object, signed, intent_hash, kid, agent, tool, args_digest, on_behalf_of, session, expires_at, nonce_consumed, intent_mode]
      description: >-
        What the Gate would see for this call. `signed` is false when no intent was sent (possible
        in `off` and `optional` mode); the intent fields are then null.
      properties:
        object: {type: string, const: intent_check}
        signed: {type: boolean}
        intent_hash: {type: [string, "null"], pattern: "^sha256:[0-9a-f]{64}$"}
        kid: {type: [string, "null"], pattern: "^[0-9a-f]{32}$"}
        agent: {type: string}
        tool: {type: string}
        args_digest: {type: string, pattern: "^sha256:[0-9a-f]{64}$", description: The SHA-256 of the arguments' JCS bytes (RFC 8785).}
        on_behalf_of: {type: [string, "null"]}
        session: {type: [string, "null"]}
        expires_at: {type: [string, "null"], format: date-time}
        nonce_consumed: {type: boolean}
        intent_mode: {type: string, enum: ["off", optional, required]}
      examples:
        - object: intent_check
          signed: true
          intent_hash: sha256:87c73e450a53f0269e33f7adb8430a6f89714606f9aae38bc732536fef7e3089
          kid: 21fe31dfa154a261626bf854046fd227
          agent: agt_01k633rrmh3bcz2p39gg4vp46q
          tool: stripe.refund
          args_digest: sha256:f7411a7cf4706333c9ba80c85aab7d8b92363ad3077a288dadc26bef42d89d36
          on_behalf_of: usr_ext_4821
          session: conv_9f2c
          expires_at: "2026-10-03T09:31:00.000Z"
          nonce_consumed: true
          intent_mode: optional
    ProtectedResourceMetadata:
      type: object
      additionalProperties: false
      required: [resource, resource_name, bearer_methods_supported, scopes_supported, resource_documentation]
      description: >-
        RFC 9728 protected-resource metadata. `authorization_servers` is absent on purpose in v1:
        Deedglass v1 takes pre-issued API keys as bearer tokens and has no authorization server to
        list; v2 adds the org's issuer.
      properties:
        resource: {type: string, description: The resource identifier (the API's base URL, or an MCP endpoint's URL).}
        resource_name: {type: string}
        bearer_methods_supported:
          type: array
          items: {type: string}
        scopes_supported:
          type: array
          items: {type: string}
        resource_documentation: {type: string, format: uri}
      examples:
        - resource: https://api.deedglass.com
          resource_name: Deedglass
          bearer_methods_supported: [header]
          scopes_supported: ["actions:execute", "actions:read", "deeds:read"]
          resource_documentation: https://docs.deedglass.com/mcp/authorization
    JSONRPCError:
      type: object
      required: [jsonrpc, error]
      description: A JSON-RPC 2.0 error response.
      properties:
        jsonrpc: {type: string, const: "2.0"}
        id: {type: [string, number, "null"]}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: integer}
            message: {type: string}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [type, code, message, param, request_id, doc_url]
          properties:
            type:
              type: string
              enum:
                - invalid_request_error
                - authentication_error
                - permission_error
                - policy_error
                - rate_limit_error
                - api_error
            code:
              type: string
              enum:
                - invalid_api_key
                - api_key_revoked
                - api_key_expired
                - agent_suspended
                - agent_stopped
                - org_stopped
                - insufficient_scope
                - policy_denied
                - approval_required
                - approval_expired
                - budget_exceeded
                - intent_required
                - intent_invalid
                - intent_replay
                - tool_unknown
                - connector_unavailable
                - upstream_error
                - timeout
                - rate_limited
                - idempotency_conflict
                - validation_failed
                - not_found
                - conflict
                - internal_error
                - authentication_required
                - method_not_allowed
                - request_too_large
                - unsupported_media_type
                - invalid_json
                - api_version_invalid
                - idempotency_key_invalid
                - idempotency_key_in_use
                - service_unavailable
                - session_expired
                - csrf_failed
                - insufficient_role
                - login_link_invalid
                - login_code_invalid
                - last_owner
            message:
              type: string
              description: One or more calm sentences with the next step.
            param:
              type: [string, "null"]
              description: The request field, query parameter or header the error is about.
            request_id:
              type: string
              pattern: "^req_[0-7][0-9a-hjkmnp-tv-z]{25}$"
            doc_url:
              type: string
              format: uri
      examples:
        - error:
            type: invalid_request_error
            code: not_found
            message: There's no endpoint at GET /v1/helth. Did you mean /v1/health?
            param: null
            request_id: req_01j9zr3m5k8q2w7x4t6v0b1c9d
            doc_url: https://docs.deedglass.com/errors/not_found
    Check:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, down, pending, mismatch, unknown, not_configured]
          description: >-
            For `seal_key`, `degraded` means the key retires within its rotation overlap (restart
            with the new key) and `down` means it is retired, revoked or unreadable.
    Health:
      type: object
      required: [object, status, version, api_version, checks, time]
      properties:
        object:
          type: string
          const: health
        status:
          type: string
          enum: [ok, degraded, down, draining]
        version:
          type: string
        api_version:
          type: string
        checks:
          type: object
          required: [database, migrations, seal_key, decoder]
          properties:
            database:
              allOf:
                - $ref: "#/components/schemas/Check"
              properties:
                latency_ms:
                  type: [integer, "null"]
                  minimum: 0
            migrations:
              allOf:
                - $ref: "#/components/schemas/Check"
              properties:
                applied:
                  type: [integer, "null"]
                  minimum: 0
                expected:
                  type: [integer, "null"]
                  minimum: 0
            seal_key:
              $ref: "#/components/schemas/Check"
            decoder:
              $ref: "#/components/schemas/Check"
        time:
          type: string
          format: date-time
      examples:
        - object: health
          status: ok
          version: 0.1.0-dev
          api_version: "2026-10-01"
          checks:
            database: {status: ok, latency_ms: 1}
            migrations: {status: ok, applied: 9, expected: 9}
            seal_key: {status: not_configured}
            decoder: {status: not_configured}
          time: "2026-10-01T09:30:00.000Z"
    Digest:
      type: string
      pattern: "^sha256:[0-9a-f]{64}$"
      description: '"sha256:" + lowercase hex of SHA-256.'
    DeedTime:
      type: string
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[.][0-9]{3}Z$"
      description: RFC 3339, UTC, exactly three fractional digits.
    SealKey:
      type: object
      additionalProperties: false
      required: [object, id, alg, public_key, thumbprint, status, activated_at, retired_at, revoked_at, jwk]
      properties:
        object:
          type: string
          const: seal_key
        id:
          type: string
          pattern: "^sk_[0-7][0-9a-hjkmnp-tv-z]{25}$"
        alg:
          type: string
          const: Ed25519
        public_key:
          type: string
          description: The raw 32-byte Ed25519 public key, base64url without padding.
        thumbprint:
          $ref: "#/components/schemas/Digest"
        status:
          type: string
          enum: [active, retired, revoked]
        activated_at:
          $ref: "#/components/schemas/DeedTime"
        retired_at:
          type: [string, "null"]
          description: Deeds issued at or after this time are not valid under the key.
        revoked_at:
          type: [string, "null"]
          description: When set, every deed this key sealed fails verification.
        jwk:
          type: object
          additionalProperties: false
          required: [kty, crv, x, kid, use]
          description: The same key as an RFC 8037 JWK, without `alg`.
          properties:
            kty: {type: string, const: OKP}
            crv: {type: string, const: Ed25519}
            x: {type: string}
            kid: {type: string}
            use: {type: string, const: sig}
    SealKeySet:
      type: object
      additionalProperties: false
      required: [object, issuer, updated_at, keys]
      properties:
        object:
          type: string
          const: seal_key_set
        issuer:
          type: string
          format: uri
          description: This deployment's base URL.
        updated_at:
          $ref: "#/components/schemas/DeedTime"
        keys:
          type: array
          items:
            $ref: "#/components/schemas/SealKey"
      examples:
        - object: seal_key_set
          issuer: http://127.0.0.1:8080
          updated_at: "2026-10-02T09:17:14.000Z"
          keys:
            - object: seal_key
              id: sk_01j9zr8k2m4p6r8t0v2x4z6b8d
              alg: Ed25519
              public_key: pEzUz7QOOPD171uzsw5ASsNYKkd5Uq4K9zc4PQUk2e8
              thumbprint: sha256:f6b1d24a4efdc39230905e0c217093f4d1d5e301ac52c9e763a773e864d93f33
              status: active
              activated_at: "2026-10-02T09:17:14.000Z"
              retired_at: null
              revoked_at: null
              jwk: {kty: OKP, crv: Ed25519, x: pEzUz7QOOPD171uzsw5ASsNYKkd5Uq4K9zc4PQUk2e8, kid: sk_01j9zr8k2m4p6r8t0v2x4z6b8d, use: sig}
    Deed:
      type: object
      additionalProperties: false
      required: [object, id, body, body_hash, seal, seal_key_id]
      description: >-
        A sealed deed (docs/DEED_SPEC.md). The stored and exported form is the RFC 8785 canonical
        JSON of this object. `seal` is Ed25519 over the bytes "deedglass/deed/v1\n" + `body_hash`.
      properties:
        object:
          type: string
          const: deed
        id:
          type: string
          pattern: "^deed_[0-7][0-9a-hjkmnp-tv-z]{25}$"
          description: Equal to `body.deed_id` (not signed; verifiers check it).
        body:
          $ref: "#/components/schemas/DeedBody"
        body_hash:
          $ref: "#/components/schemas/Digest"
        seal:
          type: string
          pattern: "^ed25519:[A-Za-z0-9_-]{86}$"
        seal_key_id:
          type: string
          pattern: "^sk_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    DeedBody:
      type: object
      additionalProperties: false
      description: >-
        Deed v1. Every key is always present; which sections are null depends on `kind`
        (docs/DEED_SPEC.md §5). Digests only, never payloads.
      required: [v, kind, deed_id, org, seq, prev_hash, issued_at, agent, on_behalf_of, session, action, policy, approval, execution, witness, cost, admin, amends, seal_key_id]
      properties:
        v: {type: integer, const: 1}
        kind: {type: string, enum: [action, admin, amendment]}
        deed_id: {type: string, pattern: "^deed_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        org: {type: string, pattern: "^org_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        seq: {type: integer, minimum: 1, maximum: 9007199254740991}
        prev_hash: {$ref: "#/components/schemas/Digest"}
        issued_at: {$ref: "#/components/schemas/DeedTime"}
        agent:
          type: [object, "null"]
          additionalProperties: false
          required: [id, name]
          properties:
            id: {type: string}
            name: {type: string, maxLength: 64}
        on_behalf_of: {type: [string, "null"], maxLength: 256}
        session: {type: [string, "null"], maxLength: 256}
        action:
          type: [object, "null"]
          additionalProperties: false
          required: [id, tool, connector, mode, request_digest, intent_hash, intent_signed]
          properties:
            id: {type: string}
            tool: {type: string}
            connector: {type: [string, "null"]}
            mode: {type: string, enum: [gateway, proxy]}
            request_digest: {$ref: "#/components/schemas/Digest"}
            intent_hash: {type: [string, "null"]}
            intent_signed: {type: boolean}
        policy:
          type: [object, "null"]
          additionalProperties: false
          required: [id, version_id, version_hash, mode, decision, rule_id]
          properties:
            id: {type: [string, "null"]}
            version_id: {type: [string, "null"]}
            version_hash: {type: [string, "null"]}
            mode: {type: string, enum: [enforce, shadow]}
            decision: {type: string, enum: [allow, deny, require_approval]}
            rule_id: {type: [string, "null"]}
        approval:
          type: [object, "null"]
          additionalProperties: false
          required: [id, outcome, decided_by, decided_at, deed]
          properties:
            id: {type: string}
            outcome: {type: string, enum: [approved, denied, expired, cancelled]}
            decided_by: {type: array, items: {type: string}}
            decided_at: {type: [string, "null"]}
            deed: {type: [string, "null"]}
        execution:
          type: [object, "null"]
          additionalProperties: false
          required: [status, started_at, finished_at, latency_ms, result_digest, error_code]
          properties:
            status: {type: string, enum: [succeeded, failed, unknown]}
            started_at: {$ref: "#/components/schemas/DeedTime"}
            finished_at: {$ref: "#/components/schemas/DeedTime"}
            latency_ms: {type: integer, minimum: 0}
            result_digest: {type: [string, "null"]}
            error_code: {type: [string, "null"]}
        witness:
          type: [object, "null"]
          additionalProperties: false
          required: [level, verdict, method, detail_digest]
          properties:
            level: {type: string, enum: [L0, L1, L2]}
            verdict: {type: string, enum: [VERIFIED, MISMATCH, UNVERIFIABLE]}
            method: {type: string}
            detail_digest: {type: [string, "null"]}
        cost:
          type: [object, "null"]
          additionalProperties: false
          required: [amount, currency]
          properties:
            amount: {type: integer, minimum: 0}
            currency: {type: string, pattern: "^[a-z]{3}$"}
        admin:
          type: [object, "null"]
          additionalProperties: false
          required: [event, action, actor, target, reason, data_digest]
          properties:
            event: {type: string}
            action: {type: string}
            actor:
              type: object
              required: [type, id]
              properties:
                type: {type: string}
                id: {type: string}
            target:
              type: [object, "null"]
              required: [type, id]
              properties:
                type: {type: string}
                id: {type: string}
            reason: {type: [string, "null"], maxLength: 280}
            data_digest: {type: [string, "null"]}
        amends: {type: [string, "null"]}
        seal_key_id: {type: string}
    NullableTime:
      type: [string, "null"]
      format: date-time
    Action:
      type: object
      required: [object, id, created_at, agent, tool, connector, mode, state, on_behalf_of, session, policy, execution, witness, cost, request_digest, result_digest, payload_pruned_at, deed]
      description: One agent action. Its sections mirror the deed's.
      properties:
        object: {type: string, const: action}
        id: {type: string, pattern: "^act_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        created_at: {type: string, format: date-time}
        agent:
          type: object
          required: [id, name]
          properties:
            id: {type: string}
            name: {type: string}
        tool: {type: string}
        connector: {type: [string, "null"]}
        mode: {type: string, enum: [gateway, proxy]}
        state:
          type: string
          enum: [received, authenticated, evaluated, denied, pending_approval, executing, executed, failed, witnessing, verified, mismatch, unverifiable, sealed, expired, cancelled]
        on_behalf_of: {type: [string, "null"]}
        session: {type: [string, "null"]}
        policy:
          type: object
          required: [id, version_id, mode, decision, rule_id]
          properties:
            id: {type: [string, "null"]}
            version_id: {type: [string, "null"]}
            mode: {type: string, enum: [enforce, shadow]}
            decision: {type: [string, "null"], enum: [allow, deny, require_approval, null]}
            rule_id: {type: [string, "null"]}
        execution:
          type: [object, "null"]
          required: [status, started_at, finished_at, latency_ms, error_code]
          properties:
            status: {type: [string, "null"], enum: [succeeded, failed, unknown, null]}
            started_at: {$ref: "#/components/schemas/NullableTime"}
            finished_at: {$ref: "#/components/schemas/NullableTime"}
            latency_ms: {type: [integer, "null"], minimum: 0}
            error_code: {type: [string, "null"]}
        witness:
          type: [object, "null"]
          required: [level, verdict, method]
          properties:
            level: {type: string, enum: [L0, L1, L2]}
            verdict: {type: string, enum: [VERIFIED, MISMATCH, UNVERIFIABLE]}
            method: {type: [string, "null"]}
        cost:
          type: [object, "null"]
          required: [amount, currency]
          properties:
            amount: {type: integer, minimum: 0}
            currency: {type: string, pattern: "^[a-z]{3}$"}
        request_digest: {$ref: "#/components/schemas/Digest"}
        result_digest: {type: [string, "null"]}
        payload_pruned_at: {$ref: "#/components/schemas/NullableTime"}
        deed: {type: [string, "null"]}
      examples:
        - object: action
          id: act_01j9zt3a5c7e9g1j3m5p7r9t1v
          created_at: "2026-10-02T10:14:03.401Z"
          agent: {id: agt_01j9z9b1d3f5h7k9m1p3r5t7v9, name: support-bot}
          tool: postgres.execute
          connector: null
          mode: gateway
          state: sealed
          on_behalf_of: u_4821
          session: chat_77
          policy: {id: null, version_id: null, mode: enforce, decision: allow, rule_id: allow-order-updates}
          execution: {status: succeeded, started_at: "2026-10-02T10:14:03.455Z", finished_at: "2026-10-02T10:14:03.496Z", latency_ms: 41, error_code: null}
          witness: {level: L2, verdict: MISMATCH, method: postgres.pgoutput}
          cost: null
          request_digest: sha256:9c1e5b7d0a2f4c6e8b0d2f4a6c8e0b2d4f6a8c0e2b4d6f8a0c2e4b6d8f0a2c4e
          result_digest: null
          payload_pruned_at: null
          deed: deed_01j9zt3q5s7v9w1y3a5c7e9g1j
    ActionList:
      type: object
      required: [object, data, has_more, next_cursor]
      properties:
        object: {type: string, const: list}
        data:
          type: array
          items:
            $ref: "#/components/schemas/Action"
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
    ActionEvent:
      type: object
      required: [object, id, seq, from, to, at, actor, data]
      properties:
        object: {type: string, const: action_event}
        id: {type: string, pattern: "^evt_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        seq: {type: integer, minimum: 1}
        from: {type: [string, "null"]}
        to: {type: string}
        at: {type: string, format: date-time}
        actor: {type: string, description: '`system`, `agt_…` or `usr_…`.'}
        data:
          type: object
          description: Short codes and digests (reason, rule_id, error_code, level, verdict, approval_id, detail_digest); never payloads.
    ActionDetail:
      allOf:
        - $ref: "#/components/schemas/Action"
      type: object
      required: [request, result, events, deeds, approval]
      properties:
        witness:
          type: [object, "null"]
          required: [level, verdict, method, detail]
          properties:
            detail:
              description: The stored expected-vs-observed diff, or null after pruning.
        request:
          description: The tool arguments, or null after pruning.
        result:
          description: The tool result, or null after pruning.
        events:
          type: object
          required: [object, data, has_more, next_cursor]
          properties:
            object: {type: string, const: list}
            data:
              type: array
              maxItems: 200
              items:
                $ref: "#/components/schemas/ActionEvent"
            has_more: {type: boolean}
            next_cursor: {type: "null"}
        deeds:
          type: array
          items:
            type: object
            required: [id, kind, seq, issued_at]
            properties:
              id: {type: string}
              kind: {type: string, enum: [action, amendment]}
              seq: {type: integer, minimum: 1}
              issued_at: {type: string, format: date-time}
        approval:
          type: "null"
          description: The approval (S22); null until approvals ship.
    DeedList:
      type: object
      required: [object, data, has_more, next_cursor]
      properties:
        object: {type: string, const: list}
        data:
          type: array
          items:
            $ref: "#/components/schemas/Deed"
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
    LedgerCheck:
      type: object
      required: [object, org, status, checked, first_seq, last_seq, anchor, head, seal_keys, break, next_from_seq, duration_ms, checked_at]
      properties:
        object: {type: string, const: ledger_check}
        org: {type: string}
        status: {type: string, enum: [intact, broken, incomplete]}
        checked: {type: integer, minimum: 0}
        first_seq: {type: [integer, "null"]}
        last_seq: {type: [integer, "null"]}
        anchor:
          type: object
          required: [kind, seq, body_hash]
