  /v1/policies:
    get:
      operationId: listPolicies
      summary: List policies
      description: >-
        The org's policies, oldest first, each with its status and the versions that are enforced
        or in shadow. Unknown parameters are refused. A Console session (viewer and up) or an org
        admin key (`admin` scope); agent keys get 403 `insufficient_scope` ("Agents cannot read or
        test policies. Use the Console or an admin key.").
      tags: [Policies]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of policies.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createPolicy
      summary: Create a policy from its YAML
      description: >-
        201. Compiles the source and saves the policy with its first version, which is not active
        until you activate it. The policy's name comes from the YAML. Nothing is sealed: the
        immutable version (author, time, `source_hash`, `version_hash`) is the record, and deeds
        are for changes that take effect. A source that doesn't compile is 400 `policy_invalid`
        with `diagnostics`, each with its line, code and hint. A name the org already uses is 409
        `conflict` (push a new version to it instead). Bodies up to 1 MiB; the source itself up to
        256 KiB. An admin+ Console session (with the `Deedglass-CSRF` header) or an org admin key;
        agent keys get 403 `insufficient_scope` ("Agents cannot read or test policies. Use the
        Console or an admin key.").
      tags: [Policies]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/PolicySource"
      responses:
        "201":
          description: The policy, with its first version.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyCreated"
        "400":
          description: >-
            The source wasn't accepted (`policy_invalid`, with `diagnostics`), or a field isn't
            valid (`validation_failed`).
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                policy_invalid:
                  summary: A rule has no reason
                  value:
                    error:
                      type: invalid_request_error
                      code: policy_invalid
                      message: The policy wasn't accepted. The diagnostics list each problem with its line and a hint.
                      param: source
                      request_id: req_01j9zr3m5k8q2w7x4t6v0b1c9d
                      doc_url: https://docs.deedglass.com/errors/policy_invalid
                      diagnostics:
                        - object: policy_diagnostic
                          severity: error
                          code: reason_missing
                          message: Rule "block-destructive-sql" denies but has no reason.
                          hint: Write the one sentence the agent will see, like "Destructive SQL never runs for agents."
                          line: 43
                          column: 15
                          rule_id: block-destructive-sql
                          path: rules[2]
                          doc_url: https://docs.deedglass.com/policies/errors/reason_missing
        default:
          $ref: "#/components/responses/Error"
  /v1/policies/active:
    get:
      operationId: getActivePolicies
      summary: Show the enforced and shadow policies
      description: >-
        The org's live activations: the version that decides (`enforce`) and the version recorded
        alongside it (`shadow`), each null when there is none. A Console session (viewer and up) or
        an org admin key (`admin` scope); agent keys get 403 `insufficient_scope` ("Agents cannot
        read or test policies. Use the Console or an admin key.").
      tags: [Policies]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      responses:
        "200":
          description: The active set.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
