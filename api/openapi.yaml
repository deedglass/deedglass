                        "created_at": "2026-10-04T06:59:05.192752Z", "updated_at": "2026-10-04T06:59:05.192752Z"},
                       {"object": "anomaly", "id": "anm_01m42vb27n2m625kwsjpjaqam7", "agent": {"id": "agt_01m42v9q429q2mprzr6xakrx42", "name": "ops-agent"},
                        "kind": "mismatch_spike", "tool": null, "severity": "high", "score": 3,
                        "title": "3 MISMATCH verdicts, 11:00 to 12:00 IST · usually 0", "status": "open", "active": false,
                        "active_until": "2026-10-02T07:30:00Z", "window": {"start": "2026-10-02T05:30:00Z", "end": "2026-10-02T06:30:00Z"}, "occurrences": 1,
