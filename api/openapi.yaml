    Check:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, down, pending, mismatch, unknown, not_configured]
          description: >-
            For `seal_key`, `degraded` means the key retires within its rotation overlap (restart
            with the new key) and `down` means it is retired, revoked or unreadable.
    Health:
      type: object
      required: [object, status, version, api_version, checks, time]
      properties:
        object:
          type: string
          const: health
        status:
          type: string
          enum: [ok, degraded, down, draining]
        version:
          type: string
        api_version:
          type: string
        checks:
          type: object
          required: [database, migrations, seal_key, decoder]
          properties:
            database:
              allOf:
                - $ref: "#/components/schemas/Check"
              properties:
                latency_ms:
                  type: [integer, "null"]
                  minimum: 0
            migrations:
              allOf:
                - $ref: "#/components/schemas/Check"
              properties:
                applied:
                  type: [integer, "null"]
                  minimum: 0
                expected:
                  type: [integer, "null"]
                  minimum: 0
            seal_key:
              $ref: "#/components/schemas/Check"
            decoder:
              $ref: "#/components/schemas/Check"
            policies:
              allOf:
                - $ref: "#/components/schemas/Check"
              description: >-
                `ok`, `degraded` when an org's policy failed its load checks (its actions are
                denied), or `not_configured`.
            insights:
              allOf:
                - $ref: "#/components/schemas/Check"
              description: >-
                Anomaly detection on this instance (S27): `ok`, `degraded` when its last pass
                failed or is late, or `not_configured`.
        time:
          type: string
          format: date-time
      examples:
        - object: health
          status: ok
          version: 0.2.1
          api_version: "2026-10-01"
          checks:
            database: {status: ok, latency_ms: 1}
            migrations: {status: ok, applied: 9, expected: 9}
            seal_key: {status: not_configured}
            decoder: {status: not_configured}
            policies: {status: ok}
            insights: {status: ok}
          time: "2026-10-01T09:30:00.000Z"
    Digest:
      type: string
      pattern: "^sha256:[0-9a-f]{64}$"
      description: '"sha256:" + lowercase hex of SHA-256.'
    DeedTime:
      type: string
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[.][0-9]{3}Z$"
      description: RFC 3339, UTC, exactly three fractional digits.
    SealKey:
      type: object
      additionalProperties: false
      required: [object, id, alg, public_key, thumbprint, status, activated_at, retired_at, revoked_at, jwk]
      properties:
        object:
          type: string
          const: seal_key
        id:
          type: string
          pattern: "^sk_[0-7][0-9a-hjkmnp-tv-z]{25}$"
        alg:
          type: string
          const: Ed25519
        public_key:
          type: string
          description: The raw 32-byte Ed25519 public key, base64url without padding.
        thumbprint:
          $ref: "#/components/schemas/Digest"
        status:
          type: string
          enum: [active, retired, revoked]
        activated_at:
          $ref: "#/components/schemas/DeedTime"
        retired_at:
          type: [string, "null"]
          description: Deeds issued at or after this time are not valid under the key.
        revoked_at:
          type: [string, "null"]
          description: When set, every deed this key sealed fails verification.
        jwk:
          type: object
          additionalProperties: false
          required: [kty, crv, x, kid, use]
          description: The same key as an RFC 8037 JWK, without `alg`.
          properties:
            kty: {type: string, const: OKP}
            crv: {type: string, const: Ed25519}
            x: {type: string}
            kid: {type: string}
            use: {type: string, const: sig}
    SealKeySet:
      type: object
      additionalProperties: false
      required: [object, issuer, updated_at, keys]
      properties:
        object:
          type: string
          const: seal_key_set
        issuer:
          type: string
          format: uri
          description: This deployment's base URL.
        updated_at:
          $ref: "#/components/schemas/DeedTime"
        keys:
          type: array
          items:
            $ref: "#/components/schemas/SealKey"
      examples:
        - object: seal_key_set
          issuer: http://127.0.0.1:8080
          updated_at: "2026-10-02T09:17:14.000Z"
          keys:
            - object: seal_key
              id: sk_01j9zr8k2m4p6r8t0v2x4z6b8d
              alg: Ed25519
              public_key: pEzUz7QOOPD171uzsw5ASsNYKkd5Uq4K9zc4PQUk2e8
              thumbprint: sha256:f6b1d24a4efdc39230905e0c217093f4d1d5e301ac52c9e763a773e864d93f33
              status: active
              activated_at: "2026-10-02T09:17:14.000Z"
              retired_at: null
              revoked_at: null
              jwk: {kty: OKP, crv: Ed25519, x: pEzUz7QOOPD171uzsw5ASsNYKkd5Uq4K9zc4PQUk2e8, kid: sk_01j9zr8k2m4p6r8t0v2x4z6b8d, use: sig}
    Deed:
      type: object
      additionalProperties: false
      required: [object, id, body, body_hash, seal, seal_key_id]
      description: >-
        A sealed deed (docs/DEED_SPEC.md). The stored and exported form is the RFC 8785 canonical
        JSON of this object. `seal` is Ed25519 over the bytes "deedglass/deed/v1\n" + `body_hash`.
      properties:
        object:
          type: string
          const: deed
        id:
          type: string
          pattern: "^deed_[0-7][0-9a-hjkmnp-tv-z]{25}$"
          description: Equal to `body.deed_id` (not signed; verifiers check it).
        body:
          $ref: "#/components/schemas/DeedBody"
        body_hash:
          $ref: "#/components/schemas/Digest"
        seal:
          type: string
          pattern: "^ed25519:[A-Za-z0-9_-]{86}$"
        seal_key_id:
          type: string
          pattern: "^sk_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    DeedBody:
      type: object
      additionalProperties: false
      description: >-
        Deed v1. Every key is always present; which sections are null depends on `kind`
        (docs/DEED_SPEC.md §5). Digests only, never payloads.
      required: [v, kind, deed_id, org, seq, prev_hash, issued_at, agent, on_behalf_of, session, action, policy, approval, execution, witness, cost, admin, amends, seal_key_id]
      properties:
        v: {type: integer, const: 1}
        kind: {type: string, enum: [action, admin, amendment]}
        deed_id: {type: string, pattern: "^deed_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        org: {type: string, pattern: "^org_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        seq: {type: integer, minimum: 1, maximum: 9007199254740991}
        prev_hash: {$ref: "#/components/schemas/Digest"}
        issued_at: {$ref: "#/components/schemas/DeedTime"}
        agent:
          type: [object, "null"]
          additionalProperties: false
          required: [id, name]
          properties:
            id: {type: string}
            name: {type: string, maxLength: 64}
        on_behalf_of: {type: [string, "null"], maxLength: 256}
        session: {type: [string, "null"], maxLength: 256}
        action:
          type: [object, "null"]
          additionalProperties: false
          required: [id, tool, connector, mode, request_digest, intent_hash, intent_signed]
          properties:
            id: {type: string}
            tool: {type: string}
            connector: {type: [string, "null"]}
            mode: {type: string, enum: [gateway, proxy]}
            request_digest: {$ref: "#/components/schemas/Digest"}
            intent_hash: {type: [string, "null"]}
            intent_signed: {type: boolean}
        policy:
          type: [object, "null"]
          additionalProperties: false
          required: [id, version_id, version_hash, mode, decision, rule_id]
          properties:
            id: {type: [string, "null"]}
            version_id: {type: [string, "null"]}
            version_hash: {type: [string, "null"]}
            mode: {type: string, enum: [enforce, shadow]}
            decision: {type: string, enum: [allow, deny, require_approval]}
            rule_id: {type: [string, "null"]}
        approval:
          type: [object, "null"]
          additionalProperties: false
          required: [id, outcome, decided_by, decided_at, deed]
          properties:
            id: {type: string}
            outcome: {type: string, enum: [approved, denied, expired, cancelled]}
            decided_by: {type: array, items: {type: string}}
            decided_at: {type: [string, "null"]}
            deed: {type: [string, "null"]}
        execution:
          type: [object, "null"]
          additionalProperties: false
          required: [status, started_at, finished_at, latency_ms, result_digest, error_code]
          properties:
            status: {type: string, enum: [succeeded, failed, unknown]}
            started_at: {$ref: "#/components/schemas/DeedTime"}
            finished_at: {$ref: "#/components/schemas/DeedTime"}
            latency_ms: {type: integer, minimum: 0}
            result_digest: {type: [string, "null"]}
            error_code: {type: [string, "null"]}
        witness:
          type: [object, "null"]
          additionalProperties: false
          required: [level, verdict, method, detail_digest]
          properties:
            level: {type: string, enum: [L0, L1, L2]}
            verdict: {type: string, enum: [VERIFIED, MISMATCH, UNVERIFIABLE]}
            method: {type: string}
            detail_digest: {type: [string, "null"]}
        cost:
          type: [object, "null"]
          additionalProperties: false
          required: [amount, currency]
          properties:
            amount: {type: integer, minimum: 0}
            currency: {type: string, pattern: "^[a-z]{3}$"}
        admin:
          type: [object, "null"]
          additionalProperties: false
          required: [event, action, actor, target, reason, data_digest]
          properties:
            event: {type: string}
            action: {type: string}
            actor:
              type: object
              required: [type, id]
              properties:
                type: {type: string}
                id: {type: string}
            target:
              type: [object, "null"]
              required: [type, id]
              properties:
                type: {type: string}
                id: {type: string}
            reason: {type: [string, "null"], maxLength: 280}
            data_digest: {type: [string, "null"]}
        amends: {type: [string, "null"]}
        seal_key_id: {type: string}
    NullableTime:
      type: [string, "null"]
      format: date-time
    Action:
      type: object
      required: [object, id, created_at, agent, tool, connector, mode, state, on_behalf_of, session, policy, execution, witness, cost, request_digest, result_digest, payload_pruned_at, deed, livemode, status, decision, approval, next_action]
      description: >-
        One agent action. Its sections mirror the deed's. `status` is the one field an agent
        needs; `state` is the exact lifecycle state (docs/GATE.md). The Gate's own responses
        (`POST /v1/actions` and its result report) add `execution.result` and `witness.reasons`;
        lists leave both out.
      properties:
        object: {type: string, const: action}
        id: {type: string, pattern: "^act_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        created_at: {type: string, format: date-time}
        livemode: {type: boolean, description: '`true` for a `dg_live_` key, `false` for a `dg_test_` key. Recorded, not enforced: connectors have no test mode in v1.'}
        agent:
          type: object
          required: [id, name]
          properties:
            id: {type: string}
            name: {type: string}
        tool: {type: string}
        connector: {type: [string, "null"]}
        mode: {type: string, enum: [gateway, proxy]}
        state:
          type: string
          enum: [received, authenticated, evaluated, denied, pending_approval, executing, executed, failed, witnessing, verified, mismatch, unverifiable, sealed, expired, cancelled]
        status:
          type: string
          enum: [processing, authorized, pending_approval, denied, executed, failed, expired, cancelled]
          description: >-
            `executed`: the tool ran and the action is sealed, whatever the verdict. `failed`: the
            tool certainly didn't apply the call. `authorized`: proxy mode, run the tool at the
            edge now. `processing`: still executing or witnessing. `pending_approval`: waiting for
            a person. `denied`: a policy, a budget or Stop refused it, and nothing ran. `expired`
            and `cancelled`: it waited for approval and never ran. A sealed action keeps the
            status of the state it was sealed from.
        on_behalf_of: {type: [string, "null"]}
        session: {type: [string, "null"]}
        undo:
          $ref: "#/components/schemas/ActionUndo"
        schedule:
          $ref: "#/components/schemas/ActionSchedule"
        decision:
          $ref: "#/components/schemas/ActionDecision"
        policy:
          type: object
          required: [id, version_id, mode, decision, rule_id]
          properties:
            id: {type: [string, "null"]}
            version_id: {type: [string, "null"]}
            mode: {type: string, enum: [enforce, shadow]}
            decision: {type: [string, "null"], enum: [allow, deny, require_approval, null]}
            rule_id: {type: [string, "null"]}
        approval:
          $ref: "#/components/schemas/ActionApproval"
        execution:
          type: [object, "null"]
          required: [status, started_at, finished_at, latency_ms, error_code]
          properties:
            status: {type: [string, "null"], enum: [succeeded, failed, unknown, null]}
            started_at: {$ref: "#/components/schemas/NullableTime"}
            finished_at: {$ref: "#/components/schemas/NullableTime"}
            latency_ms: {type: [integer, "null"], minimum: 0}
            error_code: {type: [string, "null"]}
            error_message: {type: [string, "null"], maxLength: 1024, description: 'A short, redacted message from the tool or the Gate (at most 1 KiB).'}
            result:
              description: >-
                The tool's result. Only on the Gate's own responses (`POST /v1/actions` and
                `POST /v1/actions/{id}/result`); never on lists. `GET /v1/actions/{id}` has it as
                the top-level `result`.
        witness:
          $ref: "#/components/schemas/Witness"
        cost:
          type: [object, "null"]
          required: [amount, currency]
          properties:
            amount: {type: integer, minimum: 0}
            currency: {type: string, pattern: "^[a-z]{3}$"}
        request_digest: {$ref: "#/components/schemas/Digest"}
        result_digest: {type: [string, "null"]}
        payload_pruned_at: {$ref: "#/components/schemas/NullableTime"}
        deed: {type: [string, "null"]}
        next_action:
          $ref: "#/components/schemas/NextAction"
      examples:
        - object: action
          id: act_01j9zt3a5c7e9g1j3m5p7r9t1v
          created_at: "2026-10-02T10:14:03.401Z"
          livemode: true
          agent: {id: agt_01j9z9b1d3f5h7k9m1p3r5t7v9, name: support-bot}
          tool: postgres.execute
          connector: null
          mode: gateway
          state: sealed
          status: executed
          on_behalf_of: u_4821
          session: chat_77
          decision: {outcome: allow, code: null, source: rule, rule_id: allow-order-updates, reason: Order updates are allowed., message: null, policy: null, policy_version: null, shadow: null}
          policy: {id: null, version_id: null, mode: enforce, decision: allow, rule_id: allow-order-updates}
          approval: null
          execution: {status: succeeded, started_at: "2026-10-02T10:14:03.455Z", finished_at: "2026-10-02T10:14:03.496Z", latency_ms: 41, error_code: null, error_message: null}
          witness: {object: witness, level: L2, verdict: MISMATCH, method: postgres.pgoutput, required_level: L0, detail_digest: "sha256:c3e1a07e5d1c9b20c3e1a07e5d1c9b20c3e1a07e5d1c9b20c3e1a07e5d1c9b20"}
          cost: null
          request_digest: sha256:9c1e5b7d0a2f4c6e8b0d2f4a6c8e0b2d4f6a8c0e2b4d6f8a0c2e4b6d8f0a2c4e
          result_digest: null
          payload_pruned_at: null
          deed: deed_01j9zt3q5s7v9w1y3a5c7e9g1j
          next_action: null
    Witness:
      type: [object, "null"]
      description: >-
        The Witness's verdict about the action (S19): one level, one verdict and the method of that
        level. A verdict is never stronger than its evidence: VERIFIED needs a clean level at or
        above `required_level`; any contradicting evidence is MISMATCH; missing evidence is
        UNVERIFIABLE. Lists carry the claim only. The Gate's own responses and `GET
        /v1/actions/{id}` add `summary`, `reasons` (violations and gaps; passes and notes are in
        the detail) and `witnessed_at`; `?expand[]=witness.detail` adds `detail`. An executed
        action answers 200 whatever the verdict: the tool ran, and the verdict says what that means.
      required: [object, level, verdict, method, required_level, detail_digest]
      properties:
        object: {type: string, const: witness}
        level: {type: string, enum: [L0, L1, L2]}
        verdict: {type: string, enum: [VERIFIED, MISMATCH, UNVERIFIABLE]}
        method:
          type: [string, "null"]
          description: >-
            The claimed level's method: `reported`, `edge_reported` or `response.schema` (L0);
            `readback.<connector type>.<read tool>`, `readback.postgres.row` or
            `postcondition.<connector type>` (L1); `postgres.pgoutput` (L2).
        required_level: {type: [string, "null"], enum: [L0, L1, L2, null], description: 'The level the policy''s `verify:` asks for (null on actions recorded before S19).'}
        summary: {type: string, description: One sentence a support engineer can read aloud.}
        reasons:
          type: array
          items: {$ref: "#/components/schemas/WitnessReason"}
        witnessed_at: {type: string, format: date-time}
        detail_digest: {type: [string, "null"], description: '`sha256:` of JCS(witness_detail): the deed''s `witness.detail_digest`.'}
        detail: {$ref: "#/components/schemas/WitnessDetail"}
        history:
          type: array
          description: >-
            `GET /v1/actions/{id}` only (S21): every witness section sealed about the action, oldest
            first: the action deed, then any amendment deeds (a later verdict never edits a deed;
            at most three amendments). An entry a later amendment replaced names the reason it
            stopped where it did (`l2_timeout`, …).
          items:
            type: object
            required: [deed, kind, level, verdict, at]
            properties:
              deed: {type: string, pattern: "^deed_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
              kind: {type: string, enum: [action, amendment]}
              level: {type: string, enum: [L0, L1, L2]}
              verdict: {type: string, enum: [VERIFIED, MISMATCH, UNVERIFIABLE]}
              at: {type: string, format: date-time}
              reason: {type: string}
      examples:
        - object: witness
          level: L1
          verdict: MISMATCH
          method: readback.rest.get
          required_level: L1
          summary: 'orders.update_status reported success, but orders.get says status is "pending", not "shipped".'
          reasons:
            - code: postcondition_failed
              class: violation
              level: L1
              check: readback.expect
              message: 'orders.update_status reported success, but orders.get says status is "pending", not "shipped".'
              diff: [{path: body.status, expected: shipped, observed: pending}]
          witnessed_at: "2026-10-07T04:41:22.418Z"
          detail_digest: "sha256:c3e1a07e5d1c9b20c3e1a07e5d1c9b20c3e1a07e5d1c9b20c3e1a07e5d1c9b20"
    WitnessReason:
      type: object
      description: One piece of evidence, or one missing piece. The class and the message come from the reason catalog (docs/witness/REASONS.md).
      required: [code, class, level, check, message]
      properties:
        code: {type: string, pattern: "^[a-z][a-z0-9_]{0,63}$"}
        class: {type: string, enum: [pass, violation, gap, note]}
        level: {type: string, enum: [L0, L1, L2]}
        check: {type: string}
        message: {type: string, maxLength: 400}
        diff:
          type: array
          items:
            type: object
            required: [path, expected, observed]
            properties:
              path: {type: string}
              expected: {}
              observed: {}
        evidence: {type: object, description: Small (at most 8 KiB); never payloads or secrets.}
    WitnessDetail:
      type: object
      description: >-
        witness_detail v1 (S19): what `actions.witness_detail` holds and what the deed's
        `witness.detail_digest` is the digest of. Changes are additive only; S21 fills `levels.L2`.
      required: [object, version, claim, summary, levels, reasons, witnessed_at]
      properties:
        object: {type: string, const: witness_detail}
        version: {type: integer, const: 1}
        claim:
          type: object
          required: [level, verdict, method, required_level]
          properties:
            level: {type: string, enum: [L0, L1, L2]}
            verdict: {type: string, enum: [VERIFIED, MISMATCH, UNVERIFIABLE]}
            method: {type: string}
            required_level: {type: string, enum: [L0, L1, L2]}
        summary: {type: string}
        levels:
          type: object
          required: [L0, L1, L2]
          properties:
            L0: {$ref: "#/components/schemas/WitnessLevelDetail"}
            L1: {$ref: "#/components/schemas/WitnessLevelDetail"}
            L2: {$ref: "#/components/schemas/WitnessLevelDetail"}
        reasons:
          type: array
          items: {$ref: "#/components/schemas/WitnessReason"}
        witnessed_at: {type: string, format: date-time}
        truncated: {type: integer, minimum: 0, description: Diff rows and evidence left out to stay under witness.max_detail_bytes.}
    WitnessLevelDetail:
      type: [object, "null"]
      required: [verdict, method]
      properties:
        verdict: {type: string, enum: [VERIFIED, MISMATCH, UNVERIFIABLE]}
        method: {type: string}
        readback:
          type: object
          description: What the read-back did; the body it read is kept only as a digest.
          required: [tool, attempts, latency_ms]
          properties:
            tool: {type: string}
            target: {type: string}
            request_digest: {type: string}
            status: {type: integer}
            response_digest: {type: string}
            attempts: {type: integer, minimum: 1, maximum: 5}
            latency_ms: {type: integer, minimum: 0}
        transaction:
          type: object
          description: >-
            L2 only (S21): the committed transaction the verdict is about. Every L2 verdict that
            read a frame names its system, timeline and commit LSN; `marker_lsn` is evidence only
            and is never compared.
          required: [system_id, timeline, commit_lsn, xid, committed_at]
          properties:
            system_id: {type: string}
            timeline: {type: integer}
            commit_lsn: {type: string}
            xid: {type: integer}
            committed_at: {type: string, format: date-time}
            marker_lsn: {type: string}
            changes_digest: {type: string}
        expected:
          type: object
          description: L2 only. What the statement should touch (S21 §3.3).
          required: [derivation, tables]
          properties:
            derivation: {type: string, enum: [exact_keys, count_only, contract, explicit, unknown]}
            why: {type: string}
            tables:
              type: array
              items:
                type: object
                required: [table, ops]
                properties:
                  table: {type: string}
                  ops: {type: array, items: {type: string, enum: [insert, update, delete]}}
                  rows: {type: integer}
                  max_rows: {type: integer}
                  keys: {type: array, items: {type: object, additionalProperties: {type: string}}}
                  columns: {type: array, items: {type: string}}
        observed:
          type: object
          description: L2 only. Exact counts per table, from Postgres's change log.
          required: [total, tables]
          properties:
            total: {type: integer, minimum: 0}
            tables:
              type: array
              items:
                type: object
                required: [table, insert, update, delete]
                properties:
                  table: {type: string}
                  insert: {type: integer}
                  update: {type: integer}
                  delete: {type: integer}
                  truncate: {type: integer}
        rows:
          type: array
          description: L2 only. Changed rows, expected ones first, then unexpected ones in stream order (at most witness.diff_rows).
          items:
            type: object
            required: [table, op, key, expected, cells]
            properties:
              table: {type: string}
              op: {type: string, enum: [insert, update, delete]}
              key: {type: object, additionalProperties: {type: string}}
              expected: {type: boolean}
              cells:
                type: array
                items:
                  type: object
                  required: [column, before, after]
                  properties:
                    column: {type: string}
                    before: {type: [string, "null"]}
                    after: {type: [string, "null"], description: 'Postgres''s text output; a sensitive column is "•••".'}
        rows_shown: {type: integer, minimum: 0}
        rows_more: {type: integer, minimum: 0}
        columns_more: {type: integer, minimum: 0}
        redacted: {type: array, items: {type: string}, description: 'schema.table.column of the sensitive columns shown as "•••".'}
        frames: {type: integer, minimum: 0, description: How many transactions in the change log named the action.}
        frame_ids: {type: array, items: {type: string}}
    ActionDecision:
      type: [object, "null"]
      required: [outcome, code, source, rule_id, reason, message, policy, policy_version, shadow]
      description: >-
        The policy decision as an agent reads it: S11's decision, its source, its message verbatim,
        the policy version that made it (pinned: a later activation doesn't change it), and the
        shadow decision next to it. `null` until the action is evaluated.
      properties:
        outcome: {type: string, enum: [allow, deny, require_approval]}
        code: {type: [string, "null"], description: 'The refusal code (`policy_denied`, `budget_exceeded`, `agent_stopped`, `tool_unknown`, …), `approval_required`, or null for an allow.'}
        source: {type: [string, "null"], enum: [stop, budget, rule, default, builtin, null], description: '`builtin` is the Gate''s own decision, such as `tool_unknown`.'}
        rule_id: {type: [string, "null"]}
        reason: {type: [string, "null"]}
        message: {type: [string, "null"], description: The sentence the agent sees, verbatim. Null for an allow.}
        policy: {type: [string, "null"], description: The policy id (`pol_…`).}
        policy_version: {type: [string, "null"], description: The policy version id (`pv_…`).}
        anomaly:
          type: string
          description: >-
            S27, additive: the decision trace's line about the anomaly facts the policy saw, like
            `anomaly facts: volume_spike`, or `anomaly facts: detector_stale (…)` when detection
            was behind and the policy treated the agent as anomalous. Absent when no anomaly fact
            was active.
          examples: ["anomaly facts: volume_spike"]
        shadow:
          type: [object, "null"]
          description: What the shadow policy would have decided. Recorded, never enforced.
          required: [outcome, rule_id, policy_version]
          properties:
            outcome: {type: string, enum: [allow, deny, require_approval]}
            rule_id: {type: [string, "null"]}
            policy_version: {type: [string, "null"]}
    ActionApproval:
      type: [object, "null"]
      required: [id, status, expires_at]
      description: The approval the action waits for, or waited for. `null` when no rule asked for one.
      properties:
        id: {type: string, description: The approval id (`apr_…`).}
        status: {type: string, enum: [pending, approved, denied, expired, cancelled]}
        expires_at: {type: string, format: date-time}
        decision_reason: {type: string, description: 'S22, additive: the reason a person gave when they denied it. Absent otherwise.'}
    NextAction:
      type: [object, "null"]
      required: [type]
      description: >-
        What the caller does next. `await_approval`: wait for a person (`poll_url` long-polls the
        action). `execute_at_edge`: proxy mode, run the tool at the edge and report the result to
        `report_url` before `deadline`. `scheduled` (S40): approved, it runs between `not_before` and
        `not_after`. `null` otherwise.
      properties:
        type: {type: string, enum: [await_approval, execute_at_edge, scheduled]}
        approval: {type: string, description: '`await_approval` only: the approval id.'}
        not_before: {type: string, format: date-time, description: '`scheduled` only (S40): an approved action runs from this time.'}
        not_after: {type: string, format: date-time, description: '`scheduled` only (S40): past it the action is cancelled and sealed with `schedule_missed`; nothing runs.'}
        expires_at: {type: string, format: date-time, description: '`await_approval` only.'}
        poll_url: {type: string, description: '`await_approval` only: `/v1/actions/{id}?wait=25`.'}
        report_url: {type: string, description: '`execute_at_edge` only: `/v1/actions/{id}/result`.'}
        deadline: {type: string, format: date-time, description: '`execute_at_edge` only: after it, the action is sealed UNVERIFIABLE (`edge_lost`).'}
    ActionSchedule:
      type: object
      required: [not_before, not_after]
      description: >-
        S40, additive: the window an approved action runs in, stored once at creation and never changed.
        Absent when the request carried no schedule.
      properties:
        not_before: {type: string, format: date-time}
        not_after: {type: string, format: date-time}
    ActionRequest:
      type: object
      additionalProperties: false
      required: [tool, args]
      description: The body of `POST /v1/actions`.
      properties:
        tool:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            `<connector>.<tool>`, split at the first dot. The connector is `^[a-z][a-z0-9-]{1,31}$`.
            The tool part is `^[a-z][a-z0-9_]{0,63}$` for native connectors, and the MCP charset
            `^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$` in proxy mode. Empty, over 200 bytes or not UTF-8
            is 400 `validation_failed`; any other name that isn't a tool, or that no connector
            serves in gateway mode, is recorded, sealed and refused with 404 `tool_unknown`.
        args:
          type: object
          description: >-
            The tool's arguments, a JSON object (`{}` for none): at most `gate.max_args_bytes`
            (256 KiB), nested at most 32 levels, and no integer beyond ±9007199254740991, which RFC 8785
            would round (send it as a string). Floats are fine.
        mode:
          type: string
          enum: [gateway, proxy]
          default: gateway
          description: '`gateway`: Deedglass runs the tool through a connector. `proxy`: the edge runs it and reports the result.'
        wait:
          type: number
          minimum: 0
          maximum: 25
          description: >-
            Seconds to wait for a gateway action to finish before answering 202 `processing`. The
            default is `gate.wait_timeout` (10 s). `0` answers at once.
        context:
          type: object
          additionalProperties: false
          description: Who sent the action, as the client says. Never part of any digest; at most 4 KiB.
          properties:
            client:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, maxLength: 64}
                version: {type: string, maxLength: 64}
            transport:
              type: string
              pattern: "^[a-z][a-z0-9_]{0,31}$"
              description: '`rest`, `sdk`, `mcp_stdio` or `mcp_http`. A call through `mcp_stdio` or `mcp_http` for an agent whose intent mode is `required` is refused with `intent_required`.'
            call_id:
              type: string
              pattern: "^[\\x21-\\x7e]{1,128}$"
              description: >-
                The agent framework's own id for this tool call (a LangChain `tool_call_id`, a Claude
                `tool_use_id`, an OpenAI `call_id`), stored with the context for correlation. Never part of
                a digest or a deed. Added 2026-10-05 (S32), additive.
        connector_type:
          type: string
          description: >-
            Proxy mode only: the edge's connector type (default `mcp`). `postgres` turns on the SQL
            facts for a string `args.sql`. In gateway mode it is 400 `validation_failed`.
          enum: [postgres, rest, mcp, mcp_http, sdk, a2a, github, slack, stripe, gmail, notion, fhir, fake]
        tool_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: The digest of the tool's definition, sent by MCP edges. Part of `request_digest`.
        schedule:
          type: object
          additionalProperties: false
          required: [not_before, not_after]
          description: >-
            S40, additive. Gateway mode only (proxy: 400 `validation_failed`, `param: schedule`). With
            `require_approval`, the approved action runs inside the window: the countersign schedules
            the run at `not_before`, and past `not_after` it is cancelled and sealed with
            `schedule_missed`. With `allow`, it runs now when `not_before` is at most 60 seconds away
            and is denied (`schedule_needs_approval`) otherwise. At least 5 minutes long, `not_after`
            within 72 hours and still ahead. Bound into the approval's `context_digest`.
          properties:
            not_before: {type: string, format: date-time}
            not_after: {type: string, format: date-time}
    EdgeResult:
      type: object
      additionalProperties: false
      required: [status, started_at, finished_at]
      description: >-
        The body of `POST /v1/actions/{id}/result`: what the tool returned at the edge. Send
        `result`, or `result_digest` alone; both must agree when both are sent.
      properties:
        status:
          type: string
          enum: [succeeded, failed, unknown]
          description: '`failed` means the tool certainly didn''t apply the call; `unknown` means the edge can''t tell.'
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time, description: Not before `started_at`.}
        result:
          description: The tool's result, any JSON, at most `gate.max_result_bytes` (256 KiB).
        result_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: sha256 of the result's RFC 8785 form. Required when `result` is left out.
        error_code:
          type: [string, "null"]
          pattern: "^[a-z][a-z0-9_]{0,63}$"
          description: A short snake_case code, such as `tool_error`.
        error_message:
          type: [string, "null"]
          description: A short message. It is redacted and cut to 1 KiB before it is stored.
    ToolResolveRequest:
      type: object
      additionalProperties: false
      required: [connector, tools]
      properties:
        connector:
          type: string
          pattern: "^[a-z][a-z0-9-]{1,31}$"
          description: The connector name the wrapper was given (`--connector`); tools are matched as `<connector>.<name>`.
        connector_type:
          type: string
          description: S10's connector type the edge declares; `mcp` when left out (`postgres` for Postgres MCP servers).
        tools:
          type: array
          minItems: 0
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: {type: string, pattern: "^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$"}
              digest: {type: string, pattern: "^sha256:[0-9a-f]{64}$", description: The wrapper's pinned digest of the tool definition. Recorded nowhere yet; S18 uses it.}
    ToolVisibility:
      type: object
      required: [object, name, tool, visibility, rule_id, reason]
      properties:
        object: {type: string, const: tool_visibility}
        name: {type: string}
        tool: {type: string, description: '`<connector>.<name>`, as policies match it.'}
        visibility: {type: string, enum: [visible, hidden]}
        rule_id: {type: [string, "null"], description: The first rule that covers the tool; null when the policy's default decides.}
        reason: {type: [string, "null"], description: Why the tool is hidden; null when visible.}
    ToolVisibilityList:
      type: object
      required: [object, data, has_more, next_cursor, policy_version]
      properties:
        object: {type: string, const: list}
        data:
          type: array
          items:
            $ref: "#/components/schemas/ToolVisibility"
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
        policy_version: {type: [string, "null"], description: 'The enforced policy version (`pv_…`); null when no policy is active.'}
        policy:
          type: [object, "null"]
          description: 'S22, additive: the enforced policy by name and version, for the wrapper''s startup line. Null when no policy is active.'
          required: [name, version, version_id]
          properties:
            name: {type: string}
            version: {type: integer}
            version_id: {type: string}
    Tool:
      type: object
      required: [object, name, connector, title, description, input_schema, side_effect, visibility]
      properties:
        object: {type: string, const: tool}
        name: {type: string, description: '`<connector>.<tool>`, as policies match it and /mcp/native lists it.'}
        connector: {type: string}
        title: {type: string}
        description: {type: string}
        input_schema: {type: object, description: The tool's JSON Schema for its arguments.}
        side_effect: {type: string, enum: [read, write, destructive, unknown], description: What the connector declares the tool does.}
        visibility: {type: string, enum: [visible, hidden]}
        levels: {type: array, items: {type: string, enum: [L0, L1, L2]}, description: 'S30, additive: the verification levels the tool reaches.'}
        read_back: {type: string, description: 'S30, additive: what the L1 read-back checks, in one sentence; empty when the tool is not read back.'}
    ToolList:
      type: object
      required: [object, data, has_more, next_cursor, policy_version]
      properties:
        object: {type: string, const: list}
        data:
          type: array
          items:
            $ref: "#/components/schemas/Tool"
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
        policy_version: {type: [string, "null"], description: 'The enforced policy version (`pv_…`); null when no policy is active.'}
    ActionList:
      type: object
      required: [object, data, has_more, next_cursor]
      properties:
        object: {type: string, const: list}
        data:
          type: array
          items:
            $ref: "#/components/schemas/Action"
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
    ActionEvent:
      type: object
      required: [object, id, seq, from, to, at, actor, data]
      properties:
        object: {type: string, const: action_event}
        id: {type: string, pattern: "^evt_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        seq: {type: integer, minimum: 1}
        from: {type: [string, "null"]}
        to: {type: string}
        at: {type: string, format: date-time}
        actor: {type: string, description: '`system`, `agt_…` or `usr_…`.'}
        data:
          type: object
          description: Short codes and digests (reason, rule_id, error_code, level, verdict, approval_id, detail_digest); never payloads.
    ActionUndo:
      type: object
      required: [undoes, undone_by, eligible]
      description: >-
        The action's undo object (S23). `undoes` names the action an undo puts back; `undone_by`
        names the undo that put this one back; `pending` an undo waiting for approval or running.
        `eligible` is cheap (L2 evidence from a bound transaction, gateway mode, sealed, not
        undone, within `undo.max_age`, the row images kept): it only decides whether the Console
        shows Preview undo. The full answer is always the preview.
      properties:
        undoes: {type: [string, "null"]}
        undone_by: {type: [string, "null"]}
        pending: {type: [string, "null"]}
        eligible: {type: boolean}
    UndoCheck:
      type: object
      required: [id, title, status, detail]
      description: One of the twelve safety checks (S23 §3.3). Available means no check failed.
      properties:
        id:
          type: string
          enum: [evidence, connector, age, not_undone, row_limit, replica_identity, primary_key, columns, triggers, cascades, unchanged, privileges]
        title: {type: string}
        status: {type: string, enum: [pass, warn, fail, skip]}
        detail: {type: string}
        fix: {type: string}
        fix_sql: {type: string, description: SQL to copy, one statement per line.}
        doc_url: {type: string, format: uri}
    UndoStep:
      type: object
      required: [op, table, key]
      description: >-
        One step of the plan as a person reads it: `expect` is the row now (what the action
        wrote), `set` what the undo writes back. A sensitive column shows as •••; NULL is null.
      properties:
        op: {type: string, enum: [update, insert, delete]}
        table: {type: string}
        key: {type: object, additionalProperties: {type: string}}
        set: {type: object, additionalProperties: {type: [string, "null"]}}
        expect: {type: object, additionalProperties: {type: [string, "null"]}}
    ObserveSession:
      type: object
      required: [object, id, connector, label, agent, state, opened_at, closed_at, opened_by, closed_by, flags, watched_tables, summary, caught, seal, undo, notes, observed, attribution]
      properties:
        object: {type: string, const: observe_session}
        id: {type: string, description: '`obs_…`'}
        connector:
          type: object
          required: [id, name]
          properties:
            id: {type: string}
            name: {type: string}
        label: {type: [string, "null"]}
        agent: {type: [string, "null"], description: An agent shown beside the session; it attributes nothing.}
        state: {type: string, enum: [open, closing, sealed, undoing, undone]}
        opened_at: {type: string, format: date-time}
        closed_at: {type: [string, "null"], format: date-time}
        opened_by: {$ref: "#/components/schemas/ObserveActor"}
        closed_by:
          oneOf:
            - {$ref: "#/components/schemas/ObserveActor"}
            - {type: "null"}
        flags: {type: array, items: {type: string, enum: [overlap, max_session, decoder_behind, caught, frames_expired]}}
        watched_tables: {type: array, items: {type: string}}
        summary:
          type: object
          required: [transactions, excluded, expired, rows, tables, first_commit, last_commit]
          properties:
            transactions: {type: integer}
            excluded: {type: integer}
            expired: {type: integer}
            rows: {type: integer}
            tables: {type: object, additionalProperties: {$ref: "#/components/schemas/ObserveCounts"}}
            first_commit: {type: [string, "null"], format: date-time}
            last_commit: {type: [string, "null"], format: date-time}
        caught: {type: array, items: {$ref: "#/components/schemas/CaughtItem"}}
        seal:
          type: [object, "null"]
          properties:
            deed: {type: string, description: 'The observe.session_sealed deed (`deed_…`).'}
        undo:
          type: object
          required: [action, possible, free_path]
          properties:
            action: {type: [string, "null"], description: The session undo action, once one started.}
            possible: {type: boolean}
            free_path: {type: string, description: The free way back (the undo SQL you run).}
        notes: {type: array, items: {type: string}}
        observed: {type: string, description: '"Observed: what Postgres committed. Nothing was compared with what the agent said."'}
        attribution: {type: string}
        transactions:
          type: object
          description: On the single read only, newest first.
          properties:
            object: {type: string, const: list}
            total: {type: integer}
            data:
              type: array
              items:
                type: object
                required: [id, commit_time, commit_lsn, xid, tables, changes, excluded, expired, flags, diff]
                properties:
                  id: {type: string, description: '`dtx_…`'}
                  commit_time: {type: [string, "null"], format: date-time}
                  commit_lsn: {type: string}
                  xid: {type: integer}
                  tables: {type: object, additionalProperties: {$ref: "#/components/schemas/ObserveCounts"}}
                  changes: {type: integer}
                  excluded: {type: boolean}
                  expired: {type: boolean}
                  flags: {type: array, items: {type: string}}
                  diff:
                    type: [object, "null"]
                    properties:
                      rows: {type: array, items: {type: object}}
                      total: {type: integer}
                      truncated: {type: boolean}
    ObserveActor:
      type: object
      required: [type, id]
      properties:
        type: {type: string, enum: [user, api_key, system]}
        id: {type: [string, "null"]}
    ObserveCounts:
      type: object
      required: [insert, update, delete, truncate]
      properties:
        insert: {type: integer}
        update: {type: integer}
        delete: {type: integer}
        truncate: {type: integer}
    CaughtItem:
      type: object
      required: [kind, line, undo_possible, undo_free_path]
      properties:
        kind: {type: string, enum: [truncate, many_rows, delete_rows, doesnt_match, destructive_ran, more_rows, retry_after_deny, undone_later]}
        session: {type: string}
        actions: {type: array, items: {type: string}}
        frames: {type: array, items: {type: string}}
        table: {type: string}
        rows: {type: integer}
        line: {type: string, description: '"Deedglass caught this: …", built from the record.'}
        undo_possible: {type: boolean}
        undo_free_path: {type: string, description: The free way back; every view that shows the item shows it.}
    WeeklyView:
      type: object
      additionalProperties: false
      required: [object, summary, email, pro_undo_line]
      properties:
        object: {type: string, const: weekly_view}
        summary: {$ref: "#/components/schemas/WeeklySummary"}
        email:
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/WeeklyEmailState"}
        pro_undo_line: {type: boolean, description: The server has no undo_session, so a caught session shows the one Pro line.}
    WeeklyEmailState:
      type: object
      additionalProperties: false
      required: [on, receives, owner, mailer]
      properties:
        "on": {type: boolean}
        receives: {type: boolean, description: On, an owner, and the server can send email.}
        owner: {type: boolean}
        mailer: {type: boolean}
    WeeklySummary:
      type: object
      description: The weekly_summary object (version 1); docs/WEEKLY.md describes every field.
      required: [object, version, org, period, actions, check, denials, approvals, undos, stops, sessions, caught, caught_total, chain, security_pack, generated_at]
      properties:
        object: {type: string, const: weekly_summary}
        version: {type: integer, const: 1}
        org: {type: object}
        period: {type: object}
        actions: {type: object}
        check: {type: object}
        denials: {type: array, items: {type: object}}
        approvals: {type: object}
        undos: {type: object}
        stops: {type: object}
        sessions: {type: object}
        caught: {type: array, items: {type: object}}
        caught_total: {type: integer}
        chain: {type: object}
        security_pack:
          oneOf:
            - {type: "null"}
            - {type: object}
        generated_at: {type: string, format: date-time}
    ClientList:
      type: object
      additionalProperties: false
      required: [object, period, data, has_more, next_cursor, total]
      properties:
        object: {type: string, const: list}
        period: {type: object}
        data:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [object, org, name, slug, role, actions, doesnt_match, caught, waiting, stopped, chain, last_activity]
            properties:
              object: {type: string, const: client}
              org: {type: string}
              name: {type: string}
              slug: {type: string}
              role: {type: string, enum: [owner, admin]}
              actions: {type: integer}
              doesnt_match: {type: integer}
              caught: {type: integer}
              waiting: {type: integer}
              stopped: {type: boolean}
              chain: {type: string, enum: [intact, broken, not_checked, no_records]}
              last_activity:
                oneOf:
                  - {type: "null"}
                  - {type: string, format: date-time}
        has_more: {type: boolean}
        next_cursor:
          oneOf:
            - {type: "null"}
            - {type: string}
        total: {type: integer}
    SecurityPackReadiness:
      type: object
      additionalProperties: false
      required: [object, org, org_name, period, summary, rows]
      properties:
        object: {type: string, const: security_pack_readiness}
        org: {type: string}
        org_name: {type: string}
        period:
          type: object
          additionalProperties: false
          required: [from, to]
          properties:
            from: {type: string, format: date-time}
            to: {type: string, format: date-time}
        summary:
          type: object
          additionalProperties: false
          required: [in_place, partly, not_set_up, not_applicable, cant_tell]
          properties:
            in_place: {type: integer}
            partly: {type: integer}
            not_set_up: {type: integer}
            not_applicable: {type: integer}
            cant_tell: {type: integer}
        rows:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, group, group_title, question, status, fix]
            properties:
              id: {type: string}
              group: {type: string}
              group_title: {type: string}
              question: {type: string}
              status: {type: string, enum: [in_place, partly, not_set_up, not_applicable, cant_tell]}
              fix: {type: string, description: What to do about a gap ("" when there is nothing to do).}
    ObserveUndoPreview:
      type: object
      required: [object, session, available, summary, headline, plan_digest, connector, counts, rows, tables, steps, checks, conflicts, excluded, notes, redacted, sql, refusals, pro, free_path, observed]
      properties:
        object: {type: string, const: observe_undo_preview}
        session: {type: string}
        available: {type: boolean}
        summary: {type: string}
        headline: {type: string}
        plan_digest: {type: [string, "null"]}
        connector: {type: [object, "null"]}
        counts: {type: object}
        rows: {type: integer}
        tables: {type: array, items: {type: string}}
        steps: {type: object}
        checks: {type: array, items: {type: object}}
        conflicts: {type: integer, description: Rows that changed again after the session.}
        excluded: {type: array, items: {type: string}}
        notes: {type: array, items: {type: string}}
        redacted: {type: array, items: {type: string}}
        sql: {type: [string, "null"], description: The undo SQL to review and run yourself (free).}
        refusals: {type: array, items: {type: string}}
        pro: {type: boolean, description: Whether this server may run the undo in one step.}
        free_path: {type: string}
        observed: {type: string}
    UndoPreview:
      type: object
      required: [object, action, tool, available, summary, headline, plan_digest, connector, evidence, counts, rows, tables, steps, checks, notes, redacted, policy, undone_by]
      properties:
        object: {type: string, const: undo_preview}
        action: {type: string}
        tool: {type: string, description: The original action's tool.}
        available: {type: boolean, description: No check failed.}
        summary: {type: string}
        headline: {type: string, description: '"301 rows in public.orders · 301 updates"'}
        plan_digest: {type: [string, "null"], description: 'sha256: of the plan; send it to POST /v1/actions/{id}/undo.'}
        connector:
          type: [object, "null"]
          required: [id, name, type]
          properties:
            id: {type: string}
            name: {type: string}
            type: {type: string}
        evidence:
          type: [object, "null"]
          required: [level, verdict, xid, commit_lsn, committed_at, changes]
          properties:
            level: {type: string}
            verdict: {type: string}
            xid: {type: string}
            commit_lsn: {type: string}
            committed_at: {type: string}
            changes: {type: integer}
        counts:
          type: object
          required: [update, insert, delete]
          properties:
            update: {type: integer}
            insert: {type: integer}
            delete: {type: integer}
        rows: {type: integer}
        tables: {type: array, items: {type: string}}
        steps:
          type: object
          required: [object, total, has_more, data]
          properties:
            object: {type: string, const: list}
            total: {type: integer}
            has_more: {type: boolean}
            data:
              type: array
              items:
                $ref: "#/components/schemas/UndoStep"
        checks:
          type: array
          items:
            $ref: "#/components/schemas/UndoCheck"
        notes: {type: array, items: {type: string}}
        redacted: {type: array, items: {type: string}, description: 'Columns marked sensitive, "schema.table.column": shown as ••• and compared by digest.'}
        policy:
          type: [object, "null"]
          required: [decision, rule_id, reason]
          properties:
            decision: {type: string, enum: [allow, deny, require_approval]}
            rule_id: {type: [string, "null"]}
            reason: {type: [string, "null"]}
        undone_by: {type: [string, "null"]}
    ActionDetail:
      allOf:
        - $ref: "#/components/schemas/Action"
      type: object
      required: [request, result, events, deeds, approval, undo]
      properties:
        undo:
          $ref: "#/components/schemas/ActionUndo"
        request:
          description: The tool arguments, or null after pruning.
        result:
          description: The tool result, or null after pruning.
        events:
          type: object
          required: [object, data, has_more, next_cursor]
          properties:
            object: {type: string, const: list}
            data:
              type: array
              maxItems: 200
              items:
                $ref: "#/components/schemas/ActionEvent"
            has_more: {type: boolean}
            next_cursor: {type: "null"}
        deeds:
          type: array
          items:
            type: object
            required: [id, kind, seq, issued_at]
            properties:
              id: {type: string}
              kind: {type: string, enum: [action, amendment]}
              seq: {type: integer, minimum: 1}
              issued_at: {type: string, format: date-time}
        approval:
          $ref: "#/components/schemas/ActionApproval"
    DeedList:
      type: object
      required: [object, data, has_more, next_cursor]
      properties:
        object: {type: string, const: list}
        data:
          type: array
          items:
            $ref: "#/components/schemas/Deed"
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
    LedgerCheck:
      type: object
      required: [object, org, status, checked, first_seq, last_seq, anchor, head, seal_keys, break, next_from_seq, duration_ms, checked_at]
      properties:
        object: {type: string, const: ledger_check}
        org: {type: string}
        status: {type: string, enum: [intact, broken, incomplete]}
        checked: {type: integer, minimum: 0}
        first_seq: {type: [integer, "null"]}
        last_seq: {type: [integer, "null"]}
        anchor:
          type: object
          required: [kind, seq, body_hash]
          properties:
            kind: {type: string, enum: [genesis, deed]}
            seq: {type: integer, minimum: 0}
            body_hash: {type: [string, "null"]}
        head:
          type: [object, "null"]
          required: [seq, deed, body_hash, issued_at]
          description: The last intact deed checked. Keep it outside Deedglass.
          properties:
            seq: {type: integer}
            deed: {type: string}
            body_hash: {$ref: "#/components/schemas/Digest"}
            issued_at: {$ref: "#/components/schemas/DeedTime"}
        seal_keys:
          type: array
          items: {type: string}
        break:
          type: [object, "null"]
          required: [seq, deed, code, message, next]
          properties:
            seq: {type: [integer, "null"]}
            deed: {type: [string, "null"]}
            code: {type: string, examples: [body_hash_mismatch, chain_seq_gap, chain_prev_hash_mismatch, seal_invalid]}
            message: {type: string, examples: ["Deed 812 was changed after it was sealed."]}
            next: {type: string}
        next_from_seq: {type: [integer, "null"]}
        duration_ms: {type: integer, minimum: 0}
        checked_at: {type: string, format: date-time}
      examples:
        - object: ledger_check
          org: org_01j9z8m2k4p6r8t0v2x4z6b8d0
          status: intact
          checked: 1204
          first_seq: 1
          last_seq: 1204
          anchor: {kind: genesis, seq: 0, body_hash: null}
          head: {seq: 1204, deed: deed_01j9zx3q5s7v9w1y3a5c7e9g1j, body_hash: "sha256:5e0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8fa91c", issued_at: "2026-10-02T18:29:58.004Z"}
          seal_keys: [sk_01j9zr8k2m4p6r8t0v2x4z6b8d]
          break: null
          next_from_seq: null
          duration_ms: 312
          checked_at: "2026-10-02T18:31:02.117Z"
    Connector:
      type: object
      required: [object, id, type, name, description, status, config, config_hash, tools, credentials, health, created_at, updated_at]
      properties:
        object: {type: string, const: connector}
        id: {type: string, pattern: "^con_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        type: {type: string}
        name: {type: string}
        description: {type: string}
        status: {type: string, enum: [active, disabled, error]}
        config: {type: object, description: The normalized config.}
        config_hash: {type: string, description: "sha256: of the normalized config's JCS form."}
        tools:
          type: array
          items:
            type: object
            required: [object, name, side_effect, idempotent, levels]
            properties:
              object: {type: string, const: tool}
              name: {type: string, description: "Qualified: <connector>.<tool>."}
              description: {type: string}
              side_effect: {type: string, enum: [read, write, destructive]}
              idempotent: {type: boolean}
              levels: {type: array, items: {type: string, enum: [L0, L1, L2]}}
        credentials:
          $ref: "#/components/schemas/Credential"
        health:
          type: object
          required: [status, tested_at]
          properties:
            status: {type: string, enum: [unknown, pass, warn, fail, skip]}
            tested_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        deed: {type: string, description: The admin deed of the change this answers.}
    ConnectorList:
      type: object
      required: [object, data, has_more, next_cursor]
      properties:
        object: {type: string, const: list}
        data:
          type: array
          items:
            $ref: "#/components/schemas/Connector"
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
    ConnectorDeleted:
      type: object
      required: [object, id, deleted, deed]
      properties:
        object: {type: string, const: connector}
        id: {type: string}
        deleted: {type: boolean, const: true}
        deed: {type: string}
    Credential:
      type: object
      description: A credential's metadata. Never a value, never a digest of one.
      required: [object, connector, set]
      properties:
        object: {type: string, const: credential}
        connector: {type: string}
        set: {type: boolean}
        kind: {type: string, enum: [bearer, header, basic, query, dsn, fields]}
        fields: {type: array, items: {type: string}, description: The field names.}
        hint: {type: string, description: "The last 4 characters of a token of 24 or more (…9f2c), the username of basic auth, or user@host:port/db of a DSN."}
        version: {type: integer, minimum: 1}
        kek_id: {type: string, pattern: "^kek:[0-9a-f]{12}$"}
        updated_at: {type: string, format: date-time}
        updated_by: {type: string}
        deleted: {type: boolean}
        deed: {type: string}
    ConnectorTest:
      type: object
      required: [object, connector, status, duration_ms, checks]
      properties:
        object: {type: string, const: connector_test}
        connector: {type: string}
        status: {type: string, enum: [pass, warn, fail, skip]}
        duration_ms: {type: integer}
        checks:
          type: array
          items:
            type: object
            required: [id, title, status, detail]
            properties:
              id: {type: string, description: "REST (S16): config, credentials, destination, tls, auth. Postgres (S17): connection, version, wal_level, slot_capacity, wal_keep_cap, idle_slot_timeout, schema, begin_action, agent_role, witness_role, witness.watched_tables, writable_watched, publication, slot, tls, pooler, emit_message_acl, probe."}
              title: {type: string}
              status: {type: string, enum: [pass, warn, fail, skip]}
              detail: {type: string}
              fix: {type: string}
              fix_sql: {type: string}
              doc_url: {type: string}
    Decoder:
      type: object
      description: >-
        A connector's decoder (S20): what Deedglass reads from the database's change stream. The
        decoder never decides a verdict; S21 turns bound frames into L2 verdicts.
      required: [object, connector, name, slot, publication, status, health, reason, detail, since, transport, server,
        positions, lag, wal_status, watching, last_commit, last_heartbeat_at, frames, recent, updated_at]
      properties:
        object: {type: string, enum: [decoder]}
        connector: {type: string, pattern: "^con_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        name: {type: string, example: postgres}
        slot: {type: string, example: deedglass_01j9zq7c4m8x2v6t0r3n5k1h7d}
        publication: {type: string, example: deedglass_pub}
        status: {type: string, enum: [pending, connecting, running, degraded, waiting, halted, dropped, disabled]}
        health: {type: string, enum: [healthy, pending, connecting, degraded, waiting, halted, dropped, disabled]}
        reason:
          type: [string, "null"]
          description: >-
            Why the status is what it is: lag_high, restart_retained, stalled, publication_changed,
            timeline_changed, peek_slow (degraded); slot_invalidated, slot_missing,
            publication_missing, publication_invalid, malformed_evidence, session_settings_changed,
            ledger_function_changed, system_changed, wal_level, not_replication, slot_conflict
            (halted); held_elsewhere (waiting); credentials_missing, unreachable (connecting);
            dropped, not_witnessed, connector_deleted, slot_orphaned.
        detail: {type: object, additionalProperties: true}
        since: {type: string, format: date-time}
        transport: {type: string, enum: [peek]}
        server:
          type: object
          required: [version, system_id, timeline]
          properties:
            version: {type: [string, "null"], example: "18.6"}
            system_id: {type: [string, "null"]}
            timeline: {type: [integer, "null"]}
        positions:
          type: object
          required: [checkpoint_lsn, confirmed_flush_lsn, restart_lsn, current_wal_lsn]
          properties:
            checkpoint_lsn: {type: [string, "null"], example: 0/3E65050}
            confirmed_flush_lsn: {type: [string, "null"]}
            restart_lsn: {type: [string, "null"]}
            current_wal_lsn: {type: [string, "null"]}
        lag:
          type: object
          required: [bytes, seconds, retained_bytes]
          properties:
            bytes: {type: [integer, "null"], description: "From the slot's confirmed position to the server's."}
            seconds: {type: [number, "null"], description: "Since the decoder last read everything flushed."}
            retained_bytes: {type: [integer, "null"], description: "WAL the slot keeps on the database (from restart_lsn)."}
        wal_status: {type: [string, "null"], example: reserved}
        watching: {type: array, items: {type: string}}
        last_commit:
          type: [object, "null"]
          required: [lsn, at]
          properties:
            lsn: {type: string}
            at: {type: [string, "null"], format: date-time}
        last_heartbeat_at: {type: [string, "null"], format: date-time}
        frames:
          type: object
          description: Frames stored, per class.
          additionalProperties: {type: integer}
        recent:
          type: array
          items:
            type: object
            required: [commit_lsn, class, action, counts, flags, at]
            properties:
              commit_lsn: {type: [string, "null"]}
              class: {type: string, enum: [bound, unattributed, forged_marker, forged_marker_nontx, marker_count, marker_mismatch,
                foreign_ledger, publication_gap, missing, request_id_reused, version_tag_mismatch]}
              action: {type: [string, "null"]}
              counts:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    insert: {type: integer}
                    update: {type: integer}
                    delete: {type: integer}
                    truncate: {type: integer}
              flags: {type: array, items: {type: string}}
              at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DecoderDropped:
      type: object
      required: [object, connector, name, slot, dropped, deed, status]
      properties:
        object: {type: string, enum: [decoder]}
        connector: {type: string}
        name: {type: string}
        slot: {type: string}
        dropped: {type: boolean, enum: [true]}
        deed: {type: string, description: "The decoder.slot_dropped admin deed."}
        status: {type: string, enum: [dropped]}
    SealedFile:
      type: object
      additionalProperties: false
      required: [object, sha256, bytes, media_type, label, deed]
      properties:
        object: {type: string, const: sealed_file}
        sha256: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        bytes: {type: integer, minimum: 0}
        media_type: {type: string}
        label: {type: string}
        deed:
          $ref: "#/components/schemas/Deed"
    ConnectorSetup:
      type: object
      required: [object, connector, plan_sha256, changes, deed]
      properties:
        object: {type: string, const: connector_setup}
        connector: {type: string, description: "con_…"}
        plan_sha256: {type: string}
        changes: {type: integer}
        deed: {type: string, description: "deed_… of connector.postgres_initialized"}
    ConnectorTypeList:
      type: object
      required: [object, data, has_more, next_cursor]
      properties:
        object: {type: string, const: list}
        data:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorType"
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
    ConnectorType:
      type: object
      description: >-
        One connector type in the catalog (S30 TypeInfo v2, additive to S16's shape): what it does,
        its credentials and setup, honest limits, and its fixed tools with what the Witness checks.
      required: [object, type, title, levels, credential_kinds, config_schema, docs_url, summary, status, icon, modes, setup, limits, tools_dynamic, tools]
      properties:
        object: {type: string, const: connector_type}
        type: {type: string}
        title: {type: string}
        description: {type: string}
        levels: {type: array, items: {type: string}}
        credential_kinds:
          type: array
          items:
            type: object
            properties:
              kind: {type: string}
              fields:
                type: array
                items:
                  type: object
                  properties:
                    name: {type: string}
                    secret: {type: boolean}
                    help: {type: string}
                    prefix_hint: {type: string}
        config_schema: {type: object}
        docs_url: {type: string}
        summary: {type: string}
        status: {type: string, enum: [stable, beta, dev]}
        icon: {type: string, description: A Lucide icon name.}
        modes: {type: array, items: {type: string, enum: [sandbox_only, drafts_only, dev_only]}}
        setup:
          type: array
          items:
            type: object
            required: [title]
            properties:
              title: {type: string}
              detail: {type: string}
              command: {type: string}
              url: {type: string}
        limits: {type: array, items: {type: string}}
        tools_dynamic: {type: boolean, description: True when tools come from config (rest) or the server (mcp_http).}
        tools:
          type: array
          items:
            type: object
            required: [object, name, title, description, side_effect, idempotent, levels, read_back, input_schema]
            properties:
              object: {type: string, const: tool}
              name: {type: string}
              title: {type: string}
              description: {type: string}
              side_effect: {type: string, enum: [read, write, destructive, unknown]}
              idempotent: {type: boolean}
              levels: {type: array, items: {type: string}}
              read_back: {type: string}
              requires_scope: {type: string}
              input_schema: {type: object}
    Event:
      type: object
      description: >-
        One event, on the stream and in webhooks (contract §8). On the stream, `hydrated` says
        whether `data.object` is the REST list shape (true) or the thin webhook object (false).
      required: [object, id, type, api_version, created_at, livemode, org, data]
      properties:
        object: {type: string, const: event}
        id: {type: string, description: "The event id (evt_…)."}
        type:
          type: string
          example: action.witnessed
          description: >-
            One of `action.created`, `action.decided`, `action.executed`, `action.witnessed`,
            `deed.sealed`, `approval.requested`, `approval.decided`, `agent.stopped`,
            `agent.resumed`, `agent.suspended`, `org.stopped`, `org.started`,
            `anomaly.detected` (S27), `policy.activated`, `decoder.degraded`,
            `decoder.recovered`, `decoder.alert` and `webhook.test`. New types are added.
        api_version: {type: string}
        created_at: {type: string, format: date-time}
        livemode: {type: boolean}
        org: {type: string}
        hydrated: {type: boolean, description: Stream only.}
        data:
          type: object
          required: [object]
          properties:
            object:
              type: object
              description: >-
                An action, approval or agent in its list shape, a DeedSummary, or the thin
                object (ids and states) when not hydrated. `anomaly.detected` always carries
                the thin AnomalyEventObject (`object: anomaly`, `id`, `agent`, `kind`,
                `tool` for `new_tool`, `severity`, `status`).
    DeedSummary:
      type: object
      required: [object, id, seq, kind, action, issued_at]
      properties:
        object: {type: string, const: deed_summary}
        id: {type: string}
        seq: {type: integer}
        kind: {type: string, enum: [action, amendment, admin]}
        action: {type: [string, "null"]}
        issued_at: {type: string, format: date-time}
    StreamHello:
      type: object
      required: [object, instance, resumed, heartbeat_s, server_time]
      properties:
        object: {type: string, const: stream}
        instance: {type: string, description: The instance part of this stream's cursors.}
        resumed: {type: boolean, description: True when the cursor you sent was replayed from.}
        heartbeat_s: {type: integer, example: 15}
        server_time: {type: string, format: date-time}
    StreamResync:
      type: object
      required: [object, reason]
      properties:
        object: {type: string, const: resync}
        reason: {type: string, enum: [cursor_expired, other_instance, lagged, bus_reconnected]}
    StreamSessionEnded:
      type: object
      required: [code, message]
      properties:
        code: {type: string, example: api_key_revoked}
        message: {type: string}
    Version:
      type: object
      required: [object, version, commit, built_at, go, api_versions, default_api_version]
      properties:
        object:
          type: string
          const: version
        version:
          type: string
        commit:
          type: string
        built_at:
          type: [string, "null"]
          format: date-time
        go:
          type: string
        api_versions:
          type: array
          items:
            type: string
        default_api_version:
          type: string
      examples:
        - object: version
          version: 0.2.1
          commit: 5495f7e
          built_at: "2026-10-01T10:00:00Z"
          go: go1.27.1
          api_versions: ["2026-10-01"]
          default_api_version: "2026-10-01"
    ReplayRequest:
      type: object
      additionalProperties: false
      description: >-
        What to replay over. Every field is optional: the window defaults to the 7 days before
        `to`, and `to` to now; the baseline to the decisions recorded at the time.
      properties:
        from: {type: string, format: date-time, description: The window's start (RFC 3339).}
        to: {type: string, format: date-time, description: The window's end (RFC 3339). At most 90 days after `from`.}
        baseline:
          type: object
          additionalProperties: false
          properties:
            type: {type: string, enum: [recorded, version], default: recorded}
            version: {type: integer, minimum: 1, description: '`version` only: the version of the same policy to compare with.'}
    InsightsActor:
      type: object
      required: [type, id]
      description: Who asked for it.
      properties:
        type: {type: string, enum: [user, api_key, system]}
        id: {type: string, description: '`usr_…`, `key_…`, or `deedglass` for the system.'}
    InsightsWindow:
      type: object
      required: [from, to]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
    ReplayCandidate:
      type: object
      required: [name, version, version_hash]
      description: The version replayed.
      properties:
        policy: {type: string, description: The policy id (`pol_…`).}
        name: {type: string}
        version: {type: integer, minimum: 0, description: The version number (0 for a draft).}
        version_id: {type: string, description: The version id (`pv_…`). Absent for a draft.}
        version_hash:
          $ref: "#/components/schemas/Digest"
        source_hash:
          allOf:
            - $ref: "#/components/schemas/Digest"
          description: A draft's source hash. Absent for a stored version.
    ReplayBaseline:
      type: object
      required: [type, version]
      description: >-
        What the candidate is compared with: the decisions recorded at the time (`recorded`), or
        another version of the same policy evaluated over the same inputs (`version`).
      properties:
        type: {type: string, enum: [recorded, version]}
        version: {type: integer, minimum: 0, description: The baseline version number; 0 for `recorded`.}
        version_id: {type: string, description: '`version` only (`pv_…`).'}
        version_hash:
          allOf:
            - $ref: "#/components/schemas/Digest"
          description: '`version` only.'
    ReplayProgress:
      type: object
      required: [processed, total, percent]
      properties:
        processed: {type: integer, minimum: 0}
        total: {type: [integer, "null"], minimum: 0, description: The actions in the window, counted when the replay was queued.}
        percent: {type: integer, minimum: 0, maximum: 100, description: processed / total, an integer.}
    ReplaySummary:
      type: object
      required: [actions, evaluated, unchanged, changed, rule_changed, unknown]
      description: '`actions = evaluated + unknown` and `evaluated = unchanged + changed + rule_changed`.'
      properties:
        actions: {type: integer, minimum: 0}
        evaluated: {type: integer, minimum: 0}
        unchanged: {type: integer, minimum: 0}
        changed: {type: integer, minimum: 0, description: The decision would differ.}
        rule_changed: {type: integer, minimum: 0, description: The same decision, reached by a different rule.}
        unknown: {type: integer, minimum: 0, description: Counted but not evaluated (see `unknown`); never guessed.}
    HumanOutcome:
      type: object
      required: [approved, denied, expired, cancelled, pending]
      description: >-
        What people did with the actions of a transition out of `require_approval` (for a replay,
        a transition from it; for the shadow report, an enforced `require_approval`).
      properties:
        approved: {type: integer, minimum: 0}
        denied: {type: integer, minimum: 0}
        expired: {type: integer, minimum: 0}
        cancelled: {type: integer, minimum: 0}
        pending: {type: integer, minimum: 0}
        not_requested: {type: integer, minimum: 0, description: 'A `version` baseline: the decision recorded at the time wasn''t an approval.'}
    RuleCount:
      type: object
      required: [rule_id, count]
      properties:
        rule_id: {type: string, description: 'The deciding rule; `@default` for the policy''s default.'}
        count: {type: integer, minimum: 0}
    ToolCount:
      type: object
      required: [tool, count]
      properties:
        tool: {type: string}
        count: {type: integer, minimum: 0}
    AgentCount:
      type: object
      required: [agent, count]
      properties:
        agent: {type: string, description: The agent id (`agt_…`).}
        name: {type: string}
        count: {type: integer, minimum: 0}
    Transition:
      type: object
      required: [from, to, count, by_rule, by_tool, samples]
      description: Every action whose decision would change from `from` (the baseline) to `to` (the candidate).
      properties:
        from: {type: string, enum: [allow, deny, require_approval]}
        to: {type: string, enum: [allow, deny, require_approval]}
        count: {type: integer, minimum: 1}
        human_outcome:
          $ref: "#/components/schemas/HumanOutcome"
        by_rule:
          type: array
          description: The candidate's deciding rule, most actions first.
          items: {$ref: "#/components/schemas/RuleCount"}
        by_tool:
          type: array
          items: {$ref: "#/components/schemas/ToolCount"}
        samples:
          type: array
          maxItems: 20
          description: The first 20 action ids by decision time.
          items: {type: string}
    RuleChange:
      type: object
      required: [decision, from_rule, to_rule, count, samples]
      description: The same decision, reached by a different rule.
      properties:
        decision: {type: string, enum: [allow, deny, require_approval]}
        from_rule: {type: string}
        to_rule: {type: string}
        count: {type: integer, minimum: 1}
        samples:
          type: array
          maxItems: 20
          items: {type: string}
    UnknownCounts:
      type: object
      required: [input_pruned, input_missing, input_version_unsupported, input_unreadable, evaluation_time_limit]
      description: Actions a replay counted but couldn't evaluate, by reason.
      properties:
        input_pruned: {type: integer, minimum: 0, description: Retention removed the stored decision input.}
        input_missing: {type: integer, minimum: 0, description: Recorded before decision inputs were stored.}
        input_version_unsupported: {type: integer, minimum: 0, description: A stored input in a newer format.}
        input_unreadable: {type: integer, minimum: 0, description: A stored input that doesn't decode.}
        evaluation_time_limit: {type: integer, minimum: 0, description: The evaluation hit its time limit.}
    SQLGuardDrift:
      type: object
      required: [recorded, current]
      description: >-
        The sqlguard versions recorded with the decisions, next to the current one. SQL facts are
        computed again at replay, so a difference is shown, never hidden.
      properties:
        recorded: {type: array, items: {type: string}}
        current: {type: string}
    Replay:
      type: object
      required: [object, id, status, purpose, candidate, baseline, window, progress, requested_by, attempts, created_at, started_at, finished_at, error]
      description: >-
        A replay job (S27): what it replays, its progress and, once `status` is `succeeded`, its
        result (`summary` through `elapsed_ms`; `transitions` and `rule_changes` are absent when
        there are none). `elapsed_ms` is not part of `result_digest`.
      properties:
        object: {type: string, const: replay}
        id: {type: string, pattern: "^rpl_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        status: {type: string, enum: [queued, running, succeeded, failed, cancelled]}
        purpose: {type: string, enum: [manual, suggestion]}
        candidate:
          $ref: "#/components/schemas/ReplayCandidate"
        baseline:
          $ref: "#/components/schemas/ReplayBaseline"
        window:
          $ref: "#/components/schemas/InsightsWindow"
        progress:
          $ref: "#/components/schemas/ReplayProgress"
        requested_by:
          $ref: "#/components/schemas/InsightsActor"
        attempts: {type: integer, minimum: 0, description: Runs started. A runner that lost its lease starts again from zero.}
        created_at: {type: string, format: date-time}
        started_at: {type: [string, "null"], format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
        error:
          type: [object, "null"]
          required: [code, message]
          description: A failed replay's cause.
          properties:
            code: {type: string, enum: [candidate_invalid, replay_too_large, replay_window_invalid, internal_error]}
            message: {type: string}
        summary:
          $ref: "#/components/schemas/ReplaySummary"
        transitions:
          type: array
          items: {$ref: "#/components/schemas/Transition"}
        rule_changes:
          type: array
          items: {$ref: "#/components/schemas/RuleChange"}
        unknown:
          $ref: "#/components/schemas/UnknownCounts"
        sqlguard:
          $ref: "#/components/schemas/SQLGuardDrift"
        result_digest:
          allOf:
            - $ref: "#/components/schemas/Digest"
          description: The same inputs, candidate, baseline and sqlguard version give the same digest.
        elapsed_ms: {type: integer, minimum: 0}
    ReplayList:
      type: object
      required: [object, data, has_more, next_cursor]
      properties:
        object: {type: string, const: list}
        data:
          type: array
          items: {$ref: "#/components/schemas/Replay"}
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
    CostRow:
      type: object
      required: [currency, total, p50, p95]
      description: One currency's cost, in integer minor units (cents for usd).
      properties:
        currency: {type: string, examples: [usd]}
        total: {type: integer}
        p50: {type: number}
        p95: {type: number}
    StatsTrend:
      type: object
      required: [previous]
      description: >-
        Against the previous window of the same length: `delta_pct` for counts, `delta_pp`
        (percentage points) for rates. Only `previous: null` when that window has fewer than 20
        actions.
      properties:
        delta_pct: {type: number}
        delta_pp: {type: number}
        previous: {type: [number, "null"]}
    StatsGroup:
      type: object
      required: [actions, decisions, approval, deny_rate, verdicts, levels, executed, mismatch_rate, unverifiable_rate, latency_ms, cost]
      description: >-
        One group's numbers (or the totals, which have no `key`). Rates are rounded to 4 decimals:
        `deny_rate = deny / actions` with Stop decisions left out of both, `mismatch_rate` and
        `unverifiable_rate` over `executed`.
      properties:
        key:
          type: object
          description: '`rule_id`, `tool`, or `agent` with its `name`, by `by`.'
          properties:
            rule_id: {type: string}
            tool: {type: string}
            agent: {type: string}
            name: {type: string}
        versions: {type: array, items: {type: integer}, description: '`by=rule`: the policy versions whose rule decided.'}
        actions: {type: integer, minimum: 0}
        decisions:
          type: object
          required: [allow, deny, require_approval]
          properties:
            allow: {type: integer, minimum: 0}
            deny: {type: integer, minimum: 0}
            require_approval: {type: integer, minimum: 0}
        approval:
          type: object
          required: [requested, approved, denied, expired, cancelled, pending, rate, median_seconds, p95_seconds]
          properties:
            requested: {type: integer, minimum: 0}
            approved: {type: integer, minimum: 0}
            denied: {type: integer, minimum: 0}
            expired: {type: integer, minimum: 0}
            cancelled: {type: integer, minimum: 0}
            pending: {type: integer, minimum: 0}
            rate: {type: [number, "null"], description: approved / (approved + denied); null when none was decided.}
            median_seconds: {type: [integer, "null"], description: From the request to the decision.}
            p95_seconds: {type: [integer, "null"]}
        deny_rate: {type: number}
        verdicts:
          type: object
          required: [VERIFIED, MISMATCH, UNVERIFIABLE, none]
          properties:
            VERIFIED: {type: integer, minimum: 0}
            MISMATCH: {type: integer, minimum: 0}
            UNVERIFIABLE: {type: integer, minimum: 0}
            none: {type: integer, minimum: 0, description: Actions with no verdict (not executed).}
        levels:
          type: object
          required: [L0, L1, L2]
          properties:
            L0: {type: integer, minimum: 0}
            L1: {type: integer, minimum: 0}
            L2: {type: integer, minimum: 0}
        executed: {type: integer, minimum: 0}
        mismatch_rate: {type: number}
        unverifiable_rate: {type: number}
        latency_ms:
          type: object
          required: [p50, p95]
          properties:
            p50: {type: [integer, "null"]}
            p95: {type: [integer, "null"]}
        cost:
          type: array
          items: {$ref: "#/components/schemas/CostRow"}
        trend:
          type: object
          description: '`compare=previous` only. Keys: `actions`, `deny_rate`, `mismatch_rate`, `unverifiable_rate`, and `approval_rate` when both windows have one.'
          additionalProperties:
            $ref: "#/components/schemas/StatsTrend"
    BudgetUse:
      type: object
      required: [agent, budget, kind, limit, max_utilisation, days_over_80, days]
      description: One budget's daily use over the window, by the org's days.
      properties:
        agent: {type: [string, "null"], description: The agent (`agt_…`) for an agent budget; null for a policy budget.}
        name: {type: string, description: The agent's name, for an agent budget.}
        budget: {type: string, description: 'A policy budget id, or `agent.calls_per_day` / `agent.spend_per_day`.'}
        kind: {type: string, enum: [policy, agent]}
        limit:
          type: object
          description: A calls limit, or an amount in minor units with its currency.
          properties:
            calls: {type: integer}
            amount: {type: integer}
            currency: {type: string}
        max_utilisation: {type: number}
        days_over_80: {type: integer, minimum: 0}
        days:
          type: array
          items:
            type: object
            required: [date, used, utilisation]
            properties:
              date: {type: string, format: date}
              used: {type: integer, minimum: 0}
              utilisation: {type: number}
    SeriesRow:
      type: object
      required: [date, actions, denied, verified, mismatch, unverifiable]
      description: One org-local day.
      properties:
        date: {type: string, format: date}
        actions: {type: integer, minimum: 0}
        denied: {type: integer, minimum: 0}
        verified: {type: integer, minimum: 0}
        mismatch: {type: integer, minimum: 0}
        unverifiable: {type: integer, minimum: 0}
    InsightsStats:
      type: object
      required: [object, window, timezone, by, filters, totals, groups, budgets, series, generated_at, empty]
      properties:
        object: {type: string, const: insights_stats}
        window:
          type: object
          required: [from, to, days]
          properties:
            from: {type: string, format: date-time}
            to: {type: string, format: date-time}
            days: {type: number}
        timezone: {type: string, description: The org's time zone; days and hours follow it.}
        by: {type: string, enum: [rule, tool, agent, none]}
        filters:
          type: object
          required: [agent, tool]
          properties:
            agent: {type: [string, "null"]}
            tool: {type: [string, "null"]}
        totals:
          $ref: "#/components/schemas/StatsGroup"
        groups:
          type: array
          description: Empty for `by=none`.
          items: {$ref: "#/components/schemas/StatsGroup"}
        budgets:
          type: array
          items: {$ref: "#/components/schemas/BudgetUse"}
        series:
          type: array
          items: {$ref: "#/components/schemas/SeriesRow"}
        generated_at: {type: string, format: date-time}
        empty: {type: [string, "null"], description: The sentence when the window has no actions.}
    ShadowVersion:
      type: object
      required: [policy, name, version, version_id, live]
      properties:
        policy: {type: string, description: The policy id (`pol_…`).}
        name: {type: string}
        version: {type: integer, minimum: 1}
        version_id: {type: string, description: The version id (`pv_…`).}
        live: {type: boolean, description: It is the active shadow version now.}
        since: {type: string, format: date-time, description: When it became the shadow version.}
    ShadowTransition:
      type: object
      required: [enforce, shadow, count, by_rule, by_tool, by_agent, samples]
      description: Every action the shadow version would have decided differently.
      properties:
        enforce: {type: string, enum: [allow, deny, require_approval]}
        shadow: {type: string, enum: [allow, deny, require_approval]}
        count: {type: integer, minimum: 1}
        human_outcome:
          $ref: "#/components/schemas/HumanOutcome"
        by_rule:
          type: array
          description: The shadow version's deciding rule.
          items: {$ref: "#/components/schemas/RuleCount"}
        by_tool:
          type: array
          items: {$ref: "#/components/schemas/ToolCount"}
        by_agent:
          type: array
          items: {$ref: "#/components/schemas/AgentCount"}
        samples:
          type: array
          maxItems: 20
          items: {type: string}
    ShadowReport:
      type: object
      required: [object, shadow, enforce, window, summary, transitions, sentence]
      properties:
        object: {type: string, const: shadow_report}
        shadow:
          $ref: "#/components/schemas/ShadowVersion"
        enforce:
          type: array
          description: The enforced versions that decided the report's actions.
          items:
            type: object
            required: [name, version, version_id, actions]
            properties:
              name: {type: string}
              version: {type: integer}
              version_id: {type: string}
              actions: {type: integer, minimum: 0}
        window:
          type: object
          required: [from, to]
          properties:
            from: {type: [string, "null"], format: date-time}
            to: {type: [string, "null"], format: date-time}
        summary:
          type: object
          required: [evaluated, agree, disagree, agreement]
          properties:
            evaluated: {type: integer, minimum: 0}
            agree: {type: integer, minimum: 0}
            disagree: {type: integer, minimum: 0}
            agreement: {type: number, description: agree / evaluated, 4 decimals.}
        transitions:
          type: array
          items: {$ref: "#/components/schemas/ShadowTransition"}
        sentence: {type: string, description: The one line the Console and the CLI print.}
    AnomalyKind:
      type: string
      enum: [new_tool, volume_spike, off_hours, deny_spike, mismatch_spike, user_ref_burst]
    Anomaly:
      type: object
      required: [object, id, agent, kind, tool, severity, score, title, status, active, active_until, window, occurrences, evidence, detector_version, acknowledged, resolved, created_at, updated_at]
      description: >-
        An anomaly episode (S27): the unresolved series of findings for one agent, kind and tool.
        A signal for a person to review, not a verdict. `active` (until `active_until`) is what
        `anomaly.active` sees; `status` is the review inbox.
      properties:
        object: {type: string, const: anomaly}
        id: {type: string, pattern: "^anm_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        agent:
          type: object
          required: [id, name]
          properties:
            id: {type: string}
            name: {type: string}
        kind:
          $ref: "#/components/schemas/AnomalyKind"
        tool: {type: [string, "null"], description: '`new_tool` only.'}
        severity: {type: string, enum: [info, warn, high]}
        score: {type: number}
        title: {type: string, description: Numbers first, in the org's time zone.}
        status: {type: string, enum: [open, acknowledged, resolved]}
        active: {type: boolean}
        active_until: {type: string, format: date-time}
        window:
          type: object
          required: [start, end]
          description: When the episode's findings happened (decision time).
          properties:
            start: {type: string, format: date-time}
            end: {type: string, format: date-time}
        occurrences: {type: integer, minimum: 1}
        evidence:
          type: object
          description: >-
            What the detector saw. Always `hour`, `timezone`, `window_start`, `window_end`,
            `history_hours`, `points` (at most 48 hourly points) and `action_ids` (at most 10).
            By kind: `count`, `factor`, `writes`, `share`, `deny_rate`, `baseline_rate`,
            `mismatches`, `new_refs`, `baseline_mean`, `baseline_stddev`, `tool`, `side_effect`.
          properties:
            hour: {type: string}
            timezone: {type: string}
            window_start: {type: string, format: date-time}
            window_end: {type: string, format: date-time}
            history_hours: {type: integer}
            count: {type: integer}
            points:
              type: array
              maxItems: 48
              items:
                type: object
                properties:
                  count: {type: number}
                  score: {type: number}
                  window_start: {type: string, format: date-time}
                  window_end: {type: string, format: date-time}
            action_ids: {type: array, maxItems: 10, items: {type: string}}
        detector_version: {type: string}
        acknowledged:
          type: [object, "null"]
          required: [by, at]
          properties:
            by: {type: string, description: '`usr_…` or `key_…`.'}
            at: {type: string, format: date-time}
        resolved:
          type: [object, "null"]
          required: [by, at, reason, deed]
          properties:
            by: {type: string, description: '`usr_…`, `key_…`, or `system` for the 14-day close.'}
            at: {type: string, format: date-time}
            reason: {type: [string, "null"]}
            deed: {type: [string, "null"], description: The `anomaly.resolved` admin deed; null for the 14-day close.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AnomalyList:
      type: object
      required: [object, data, has_more, next_cursor, active_now, anomaly_facts, notice, baseline_building]
      description: The list envelope, plus what the inbox says about the org (additive fields).
      properties:
        object: {type: string, const: list}
        data:
          type: array
          items: {$ref: "#/components/schemas/Anomaly"}
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
        active_now: {type: integer, minimum: 0, description: Episodes active now.}
        anomaly_facts: {type: boolean, description: This org's policies see `anomaly.*`.}
        notice: {type: [string, "null"], description: The sentence when a policy reads anomaly facts but they are off.}
        baseline_building:
          type: array
          description: Agents with under 72 hours of history; only `new_tool` can fire for them.
          items:
            type: object
            required: [agent, name, hours, sentence]
            properties:
              agent: {type: string}
              name: {type: string}
              hours: {type: integer, minimum: 0}
              sentence: {type: string}
    AnomalyEventObject:
      type: object
      required: [object, id, agent, kind, severity, status]
      description: >-
        `data.object` of `anomaly.detected` (S27): the episode as ids and states. Sent when an
        episode opens and on each new occurrence, never per finding.
      properties:
        object: {type: string, const: anomaly}
        id: {type: string, description: The anomaly id (`anm_…`).}
        agent: {type: string, description: The agent id (`agt_…`).}
        kind:
          $ref: "#/components/schemas/AnomalyKind"
        tool: {type: string, description: '`new_tool` only.'}
        severity: {type: string, enum: [info, warn, high]}
        status: {type: string, const: open, description: An episode is open when it is detected.}
      examples:
        - {object: anomaly, id: anm_01m42vb27wzpyw0b2n6aycjxkh, agent: agt_01m42v9q4500m4rfchvb8j53da, kind: volume_spike, severity: high, status: open}
    Suggestion:
      type: object
      description: A policy change Insights proposes, with its evidence, diff, replay and risk (S28). Nothing applies until a person accepts it, and accepting only runs it in shadow.
      required: [object, id, status, kind, generator, title, rationale, phrasing, policy, target_rule_id, evidence, evidence_digest, diff, warnings, replay, risk_note, impact, stale_reason, created_at, decided_by, decided_at, decision_reason, resulting_version, decision_deed]
      properties:
        object: {type: string, const: suggestion}
        id: {type: string, pattern: '^sug_[0-7][0-9a-hjkmnp-tv-z]{25}$'}
        status: {type: string, enum: [open, accepting, accepted, rejected, superseded]}
        kind: {type: string, enum: [loosen, tighten, budget, explicit_rule, advisory]}
        generator: {type: string, enum: [loosen.approval_rate, tighten.mismatch, tighten.verify_level, budget.near_limit, explicit_rule.default_hit, advisory.deny_heavy]}
        title: {type: string}
        rationale: {type: string}
        phrasing:
          type: object
          required: [source]
          properties:
            source: {type: string, enum: [template, claude]}
            model: {type: string}
            reason: {type: string, description: Why the template wording stands (validation:…, refusal, timeout, http_429, …).}
            input_tokens: {type: integer}
            output_tokens: {type: integer}
            cost_usd_micros: {type: integer}
            duration_ms: {type: integer}
            at: {type: string, format: date-time}
            template_title: {type: string, description: When worded by Claude, the template title it replaced.}
        policy:
          type: object
          required: [id, name, base_version, base_version_id, base_version_hash]
          properties:
            id: {type: string}
            name: {type: string}
            base_version: {type: integer, description: The enforced version the suggestion was written for.}
            base_version_id: {type: string}
            base_version_hash: {type: string}
        target_rule_id: {type: [string, "null"]}
        evidence: {type: object, description: 'The numbers that triggered it: window, approvals, median_wait_seconds, approvers, agents, tool, pattern, sample_actions (loosen); mismatches (tighten); days and limits (budget); and so on per generator.'}
        evidence_digest: {type: string}
        diff:
          type: [object, "null"]
          description: The change as unified hunks with 3 lines of context; null for advice.
          properties:
            hunks:
              type: array
              items:
                type: object
                properties:
                  old_start: {type: integer}
                  old_lines: {type: integer}
                  new_start: {type: integer}
                  new_lines: {type: integer}
                  lines: {type: array, items: {type: object, properties: {op: {type: string, enum: [" ", "+", "-"]}, text: {type: string}}}}
            text: {type: string}
            added: {type: integer}
            removed: {type: integer}
        warnings: {type: array, items: {type: object}, description: The candidate's compile warnings (severity warning).}
        replay:
          type: [object, "null"]
          description: The change replayed against the same 14 days, compared with the enforced version.
          properties:
            id: {type: string, description: The replay (`rpl_…`, purpose suggestion).}
            window: {type: object}
            summary: {type: object}
            transitions: {type: array, items: {type: object}}
            result_digest: {type: string}
        risk_note: {type: string}
        impact: {type: integer, description: Actions whose decision the replay changes.}
        stale_reason: {type: [string, "null"], enum: [base_changed, null]}
        created_at: {type: string, format: date-time}
        decided_by: {type: [object, "null"], properties: {type: {type: string, enum: [user, api_key]}, id: {type: string}}}
        decided_at: {type: [string, "null"], format: date-time}
        decision_reason: {type: [string, "null"]}
        resulting_version: {type: [object, "null"], properties: {id: {type: string}, version: {type: integer}, version_hash: {type: string}}}
        decision_deed: {type: [string, "null"]}
        deeds: {type: array, items: {type: string}, description: 'Accept and reject answers only: the deeds sealed, in order.'}
        replaced_shadow_version: {type: integer, description: Accept only, when the shadow it replaced.}
        note: {type: string, description: Accept only, when the change already existed as a version.}
    LearnRun:
      type: object
      required: [object, kind, period, policy, window, actions, created, superseded, unchanged, waiting, dropped, notice, elapsed_ms]
      properties:
        object: {type: string, const: learn_run}
        kind: {type: string, const: suggest}
        period: {type: string}
        policy: {type: [object, "null"]}
        window: {type: object}
        actions: {type: integer}
        created: {type: array, items: {type: object, properties: {id: {type: string}, kind: {type: string}, generator: {type: string}, target_rule_id: {type: string}, target: {type: string}, title: {type: string}, impact: {type: integer}}}}
        superseded: {type: integer}
        unchanged: {type: integer}
        waiting: {type: integer}
        dropped: {type: array, items: {type: object, properties: {generator: {type: string}, target: {type: string}, reason: {type: string}}}}
        notice: {type: [string, "null"]}
        elapsed_ms: {type: integer}
    InsightsSettings:
      type: object
      required: [object, anomaly_facts, anomaly_active_minutes, anomaly_stale_after_minutes, active_policy_reads_anomaly, notice]
      properties:
        object: {type: string, const: insights_settings}
        anomaly_facts: {type: boolean, description: This org's policies see `anomaly.*`. Off by default.}
        anomaly_active_minutes: {type: integer, minimum: 5, maximum: 1440, description: How long an episode stays active after its last finding (default 60).}
        anomaly_stale_after_minutes:
          type: integer
          minimum: 10
          maximum: 240
          description: >-
            With the facts on, a detection pass older than this makes every agent anomalous
            (`detector_stale`), because unknown isn't usual (default 15).
        active_policy_reads_anomaly: {type: boolean, description: The enforced or shadow policy reads `anomaly.*`.}
        notice: {type: [string, "null"], description: The sentence when a policy reads anomaly facts but they are off.}
        llm_phrasing: {type: boolean, description: 'S28: Claude may reword suggestions (off by default; needs the operator''s DEEDGLASS_ANTHROPIC_API_KEY).'}
        llm_monthly_cap_cents: {type: integer, minimum: 0, maximum: 10000, description: The month's phrasing spend cap in cents (default 200).}
        digest: {type: object, properties: {recipients: {type: string, enum: [owners, admins, "off"]}}, description: Who gets the weekly digest (default owners).}
        phrasing_available: {type: boolean, description: The server has an Anthropic key, so llm_phrasing can be on.}
