          properties:
            amount: {type: integer, minimum: 0, description: Minor units.}
            currency: {type: string, pattern: "^[a-z]{3}$"}
      examples:
        - {calls_minute: 3, calls_hour: 41, calls_today: 212, spend_today: {amount: 1200, currency: usd}}
