        prefix: {type: string, pattern: "^dg_(live|test)_[0-9A-Za-z]{8}$", description: 'How the key is displayed: `dg_live_jJbEEMWk_••••`.'}
        scopes:
          type: array
          items: {type: string, enum: ["actions:execute", "actions:read", "deeds:read", "actions:undo", admin]}
        expires_at: {type: [string, "null"], format: date-time, description: Set when the key was rolled.}
        last_used_at: {type: [string, "null"], format: date-time}
        revoked_at: {type: [string, "null"], format: date-time}
        rolled_from: {type: [string, "null"], description: The key this one replaced (`key_…`).}
        created_at: {type: string, format: date-time}
      examples:
        - object: api_key
          id: key_01k6jz12ptrvg2zn5vts5xc1ay
          agent: agt_01k633rrmh3bcz2p39gg4vp46q
          name: prod runner
          mode: live
          prefix: dg_live_jJbEEMWk
          scopes: ["actions:execute", "actions:read", "deeds:read"]
          expires_at: null
          last_used_at: "2026-10-03T14:01:58.512Z"
          revoked_at: null
          rolled_from: null
          created_at: "2026-10-03T10:03:40.000Z"
