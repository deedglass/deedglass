  /v1/insights/shadow:
    get:
      operationId: getShadowReport
      summary: Get the shadow disagreement report
      description: >-
        Where the shadow policy and the enforced one disagreed on live traffic (S27): the actions
        the shadow version evaluated, how many it agreed on (`agreement = agree / evaluated`, 4
        decimals), and every disagreement as a transition from the enforced decision to the shadow
        one, by rule (the shadow's deciding rule), tool and agent, with the first 20 action ids
        and, for actions the enforced policy sent to approval, what people did with them.
        `enforce` lists the enforced versions that decided those actions. `sentence` is the one
        line the Console and `deedglass insights shadow` print. Rows are chosen by the shadow
        version recorded on each action, never by activation time. `shadow_version` (a `pv_` id)
        reads a past shadow version; the default is the live one, and with none live the answer
        is 404 `not_found`. `from` and `to` (RFC 3339, each optional) narrow the window; `from`
        not before `to` is 400 `replay_window_invalid`. A Console session (viewer and up) or an
        org admin key (`admin` scope); agent keys get 403 `insufficient_scope`.
      tags: [Insights]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: shadow_version, in: query, required: false, description: A shadow version (`pv_…`). Default the live one., schema: {type: string}, example: pv_01m42va0ryp515cvtem633vqng}
        - {name: from, in: query, required: false, description: Actions decided at or after this time (RFC 3339)., schema: {type: string, format: date-time}}
        - {name: to, in: query, required: false, description: Actions decided before this time (RFC 3339)., schema: {type: string, format: date-time}}
      responses:
        "200":
          description: The report.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShadowReport"
              examples:
                live:
                  summary: acme-sim v2 in shadow next to v1 (three samples shown per transition)
                  value:
                    {"object": "shadow_report",
                     "shadow": {"policy": "pol_01m42v9q4bjwfqmk8bd58vzkdh", "name": "acme-sim", "version": 2, "version_id": "pv_01m42va0ryp515cvtem633vqng",
                                "live": true, "since": "2026-10-04T06:58:31.330501Z"},
                     "enforce": [{"name": "acme-sim", "version": 1, "version_id": "pv_01m42v9q4bjwfqmk8bd58vzkdj", "actions": 4179}],
                     "window": {"from": null, "to": null},
                     "summary": {"evaluated": 4179, "agree": 4004, "disagree": 175, "agreement": 0.9581},
                     "transitions": [
                       {"enforce": "allow", "shadow": "require_approval", "count": 158,
                        "by_rule": [{"rule_id": "refund-approval-over-30", "count": 158}],
                        "by_tool": [{"tool": "stripe.create_refund", "count": 158}],
                        "by_agent": [{"agent": "agt_01m42v9q3v1av7wvzjr1kq3mx1", "name": "support-bot", "count": 158}],
                        "samples": ["act_01m42va0xa6fjkr9xbwsst1fzw", "act_01m42va1567ecpzdb2g1td5n56", "act_01m42va1bf0w9q777sp2eqh2mq"]},
                       {"enforce": "allow", "shadow": "deny", "count": 17,
                        "by_rule": [{"rule_id": "slack-allowlist", "count": 17}],
                        "by_tool": [{"tool": "slack.post_message", "count": 17}],
                        "by_agent": [{"agent": "agt_01m42v9q4500m4rfchvb8j53da", "name": "growth-agent", "count": 17}],
                        "samples": ["act_01m42va25mvsydk6j93ee0wc9p", "act_01m42va2ered5fbrvrzkqzbqpq", "act_01m42va3gdnqdf3acgkxan6ebb"]}],
                     "sentence": "Shadow acme-sim v2 would have sent 158 actions to approval and denied 17 that v1 allowed (refund-approval-over-30: 158, slack-allowlist: 17)."}
        "404":
          description: No shadow policy is active (or no such version).
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  type: invalid_request_error
                  code: not_found
                  message: "No shadow policy is active in this org. Run one: deedglass policy activate <name> --version <n> --mode shadow --reason \"…\""
                  param: null
                  request_id: req_01m42vmb2c4e6g8j0m2p4r6t8v
                  doc_url: https://docs.deedglass.com/errors/not_found
        default:
          $ref: "#/components/responses/Error"
  /v1/insights/anomalies:
    get:
      operationId: listAnomalies
      summary: List anomalies
      description: >-
        Anomaly episodes, newest window first (S27). An episode is the unresolved series of
        findings for one agent, kind and tool; anomalies are signals for a person to review, not
        verdicts. `status` is `open` and `acknowledged` by default; `resolved` or `all` for the
        rest. Filters: `agent` (an `agt_` id), `kind` and `since` (episodes whose window ends at or
        after it), with `limit` (1 to 100, default 25) and `cursor`. The list object adds what the
        inbox says about the org: `active_now` (episodes active now), `anomaly_facts` (whether this
        org's policies see `anomaly.*`), `notice` (the sentence when a policy reads anomaly facts
        but they are off) and `baseline_building` (agents with under 72 hours of history, for which
        only `new_tool` can fire). Any other parameter, or one sent twice, is 400
        `validation_failed`. A Console session (viewer and up) or an org admin key (`admin`
        scope); agent keys get 403 `insufficient_scope`.
      tags: [Insights]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: status, in: query, required: false, description: Default open and acknowledged., schema: {type: string, enum: [open, acknowledged, resolved, all]}}
        - {name: agent, in: query, required: false, description: Only this agent's episodes (`agt_…`)., schema: {type: string}}
        - {name: kind, in: query, required: false, schema: {$ref: "#/components/schemas/AnomalyKind"}}
        - {name: since, in: query, required: false, description: Episodes whose window ends at or after this time (RFC 3339)., schema: {type: string, format: date-time}}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of anomalies, with the inbox's header facts.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomalyList"
              examples:
                inbox:
                  summary: Two open episodes (evidence trimmed to three action ids)
                  value:
                    {"object": "list", "has_more": false, "next_cursor": null, "active_now": 0, "anomaly_facts": false, "notice": null, "baseline_building": [],
                     "data": [
                       {"object": "anomaly", "id": "anm_01m42vb27wzpyw0b2n6aycjxkh", "agent": {"id": "agt_01m42v9q4500m4rfchvb8j53da", "name": "growth-agent"},
                        "kind": "volume_spike", "tool": null, "severity": "high", "score": 22.8,
                        "title": "85 calls, 14:00 to 15:00 IST · 34.8× its usual 2.4", "status": "open", "active": false,
                        "active_until": "2026-10-02T10:30:00Z", "window": {"start": "2026-10-02T08:30:00Z", "end": "2026-10-02T09:30:00Z"}, "occurrences": 1,
                        "evidence": {"hour": "14:00", "count": 85, "factor": 34.8, "writes": 85, "timezone": "IST",
                                     "points": [{"count": 85, "score": 22.8, "window_start": "2026-10-02T08:30:00.000Z", "window_end": "2026-10-02T09:30:00.000Z"}],
                                     "action_ids": ["act_01m42vak3h51dq7hv3vvv3dgv2", "act_01m42vak4fsmgfq9m2nx3cezp5", "act_01m42vak4n1bnq8sj24k4r93yk"],
                                     "window_start": "2026-10-02T08:30:00Z", "window_end": "2026-10-02T09:30:00Z",
                                     "baseline_mean": 2.44, "baseline_stddev": 3.62, "history_hours": 122},
