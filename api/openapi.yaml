            version_hash: sha256:3e23e8160039594a33894f6564e1b1348bbd7a0088d42c4acb73eeaed59c009d
            activation: pa_01jb8p0z2b4d6f8h0k2n4q6s8v
            activated_at: "2026-10-06T11:40:02.000Z"
