        A person denies (S22): a veto, final at once. `reason` is required (at most 280 characters;
        the agent sees it). The action is denied and sealed in the same transaction. Same rules as
        approve, except the person the action runs on behalf of may deny.
      tags: [Approvals]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
