        status: {type: string, enum: [enforced, shadow, inactive]}
        version_hash:
          $ref: "#/components/schemas/Digest"
        source_hash:
          $ref: "#/components/schemas/Digest"
        lang: {type: string, const: deedglass.policy/v1}
        origin:
          type: string
          enum: [manual, suggestion, starter, onboarding]
          description: Where the version came from. A person or an admin key pushing it is `manual`.
        author:
          $ref: "#/components/schemas/PolicyActorRef"
        notes: {type: [string, "null"], maxLength: 2000}
        rules: {type: integer, minimum: 0}
        budgets: {type: integer, minimum: 0}
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/PolicyDiagnostic"
        source: {type: string, description: The YAML exactly as pushed (single get only).}
        created_at: {type: string, format: date-time}
