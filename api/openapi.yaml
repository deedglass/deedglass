      description: A new policy, with its first version.
      allOf:
        - $ref: "#/components/schemas/Policy"
        - type: object
          required: [version]
          properties:
            version:
              $ref: "#/components/schemas/PolicyVersion"
    PolicyList:
      type: object
      required: [object, data, has_more, next_cursor]
      description: A page of policies.
      properties:
        object: {type: string, const: list}
        data:
          type: array
          items:
            $ref: "#/components/schemas/Policy"
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
    PolicyVersion:
      type: object
      required: [object, id, policy, version, name, status, version_hash, source_hash, lang, origin, author, notes, rules, budgets, warnings, created_at]
      description: >-
        One immutable version of a policy. `source` is present on a single get only.
        `version_hash` is the hash of the normalized policy, so formatting and comments don't
        change it; `source_hash` is the hash of the exact bytes pushed.
      properties:
        object: {type: string, const: policy_version}
        id: {type: string, pattern: "^pv_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        policy: {type: string, pattern: "^pol_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        version: {type: integer, minimum: 1}
        name: {type: string}
        status: {type: string, enum: [enforced, shadow, inactive]}
        version_hash:
          $ref: "#/components/schemas/Digest"
        source_hash:
          $ref: "#/components/schemas/Digest"
        lang: {type: string, const: deedglass.policy/v1}
        origin:
          type: string
          enum: [manual, suggestion, starter, onboarding]
          description: Where the version came from. A person or an admin key pushing it is `manual`.
        author:
          $ref: "#/components/schemas/PolicyActorRef"
        notes: {type: [string, "null"], maxLength: 2000}
        rules: {type: integer, minimum: 0}
        budgets: {type: integer, minimum: 0}
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/PolicyDiagnostic"
        source: {type: string, description: The YAML exactly as pushed (single get only).}
        created_at: {type: string, format: date-time}
      examples:
        - object: policy_version
          id: pv_01jb8m3c0d2f4g6h8j0k2m4n6p
          policy: pol_01jb8m2x7k4q9r3t5v6w8y0z1a
          version: 3
          name: postgres-safe
          status: enforced
          version_hash: sha256:3e23e8160039594a33894f6564e1b1348bbd7a0088d42c4acb73eeaed59c009d
          source_hash: sha256:2e7d2c03a9507ae265ecf5b5356885a53393a2029d241394997265a1a25aefc6
          lang: deedglass.policy/v1
          origin: manual
          author: {object: user, id: usr_01k6c9kb2zcjsyn7b8g2k1vqvp}
          notes: Allow-list writes to public.orders for the pilot.
          rules: 12
          budgets: 2
          warnings: []
          created_at: "2026-10-06T11:38:15.000Z"
    PolicyVersionList:
      type: object
      required: [object, data, has_more, next_cursor]
      description: A page of versions, without `source`.
      properties:
        object: {type: string, const: list}
        data:
          type: array
          items:
            $ref: "#/components/schemas/PolicyVersion"
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
    PolicyActivation:
      type: object
      required: [object, id, policy, name, mode, version, previous, promoted_from_shadow, acknowledged_warnings, reason, activated_by, activated_at, deactivated_at, deactivated_by, deeds]
      description: >-
        One activation of a version, as enforce or shadow, with the deeds that sealed it. `deeds`
        is in seal order: one deed, or two for a promote from shadow (the shadow ending, then the
        version enforced).
      properties:
        object: {type: string, const: policy_activation}
        id: {type: string, pattern: "^pa_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        policy: {type: string, pattern: "^pol_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        name: {type: string}
        mode: {type: string, enum: [enforce, shadow]}
        version:
          type: object
          required: [id, version, version_hash]
          properties:
            id: {type: string, pattern: "^pv_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
            version: {type: integer, minimum: 1}
            version_hash:
              $ref: "#/components/schemas/Digest"
        previous:
          type: [object, "null"]
          required: [policy, name, version]
          description: The activation this one replaced in the same mode; null when there was none.
          properties:
            policy: {type: string}
            name: {type: string}
            version: {type: integer, minimum: 1}
        promoted_from_shadow: {type: boolean, description: True when the version was the shadow policy and is now enforced.}
        acknowledged_warnings:
          type: array
          description: The warning codes accepted for this activation, sorted.
          items: {type: string}
        reason: {type: string, minLength: 3, maxLength: 280}
        activated_by:
          $ref: "#/components/schemas/PolicyActorRef"
        activated_at: {type: string, format: date-time}
        deactivated_at: {type: [string, "null"], format: date-time}
        deactivated_by:
          description: Who switched it off; null while it is live.
          anyOf:
            - $ref: "#/components/schemas/PolicyActorRef"
            - type: "null"
        deeds:
          type: array
          minItems: 1
          items: {type: string, pattern: "^deed_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
      examples:
        - object: policy_activation
          id: pa_01jb8p0z2b4d6f8h0k2n4q6s8v
          policy: pol_01jb8m2x7k4q9r3t5v6w8y0z1a
          name: postgres-safe
          mode: enforce
          version: {id: pv_01jb8m3c0d2f4g6h8j0k2m4n6p, version: 3, version_hash: "sha256:3e23e8160039594a33894f6564e1b1348bbd7a0088d42c4acb73eeaed59c009d"}
          previous: {policy: pol_01jb8m2x7k4q9r3t5v6w8y0z1a, name: postgres-safe, version: 2}
          promoted_from_shadow: true
          acknowledged_warnings: []
          reason: Guard the orders database before the pilot.
          activated_by: {object: user, id: usr_01k6c9kb2zcjsyn7b8g2k1vqvp}
          activated_at: "2026-10-06T11:40:02.000Z"
          deactivated_at: null
          deactivated_by: null
          deeds: [deed_01jb8p0y1a3c5e7g9j1m3p5r7t, deed_01k6vrddq2atgb2023qvhhct3g]
    PolicyActiveEntry:
      type: object
      required: [policy, name, version, version_id, version_hash, activation, activated_at, deed]
      description: One live activation in the active set.
      properties:
        policy: {type: string, pattern: "^pol_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        name: {type: string}
        version: {type: integer, minimum: 1}
        version_id: {type: string, pattern: "^pv_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        version_hash:
          $ref: "#/components/schemas/Digest"
        activation: {type: string, pattern: "^pa_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        activated_at: {type: string, format: date-time}
        deed: {type: string, description: The deed that sealed the activation.}
    PolicyActiveSet:
      type: object
      required: [object, enforce, shadow]
      description: The org's enforced and shadow policies; each is null when there is none.
      properties:
        object: {type: string, const: policy_active_set}
        enforce:
          anyOf:
            - $ref: "#/components/schemas/PolicyActiveEntry"
            - type: "null"
        shadow:
          anyOf:
            - $ref: "#/components/schemas/PolicyActiveEntry"
            - type: "null"
      examples:
        - object: policy_active_set
          enforce:
            policy: pol_01jb8m2x7k4q9r3t5v6w8y0z1a
            name: postgres-safe
            version: 3
            version_id: pv_01jb8m3c0d2f4g6h8j0k2m4n6p
            version_hash: sha256:3e23e8160039594a33894f6564e1b1348bbd7a0088d42c4acb73eeaed59c009d
            activation: pa_01jb8p0z2b4d6f8h0k2n4q6s8v
            activated_at: "2026-10-06T11:40:02.000Z"
            deed: deed_01k6vrddq2atgb2023qvhhct3g
          shadow: null
    PolicyLintResult:
      type: object
      required: [object, file, valid, name, version_hash, rules, budgets, errors, warnings]
      description: What the compiler found. `valid` is false when `errors` is not empty.
      properties:
        object: {type: string, const: policy_lint_result}
        file: {type: string, description: Empty for the API.}
        valid: {type: boolean}
        name: {type: [string, "null"], description: The policy's name, when the YAML gives one.}
        version_hash: {type: [string, "null"], pattern: "^sha256:[0-9a-f]{64}$", description: Null when the policy is invalid.}
        rules: {type: integer, minimum: 0}
        budgets: {type: integer, minimum: 0}
        errors:
          type: array
          items:
            $ref: "#/components/schemas/PolicyDiagnostic"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/PolicyDiagnostic"
    PolicyTraceStep:
      type: object
      required: [step, result, detail]
      description: One line of an explain trace.
      properties:
        step: {type: string, enum: [stop, budget, rule, default]}
        id: {type: string, description: The rule or budget id.}
        line: {type: integer, minimum: 1, description: The rule's line in the policy file.}
        result: {type: string, enum: [pass, match, no_match, error, exceeded, reserved, not_evaluated]}
        detail: {type: string}
        cost: {type: integer, minimum: 0, description: The condition's CEL cost.}
    PolicyApproval:
      type: object
      required: [approvers, required, expires_in]
      description: Who approves and for how long.
      properties:
        approvers:
          type: array
          description: '`role:owner`, `role:admin` or `user:<email>`, sorted.'
          items: {type: string}
        required: {type: integer, minimum: 1}
        expires_in: {type: integer, minimum: 0, description: Seconds.}
    PolicyDecision:
      type: object
      required: [object, decision, code, source, rule_id, rule_line, reason, message, approval, verify, notify, budget, policy, shadow, facts, trace, errors, sqlguard_version, evaluated_in_us]
      description: >-
        A dry-run decision. Nothing ran and no usage was reserved. `shadow` is the shadow policy's
        decision for the same input, when one is active.
      properties:
        object: {type: string, const: policy_decision}
        decision: {type: string, enum: [allow, deny, require_approval]}
        code:
          type: [string, "null"]
          enum: [policy_denied, approval_required, budget_exceeded, agent_stopped, agent_suspended, org_stopped, policy_unavailable, null]
        source: {type: string, enum: [stop, budget, rule, default, builtin]}
        rule_id: {type: [string, "null"]}
        rule_line: {type: [integer, "null"], minimum: 1}
        reason: {type: [string, "null"]}
        message: {type: string, description: What the agent would see.}
        approval:
          anyOf:
            - $ref: "#/components/schemas/PolicyApproval"
            - type: "null"
        verify: {type: [string, "null"], enum: [L0, L1, L2, null]}
        notify:
          type: array
          items: {type: string}
        budget:
          type: [object, "null"]
          required: [id, per, window, limit, used, unit, resets_at, retry_after_s]
          description: The budget that decided; null otherwise.
          properties:
            id: {type: string}
            per: {type: string, enum: [agent, org]}
            window: {type: string, enum: [minute, hour, day]}
            limit: {type: integer, minimum: 0}
            used: {type: integer, minimum: 0}
            projected: {type: integer, minimum: 0, description: Used plus this action's measured amount, for a measured budget it would pass.}
            unit: {type: string, description: '`calls`, or a currency in minor units.'}
            resets_at: {type: string, format: date-time}
            retry_after_s: {type: integer, minimum: 0}
        policy:
          type: object
          required: [id, name, version, version_id, version_hash, mode]
          description: The policy that decided. `id`, `version` and `version_id` are null for a source sent with the request.
          properties:
            id: {type: [string, "null"]}
            name: {type: string}
            version: {type: [integer, "null"], minimum: 1}
            version_id: {type: [string, "null"]}
            version_hash: {type: string}
            mode: {type: string, enum: [enforce, shadow]}
        shadow:
          anyOf:
            - $ref: "#/components/schemas/PolicyDecision"
            - type: "null"
        facts:
          type: object
          required: [sql, time]
          description: >-
            The derived facts the rules saw. `sql` is the SQL classifier's report on `args.sql`
            (docs/SQLGUARD.md); `time` is the decision instant in the org's time zone (`now`,
            `hour`, `minute`, `weekday`, `date`).
          properties:
            sql: {type: object}
            time: {type: object}
        trace:
          type: array
          description: With `explain` only; otherwise empty.
          items:
            $ref: "#/components/schemas/PolicyTraceStep"
        errors:
          type: array
          items: {type: string}
        sqlguard_version: {type: string}
        evaluated_in_us: {type: integer, minimum: 1}
    PolicyCaseResult:
      type: object
      required: [name, pass, expected, got]
      description: One test case, what it expected and what the policy decided.
      properties:
        name: {type: string}
        line: {type: integer, minimum: 1}
        pass: {type: boolean}
        expected:
          type: object
          required: [decision]
          properties:
            decision: {type: string, enum: [allow, deny, require_approval]}
            rule: {type: string, description: 'A rule id, `default`, `budget:<id>` or `stop`.'}
            code: {type: string}
            reason_contains: {type: string}
            message: {type: string}
            verify: {type: string}
            approval:
              type: object
              properties:
                required: {type: integer}
                approvers: {type: array, items: {type: string}}
                expires_in: {type: integer}
            notify: {type: array, items: {type: string}}
        got:
          type: object
          required: [decision, rule, message]
          properties:
            decision: {type: string, enum: [allow, deny, require_approval]}
            rule: {type: string}
            code: {type: string}
            reason: {type: string}
            message: {type: string}
            verify: {type: string}
            approval:
              $ref: "#/components/schemas/PolicyApproval"
            notify: {type: array, items: {type: string}}
        problems:
          type: array
          description: 'Each difference, like "rule: expected block-destructive-sql, got allow-reads".'
          items: {type: string}
    PolicyRuleCoverage:
      type: object
      required: [id, cases]
      description: How many cases a rule or budget decided.
      properties:
        id: {type: string}
        line: {type: integer, minimum: 1}
        cases: {type: integer, minimum: 0}
    PolicyCoverage:
      type: object
      required: [rules, covered, total, uncovered, default, budgets]
      description: Which rules and budgets the cases reached.
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/PolicyRuleCoverage"
        covered: {type: integer, minimum: 0, description: Rules that decided at least one case.}
        total: {type: integer, minimum: 0}
        uncovered:
          type: array
          items: {type: string}
        default: {type: integer, minimum: 0, description: Cases the default decided.}
        budgets:
          type: array
          items:
            $ref: "#/components/schemas/PolicyRuleCoverage"
    PolicyTestResult:
      type: object
      required: [object, policy, version_hash, ok, passed, failed, skipped, cases, coverage, elapsed_us]
      description: The result of a test run. `ok` is true when every case passed.
      properties:
        object: {type: string, const: policy_test_result}
        policy: {type: string, description: The policy's name.}
        file: {type: string}
        cases_file: {type: string}
        version_hash:
          $ref: "#/components/schemas/Digest"
        ok: {type: boolean}
        passed: {type: integer, minimum: 0}
        failed: {type: integer, minimum: 0}
        skipped: {type: integer, minimum: 0}
        cases:
          type: array
          items:
            $ref: "#/components/schemas/PolicyCaseResult"
        coverage:
          $ref: "#/components/schemas/PolicyCoverage"
        elapsed_us: {type: integer, minimum: 0}
    ProtectedResourceMetadata:
      type: object
      additionalProperties: false
      required: [resource, resource_name, bearer_methods_supported, scopes_supported, resource_documentation]
      description: >-
        RFC 9728 protected-resource metadata. `authorization_servers` is absent on purpose in v1:
        Deedglass v1 takes pre-issued API keys as bearer tokens and has no authorization server to
        list; v2 adds the org's issuer.
      properties:
        resource: {type: string, description: The resource identifier (the API's base URL, or an MCP endpoint's URL).}
        resource_name: {type: string}
        bearer_methods_supported:
          type: array
          items: {type: string}
        scopes_supported:
          type: array
          items: {type: string}
        resource_documentation: {type: string, format: uri}
      examples:
        - resource: https://api.deedglass.com
          resource_name: Deedglass
          bearer_methods_supported: [header]
          scopes_supported: ["actions:execute", "actions:read", "deeds:read"]
          resource_documentation: https://docs.deedglass.com/mcp/authorization
    JSONRPCError:
      type: object
      required: [jsonrpc, error]
      description: A JSON-RPC 2.0 error response.
      properties:
        jsonrpc: {type: string, const: "2.0"}
        id: {type: [string, number, "null"]}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: integer}
            message: {type: string}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [type, code, message, param, request_id, doc_url]
          properties:
            type:
              type: string
              enum:
                - invalid_request_error
                - authentication_error
                - permission_error
                - policy_error
                - rate_limit_error
                - api_error
            code:
              type: string
              enum:
                - invalid_api_key
                - api_key_revoked
                - api_key_expired
                - agent_suspended
                - agent_stopped
                - org_stopped
                - insufficient_scope
                - policy_denied
                - approval_required
                - approval_expired
                - budget_exceeded
                - intent_required
                - intent_invalid
                - intent_replay
                - tool_unknown
                - connector_unavailable
                - upstream_error
                - timeout
                - rate_limited
                - idempotency_conflict
                - validation_failed
                - not_found
                - conflict
                - internal_error
                - authentication_required
                - method_not_allowed
                - request_too_large
                - unsupported_media_type
                - invalid_json
                - api_version_invalid
                - idempotency_key_invalid
                - idempotency_key_in_use
                - service_unavailable
                - session_expired
                - csrf_failed
                - insufficient_role
                - login_link_invalid
                - login_code_invalid
                - last_owner
                - policy_unavailable
                - policy_invalid
                - credentials_missing
                - destination_blocked
                - vault_unavailable
                - upstream_auth_failed
                - upstream_not_found
                - upstream_rate_limited
                - response_too_large
            message:
              type: string
              description: One or more calm sentences with the next step.
            param:
              type: [string, "null"]
              description: The request field, query parameter or header the error is about.
            request_id:
              type: string
              pattern: "^req_[0-7][0-9a-hjkmnp-tv-z]{25}$"
            doc_url:
              type: string
              format: uri
            diagnostics:
              type: array
              description: On `policy_invalid` only. Each problem with its line, code and hint.
              items:
                $ref: "#/components/schemas/PolicyDiagnostic"
            action:
              $ref: "#/components/schemas/Action"
              description: >-
                On refusals of `POST /v1/actions` only (`policy_denied`, `policy_unavailable`,
                `budget_exceeded`, `agent_stopped`, `agent_suspended`, `org_stopped`,
                `tool_unknown`): the recorded, sealed action. Additive (S13).
      examples:
        - error:
            type: invalid_request_error
            code: not_found
            message: There's no endpoint at GET /v1/helth. Did you mean /v1/health?
            param: null
            request_id: req_01j9zr3m5k8q2w7x4t6v0b1c9d
            doc_url: https://docs.deedglass.com/errors/not_found
    Check:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, down, pending, mismatch, unknown, not_configured]
          description: >-
            For `seal_key`, `degraded` means the key retires within its rotation overlap (restart
            with the new key) and `down` means it is retired, revoked or unreadable.
    Health:
      type: object
      required: [object, status, version, api_version, checks, time]
      properties:
        object:
          type: string
          const: health
        status:
          type: string
          enum: [ok, degraded, down, draining]
        version:
          type: string
        api_version:
          type: string
        checks:
          type: object
          required: [database, migrations, seal_key, decoder]
          properties:
            database:
              allOf:
                - $ref: "#/components/schemas/Check"
              properties:
                latency_ms:
                  type: [integer, "null"]
                  minimum: 0
            migrations:
              allOf:
                - $ref: "#/components/schemas/Check"
              properties:
                applied:
                  type: [integer, "null"]
                  minimum: 0
                expected:
                  type: [integer, "null"]
                  minimum: 0
            seal_key:
              $ref: "#/components/schemas/Check"
            decoder:
              $ref: "#/components/schemas/Check"
            policies:
              allOf:
                - $ref: "#/components/schemas/Check"
              description: >-
                `ok`, `degraded` when an org's policy failed its load checks (its actions are
                denied), or `not_configured`.
        time:
          type: string
          format: date-time
      examples:
        - object: health
          status: ok
          version: 0.1.0-dev
          api_version: "2026-10-01"
          checks:
            database: {status: ok, latency_ms: 1}
            migrations: {status: ok, applied: 9, expected: 9}
            seal_key: {status: not_configured}
            decoder: {status: not_configured}
            policies: {status: ok}
          time: "2026-10-01T09:30:00.000Z"
    Digest:
      type: string
      pattern: "^sha256:[0-9a-f]{64}$"
      description: '"sha256:" + lowercase hex of SHA-256.'
    DeedTime:
      type: string
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[.][0-9]{3}Z$"
      description: RFC 3339, UTC, exactly three fractional digits.
    SealKey:
      type: object
      additionalProperties: false
      required: [object, id, alg, public_key, thumbprint, status, activated_at, retired_at, revoked_at, jwk]
      properties:
        object:
          type: string
          const: seal_key
        id:
          type: string
          pattern: "^sk_[0-7][0-9a-hjkmnp-tv-z]{25}$"
        alg:
          type: string
          const: Ed25519
        public_key:
          type: string
          description: The raw 32-byte Ed25519 public key, base64url without padding.
        thumbprint:
          $ref: "#/components/schemas/Digest"
        status:
          type: string
          enum: [active, retired, revoked]
        activated_at:
          $ref: "#/components/schemas/DeedTime"
        retired_at:
          type: [string, "null"]
          description: Deeds issued at or after this time are not valid under the key.
        revoked_at:
          type: [string, "null"]
          description: When set, every deed this key sealed fails verification.
        jwk:
          type: object
          additionalProperties: false
          required: [kty, crv, x, kid, use]
          description: The same key as an RFC 8037 JWK, without `alg`.
          properties:
            kty: {type: string, const: OKP}
            crv: {type: string, const: Ed25519}
            x: {type: string}
            kid: {type: string}
            use: {type: string, const: sig}
    SealKeySet:
      type: object
      additionalProperties: false
      required: [object, issuer, updated_at, keys]
      properties:
        object:
          type: string
          const: seal_key_set
        issuer:
          type: string
          format: uri
          description: This deployment's base URL.
        updated_at:
          $ref: "#/components/schemas/DeedTime"
        keys:
          type: array
          items:
            $ref: "#/components/schemas/SealKey"
      examples:
        - object: seal_key_set
          issuer: http://127.0.0.1:8080
          updated_at: "2026-10-02T09:17:14.000Z"
          keys:
            - object: seal_key
              id: sk_01j9zr8k2m4p6r8t0v2x4z6b8d
              alg: Ed25519
              public_key: pEzUz7QOOPD171uzsw5ASsNYKkd5Uq4K9zc4PQUk2e8
              thumbprint: sha256:f6b1d24a4efdc39230905e0c217093f4d1d5e301ac52c9e763a773e864d93f33
              status: active
              activated_at: "2026-10-02T09:17:14.000Z"
              retired_at: null
              revoked_at: null
              jwk: {kty: OKP, crv: Ed25519, x: pEzUz7QOOPD171uzsw5ASsNYKkd5Uq4K9zc4PQUk2e8, kid: sk_01j9zr8k2m4p6r8t0v2x4z6b8d, use: sig}
    Deed:
      type: object
      additionalProperties: false
      required: [object, id, body, body_hash, seal, seal_key_id]
      description: >-
        A sealed deed (docs/DEED_SPEC.md). The stored and exported form is the RFC 8785 canonical
        JSON of this object. `seal` is Ed25519 over the bytes "deedglass/deed/v1\n" + `body_hash`.
      properties:
        object:
          type: string
          const: deed
        id:
          type: string
          pattern: "^deed_[0-7][0-9a-hjkmnp-tv-z]{25}$"
          description: Equal to `body.deed_id` (not signed; verifiers check it).
        body:
          $ref: "#/components/schemas/DeedBody"
        body_hash:
          $ref: "#/components/schemas/Digest"
        seal:
          type: string
          pattern: "^ed25519:[A-Za-z0-9_-]{86}$"
        seal_key_id:
          type: string
          pattern: "^sk_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    DeedBody:
      type: object
      additionalProperties: false
      description: >-
        Deed v1. Every key is always present; which sections are null depends on `kind`
        (docs/DEED_SPEC.md §5). Digests only, never payloads.
      required: [v, kind, deed_id, org, seq, prev_hash, issued_at, agent, on_behalf_of, session, action, policy, approval, execution, witness, cost, admin, amends, seal_key_id]
      properties:
        v: {type: integer, const: 1}
        kind: {type: string, enum: [action, admin, amendment]}
        deed_id: {type: string, pattern: "^deed_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        org: {type: string, pattern: "^org_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        seq: {type: integer, minimum: 1, maximum: 9007199254740991}
        prev_hash: {$ref: "#/components/schemas/Digest"}
        issued_at: {$ref: "#/components/schemas/DeedTime"}
        agent:
          type: [object, "null"]
          additionalProperties: false
          required: [id, name]
          properties:
            id: {type: string}
            name: {type: string, maxLength: 64}
        on_behalf_of: {type: [string, "null"], maxLength: 256}
        session: {type: [string, "null"], maxLength: 256}
        action:
          type: [object, "null"]
          additionalProperties: false
          required: [id, tool, connector, mode, request_digest, intent_hash, intent_signed]
          properties:
            id: {type: string}
            tool: {type: string}
            connector: {type: [string, "null"]}
            mode: {type: string, enum: [gateway, proxy]}
            request_digest: {$ref: "#/components/schemas/Digest"}
            intent_hash: {type: [string, "null"]}
            intent_signed: {type: boolean}
        policy:
          type: [object, "null"]
          additionalProperties: false
          required: [id, version_id, version_hash, mode, decision, rule_id]
          properties:
            id: {type: [string, "null"]}
            version_id: {type: [string, "null"]}
            version_hash: {type: [string, "null"]}
            mode: {type: string, enum: [enforce, shadow]}
            decision: {type: string, enum: [allow, deny, require_approval]}
            rule_id: {type: [string, "null"]}
        approval:
          type: [object, "null"]
          additionalProperties: false
          required: [id, outcome, decided_by, decided_at, deed]
          properties:
            id: {type: string}
            outcome: {type: string, enum: [approved, denied, expired, cancelled]}
            decided_by: {type: array, items: {type: string}}
            decided_at: {type: [string, "null"]}
            deed: {type: [string, "null"]}
        execution:
          type: [object, "null"]
          additionalProperties: false
          required: [status, started_at, finished_at, latency_ms, result_digest, error_code]
          properties:
            status: {type: string, enum: [succeeded, failed, unknown]}
            started_at: {$ref: "#/components/schemas/DeedTime"}
            finished_at: {$ref: "#/components/schemas/DeedTime"}
            latency_ms: {type: integer, minimum: 0}
            result_digest: {type: [string, "null"]}
            error_code: {type: [string, "null"]}
        witness:
          type: [object, "null"]
          additionalProperties: false
          required: [level, verdict, method, detail_digest]
          properties:
            level: {type: string, enum: [L0, L1, L2]}
            verdict: {type: string, enum: [VERIFIED, MISMATCH, UNVERIFIABLE]}
            method: {type: string}
            detail_digest: {type: [string, "null"]}
        cost:
          type: [object, "null"]
          additionalProperties: false
          required: [amount, currency]
          properties:
            amount: {type: integer, minimum: 0}
            currency: {type: string, pattern: "^[a-z]{3}$"}
        admin:
          type: [object, "null"]
          additionalProperties: false
          required: [event, action, actor, target, reason, data_digest]
          properties:
            event: {type: string}
            action: {type: string}
            actor:
              type: object
              required: [type, id]
              properties:
                type: {type: string}
                id: {type: string}
            target:
              type: [object, "null"]
              required: [type, id]
              properties:
                type: {type: string}
                id: {type: string}
            reason: {type: [string, "null"], maxLength: 280}
            data_digest: {type: [string, "null"]}
        amends: {type: [string, "null"]}
        seal_key_id: {type: string}
    NullableTime:
      type: [string, "null"]
      format: date-time
    Action:
      type: object
      required: [object, id, created_at, agent, tool, connector, mode, state, on_behalf_of, session, policy, execution, witness, cost, request_digest, result_digest, payload_pruned_at, deed, livemode, status, decision, approval, next_action]
      description: >-
        One agent action. Its sections mirror the deed's. `status` is the one field an agent
        needs; `state` is the exact lifecycle state (docs/GATE.md). The Gate's own responses
        (`POST /v1/actions` and its result report) add `execution.result` and `witness.reasons`;
        lists leave both out.
      properties:
        object: {type: string, const: action}
        id: {type: string, pattern: "^act_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        created_at: {type: string, format: date-time}
        livemode: {type: boolean, description: '`true` for a `dg_live_` key, `false` for a `dg_test_` key. Recorded, not enforced: connectors have no test mode in v1.'}
        agent:
          type: object
          required: [id, name]
          properties:
            id: {type: string}
            name: {type: string}
        tool: {type: string}
        connector: {type: [string, "null"]}
        mode: {type: string, enum: [gateway, proxy]}
        state:
          type: string
          enum: [received, authenticated, evaluated, denied, pending_approval, executing, executed, failed, witnessing, verified, mismatch, unverifiable, sealed, expired, cancelled]
        status:
          type: string
          enum: [processing, authorized, pending_approval, denied, executed, failed, expired, cancelled]
          description: >-
            `executed`: the tool ran and the action is sealed, whatever the verdict. `failed`: the
            tool certainly didn't apply the call. `authorized`: proxy mode, run the tool at the
            edge now. `processing`: still executing or witnessing. `pending_approval`: waiting for
            a person. `denied`: a policy, a budget or Stop refused it, and nothing ran. `expired`
            and `cancelled`: it waited for approval and never ran. A sealed action keeps the
            status of the state it was sealed from.
        on_behalf_of: {type: [string, "null"]}
        session: {type: [string, "null"]}
        decision:
          $ref: "#/components/schemas/ActionDecision"
        policy:
          type: object
          required: [id, version_id, mode, decision, rule_id]
          properties:
            id: {type: [string, "null"]}
            version_id: {type: [string, "null"]}
            mode: {type: string, enum: [enforce, shadow]}
            decision: {type: [string, "null"], enum: [allow, deny, require_approval, null]}
            rule_id: {type: [string, "null"]}
        approval:
          $ref: "#/components/schemas/ActionApproval"
        execution:
          type: [object, "null"]
          required: [status, started_at, finished_at, latency_ms, error_code]
          properties:
            status: {type: [string, "null"], enum: [succeeded, failed, unknown, null]}
            started_at: {$ref: "#/components/schemas/NullableTime"}
            finished_at: {$ref: "#/components/schemas/NullableTime"}
            latency_ms: {type: [integer, "null"], minimum: 0}
            error_code: {type: [string, "null"]}
            error_message: {type: [string, "null"], maxLength: 1024, description: 'A short, redacted message from the tool or the Gate (at most 1 KiB).'}
            result:
              description: >-
                The tool's result. Only on the Gate's own responses (`POST /v1/actions` and
                `POST /v1/actions/{id}/result`); never on lists. `GET /v1/actions/{id}` has it as
                the top-level `result`.
        witness:
          type: [object, "null"]
          required: [level, verdict, method]
          properties:
            level: {type: string, enum: [L0, L1, L2]}
            verdict: {type: string, enum: [VERIFIED, MISMATCH, UNVERIFIABLE]}
            method: {type: [string, "null"], description: '`reported` (L0: the tool reported success), `edge_reported` (L0, proxy mode: the edge reported success), or a later witness''s method.'}
            reasons:
              type: array
              items: {type: string}
              description: >-
                Short codes (`outcome_unknown`, `timeout`, `edge_lost`, `witness_gave_up`, …), never
                payloads. On the Gate's own responses and `GET /v1/actions/{id}`; left out of lists.
        cost:
          type: [object, "null"]
          required: [amount, currency]
          properties:
            amount: {type: integer, minimum: 0}
            currency: {type: string, pattern: "^[a-z]{3}$"}
        request_digest: {$ref: "#/components/schemas/Digest"}
        result_digest: {type: [string, "null"]}
        payload_pruned_at: {$ref: "#/components/schemas/NullableTime"}
        deed: {type: [string, "null"]}
        next_action:
          $ref: "#/components/schemas/NextAction"
      examples:
        - object: action
          id: act_01j9zt3a5c7e9g1j3m5p7r9t1v
          created_at: "2026-10-02T10:14:03.401Z"
          livemode: true
          agent: {id: agt_01j9z9b1d3f5h7k9m1p3r5t7v9, name: support-bot}
          tool: postgres.execute
          connector: null
          mode: gateway
          state: sealed
          status: executed
          on_behalf_of: u_4821
          session: chat_77
          decision: {outcome: allow, code: null, source: rule, rule_id: allow-order-updates, reason: Order updates are allowed., message: null, policy: null, policy_version: null, shadow: null}
          policy: {id: null, version_id: null, mode: enforce, decision: allow, rule_id: allow-order-updates}
          approval: null
          execution: {status: succeeded, started_at: "2026-10-02T10:14:03.455Z", finished_at: "2026-10-02T10:14:03.496Z", latency_ms: 41, error_code: null, error_message: null}
          witness: {level: L2, verdict: MISMATCH, method: postgres.pgoutput}
          cost: null
          request_digest: sha256:9c1e5b7d0a2f4c6e8b0d2f4a6c8e0b2d4f6a8c0e2b4d6f8a0c2e4b6d8f0a2c4e
          result_digest: null
          payload_pruned_at: null
          deed: deed_01j9zt3q5s7v9w1y3a5c7e9g1j
          next_action: null
    ActionDecision:
      type: [object, "null"]
      required: [outcome, code, source, rule_id, reason, message, policy, policy_version, shadow]
      description: >-
        The policy decision as an agent reads it: S11's decision, its source, its message verbatim,
        the policy version that made it (pinned: a later activation doesn't change it), and the
        shadow decision next to it. `null` until the action is evaluated.
      properties:
        outcome: {type: string, enum: [allow, deny, require_approval]}
        code: {type: [string, "null"], description: 'The refusal code (`policy_denied`, `budget_exceeded`, `agent_stopped`, `tool_unknown`, …), `approval_required`, or null for an allow.'}
        source: {type: [string, "null"], enum: [stop, budget, rule, default, builtin, null], description: '`builtin` is the Gate''s own decision, such as `tool_unknown`.'}
        rule_id: {type: [string, "null"]}
        reason: {type: [string, "null"]}
        message: {type: [string, "null"], description: The sentence the agent sees, verbatim. Null for an allow.}
        policy: {type: [string, "null"], description: The policy id (`pol_…`).}
        policy_version: {type: [string, "null"], description: The policy version id (`pv_…`).}
        shadow:
          type: [object, "null"]
          description: What the shadow policy would have decided. Recorded, never enforced.
          required: [outcome, rule_id, policy_version]
          properties:
            outcome: {type: string, enum: [allow, deny, require_approval]}
            rule_id: {type: [string, "null"]}
            policy_version: {type: [string, "null"]}
    ActionApproval:
      type: [object, "null"]
      required: [id, status, expires_at]
      description: The approval the action waits for, or waited for. `null` when no rule asked for one.
      properties:
        id: {type: string, description: The approval id (`apr_…`).}
        status: {type: string, enum: [pending, approved, denied, expired, cancelled]}
        expires_at: {type: string, format: date-time}
    NextAction:
      type: [object, "null"]
      required: [type]
      description: >-
        What the caller does next. `await_approval`: wait for a person (`poll_url` long-polls the
        action). `execute_at_edge`: proxy mode, run the tool at the edge and report the result to
        `report_url` before `deadline`. `null` otherwise.
      properties:
        type: {type: string, enum: [await_approval, execute_at_edge]}
        approval: {type: string, description: '`await_approval` only: the approval id.'}
        expires_at: {type: string, format: date-time, description: '`await_approval` only.'}
        poll_url: {type: string, description: '`await_approval` only: `/v1/actions/{id}?wait=25`.'}
        report_url: {type: string, description: '`execute_at_edge` only: `/v1/actions/{id}/result`.'}
        deadline: {type: string, format: date-time, description: '`execute_at_edge` only: after it, the action is sealed UNVERIFIABLE (`edge_lost`).'}
    ActionRequest:
      type: object
      additionalProperties: false
      required: [tool, args]
      description: The body of `POST /v1/actions`.
      properties:
        tool:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            `<connector>.<tool>`, split at the first dot. The connector is `^[a-z][a-z0-9-]{1,31}$`.
            The tool part is `^[a-z][a-z0-9_]{0,63}$` for native connectors, and the MCP charset
            `^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$` in proxy mode. Empty, over 200 bytes or not UTF-8
            is 400 `validation_failed`; any other name that isn't a tool, or that no connector
            serves in gateway mode, is recorded, sealed and refused with 404 `tool_unknown`.
        args:
          type: object
          description: >-
            The tool's arguments, a JSON object (`{}` for none): at most `gate.max_args_bytes`
            (256 KiB), nested at most 32 levels, and no integer beyond ±9007199254740991, which RFC 8785
            would round (send it as a string). Floats are fine.
        mode:
          type: string
          enum: [gateway, proxy]
          default: gateway
          description: '`gateway`: Deedglass runs the tool through a connector. `proxy`: the edge runs it and reports the result.'
        wait:
          type: number
          minimum: 0
          maximum: 25
          description: >-
            Seconds to wait for a gateway action to finish before answering 202 `processing`. The
            default is `gate.wait_timeout` (10 s). `0` answers at once.
        context:
          type: object
          additionalProperties: false
          description: Who sent the action, as the client says. Never part of any digest; at most 4 KiB.
          properties:
            client:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, maxLength: 64}
                version: {type: string, maxLength: 64}
            transport:
              type: string
              pattern: "^[a-z][a-z0-9_]{0,31}$"
              description: '`rest`, `sdk`, `mcp_stdio` or `mcp_http`. A call through `mcp_stdio` or `mcp_http` for an agent whose intent mode is `required` is refused with `intent_required`.'
        connector_type:
          type: string
          description: >-
            Proxy mode only: the edge's connector type (default `mcp`). `postgres` turns on the SQL
            facts for a string `args.sql`. In gateway mode it is 400 `validation_failed`.
          enum: [postgres, rest, mcp, mcp_http, sdk, github, slack, stripe, gmail, notion, fake]
        tool_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: The digest of the tool's definition, sent by MCP edges. Part of `request_digest`.
    EdgeResult:
      type: object
      additionalProperties: false
      required: [status, started_at, finished_at]
      description: >-
        The body of `POST /v1/actions/{id}/result`: what the tool returned at the edge. Send
        `result`, or `result_digest` alone; both must agree when both are sent.
      properties:
        status:
          type: string
          enum: [succeeded, failed, unknown]
          description: '`failed` means the tool certainly didn''t apply the call; `unknown` means the edge can''t tell.'
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time, description: Not before `started_at`.}
        result:
          description: The tool's result, any JSON, at most `gate.max_result_bytes` (256 KiB).
        result_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: sha256 of the result's RFC 8785 form. Required when `result` is left out.
        error_code:
          type: [string, "null"]
          pattern: "^[a-z][a-z0-9_]{0,63}$"
          description: A short snake_case code, such as `tool_error`.
        error_message:
          type: [string, "null"]
          description: A short message. It is redacted and cut to 1 KiB before it is stored.
    ToolResolveRequest:
      type: object
      additionalProperties: false
      required: [connector, tools]
      properties:
        connector:
          type: string
          pattern: "^[a-z][a-z0-9-]{1,31}$"
          description: The connector name the wrapper was given (`--connector`); tools are matched as `<connector>.<name>`.
        connector_type:
          type: string
          description: S10's connector type the edge declares; `mcp` when left out (`postgres` for Postgres MCP servers).
        tools:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: {type: string, pattern: "^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$"}
              digest: {type: string, pattern: "^sha256:[0-9a-f]{64}$", description: The wrapper's pinned digest of the tool definition. Recorded nowhere yet; S18 uses it.}
    ToolVisibility:
      type: object
      required: [object, name, tool, visibility, rule_id, reason]
      properties:
        object: {type: string, const: tool_visibility}
        name: {type: string}
        tool: {type: string, description: '`<connector>.<name>`, as policies match it.'}
        visibility: {type: string, enum: [visible, hidden]}
        rule_id: {type: [string, "null"], description: The first rule that covers the tool; null when the policy's default decides.}
        reason: {type: [string, "null"], description: Why the tool is hidden; null when visible.}
    ToolVisibilityList:
      type: object
      required: [object, data, has_more, next_cursor, policy_version]
      properties:
        object: {type: string, const: list}
        data:
          type: array
          items:
            $ref: "#/components/schemas/ToolVisibility"
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
        policy_version: {type: [string, "null"], description: 'The enforced policy version (`pv_…`); null when no policy is active.'}
    Tool:
      type: object
      required: [object, name, connector, title, description, input_schema, side_effect, visibility]
      properties:
        object: {type: string, const: tool}
        name: {type: string, description: '`<connector>.<tool>`, as policies match it and /mcp/native lists it.'}
        connector: {type: string}
        title: {type: string}
        description: {type: string}
        input_schema: {type: object, description: The tool's JSON Schema for its arguments.}
        side_effect: {type: string, enum: [read, write, destructive, unknown], description: What the connector declares the tool does.}
        visibility: {type: string, enum: [visible, hidden]}
    ToolList:
      type: object
      required: [object, data, has_more, next_cursor, policy_version]
      properties:
        object: {type: string, const: list}
        data:
          type: array
          items:
            $ref: "#/components/schemas/Tool"
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
        policy_version: {type: [string, "null"], description: 'The enforced policy version (`pv_…`); null when no policy is active.'}
    ActionList:
      type: object
      required: [object, data, has_more, next_cursor]
      properties:
        object: {type: string, const: list}
        data:
          type: array
          items:
            $ref: "#/components/schemas/Action"
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
    ActionEvent:
      type: object
      required: [object, id, seq, from, to, at, actor, data]
      properties:
        object: {type: string, const: action_event}
        id: {type: string, pattern: "^evt_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        seq: {type: integer, minimum: 1}
        from: {type: [string, "null"]}
        to: {type: string}
        at: {type: string, format: date-time}
        actor: {type: string, description: '`system`, `agt_…` or `usr_…`.'}
        data:
          type: object
          description: Short codes and digests (reason, rule_id, error_code, level, verdict, approval_id, detail_digest); never payloads.
    ActionDetail:
      allOf:
        - $ref: "#/components/schemas/Action"
      type: object
      required: [request, result, events, deeds, approval]
      properties:
        witness:
          type: [object, "null"]
          required: [level, verdict, method, reasons, detail]
          properties:
            reasons:
              type: array
              items: {type: string}
              description: Short codes such as `outcome_unknown`, `timeout` or `edge_lost`; an empty list when there are none.
            detail:
              description: The stored expected-vs-observed diff, or null after pruning.
        request:
          description: The tool arguments, or null after pruning.
        result:
          description: The tool result, or null after pruning.
        events:
          type: object
          required: [object, data, has_more, next_cursor]
          properties:
            object: {type: string, const: list}
            data:
              type: array
              maxItems: 200
              items:
                $ref: "#/components/schemas/ActionEvent"
            has_more: {type: boolean}
            next_cursor: {type: "null"}
        deeds:
          type: array
          items:
            type: object
            required: [id, kind, seq, issued_at]
            properties:
              id: {type: string}
              kind: {type: string, enum: [action, amendment]}
              seq: {type: integer, minimum: 1}
              issued_at: {type: string, format: date-time}
        approval:
          $ref: "#/components/schemas/ActionApproval"
    DeedList:
      type: object
      required: [object, data, has_more, next_cursor]
      properties:
        object: {type: string, const: list}
        data:
          type: array
          items:
            $ref: "#/components/schemas/Deed"
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
    LedgerCheck:
      type: object
      required: [object, org, status, checked, first_seq, last_seq, anchor, head, seal_keys, break, next_from_seq, duration_ms, checked_at]
      properties:
        object: {type: string, const: ledger_check}
        org: {type: string}
        status: {type: string, enum: [intact, broken, incomplete]}
        checked: {type: integer, minimum: 0}
        first_seq: {type: [integer, "null"]}
        last_seq: {type: [integer, "null"]}
        anchor:
          type: object
          required: [kind, seq, body_hash]
          properties:
            kind: {type: string, enum: [genesis, deed]}
            seq: {type: integer, minimum: 0}
            body_hash: {type: [string, "null"]}
        head:
          type: [object, "null"]
          required: [seq, deed, body_hash, issued_at]
          description: The last intact deed checked. Keep it outside Deedglass.
          properties:
            seq: {type: integer}
            deed: {type: string}
            body_hash: {$ref: "#/components/schemas/Digest"}
            issued_at: {$ref: "#/components/schemas/DeedTime"}
        seal_keys:
          type: array
          items: {type: string}
        break:
          type: [object, "null"]
