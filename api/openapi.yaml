openapi: 3.1.1
info:
  title: Deedglass API
  version: "2026-10-01"
  summary: The execution and accountability layer for AI agents.
  description: >-
    Deedglass sits between your AI agents and the tools they use, deciding what each agent may do,
    running it under control, and recording what actually happened as a signed deed.


    Every response carries `Deedglass-Request-Id` and the resolved `Deedglass-Version`. Errors use
    one envelope with a `doc_url` for every code. This document is written by hand; tests in
    `internal/httpx` fail when it and the mounted routes drift apart.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:8080
    description: A local server (make dev)
  - url: https://api.deedglass.com
    description: The cloud beta
tags:
  - name: People
    description: >-
      Signing in with an emailed link or code (no passwords), sessions, your org and its members
      (docs/IDENTITY.md).
  - name: Agents
    description: >-
      Agents, their API keys, Stop and Stop all (docs/AGENTS.md). Control-plane routes accept a
      Console session (by role) or an org admin key (`admin` scope). Agent keys get 403
      `insufficient_scope` on all of them: no agent key changes any agent, including its own. A 401
      carries `WWW-Authenticate: Bearer realm="deedglass", error="invalid_token",
      error_description="…"`; a 403 `insufficient_scope` carries `WWW-Authenticate: Bearer
      realm="deedglass", error="insufficient_scope", scope="…"`. Every change seals an admin deed.
  - name: Pages
    description: The server-rendered sign-in pages and the Console.
  - name: System
    description: Health, version and this document.
  - name: Ledger
    description: >-
      The searchable history of every action an agent took and every state change, and the deed
      chain check (docs/LEDGER.md).
  - name: Events
    description: >-
      The live event stream (Server-Sent Events) the Console and `deedglass actions list --follow`
      read (docs/EVENTS.md).
  - name: Overview
    description: >-
      The Console's first screen as numbers: actions, blocks, verdicts, approvals, the most active
      agents and what needs a person (docs/OVERVIEW_METRICS.md).
  - name: Gate
    description: >-
      Sending actions through the Gate, cancelling one that waits for approval, and reporting the
      result of a proxy-mode action (docs/GATE.md).
  - name: Observe
    description: >-
      Observe mode (S50): watched sessions over a Postgres connector's change log, their seal, the
      free undo SQL and the one-step session undo (docs/OBSERVE.md).
  - name: Security pack
    description: >-
      The security review pack (S51): the free readiness view of 24 questions about how the org
      controls its agents, and the sealed document for a reviewer (docs/SECURITY_PACK.md).
  - name: Weekly
    description: >-
      The weekly summary (S52): what an org's agents did in a week or a month, the Monday email's
      setting and off page, and the Clients view (docs/WEEKLY.md, docs/AGENCIES.md).
  - name: Deeds
    description: >-
      Signed records of what agents did, and the public seal keys that check them offline
      (docs/DEED_SPEC.md).
  - name: Intents
    description: "Signed intents: the conformance check SDK authors run against Deedglass."
  - name: Policies
    description: >-
      Policies and their immutable versions, activation as enforce or shadow (each sealed as an
      admin deed), and the lint, dry-run and test tools (docs/POLICY_LANGUAGE.md). Every route
      accepts a Console session (by role) or an org admin key (`admin` scope). Agent keys get 403
      `insufficient_scope` on all of them, reads included.
  - name: Connectors
    description: >-
      Connectors turn an API into governed tools, and hold its credential (docs/CONNECTORS.md).
      Credentials are write-only: no route returns a value, only the kind, the field names and a
      short hint. Every route accepts a Console session (viewers read, admins change) or an org
      admin key (`admin` scope); agent keys get 403 `insufficient_scope` on all of them, reads
      included. Every change seals an admin deed.
  - name: Insights
    description: >-
      What your history says (docs/INSIGHTS.md): replaying a policy version over past decisions,
      where the shadow policy disagrees with the enforced one, decision and verdict stats, and
      anomaly episodes for a person to review. Insights reads and reports; its only input into
      decisions is the opt-in anomaly facts. Every route accepts a Console session (viewers read,
      admins change) or an org admin key (`admin` scope); agent keys get 403 `insufficient_scope`
      on all of them, reads included.
  - name: MCP
    description: "MCP authorization readiness: OAuth protected-resource metadata (RFC 9728) and the /mcp endpoints."
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Check the server and its database
      description: >-
        Public. The checks are cached for 1 s, so frequent probes don't load the database. The body
        shows statuses only; details go to the server log. Returns 503 when the database is
        unreachable or the server is draining.
      tags: [System]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      responses:
        "200":
          description: The server can serve requests (`status` is `ok` or `degraded`).
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database is unreachable (`down`) or the server is shutting down (`draining`).
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
  /v1/version:
    get:
      operationId: getVersion
      summary: Show the server's version and API versions
      tags: [System]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      responses:
        "200":
          description: This server's build and the API versions it serves.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        default:
          $ref: "#/components/responses/Error"
  /api/openapi.yaml:
    get:
      operationId: getOpenAPISpec
      summary: Download this document
      tags: [System]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      responses:
        "200":
          description: This OpenAPI document, exactly as embedded in the server.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/yaml:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /.well-known/deedglass/keys.json:
    get:
      operationId: getSealKeys
      summary: List the public seal keys
      description: >-
        Public and not versioned. Every seal key this deployment ever registered, oldest first, so
        any deed it sealed can be checked offline with `deedglass verify`. Retired keys stay listed;
        a deed is valid under a key when `activated_at ≤ issued_at < retired_at` and the key is not
        revoked. Readable cross-origin (`Access-Control-Allow-Origin: *`). Cached for 60 s on the
        server and 300 s by clients; send `If-None-Match` with the `ETag` to get 304. The server
        never returns a partial list: when it can't read the keys it answers 503
        `service_unavailable`.
      tags: [Deeds]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: The `ETag` of a copy you hold.
          schema:
            type: string
      responses:
        "200":
          description: The seal key set.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            ETag:
              description: '`"sha256:<hex>"` of the body.'
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: public, max-age=300
            Access-Control-Allow-Origin:
              schema:
                type: string
                const: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SealKeySet"
        "304":
          description: The copy named in `If-None-Match` is current.
          headers:
            ETag:
              description: '`"sha256:<hex>"` of the body.'
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /v1/events:
    get:
      operationId: streamEvents
      summary: Stream live events (Server-Sent Events)
      description: >-
        What Postgres committed in your org, in commit order, as `text/event-stream`
        (docs/EVENTS.md). A Console session (viewer and up) or an org admin key sees the whole org;
        an agent key needs `actions:read` and sees only its own agent's actions, approvals and
        deeds. The stream starts with `retry: 3000`, then `event: hello`, then one message per
        event: `id: <instance>.<seq>` (the stream cursor, not the `evt_` id), `event: <type>` and
        `data:` the event object, which is exactly the webhook envelope (`object`, `id`, `type`,
        `api_version`, `created_at`, `livemode`, `org`, `data.object`) plus `hydrated`. When
        `hydrated` is true, `data.object` is the object in the shape its REST list returns
        (`deed.sealed` carries a `deed_summary`); otherwise it is the thin webhook object. Events
        never carry request or result payloads, approval context or email addresses. A `: ping`
        comment comes every 15 s when nothing else does; the server closes the stream after 30
        minutes (reconnect with the last cursor). The credential is checked again every 60 s; when
        it is no longer valid, `event: session_ended` carries the error code and message, and the
        stream closes. Whenever you may have missed events (a cursor this instance can't serve,
        the server's connection to Postgres reconnected, or your client fell behind), `event:
        resync` names the reason: refetch your lists. Resume is best effort, within about 5
        minutes on the same instance. Filters and cursors are checked before the first byte; a bad
        one is a `400` envelope. More than 8 open streams for one person or key is `429`
        `rate_limited`.
      tags: [Events]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: types, in: query, required: false, description: 'A comma list of event types or family wildcards: `action.*,deed.sealed`. Default every type.', schema: {type: string, maxLength: 1200}, example: "action.*,deed.sealed"}
        - {name: agent, in: query, required: false, description: Only this agent's events. An agent key may name only its own agent., schema: {type: string, pattern: "^agt_[0-7][0-9a-hjkmnp-tv-z]{25}$"}}
        - {name: last_event_id, in: query, required: false, description: 'The last `id:` you received, to resume (for clients that can''t set `Last-Event-ID`; the header wins).', schema: {type: string, pattern: "^[0-9a-z]{1,32}\\.[0-9]{1,19}$"}, example: "7f3k2m.1842"}
        - {name: Last-Event-ID, in: header, required: false, description: The last `id:` you received; EventSource sends it on reconnect., schema: {type: string}}
      responses:
        "200":
          description: >-
            The stream. Messages: `hello` (StreamHello), one per event (Event), `resync`
            (StreamResync), `session_ended` (StreamSessionEnded), and `: ping` comments.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events; each data line is one JSON object of the schemas named above.
              examples:
                live:
                  summary: A hello, then an action event
                  value: |+
                    retry: 3000

                    id: 7f3k2m.1841
                    event: hello
                    data: {"object":"stream","instance":"7f3k2m","resumed":false,"heartbeat_s":15,"server_time":"2026-10-08T14:02:09.100Z"}

                    id: 7f3k2m.1842
                    event: action.witnessed
                    data: {"object":"event","id":"evt_01k6h7mz3c9d8e7f6g5h4j3k2m","type":"action.witnessed","api_version":"2026-10-01","created_at":"2026-10-08T14:02:09.512Z","livemode":false,"org":"org_01k6h7kp6msmzrhdzwtcr3jnkp","hydrated":true,"data":{"object":{"object":"action","id":"act_01k6h7mz3c9d8e7f6g5h4j3k2m","state":"witnessing"}}}

                    : ping

                resync:
                  summary: The client may have missed events
                  value: |+
                    id: 7f3k2m.1900
                    event: resync
                    data: {"object":"resync","reason":"cursor_expired"}

        default:
          $ref: "#/components/responses/Error"
  /v1/overview:
    get:
      operationId: getOverview
      summary: Get the overview
      description: >-
        The Overview screen's numbers for your org (docs/OVERVIEW_METRICS.md has every
        definition). `window` is `24h` (24 hourly buckets, the default) or `7d` (28 six-hour
        buckets). `to` is the first bucket boundary at or after now, in UTC, so the current partial
        bucket is the last one; `from` is `to` minus the window; an action counts when `from <=
        created_at < to`. `previous` is the window before. Blocked means the decision was `deny`
        (policy, budget and Stop). `not_witnessed` is the window's actions with no verdict. Approvals
        count every pending approval, whatever the window. `agents` is the 8 most recently active
        agents with today's usage in the org's time zone. `attention` holds at most 8 items in
        priority order (`chain_broken`, `org_stopped`, `slot_invalidated`, `slot_lagging`,
        `mismatch`, `approval_expiring`, `budget_near`): kinds and data, never sentences, except a
        mismatch's witness summary. Answers are cached for 10 s per org and window. Any other
        parameter, or another window, is 400 `validation_failed`. A Console session (viewer and up)
        or an org admin key; agent keys get 403 `insufficient_scope`.
      tags: [Overview]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: window, in: query, required: false, description: '`24h` (default) or `7d`, sent once.', schema: {type: string, enum: [24h, 7d], default: 24h}}
      responses:
        "200":
          description: The overview.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
        default:
          $ref: "#/components/responses/Error"
  /v1/actions:
    get:
      operationId: listActions
      summary: List actions
      description: >-
        Newest first, ordered by `(created_at, id)` descending, so rows added while you page only
        appear on a fresh first page. Filters combine with AND; list filters take a comma list
        (`verdict=MISMATCH,UNVERIFIABLE`). Unknown parameters are refused. A cursor is bound to the
        filters it was issued with: reuse it with different filters and the answer is 400
        `validation_failed` on `cursor`. Requires `actions:read` (viewer and up).
      tags: [Ledger]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: agent, in: query, required: false, description: An agent id (`agt_…`)., schema: {type: string, pattern: "^agt_[0-7][0-9a-hjkmnp-tv-z]{25}$"}}
        - {name: tool, in: query, required: false, description: 'A tool name, exact or a glob with `*` (`stripe.*`, `*.execute`); at most 200 bytes and three `*`.', schema: {type: string, maxLength: 200}}
        - {name: state, in: query, required: false, description: A comma list of lifecycle states (contract §5)., schema: {type: string}}
        - {name: decision, in: query, required: false, description: 'A comma list of `allow`, `deny`, `require_approval`.', schema: {type: string}}
        - {name: verdict, in: query, required: false, description: 'A comma list of `VERIFIED`, `MISMATCH`, `UNVERIFIABLE`.', schema: {type: string}}
        - {name: level, in: query, required: false, description: 'A comma list of `L0`, `L1`, `L2`.', schema: {type: string}}
        - {name: on_behalf_of, in: query, required: false, description: The exact on-behalf-of reference., schema: {type: string, maxLength: 256}}
        - {name: "created_at[gte]", in: query, required: false, description: RFC 3339; inclusive., schema: {type: string, format: date-time}}
        - {name: "created_at[lt]", in: query, required: false, description: RFC 3339; exclusive., schema: {type: string, format: date-time}}
        - {name: q, in: query, required: false, description: Text to find in the tool name or the error code (2 to 64 characters)., schema: {type: string, minLength: 2, maxLength: 64}}
        - {name: shadow_differs, in: query, required: false, description: 'Only `true` (S26): actions whose shadow policy decided, and decided differently from the enforced decision. Any other value is 400 `validation_failed`.', schema: {type: string, enum: ["true"]}}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of actions.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAction
      summary: Send an action through the Gate
      description: >-
        Every tool call an agent makes passes through here (docs/GATE.md). The Gate checks the
        signed intent (when the agent's intent mode asks for one), reads the agent's Stop state,
        asks the active policy, and then refuses the action, waits for a person, runs the tool
        (gateway mode) or authorizes the edge to run it (proxy mode). Every action it records ends
        as a sealed deed. `status` is the one field an agent needs: `executed` (200: the tool ran
        and the action is sealed, whatever the verdict), `failed` (200: the tool certainly didn't
        apply the call), `authorized` (200, proxy mode: run the tool at the edge now, then report
        it to `next_action.report_url`), `processing` (202: still running when `wait` ended; poll
        `GET /v1/actions/{id}?wait=25`) and `pending_approval` (202: waiting for a person;
        `next_action.poll_url` waits for the decision). A refusal is an error envelope that carries
        the sealed action in `error.action`: `policy_denied` and `policy_unavailable` (403
        `policy_error`), `agent_stopped`, `agent_suspended` and `org_stopped` (403
        `permission_error`), `budget_exceeded` (429 `rate_limit_error`, with `Retry-After`) and
        `tool_unknown` (404). The message is the decision's own sentence, verbatim. Malformed
        requests (400 `validation_failed`) and identity failures (`intent_required`,
        `intent_invalid`, `intent_replay`) are not recorded. A gateway action keeps running when
        the HTTP request ends: it is recorded and sealed either way. **The Gate owns idempotency
        on this route**, not S03's middleware: a key names one action per agent for 24 hours, the
        same key with the same request answers with the original action (and
        `Deedglass-Idempotent-Replayed: true`), a duplicate that arrives while the original runs
        waits for it, and the same key with a different request is 422 `idempotency_conflict`. An
        agent key with `actions:execute`; a stopped or suspended agent's attempt is recorded and
        sealed, then refused.
      tags: [Gate]
      security: [{bearerAuth: []}]
      x-deedglass-auth: agent_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - name: Idempotency-Key
          in: header
          required: false
          description: >-
            Recommended (the SDKs always send one). 1 to 255 printable ASCII characters. It names
            one action of this agent for 24 hours. The comparison is the request digest plus
            `Deedglass-On-Behalf-Of` and `Deedglass-Session`; a signed intent isn't part of it, so
            a retry signed again still replays.
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - $ref: "#/components/parameters/DeedglassIntent"
        - $ref: "#/components/parameters/DeedglassOnBehalfOf"
        - $ref: "#/components/parameters/DeedglassSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionRequest"
            examples:
              gateway:
                summary: Deedglass runs the tool
                value:
                  tool: fake.echo
                  args: {message: hello}
                  mode: gateway
                  wait: 10
                  context: {client: {name: deedglass-cli, version: 0.2.1}, transport: rest}
              proxy:
                summary: The edge runs the tool and reports back
                value:
                  tool: filesystem.write_file
                  args: {path: /tmp/deedglass-demo/allowed/notes.txt, content: hello}
                  mode: proxy
                  connector_type: mcp
                  tool_digest: sha256:7c675408077d30b6ef05421be9370eb9c75c661f7cd6966c1b73454db1cc8018
                  context: {client: {name: deedglass-mcp, version: 0.2.1}, transport: mcp_stdio}
      responses:
        "200":
          description: >-
            `executed` or `failed` (sealed), or `authorized` (proxy mode). `execution.result` holds
            the tool's result on this response only.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"
              examples:
                executed:
                  summary: Gateway mode, executed and sealed
                  value:
                    object: action
                    id: act_01k6w3p8r2t4v6x8z0b2d4f6h8
                    created_at: "2026-10-05T04:12:09.114Z"
                    livemode: false
                    agent: {id: agt_01k633rrmh3bcz2p39gg4vp46q, name: support-bot}
                    tool: fake.echo
                    connector: null
                    mode: gateway
                    state: sealed
                    status: executed
                    on_behalf_of: null
                    session: null
                    decision:
                      outcome: allow
                      code: null
                      source: rule
                      rule_id: allow-fake
                      reason: Fake tools are safe to run.
                      message: null
                      policy: pol_01k6r2m8q0s2v4x6z8b0d2f4h6
                      policy_version: pv_01k6r2m9a1c3e5g7j9m1q3s5v7
                      shadow: null
                    policy: {id: pol_01k6r2m8q0s2v4x6z8b0d2f4h6, version_id: pv_01k6r2m9a1c3e5g7j9m1q3s5v7, mode: enforce, decision: allow, rule_id: allow-fake}
                    approval: null
                    execution:
                      status: succeeded
                      started_at: "2026-10-05T04:12:09.116Z"
                      finished_at: "2026-10-05T04:12:09.117Z"
                      latency_ms: 1
                      error_code: null
                      error_message: null
                      result: {echo: {message: hello}}
                    witness: {object: witness, level: L0, verdict: VERIFIED, method: reported, required_level: L0, summary: The tool reported success., reasons: [], witnessed_at: "2026-10-05T04:12:09.130Z", detail_digest: "sha256:0b5f2e9a7c4d1e8f3a6b9c2d5e8f1a4b7c0d3e6f9a2b5c8d1e4f7a0b3c6d9e2f"}
                    cost: {amount: 0, currency: usd}
                    request_digest: sha256:c2cb9a8c51c029f97049fed02f985cc49cee22836423d2c9a8e1b74e333a3c4c
                    result_digest: sha256:fca08626754877b4929151a6f5a278d4189da0bdff4e71b4f523d6f97bb8f0d0
                    payload_pruned_at: null
                    deed: deed_01k6w3p9a1c3e5g7j9m1q3s5v7
                    next_action: null
                authorized:
                  summary: Proxy mode, the edge may run the tool now
                  value:
                    object: action
                    id: act_01k6w5b3d5f7h9k1n3q5s7w9y1
                    created_at: "2026-10-05T04:20:10.902Z"
                    livemode: false
                    agent: {id: agt_01k633rrmh3bcz2p39gg4vp46q, name: support-bot}
                    tool: filesystem.write_file
