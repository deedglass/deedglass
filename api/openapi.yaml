    PolicyDiagnostic:
      type: object
      required: [severity, code, message, line, column, doc_url]
      description: >-
        One finding about a policy file, with its position and the next step. Codes are stable and
        listed in docs/POLICY_ERRORS.md. In the `policy_invalid` error envelope each diagnostic
        also carries `object: policy_diagnostic`.
      properties:
        object: {type: string, const: policy_diagnostic, description: In the error envelope only.}
        severity: {type: string, enum: [error, warning]}
        code: {type: string, description: Snake case and stable, like `reason_missing` or `default_allow`.}
        message: {type: string, description: One sentence.}
        hint: {type: string, description: The next step.}
        file: {type: string}
        line: {type: integer, minimum: 0, description: 1-based; 0 means the whole file.}
        column: {type: integer, minimum: 0, description: 1-based, in characters.}
        end_line: {type: integer, minimum: 1}
        end_column: {type: integer, minimum: 1, description: Exclusive.}
        rule_id: {type: string}
        path: {type: string, description: 'The YAML path, like `rules[3].when`.'}
        doc_url: {type: string, format: uri}
      examples:
        - object: policy_diagnostic
          severity: warning
          code: default_allow
          message: "defaults.decision: allow lets every unmatched action run."
          hint: Deedglass recommends deny. Enforcing this policy will need an explicit acknowledgement.
          line: 4
          column: 13
          path: defaults.decision
          doc_url: https://docs.deedglass.com/policies/errors/default_allow
    Policy:
      type: object
      required: [object, id, name, description, status, active_version, shadow_version, latest_version, created_at, updated_at]
      description: A named policy. Its versions never change; activating one makes it decide.
      properties:
        object: {type: string, const: policy}
        id: {type: string, pattern: "^pol_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        name: {type: string, description: From the YAML. Unique in the org and immutable.}
        description: {type: string}
        status:
          type: string
          enum: [enforced, shadow, inactive]
          description: '`enforced` when a version decides, `shadow` when a version only runs in shadow, otherwise `inactive`.'
        active_version: {type: [integer, "null"], minimum: 1, description: The enforced version's number; null when none is enforced.}
        shadow_version: {type: [integer, "null"], minimum: 1, description: The shadow version's number; null when none runs in shadow.}
        latest_version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      examples:
        - object: policy
          id: pol_01jb8m2x7k4q9r3t5v6w8y0z1a
          name: postgres-safe
          description: Reads run freely. Writes wait for a human. Schema changes never run.
          status: enforced
          active_version: 3
          shadow_version: null
          latest_version: 3
          created_at: "2026-10-04T09:12:44.000Z"
          updated_at: "2026-10-06T11:40:02.000Z"
