          description: '`enforced` when a version decides, `shadow` when a version only runs in shadow, otherwise `inactive`.'
        active_version: {type: [integer, "null"], minimum: 1, description: The enforced version's number; null when none is enforced.}
        shadow_version: {type: [integer, "null"], minimum: 1, description: The shadow version's number; null when none runs in shadow.}
        latest_version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      examples:
        - object: policy
          id: pol_01jb8m2x7k4q9r3t5v6w8y0z1a
          name: postgres-safe
          description: Reads run freely. Writes wait for a human. Schema changes never run.
