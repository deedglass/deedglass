openapi: 3.1.1
info:
  title: Deedglass API
  version: "2026-10-01"
  summary: The execution and accountability layer for AI agents.
  description: >-
    Deedglass sits between your AI agents and the tools they use, deciding what each agent may do,
    running it under control, and recording what actually happened as a signed deed.


    Every response carries `Deedglass-Request-Id` and the resolved `Deedglass-Version`. Errors use
    one envelope with a `doc_url` for every code. This document is written by hand; tests in
    `internal/httpx` fail when it and the mounted routes drift apart.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:8080
    description: A local server (make dev)
  - url: https://api.deedglass.com
    description: The cloud beta
tags:
  - name: People
    description: >-
      Signing in with an emailed link or code (no passwords), sessions, your org and its members
      (docs/IDENTITY.md).
  - name: Agents
    description: >-
      Agents, their API keys, Stop and Stop all (docs/AGENTS.md). Control-plane routes accept a
      Console session (by role) or an org admin key (`admin` scope). Agent keys get 403
      `insufficient_scope` on all of them: no agent key changes any agent, including its own. A 401
      carries `WWW-Authenticate: Bearer realm="deedglass", error="invalid_token",
      error_description="…"`; a 403 `insufficient_scope` carries `WWW-Authenticate: Bearer
      realm="deedglass", error="insufficient_scope", scope="…"`. Every change seals an admin deed.
  - name: Pages
    description: The server-rendered sign-in pages.
  - name: System
    description: Health, version and this document.
  - name: Ledger
    description: >-
      The searchable history of every action an agent took and every state change, and the deed
      chain check (docs/LEDGER.md).
  - name: Gate
    description: >-
      Sending actions through the Gate, cancelling one that waits for approval, and reporting the
      result of a proxy-mode action (docs/GATE.md).
  - name: Deeds
    description: >-
      Signed records of what agents did, and the public seal keys that check them offline
      (docs/DEED_SPEC.md).
  - name: Intents
    description: "Signed intents: the conformance check SDK authors run against Deedglass."
  - name: Policies
    description: >-
      Policies and their immutable versions, activation as enforce or shadow (each sealed as an
      admin deed), and the lint, dry-run and test tools (docs/POLICY_LANGUAGE.md). Every route
      accepts a Console session (by role) or an org admin key (`admin` scope). Agent keys get 403
      `insufficient_scope` on all of them, reads included.
  - name: Connectors
    description: >-
      Connectors turn an API into governed tools, and hold its credential (docs/CONNECTORS.md).
      Credentials are write-only: no route returns a value, only the kind, the field names and a
      short hint. Every route accepts a Console session (viewers read, admins change) or an org
      admin key (`admin` scope); agent keys get 403 `insufficient_scope` on all of them, reads
      included. Every change seals an admin deed.
  - name: MCP
    description: "MCP authorization readiness: OAuth protected-resource metadata (RFC 9728) and the /mcp endpoints."
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Check the server and its database
      description: >-
        Public. The checks are cached for 1 s, so frequent probes don't load the database. The body
        shows statuses only; details go to the server log. Returns 503 when the database is
        unreachable or the server is draining.
      tags: [System]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      responses:
        "200":
          description: The server can serve requests (`status` is `ok` or `degraded`).
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database is unreachable (`down`) or the server is shutting down (`draining`).
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
  /v1/version:
    get:
      operationId: getVersion
      summary: Show the server's version and API versions
      tags: [System]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      responses:
        "200":
          description: This server's build and the API versions it serves.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        default:
          $ref: "#/components/responses/Error"
  /api/openapi.yaml:
    get:
      operationId: getOpenAPISpec
      summary: Download this document
      tags: [System]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      responses:
        "200":
          description: This OpenAPI document, exactly as embedded in the server.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/yaml:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /.well-known/deedglass/keys.json:
    get:
      operationId: getSealKeys
      summary: List the public seal keys
      description: >-
        Public and not versioned. Every seal key this deployment ever registered, oldest first, so
        any deed it sealed can be checked offline with `deedglass verify`. Retired keys stay listed;
        a deed is valid under a key when `activated_at ≤ issued_at < retired_at` and the key is not
        revoked. Readable cross-origin (`Access-Control-Allow-Origin: *`). Cached for 60 s on the
        server and 300 s by clients; send `If-None-Match` with the `ETag` to get 304. The server
        never returns a partial list: when it can't read the keys it answers 503
        `service_unavailable`.
      tags: [Deeds]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: The `ETag` of a copy you hold.
          schema:
            type: string
      responses:
        "200":
          description: The seal key set.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            ETag:
              description: '`"sha256:<hex>"` of the body.'
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: public, max-age=300
            Access-Control-Allow-Origin:
              schema:
                type: string
                const: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SealKeySet"
        "304":
          description: The copy named in `If-None-Match` is current.
          headers:
            ETag:
              description: '`"sha256:<hex>"` of the body.'
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /v1/actions:
    get:
      operationId: listActions
      summary: List actions
      description: >-
        Newest first, ordered by `(created_at, id)` descending, so rows added while you page only
        appear on a fresh first page. Filters combine with AND; list filters take a comma list
        (`verdict=MISMATCH,UNVERIFIABLE`). Unknown parameters are refused. A cursor is bound to the
        filters it was issued with: reuse it with different filters and the answer is 400
        `validation_failed` on `cursor`. Requires `actions:read` (viewer and up).
      tags: [Ledger]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: agent, in: query, required: false, description: An agent id (`agt_…`)., schema: {type: string, pattern: "^agt_[0-7][0-9a-hjkmnp-tv-z]{25}$"}}
        - {name: tool, in: query, required: false, description: 'A tool name, exact or a glob with `*` (`stripe.*`, `*.execute`); at most 200 bytes and three `*`.', schema: {type: string, maxLength: 200}}
        - {name: state, in: query, required: false, description: A comma list of lifecycle states (contract §5)., schema: {type: string}}
        - {name: decision, in: query, required: false, description: 'A comma list of `allow`, `deny`, `require_approval`.', schema: {type: string}}
        - {name: verdict, in: query, required: false, description: 'A comma list of `VERIFIED`, `MISMATCH`, `UNVERIFIABLE`.', schema: {type: string}}
        - {name: level, in: query, required: false, description: 'A comma list of `L0`, `L1`, `L2`.', schema: {type: string}}
        - {name: on_behalf_of, in: query, required: false, description: The exact on-behalf-of reference., schema: {type: string, maxLength: 256}}
        - {name: "created_at[gte]", in: query, required: false, description: RFC 3339; inclusive., schema: {type: string, format: date-time}}
        - {name: "created_at[lt]", in: query, required: false, description: RFC 3339; exclusive., schema: {type: string, format: date-time}}
        - {name: q, in: query, required: false, description: Text to find in the tool name or the error code (2 to 64 characters)., schema: {type: string, minLength: 2, maxLength: 64}}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of actions.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAction
      summary: Send an action through the Gate
      description: >-
        Every tool call an agent makes passes through here (docs/GATE.md). The Gate checks the
        signed intent (when the agent's intent mode asks for one), reads the agent's Stop state,
        asks the active policy, and then refuses the action, waits for a person, runs the tool
        (gateway mode) or authorizes the edge to run it (proxy mode). Every action it records ends
        as a sealed deed. `status` is the one field an agent needs: `executed` (200: the tool ran
        and the action is sealed, whatever the verdict), `failed` (200: the tool certainly didn't
        apply the call), `authorized` (200, proxy mode: run the tool at the edge now, then report
        it to `next_action.report_url`), `processing` (202: still running when `wait` ended; poll
        `GET /v1/actions/{id}?wait=25`) and `pending_approval` (202: waiting for a person;
        `next_action.poll_url` waits for the decision). A refusal is an error envelope that carries
        the sealed action in `error.action`: `policy_denied` and `policy_unavailable` (403
        `policy_error`), `agent_stopped`, `agent_suspended` and `org_stopped` (403
        `permission_error`), `budget_exceeded` (429 `rate_limit_error`, with `Retry-After`) and
        `tool_unknown` (404). The message is the decision's own sentence, verbatim. Malformed
        requests (400 `validation_failed`) and identity failures (`intent_required`,
        `intent_invalid`, `intent_replay`) are not recorded. A gateway action keeps running when
        the HTTP request ends: it is recorded and sealed either way. **The Gate owns idempotency
        on this route**, not S03's middleware: a key names one action per agent for 24 hours, the
        same key with the same request answers with the original action (and
        `Deedglass-Idempotent-Replayed: true`), a duplicate that arrives while the original runs
        waits for it, and the same key with a different request is 422 `idempotency_conflict`. An
        agent key with `actions:execute`; a stopped or suspended agent's attempt is recorded and
        sealed, then refused.
      tags: [Gate]
      security: [{bearerAuth: []}]
      x-deedglass-auth: agent_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - name: Idempotency-Key
          in: header
          required: false
          description: >-
            Recommended (the SDKs always send one). 1 to 255 printable ASCII characters. It names
            one action of this agent for 24 hours. The comparison is the request digest plus
            `Deedglass-On-Behalf-Of` and `Deedglass-Session`; a signed intent isn't part of it, so
            a retry signed again still replays.
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - $ref: "#/components/parameters/DeedglassIntent"
        - $ref: "#/components/parameters/DeedglassOnBehalfOf"
        - $ref: "#/components/parameters/DeedglassSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionRequest"
            examples:
              gateway:
                summary: Deedglass runs the tool
                value:
                  tool: fake.echo
                  args: {message: hello}
                  mode: gateway
                  wait: 10
                  context: {client: {name: deedglass-cli, version: 0.1.0}, transport: rest}
              proxy:
                summary: The edge runs the tool and reports back
                value:
                  tool: filesystem.write_file
                  args: {path: /tmp/deedglass-demo/allowed/notes.txt, content: hello}
                  mode: proxy
                  connector_type: mcp
                  tool_digest: sha256:7c675408077d30b6ef05421be9370eb9c75c661f7cd6966c1b73454db1cc8018
                  context: {client: {name: deedglass-mcp, version: 0.1.0}, transport: mcp_stdio}
      responses:
        "200":
          description: >-
            `executed` or `failed` (sealed), or `authorized` (proxy mode). `execution.result` holds
            the tool's result on this response only.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"
              examples:
                executed:
                  summary: Gateway mode, executed and sealed
                  value:
                    object: action
                    id: act_01k6w3p8r2t4v6x8z0b2d4f6h8
                    created_at: "2026-10-05T04:12:09.114Z"
                    livemode: false
                    agent: {id: agt_01k633rrmh3bcz2p39gg4vp46q, name: support-bot}
                    tool: fake.echo
                    connector: null
                    mode: gateway
                    state: sealed
                    status: executed
                    on_behalf_of: null
                    session: null
                    decision:
                      outcome: allow
                      code: null
                      source: rule
                      rule_id: allow-fake
                      reason: Fake tools are safe to run.
                      message: null
                      policy: pol_01k6r2m8q0s2v4x6z8b0d2f4h6
                      policy_version: pv_01k6r2m9a1c3e5g7j9m1q3s5v7
                      shadow: null
                    policy: {id: pol_01k6r2m8q0s2v4x6z8b0d2f4h6, version_id: pv_01k6r2m9a1c3e5g7j9m1q3s5v7, mode: enforce, decision: allow, rule_id: allow-fake}
                    approval: null
                    execution:
                      status: succeeded
                      started_at: "2026-10-05T04:12:09.116Z"
                      finished_at: "2026-10-05T04:12:09.117Z"
                      latency_ms: 1
                      error_code: null
                      error_message: null
                      result: {echo: {message: hello}}
                    witness: {level: L0, verdict: VERIFIED, method: reported, reasons: []}
                    cost: {amount: 0, currency: usd}
                    request_digest: sha256:c2cb9a8c51c029f97049fed02f985cc49cee22836423d2c9a8e1b74e333a3c4c
                    result_digest: sha256:fca08626754877b4929151a6f5a278d4189da0bdff4e71b4f523d6f97bb8f0d0
                    payload_pruned_at: null
                    deed: deed_01k6w3p9a1c3e5g7j9m1q3s5v7
                    next_action: null
                authorized:
                  summary: Proxy mode, the edge may run the tool now
                  value:
                    object: action
                    id: act_01k6w5b3d5f7h9k1n3q5s7w9y1
                    created_at: "2026-10-05T04:20:10.902Z"
                    livemode: false
                    agent: {id: agt_01k633rrmh3bcz2p39gg4vp46q, name: support-bot}
                    tool: filesystem.write_file
                    connector: null
                    mode: proxy
                    state: executing
                    status: authorized
                    on_behalf_of: null
                    session: null
                    decision: {outcome: allow, code: null, source: rule, rule_id: allow-demo-dir, reason: Writes inside the demo folder are fine., message: null, policy: pol_01k6r2m8q0s2v4x6z8b0d2f4h6, policy_version: pv_01k6r2m9a1c3e5g7j9m1q3s5v7, shadow: null}
                    policy: {id: pol_01k6r2m8q0s2v4x6z8b0d2f4h6, version_id: pv_01k6r2m9a1c3e5g7j9m1q3s5v7, mode: enforce, decision: allow, rule_id: allow-demo-dir}
                    approval: null
                    execution: null
                    witness: null
                    cost: null
                    request_digest: sha256:30f3b488ca53be83e50a9adf9c649ec4d2c1ec5087de8ebfc473bc1b834c01de
                    result_digest: null
                    payload_pruned_at: null
                    deed: null
                    next_action:
                      type: execute_at_edge
                      report_url: /v1/actions/act_01k6w5b3d5f7h9k1n3q5s7w9y1/result
                      deadline: "2026-10-05T04:30:10.903Z"
        "202":
          description: >-
            `processing` (still executing or witnessing when `wait` ended) or `pending_approval`
            (waiting for a person). Poll `GET /v1/actions/{id}?wait=25`.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"
              example:
                object: action
                id: act_01k6w6c4e6g8j0m2p4r6t8w0y2
                created_at: "2026-10-05T04:25:31.208Z"
                livemode: false
                agent: {id: agt_01k633rrmh3bcz2p39gg4vp46q, name: support-bot}
                tool: fake.write
                connector: null
                mode: gateway
                state: pending_approval
                status: pending_approval
                on_behalf_of: u_4821
                session: null
                decision: {outcome: require_approval, code: approval_required, source: rule, rule_id: writes-need-approval, reason: Writes wait for a human., message: "Waiting for approval under policy \"writes-need-approval\": Writes wait for a human.", policy: pol_01k6r2m8q0s2v4x6z8b0d2f4h6, policy_version: pv_01k6r2m9a1c3e5g7j9m1q3s5v7, shadow: null}
                policy: {id: pol_01k6r2m8q0s2v4x6z8b0d2f4h6, version_id: pv_01k6r2m9a1c3e5g7j9m1q3s5v7, mode: enforce, decision: require_approval, rule_id: writes-need-approval}
                approval: {id: apr_01k6w6c5f7h9k1n3q5s7v9x1z3, status: pending, expires_at: "2026-10-05T04:40:31.210Z"}
                execution: null
                witness: null
                cost: null
                request_digest: sha256:f7ee87ae04b701c55919513f07a30d1c1d738b0373f17df44ed99607f3580749
                result_digest: null
                payload_pruned_at: null
                deed: null
                next_action:
                  type: await_approval
                  approval: apr_01k6w6c5f7h9k1n3q5s7v9x1z3
                  expires_at: "2026-10-05T04:40:31.210Z"
                  poll_url: /v1/actions/act_01k6w6c4e6g8j0m2p4r6t8w0y2?wait=25
        "400":
          description: >-
            `validation_failed`: a malformed request, not recorded. `param` names the field (`tool`,
            `args`, `mode`, `wait`, `connector_type`, `tool_digest`, `context.transport`,
            `context.client`).
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  type: invalid_request_error
                  code: validation_failed
                  message: args is 312 KiB; the limit is 256 KiB. Send a reference to the data instead of the data itself.
                  param: args
                  request_id: req_01k6w4a3d5f7h9k1n3q5s7v9x1
                  doc_url: https://docs.deedglass.com/errors/validation_failed
        "401":
          description: The API key is missing, not valid, revoked or expired. Nothing is recorded.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            Refused. `policy_denied` and `policy_unavailable` (`policy_error`), and
            `agent_stopped`, `agent_suspended` and `org_stopped` (`permission_error`) are recorded
            and sealed, and carry the action in `error.action`. `intent_required`,
            `intent_invalid` and `intent_replay` (`permission_error`) and `insufficient_scope` are
            identity failures: nothing is recorded and there is no `error.action`.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                policy_denied:
                  summary: A rule denied it; the refusal is sealed
                  value:
                    error:
                      type: policy_error
                      code: policy_denied
                      message: "Blocked by policy \"no-bulk-writes\": writes over 100 rows need a person, not an agent."
                      param: null
                      request_id: req_01k6w4a3d5f7h9k1n3q5s7v9x1
                      doc_url: https://docs.deedglass.com/errors/policy_denied
                      action:
                        object: action
                        id: act_01k6w4a2c4e6g8j0m2p4r6t8v0
                        created_at: "2026-10-05T04:14:52.630Z"
                        livemode: false
                        agent: {id: agt_01k633rrmh3bcz2p39gg4vp46q, name: support-bot}
                        tool: fake.write
                        connector: null
                        mode: gateway
                        state: sealed
                        status: denied
                        on_behalf_of: null
                        session: null
                        decision: {outcome: deny, code: policy_denied, source: rule, rule_id: no-bulk-writes, reason: "writes over 100 rows need a person, not an agent.", message: "Blocked by policy \"no-bulk-writes\": writes over 100 rows need a person, not an agent.", policy: pol_01k6r2m8q0s2v4x6z8b0d2f4h6, policy_version: pv_01k6r2m9a1c3e5g7j9m1q3s5v7, shadow: null}
                        policy: {id: pol_01k6r2m8q0s2v4x6z8b0d2f4h6, version_id: pv_01k6r2m9a1c3e5g7j9m1q3s5v7, mode: enforce, decision: deny, rule_id: no-bulk-writes}
                        approval: null
                        execution: null
                        witness: null
                        cost: null
                        request_digest: sha256:be1b8c0dafafa9da4de5a1acf33834b5d7306ea41eec46ea1f8befb7985332dc
                        result_digest: null
                        payload_pruned_at: null
                        deed: deed_01k6w4a4e6g8j0m2p4r6t8w0y2
                        next_action: null
                agent_stopped:
                  summary: The agent is stopped; its attempt is sealed
                  value:
                    error:
                      type: permission_error
                      code: agent_stopped
                      message: Agent "support-bot" is stopped. Deedglass refuses its calls until an admin starts it in Console › Agents.
                      param: null
                      request_id: req_01k6w4a3d5f7h9k1n3q5s7v9x1
                      doc_url: https://docs.deedglass.com/errors/agent_stopped
                      action: {object: action, id: act_01k6w4a2c4e6g8j0m2p4r6t8v0, state: sealed, status: denied, deed: deed_01k6w4a4e6g8j0m2p4r6t8w0y2}
                intent_required:
                  summary: An MCP call for an agent that must sign; nothing is recorded
                  value:
                    error:
                      type: permission_error
                      code: intent_required
                      message: Agent "support-bot" requires a signed intent for every call, and MCP clients can't sign intents yet. Call it through the SDK or the REST API, or an admin can set its intent mode to optional in Console › Agents.
                      param: Deedglass-Intent
                      request_id: req_01k6w4a3d5f7h9k1n3q5s7v9x1
                      doc_url: https://docs.deedglass.com/errors/intent_required
        "404":
          description: >-
            `tool_unknown`: no connector serves the tool (gateway mode), or the name isn't a tool
            name (a look-alike, say). The attempt is recorded and sealed (`decision.source:
            builtin`), and `error.action` carries it.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  type: invalid_request_error
                  code: tool_unknown
                  message: No tool named "fake.ecko". Tools look like "connector.tool", for example "fake.echo".
                  param: null
                  request_id: req_01k6w4a3d5f7h9k1n3q5s7v9x1
                  doc_url: https://docs.deedglass.com/errors/tool_unknown
                  action: {object: action, id: act_01k6w4a2c4e6g8j0m2p4r6t8v0, tool: fake.ecko, state: sealed, status: denied, deed: deed_01k6w4a4e6g8j0m2p4r6t8w0y2}
        "409":
          description: >-
            `idempotency_key_in_use`, rarely: two requests with the same key raced, and the other
            one's action can't be read yet. Retry in a moment with the same key.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: >-
            `idempotency_conflict`: this agent used the Idempotency-Key in the last 24 hours with a
            different request (another tool, other arguments, another on-behalf-of or session).
            Also `validation_failed` for a malformed `Deedglass-On-Behalf-Of` or
            `Deedglass-Session` header.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  type: invalid_request_error
                  code: idempotency_conflict
                  message: This Idempotency-Key was used with a different request in the last 24 hours. Use a new key for a new request.
                  param: Idempotency-Key
                  request_id: req_01k6w4a3d5f7h9k1n3q5s7v9x1
                  doc_url: https://docs.deedglass.com/errors/idempotency_conflict
        "429":
          description: >-
            `budget_exceeded`: a budget refused it. The refusal is recorded and sealed, and
            `error.action` carries it. `Retry-After` says when the budget's window resets.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Retry-After:
              description: Seconds until the budget's window resets, at least 1.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  type: rate_limit_error
                  code: budget_exceeded
                  message: "Budget \"agent-rate\" reached: 60 of 60 calls this minute. Try again in 14 s."
                  param: null
                  request_id: req_01k6w4a3d5f7h9k1n3q5s7v9x1
                  doc_url: https://docs.deedglass.com/errors/budget_exceeded
                  action: {object: action, id: act_01k6w4a2c4e6g8j0m2p4r6t8v0, state: sealed, status: denied, deed: deed_01k6w4a4e6g8j0m2p4r6t8w0y2}
        default:
          $ref: "#/components/responses/Error"
  /v1/actions/{id}:
    get:
      operationId: getAction
      summary: Show one action, its events and deeds
      description: >-
        The action plus its payloads (`request`, `result`, `witness.detail`; `null` once retention
        removed them, see `payload_pruned_at`), up to 200 events in order, and the deeds about it
        (the action deed and any amendments). An id from another org is 404 `not_found`, exactly
        like an id that doesn't exist. Requires `actions:read`. With `?wait=` (0 to 25 seconds)
        it long-polls: it answers when the action is settled (sealed, or waiting for a person),
        when its state changes, or when the wait ends. An action already `pending_approval` when
        the wait starts waits for its next change, which is how `next_action.poll_url` waits for a
        person's decision. For an agent key a Stop ends the wait at once with the stop error, and
        each agent may hold 20 open waits per instance (the 21st is 429 `rate_limited`, with
        `Retry-After: 1`).
      tags: [Ledger]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: id, in: path, required: true, description: The action id (`act_…`)., schema: {type: string}}
        - {name: wait, in: query, required: false, description: 'Seconds to long-poll, 0 to 25, sent once. `0` (the default) answers at once.', schema: {type: number, minimum: 0, maximum: 25}}
        - name: "expand[]"
          in: query
          required: false
          description: >-
            `request`, `result` or `events`, repeatable. Accepted for the SDKs; this response
            always carries all three. Any other value, or any other query parameter, is 400
            `validation_failed`.
          schema:
            type: array
            items: {type: string, enum: [request, result, events]}
          style: form
          explode: true
      responses:
        "200":
          description: The action.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionDetail"
        default:
          $ref: "#/components/responses/Error"
  /v1/actions/{id}/cancel:
    post:
      operationId: cancelAction
      summary: Cancel an action waiting for approval
      description: >-
        Only from `pending_approval`: the action goes `cancelled`, then sealed, its approval is
        cancelled and its budget reservation goes back. From any other state the answer is 409
        `conflict`: "This action is already executing, so it can't be cancelled." while it runs,
        and "This action has already finished, so there is nothing to cancel." once it ended. The
        agent's own key (with `actions:execute`), an admin+ Console session (with the
        `Deedglass-CSRF` header) or an org admin key. Another agent's action is 404 `not_found`,
        exactly like an id that doesn't exist.
      tags: [Gate]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, description: The action id (`act_…`)., schema: {type: string}}
      responses:
        "200":
          description: "The action, `status: cancelled`, sealed."
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"
        "404":
          description: '`not_found`: no such action in this org, or (for an agent key) another agent''s.'
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: '`conflict`: the action isn''t waiting for approval.'
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  type: invalid_request_error
                  code: conflict
                  message: This action is already executing, so it can't be cancelled.
                  param: null
                  request_id: req_01k6w4a3d5f7h9k1n3q5s7v9x1
                  doc_url: https://docs.deedglass.com/errors/conflict
        default:
          $ref: "#/components/responses/Error"
  /v1/actions/{id}/result:
    post:
      operationId: reportActionResult
      summary: Report the result of a proxy-mode action
      description: >-
        Proxy mode only: after `POST /v1/actions` answered `status: authorized`, the edge runs the
        tool and reports what it returned here, once, before `next_action.deadline`
        (`gate.edge_result_timeout`, 10 minutes by default). Deedglass records the result as the
        edge's word (witness method `edge_reported`, level L0), then seals. Send `result`, or
        `result_digest` alone for a result too large to send; when both are sent the digest must
        match (sha256 of the result's RFC 8785 form), else 400 `validation_failed`. Errors: 404
        `not_found` (also for another agent's action, so ids can't be probed); 409 `conflict` for a
        gateway action, an action not yet authorized, a second report ("A result was already
        reported for this action."), or a report after the deadline ("This action was already
        sealed as UNVERIFIABLE because its result arrived after the deadline."). The same agent's
        key, with `actions:execute`.
      tags: [Gate]
      security: [{bearerAuth: []}]
      x-deedglass-auth: agent_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, description: The action id (`act_…`)., schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdgeResult"
            example:
              status: succeeded
              started_at: "2026-10-05T04:20:11.020Z"
              finished_at: "2026-10-05T04:20:11.061Z"
              result: {content: [{type: text, text: Wrote 5 bytes to /tmp/deedglass-demo/allowed/notes.txt}], isError: false}
              error_code: null
              error_message: null
      responses:
        "200":
          description: The action, witnessed and sealed.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"
        "400":
          description: >-
            `validation_failed`: `status`, the times, `error_code`, a result over
            `gate.max_result_bytes`, or a `result_digest` that doesn't match `result`.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: '`not_found`: no such action in this org, or another agent''s.'
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: '`conflict`: not a proxy action, not authorized yet, already reported, or past its deadline.'
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  type: invalid_request_error
                  code: conflict
                  message: This action was already sealed as UNVERIFIABLE because its result arrived after the deadline.
                  param: null
                  request_id: req_01k6w4a3d5f7h9k1n3q5s7v9x1
                  doc_url: https://docs.deedglass.com/errors/conflict
        default:
          $ref: "#/components/responses/Error"
  /v1/tools:
    get:
      operationId: listTools
      summary: The native tools this agent may see
      description: >-
        The tools of the Gate's native connectors (the ones `/mcp/native` serves), named
        `<connector>.<tool>`, for SDKs and `deedglass mcp serve`. Tools the active policy always
        denies to this agent are left out; `include_hidden=true` lists them too, with `visibility:
        hidden` (the same answer `POST /v1/tools/resolve` gives, so nothing secret). Every call is
        still decided by `POST /v1/actions`. An agent key with `actions:execute`.
      tags: [Gate]
      security: [{bearerAuth: []}]
      x-deedglass-auth: agent_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - name: include_hidden
          in: query
          required: false
          description: Also list the tools the policy always denies, with `visibility` hidden.
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: The tools, sorted by name. Not paginated (`has_more` is false).
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolList"
              example:
                object: list
                data:
                  - object: tool
                    name: fake.echo
                    connector: fake
                    title: Echo
                    description: Returns its arguments.
                    input_schema: {type: object, properties: {message: {type: string}}, additionalProperties: false}
                    side_effect: read
                    visibility: visible
                has_more: false
                next_cursor: null
                policy_version: pv_01k6w4a3d5f7h9k1n3q5s7v9x1
        default:
          $ref: "#/components/responses/Error"
  /v1/tools/resolve:
    post:
      operationId: resolveTools
      summary: Which of an edge's tools the policy always denies
      description: >-
        For MCP wrappers (`deedglass mcp wrap`, docs/MCP.md): send the tools an MCP server lists,
        and Deedglass answers, for each, whether the enforced policy denies every call to it from
        this agent (`hidden`) or might allow it (`visible`). It reads the policy's static structure
        only: the first rule whose `match` covers `<connector>.<name>` decides, a rule with a `when`
        can't be decided ahead of time and counts as visible, and with no covering rule the
        policy's default decides. Budgets and Stop are ignored, because they change from minute to
        minute. MCP `annotations` are never read. Hiding is a convenience for the model: every call
        still goes through `POST /v1/actions` and is decided there. Nothing is recorded. At most
        500 tools. An agent key with `actions:execute`.
      tags: [Gate]
      security: [{bearerAuth: []}]
      x-deedglass-auth: agent_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolResolveRequest"
            example:
              connector: scratch
              tools:
                - {name: read_text_file, digest: "sha256:1b0e5c1f8a7d6e4b3c2a19f0e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9"}
                - {name: move_file, digest: "sha256:a41c5c1f8a7d6e4b3c2a19f0e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9"}
      responses:
        "200":
          description: One `tool_visibility` per tool, in request order.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolVisibilityList"
              example:
                object: list
                data:
                  - {object: tool_visibility, name: read_text_file, tool: scratch.read_text_file, visibility: visible, rule_id: allow-scratch-reads, reason: null}
                  - {object: tool_visibility, name: move_file, tool: scratch.move_file, visibility: hidden, rule_id: null, reason: "No rule allows this tool, and the policy default is deny."}
                has_more: false
                next_cursor: null
                policy_version: pv_01k6w4a3d5f7h9k1n3q5s7v9x1
        "400":
          description: '`validation_failed`: the connector name, a tool name or digest, or more than 500 tools.'
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /v1/deeds:
    get:
      operationId: listDeeds
      summary: List deeds
      description: >-
        Deed envelopes by seq, oldest first (`order=desc` for newest first). Each item is a stored
        deed; `GET /v1/deeds/{id}` returns its exact canonical bytes. Requires `deeds:read`.
      tags: [Deeds]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/FromSeq"
        - $ref: "#/components/parameters/ToSeq"
        - {name: kind, in: query, required: false, description: 'A comma list of `action`, `admin`, `amendment`.', schema: {type: string}}
        - {name: action, in: query, required: false, description: 'An action id: its deed and any amendments.', schema: {type: string}}
        - {name: order, in: query, required: false, description: '`asc` (default) or `desc`.', schema: {type: string, enum: [asc, desc]}}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of deeds.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeedList"
        default:
          $ref: "#/components/responses/Error"
  /v1/deeds/{id}:
    get:
      operationId: getDeed
      summary: Get one deed's exact bytes
      description: >-
        The stored canonical JSON of the deed envelope, byte for byte, so its hash and seal check
        offline. Deeds never change: the response is cacheable forever and its `ETag` is the
        `body_hash`. With `Accept: application/cose` the deed comes as a COSE_Sign1 signed
        statement (RFC 9052; not an RFC 9942 transparency-service object). Requires `deeds:read`.
      tags: [Deeds]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: id, in: path, required: true, description: The deed id (`deed_…`)., schema: {type: string}}
        - {name: If-None-Match, in: header, required: false, description: The `ETag` of a copy you hold., schema: {type: string}}
      responses:
        "200":
          description: The deed.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            ETag:
              description: '`"sha256:<hex>"`: the deed''s `body_hash`.'
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: private, max-age=31536000, immutable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deed"
            application/cose:
              schema:
                type: string
                contentMediaType: application/cose
        "304":
          description: The copy named in `If-None-Match` is current.
        default:
          $ref: "#/components/responses/Error"
  /v1/deeds/export:
    get:
      operationId: exportDeeds
      summary: Export deeds as a bundle
      description: >-
        A streamed export bundle v1 (docs/BUNDLE_FORMAT.md): a deterministic tar.gz holding
        README.txt, keys.json, deeds.jsonl, manifest.json and manifest.seal.json, read from one
        database snapshot. Choose deeds by seq or by issued_at, at most 1,000,000 at a time; an
        empty range is 404 with where the chain ends. Check the file with `deedglass verify
        <file> --keys <this server>/.well-known/deedglass/keys.json`. Requires `deeds:read`.
      tags: [Deeds]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/FromSeq"
        - $ref: "#/components/parameters/ToSeq"
        - {name: "issued_at[gte]", in: query, required: false, description: RFC 3339; inclusive. Not with from_seq or to_seq., schema: {type: string, format: date-time}}
        - {name: "issued_at[lt]", in: query, required: false, description: RFC 3339; exclusive., schema: {type: string, format: date-time}}
      responses:
        "200":
          description: The bundle, streamed.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Content-Disposition:
              description: '`attachment; filename="deedglass-<org>-<first>-<last>.tar.gz"`.'
              schema:
                type: string
          content:
            application/gzip:
              schema:
                type: string
                contentMediaType: application/gzip
        default:
          $ref: "#/components/responses/Error"
  /v1/ledger/check:
    get:
      operationId: checkLedger
      summary: Check the deed chain
      description: >-
        Checks every deed in the range in seq order against this server's own seal keys: hashes,
        seals, links and seq continuity. A broken chain is a 200 result with `status: broken` and
        the first break, not an error. The check stops after 30 s or 2,000,000 deeds with `status:
        incomplete` and `next_from_seq`. Keep `head` somewhere outside Deedglass: it is how a
        deletion from the end of the chain becomes visible. Requires `deeds:read`.
      tags: [Ledger]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/FromSeq"
        - $ref: "#/components/parameters/ToSeq"
        - {name: "issued_at[gte]", in: query, required: false, description: RFC 3339; inclusive. Not with from_seq or to_seq., schema: {type: string, format: date-time}}
        - {name: "issued_at[lt]", in: query, required: false, description: RFC 3339; exclusive., schema: {type: string, format: date-time}}
      responses:
        "200":
          description: The result.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Version:
              $ref: "#/components/headers/DeedglassVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerCheck"
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/login:
    post:
      operationId: requestLogin
      summary: Ask for a sign-in link and code
      description: >-
        Public. Always 202 with the same body for every well-formed address, whether or not it has
        an account: the server never reads the database here, and a worker sends the email. The
        email carries one link (`/auth/confirm#t=…`, valid once for 15 minutes) and a 6-digit code
        for another device. Limits: 20 requests per IP and 5 per address per hour (429
        `rate_limited` with `Retry-After`).
      tags: [People]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: {type: string, maxLength: 254}
            example: {email: Priya@Acme.com}
      responses:
        "202":
          description: Accepted. The same for known and unknown addresses.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginRequest"
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/preview:
    post:
      operationId: previewLogin
      summary: See what a sign-in link would do, without using it
      description: >-
        Public. The confirm page calls this first and shows whose account and which org the link
        signs into, so nobody is signed in to an account they didn't expect (login CSRF). Nothing is
        consumed. An unknown, used, replaced or expired token is 400 `login_link_invalid`; 30
        failures per IP per hour are allowed.
      tags: [People]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: {type: string, minLength: 43, maxLength: 43}
            example: {token: OEVkbr-q18qimgaDkbcE5mnZqQ2a1zGG7_TgYq8PKFc}
      responses:
        "200":
          description: What the link does.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginPreview"
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/callback:
    post:
      operationId: completeLogin
      summary: Sign in with a link's token, or with an email address and code
      description: >-
        Public. Uses the token once (only while unused, not replaced by a newer email and not
        expired), accepts the invite when the link is one, and sets the session and CSRF cookies.
        With `email` and `code`, the code must belong to the newest email; each code allows 5
        attempts. Every miss is 400 `login_code_invalid` with the same message.
      tags: [People]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [token]
                  properties:
                    token: {type: string}
                - type: object
                  additionalProperties: false
                  required: [email, code]
                  properties:
                    email: {type: string}
                    code: {type: string, description: Six digits; spaces are ignored.}
            examples:
              link: {value: {token: OEVkbr-q18qimgaDkbcE5mnZqQ2a1zGG7_TgYq8PKFc}}
              code: {value: {email: priya@acme.com, code: "482913"}}
      responses:
        "200":
          description: Signed in. `Set-Cookie` carries `__Host-deedglass_session` and `__Host-deedglass_csrf`.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Set-Cookie:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Sign out
      description: >-
        Ends this session, or with `everywhere` every session of yours in every org, and expires the
        cookies. Needs the `Deedglass-CSRF` header.
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                everywhere: {type: boolean, default: false}
      responses:
        "204":
          description: Signed out.
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/switch-org:
    post:
      operationId: switchOrg
      summary: Switch to another org you belong to
      description: >-
        Issues a new session in the org (new cookies) and ends the current one. Needs the
        `Deedglass-CSRF` header.
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [org]
              properties:
                org: {type: string}
      responses:
        "200":
          description: The new session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
  /v1/me:
    get:
      operationId: getMe
      summary: Who is signed in
      description: The person, the session's org, their role there, the orgs they can switch to, and the CSRF token.
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      responses:
        "200":
          description: You.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMe
      summary: Change your name
      description: The name other members see. An empty string clears it. Needs the `Deedglass-CSRF` header.
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, maxLength: 80}
      responses:
        "200":
          description: You, updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
  /v1/org:
    get:
      operationId: getOrg
      summary: Get your org
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      responses:
        "200":
          description: The org.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateOrg
      summary: Change the org's name or time zone
      description: Admins and owners. Seals an `org.updated` admin deed when something changed. Needs the `Deedglass-CSRF` header.
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                timezone: {type: string, description: An IANA time zone name such as Asia/Kolkata.}
            example: {timezone: Asia/Kolkata}
      responses:
        "200":
          description: The org, with the deed (null when nothing changed).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Org"
                  - type: object
                    required: [deed]
                    properties:
                      deed: {type: [string, "null"]}
        default:
          $ref: "#/components/responses/Error"
  /v1/org/members:
    get:
      operationId: listMembers
      summary: List the org's members
      description: Oldest first. Without `status`, invited and active members; `status=removed` lists people who were removed.
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: status, in: query, required: false, schema: {type: string, enum: [invited, active, removed]}}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: inviteMember
      summary: Invite someone
      description: >-
        Admins invite viewers and admins; only owners invite owners. Sends a one-time invite link,
        valid for 7 days, and seals `member.invited`. 201 for a new invite; 200 when the person was
        already invited (the old link stops working and a new one is sent); 409 `conflict` for an
        active member. Needs the `Deedglass-CSRF` header.
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: {type: string}
                role: {type: string, enum: [viewer, admin, owner]}
            example: {email: sam@acme.com, role: viewer}
      responses:
        "201":
          description: Invited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "200":
          description: Invited again, with a fresh link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        default:
          $ref: "#/components/responses/Error"
  /v1/org/members/{id}:
    patch:
      operationId: updateMember
      summary: Change a member's role
      description: >-
        Owners only. Seals `member.role_changed`. Demoting the last owner is 409 `last_owner`. The
        change applies on the member's next request. Needs the `Deedglass-CSRF` header.
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRF"
        - {name: id, in: path, required: true, description: The membership id (`mem_…`)., schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: {type: string, enum: [viewer, admin, owner]}
      responses:
        "200":
          description: The membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeMember
      summary: Remove a member, or leave
      description: >-
        Admins remove viewers and admins; owners remove anyone; removing yourself is leaving. The
        member's sessions in the org end at once. Seals `member.removed`. Removing the last owner is
        409 `last_owner`. Needs the `Deedglass-CSRF` header.
      tags: [People]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRF"
        - {name: id, in: path, required: true, description: The membership id (`mem_…`)., schema: {type: string}}
      responses:
        "200":
          description: The membership, now removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        default:
          $ref: "#/components/responses/Error"
  /v1/agents:
    get:
      operationId: listAgents
      summary: List agents
      description: >-
        Oldest first. Filters combine with AND. Unknown parameters are refused. A Console session
        (viewer and up) or an org admin key (`admin` scope); agent keys get 403
        `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - {name: status, in: query, required: false, schema: {type: string, enum: [active, suspended, stopped]}}
        - {name: label, in: query, required: false, description: 'One label as `key:value`, like `env:prod`.', schema: {type: string}}
        - {name: name, in: query, required: false, description: The exact agent name (the CLI resolves names this way)., schema: {type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$"}}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of agents.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAgent
      summary: Create an agent
      description: >-
        Seals `agent.created`. The name (`^[a-z0-9][a-z0-9-]{1,62}$`, unique in the org) can't
        change later, because policies match on it; `console`, `system` and `deedglass` are
        reserved. At most 32 labels. Budgets are in minor units (cents for usd). `owner` defaults
        to the signed-in person. A taken name is 409 `conflict`. An admin+ Console session (with the
        `Deedglass-CSRF` header) or an org admin key; agent keys get 403 `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$", description: Immutable. Not console, system or deedglass.}
                description: {type: string, maxLength: 500}
                labels:
                  $ref: "#/components/schemas/Labels"
                budgets:
                  $ref: "#/components/schemas/Budgets"
                owner: {type: string, description: An active member's id (`usr_…`).}
            example:
              name: support-bot
              description: Answers refund tickets in Zendesk
              labels: {env: prod, team: support}
              budgets: {calls_per_minute: 60, calls_per_day: 5000, spend_per_day: {amount: 5000, currency: usd}}
      responses:
        "201":
          description: The agent, with the deed that sealed `agent.created`.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/agents/{id}:
    get:
      operationId: getAgent
      summary: Get an agent
      description: >-
        An id from another org is 404 `not_found`, like an id that doesn't exist. A Console session
        (viewer and up) or an org admin key; agent keys get 403 `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: The agent.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateAgent
      summary: Change an agent's description, labels, budgets, owner or intent mode
      description: >-
        Send only what changes. `labels` and `budgets` replace the whole map; `owner: ""` clears the
        owner. Names are immutable, so sending `name` is 422 `validation_failed`: to rename, create
        a new agent and move its keys. Seals `agent.updated` unless nothing changed (then `deed` is
        null). Changing `intent_mode` seals its own deed, `agent.intent_mode_changed` with `from`
        and `to`; setting it to `required` while the agent has no intent keys is 409 `conflict`
        (add a key first). An admin+ Console session (with the `Deedglass-CSRF` header) or an org
        admin key; agent keys get 403 `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                description: {type: string, maxLength: 500}
                labels:
                  $ref: "#/components/schemas/Labels"
                budgets:
                  $ref: "#/components/schemas/Budgets"
                owner: {type: string, description: An active member's id (`usr_…`), or "" to clear it.}
                intent_mode:
                  type: string
                  enum: ["off", optional, required]
                  description: >-
                    Signed intents (S09): off (headers ignored), optional (checked when sent) or
                    required (every call needs one).
            example: {labels: {env: prod, team: support, tier: "1"}}
      responses:
        "200":
          description: The agent, with the deed (null when nothing changed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/agents/{id}/suspend:
    post:
      operationId: suspendAgent
      summary: Suspend an agent
      description: >-
        A planned pause. New calls are refused with 403 `agent_suspended`; resume undoes it. Seals
        `agent.suspended`. Idempotent: suspending a suspended agent returns 200 unchanged with
        `deed: null`. Suspending a stopped agent is 409 `conflict`. An admin+ Console session (with
        the `Deedglass-CSRF` header) or an org admin key; agent keys get 403 `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        $ref: "#/components/requestBodies/OptionalReason"
      responses:
        "200":
          description: The agent, with the deed (null when it was already suspended).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/agents/{id}/resume:
    post:
      operationId: resumeAgent
      summary: Resume a suspended agent
      description: >-
        Seals `agent.resumed`. Idempotent: resuming an active agent returns 200 unchanged with
        `deed: null`. Resuming a stopped agent is 409 `conflict` (start it instead). An admin+
        Console session (with the `Deedglass-CSRF` header) or an org admin key; agent keys get 403
        `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        $ref: "#/components/requestBodies/OptionalReason"
      responses:
        "200":
          description: The agent, with the deed (null when it was already active).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/agents/{id}/stop:
    post:
      operationId: stopAgent
      summary: Stop an agent
      description: >-
        The emergency brake. Seals `agent.stopped`; every Deedglass instance refuses the agent's
        calls within 2 seconds, with 403 `agent_stopped`. Actions already running at a tool finish:
        Stop can't un-run them. The reason is optional and never shown to the agent. Idempotent:
        stopping a stopped agent returns 200 unchanged with `deed: null`. If the stop can't be
        recorded the answer is 500 `internal_error` and nothing changed; the API never says stopped
        unless it is. An admin+ Console session (with the `Deedglass-CSRF` header) or an org admin
        key; agent keys get 403 `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        $ref: "#/components/requestBodies/OptionalReason"
      responses:
        "200":
          description: The agent, now stopped, with the deed (null when it was already stopped).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResult"
              example:
                object: agent
                id: agt_01k633rrmh3bcz2p39gg4vp46q
                name: support-bot
                description: Answers refund tickets in Zendesk
                labels: {env: prod, team: support}
                budgets: {calls_per_minute: 60, calls_per_day: 5000, spend_per_day: {amount: 5000, currency: usd}}
                status: stopped
                status_reason: Refund loop in staging
                status_changed_at: "2026-10-03T14:02:09.000Z"
                status_changed_by: usr_01k6c9kb2zcjsyn7b8g2k1vqvp
                owner: usr_01k6c9kb2zcjsyn7b8g2k1vqvp
                active_keys: 1
                last_used_at: "2026-10-03T14:01:58.512Z"
                created_at: "2026-10-03T10:02:11.000Z"
                updated_at: "2026-10-03T14:02:09.000Z"
                intent_mode: "off"
                deed: deed_01k6vrddq2atgb2023qvhhct3g
        default:
          $ref: "#/components/responses/Error"
  /v1/agents/{id}/start:
    post:
      operationId: startAgent
      summary: Start a stopped agent
      description: >-
        Seals `agent.started`. The reason is required (3 to 280 characters, saying why it's safe now)
        and goes into the deed. Idempotent: starting an active agent returns 200 unchanged with
        `deed: null`. Starting a suspended agent is 409 `conflict` (resume it instead). While the
        org is stopped (Stop all), the agent stays refused with `org_stopped`. An admin+ Console
        session (with the `Deedglass-CSRF` header) or an org admin key; agent keys get 403
        `insufficient_scope`, so no agent can start itself.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        $ref: "#/components/requestBodies/RequiredReason"
      responses:
        "200":
          description: The agent, with the deed (null when it was already active).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/agents/{id}/keys:
    get:
      operationId: listAgentKeys
      summary: List an agent's API keys
      description: >-
        The agent's keys, newest first, revoked and expired ones included (at most 100). The secret
        is never shown. A Console session (viewer and up) or an org admin key; agent keys get 403
        `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: The keys, in one page.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAgentKey
      summary: Create an API key for an agent
      description: >-
        201. The `secret` is shown once, in this response; Deedglass stores only its hash. Replaying
        the same `Idempotency-Key` returns the same key with `"secret": null` and
        `Deedglass-Idempotent-Replayed: true`; if the first response was lost, roll or revoke that
        key. Scopes default to `actions:execute`, `actions:read` and `deeds:read`; agent keys can't
        hold `admin`. An agent has at most 10 active keys; the 11th is 409 `conflict`. Seals
        `api_key.created`. An admin+ Console session (with the `Deedglass-CSRF` header) or an org
        admin key; agent keys get 403 `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, maxLength: 64, description: A label for people, without line breaks.}
                mode: {type: string, enum: [live, test], default: live}
                scopes:
                  type: array
                  uniqueItems: true
                  items: {type: string, enum: ["actions:execute", "actions:read", "deeds:read", "actions:undo"]}
                  default: ["actions:execute", "actions:read", "deeds:read"]
            example: {name: prod runner, mode: live}
      responses:
        "201":
          description: The key, with its secret (null in a replay).
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/agents/{id}/intent-keys:
    get:
      operationId: listIntentKeys
      summary: List an agent's intent keys
      description: >-
        The Ed25519 public keys the agent signs intents with (at most two). A Console session
        (viewer and up) or an org admin key; agent keys get 403 `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: The intent keys, in one page.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentKeyList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: addIntentKey
      summary: Register an intent key for an agent
      description: >-
        201. Registers an Ed25519 public key the agent signs intents with. The key must pass the
        registration rules: 32 bytes, canonical encoding, on the curve and not of small order;
        otherwise the answer is 422 `validation_failed` with `param` set to `public_key`. A key
        whose `kid` is already registered, or a third key, is 409 `conflict`: an agent has at most
        two intent keys; two lets you rotate without downtime. Seals `agent.intent_key_added`. An
        admin+ Console session (with the `Deedglass-CSRF` header) or an org admin key; agent keys
        get 403 `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [public_key]
              properties:
                public_key:
                  type: string
                  pattern: "^ed25519:[A-Za-z0-9_-]{43}$"
                  description: '`ed25519:` and the 32-byte public key in base64url without padding.'
            example: {public_key: "ed25519:11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo"}
      responses:
        "201":
          description: The intent key, with the deed.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentKey"
        default:
          $ref: "#/components/responses/Error"
  /v1/agents/{id}/intent-keys/{kid}:
    delete:
      operationId: removeIntentKey
      summary: Remove an intent key
      description: >-
        Intents signed with the key are refused from now on. Removing the last key while the
        agent's `intent_mode` is `required` is 409 `conflict` (change the mode first); a `kid` the
        agent doesn't have is 404 `not_found`. Seals `agent.intent_key_removed`. An admin+ Console
        session (with the `Deedglass-CSRF` header) or an org admin key; agent keys get 403
        `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/IntentKid"
      responses:
        "200":
          description: The key is removed, with the deed.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentKeyDeleted"
        default:
          $ref: "#/components/responses/Error"
  /v1/keys/{id}/roll:
    post:
      operationId: rollKey
      summary: Roll an API key
      description: >-
        201. Creates a new key with the same agent, name, mode and scopes; its `secret` is shown
        once, and `previous` says when the old key stops working (`expires_in` seconds from now,
        0–604800, default 86400). Rolling a revoked or expired key is 409 `conflict`. Admin keys
        can't roll admin keys (403 `insufficient_role`), because that creates one. Replaying the
        same `Idempotency-Key` returns `"secret": null`. Seals `api_key.rolled`. An admin+ Console
        session (with the `Deedglass-CSRF` header) or an org admin key; agent keys get 403
        `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/KeyId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expires_in: {type: integer, minimum: 0, maximum: 604800, default: 86400, description: Seconds the old key keeps working.}
            example: {expires_in: 86400}
      responses:
        "201":
          description: The new key, with its secret and the old key's expiry.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyResult"
              example:
                object: api_key
                id: key_01k6jt6tgx72gjr876976xak5e
                agent: agt_01k633rrmh3bcz2p39gg4vp46q
                name: prod runner
                mode: live
                prefix: dg_live_0IDw6L5O
                scopes: ["actions:execute", "actions:read", "deeds:read"]
                secret: dg_live_0IDw6L5O_9hxevwY7nqdKIZZi5A2xlI2O2qn8znik
                expires_at: null
                last_used_at: null
                revoked_at: null
                rolled_from: key_01k6jz12ptrvg2zn5vts5xc1ay
                created_at: "2026-10-03T10:03:40.000Z"
                deed: deed_01k6vrddq2atgb2023qvhhct3g
                previous: {id: key_01k6jz12ptrvg2zn5vts5xc1ay, expires_at: "2026-10-04T10:03:40.000Z"}
        default:
          $ref: "#/components/responses/Error"
  /v1/keys/{id}/revoke:
    post:
      operationId: revokeKey
      summary: Revoke an API key
      description: >-
        The key stops working at once (401 `api_key_revoked`). Seals `api_key.revoked`. Idempotent:
        revoking a revoked key returns 200 with `deed: null`. An admin+ Console session (with the
        `Deedglass-CSRF` header) or an org admin key; agent keys get 403 `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/KeyId"
      requestBody:
        $ref: "#/components/requestBodies/OptionalReason"
      responses:
        "200":
          description: The key, now revoked, with the deed (null when it was already revoked).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/org/stop-all:
    post:
      operationId: stopAllAgents
      summary: Stop every agent in the org
      description: >-
        Turns on the org's Stop all: every agent's calls are refused with 403 `org_stopped`,
        whatever its own status, on every instance within 2 seconds. Seals `org.stopped_all`. The reason
        is optional. Idempotent: repeating it returns 200 unchanged with `deed: null`. If it can't be
        recorded the answer is 500 `internal_error` and nothing changed. An admin+ Console session
        (with the `Deedglass-CSRF` header) or an org admin key; agent keys get 403
        `insufficient_scope`.
      tags: [Agents]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/OptionalReason"
      responses:
        "200":
          description: The org's Stop all state, with the deed (null when it was already on).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgStop"
        default:
          $ref: "#/components/responses/Error"
  /v1/org/start-all:
    post:
      operationId: startAllAgents
      summary: Turn off Stop all
      description: >-
        Owners only, in the Console: admin keys can't release the brake. The reason is required
        (3 to 280 characters) and goes into the deed. Agents stopped one by one stay stopped. Seals
        `org.started_all`. Idempotent: when Stop all is off, returns 200 unchanged with `deed: null`.
        Needs the `Deedglass-CSRF` header.
      tags: [Agents]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/RequiredReason"
      responses:
        "200":
          description: The org's Stop all state, now off, with the deed (null when it was already off).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgStop"
        default:
          $ref: "#/components/responses/Error"
  /v1/org/keys:
    get:
      operationId: listAdminKeys
      summary: List the org's admin keys
      description: Newest first, revoked ones included (at most 100). The secret is never shown. Admins and owners, in the Console only.
      tags: [Agents]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      responses:
        "200":
          description: The admin keys, in one page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAdminKey
      summary: Create an org admin key
      description: >-
        201. An admin key acts as the admin role (never owner) on the control plane: it can't call
        start-all, change roles or create admin keys, so admin keys can't keep access alive on their
        own. Its scopes are exactly `[admin]`. Admins and owners, in the Console only (or `deedglass
        org keys create` on the server). The `secret` is shown once; a replay returns `"secret":
        null`. Seals `api_key.created`. Needs the `Deedglass-CSRF` header.
      tags: [Agents]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, maxLength: 64}
                mode: {type: string, enum: [live, test], default: live}
                scopes:
                  type: array
                  description: Leave it out; admin keys always have exactly `[admin]`.
                  minItems: 1
                  maxItems: 1
                  items: {type: string, const: admin}
            example: {name: terraform}
      responses:
        "201":
          description: The admin key, with its secret (null in a replay).
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/whoami:
    get:
      operationId: whoami
      summary: Which key, agent and org this is
      description: >-
        Any API key. It skips the stop checks, so a stopped or suspended agent (or one in a stopped
        org) can learn its status here. It never includes a stop reason or who stopped the agent.
        For an org admin key, `agent` and `budgets` are null. An invalid, revoked or expired key is
        401 with `WWW-Authenticate: Bearer realm="deedglass", error="invalid_token"`.
      tags: [Agents]
      security: [{bearerAuth: []}]
      x-deedglass-auth: agent_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      responses:
        "200":
          description: The key's identity and statuses.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Whoami"
        default:
          $ref: "#/components/responses/Error"
  /v1/intents/verify:
    post:
      operationId: verifyIntent
      summary: Check a signed intent without acting
      description: >-
        A conformance check for SDK authors. It checks the `Deedglass-Intent` header in every intent
        mode (`off` included) exactly as the Gate will, consumes the nonce, and never acts: no tool
        is called. Without the header the answer is 422 `validation_failed` ("Send a
        Deedglass-Intent header to check."), except for an agent in `required` mode, which gets 403
        `intent_required`. Refusals are 403 `permission_error` with code `intent_invalid` (`param`
        names the field), `intent_replay` or `intent_required`; never 401. `Idempotency-Key` is
        ignored. An agent key with `actions:execute`.
      tags: [Intents]
      security: [{bearerAuth: []}]
      x-deedglass-auth: agent_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/DeedglassIntent"
        - $ref: "#/components/parameters/DeedglassOnBehalfOf"
        - $ref: "#/components/parameters/DeedglassSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tool, args]
              properties:
                tool:
                  type: string
                  pattern: '^[a-z][a-z0-9-]{1,31}\.[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
                  description: The tool the intent names, as `<connector>.<tool>`.
                args:
                  description: The arguments, any JSON value (use {} for none; at most 256 KiB).
            example: {tool: stripe.refund, args: {charge: ch_3QxZ8f2L, amount: 1200}}
      responses:
        "200":
          description: The intent passed every check, and its nonce is consumed.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentCheck"
        "403":
          description: >-
            The intent was refused: `intent_invalid` (`param` names the field), `intent_replay` or
            `intent_required`.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                intent_replay:
                  summary: The nonce was already used
                  value:
                    error:
                      type: permission_error
                      code: intent_replay
                      message: This signed intent was already used at 09:30:02 UTC. Sign a new intent, with a fresh nonce, for every call.
                      param: nonce
                      request_id: req_01j9zr3m5k8q2w7x4t6v0b1c9d
                      doc_url: https://docs.deedglass.com/errors/intent_replay
                intent_invalid:
                  summary: The arguments differ from the signed ones
                  value:
                    error:
                      type: permission_error
                      code: intent_invalid
                      message: The signed intent's args_digest doesn't match the arguments sent. Sign the exact arguments you send, canonicalized with RFC 8785.
                      param: args_digest
                      request_id: req_01j9zr3m5k8q2w7x4t6v0b1c9d
                      doc_url: https://docs.deedglass.com/errors/intent_invalid
        default:
          $ref: "#/components/responses/Error"
  /v1/policies:
    get:
      operationId: listPolicies
      summary: List policies
      description: >-
        The org's policies, oldest first, each with its status and the versions that are enforced
        or in shadow. Unknown parameters are refused. A Console session (viewer and up) or an org
        admin key (`admin` scope); agent keys get 403 `insufficient_scope` ("Agents cannot read or
        test policies. Use the Console or an admin key.").
      tags: [Policies]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of policies.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createPolicy
      summary: Create a policy from its YAML
      description: >-
        201. Compiles the source and saves the policy with its first version, which is not active
        until you activate it. The policy's name comes from the YAML. Nothing is sealed: the
        immutable version (author, time, `source_hash`, `version_hash`) is the record, and deeds
        are for changes that take effect. A source that doesn't compile is 400 `policy_invalid`
        with `diagnostics`, each with its line, code and hint. A name the org already uses is 409
        `conflict` (push a new version to it instead). Bodies up to 1 MiB; the source itself up to
        256 KiB. An admin+ Console session (with the `Deedglass-CSRF` header) or an org admin key;
        agent keys get 403 `insufficient_scope` ("Agents cannot read or test policies. Use the
        Console or an admin key.").
      tags: [Policies]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/PolicySource"
      responses:
        "201":
          description: The policy, with its first version.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyCreated"
        "400":
          description: >-
            The source wasn't accepted (`policy_invalid`, with `diagnostics`), or a field isn't
            valid (`validation_failed`).
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                policy_invalid:
                  summary: A rule has no reason
                  value:
                    error:
                      type: invalid_request_error
                      code: policy_invalid
                      message: The policy wasn't accepted. The diagnostics list each problem with its line and a hint.
                      param: source
                      request_id: req_01j9zr3m5k8q2w7x4t6v0b1c9d
                      doc_url: https://docs.deedglass.com/errors/policy_invalid
                      diagnostics:
                        - object: policy_diagnostic
                          severity: error
                          code: reason_missing
                          message: Rule "block-destructive-sql" denies but has no reason.
                          hint: Write the one sentence the agent will see, like "Destructive SQL never runs for agents."
                          line: 43
                          column: 15
                          rule_id: block-destructive-sql
                          path: rules[2]
                          doc_url: https://docs.deedglass.com/policies/errors/reason_missing
        default:
          $ref: "#/components/responses/Error"
  /v1/policies/active:
    get:
      operationId: getActivePolicies
      summary: Show the enforced and shadow policies
      description: >-
        The org's live activations: the version that decides (`enforce`) and the version recorded
        alongside it (`shadow`), each null when there is none. A Console session (viewer and up) or
        an org admin key (`admin` scope); agent keys get 403 `insufficient_scope` ("Agents cannot
        read or test policies. Use the Console or an admin key.").
      tags: [Policies]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      responses:
        "200":
          description: The active set.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyActiveSet"
        default:
          $ref: "#/components/responses/Error"
  /v1/policies/{id}:
    get:
      operationId: getPolicy
      summary: Get a policy
      description: >-
        By `pol_` id or by name. A policy from another org is 404 `not_found`, like one that
        doesn't exist. A Console session (viewer and up) or an org admin key (`admin` scope); agent
        keys get 403 `insufficient_scope` ("Agents cannot read or test policies. Use the Console or
        an admin key.").
      tags: [Policies]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/PolicyRef"
      responses:
        "200":
          description: The policy.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        default:
          $ref: "#/components/responses/Error"
  /v1/policies/{id}/versions:
    get:
      operationId: listPolicyVersions
      summary: List a policy's versions
      description: >-
        Newest first, without `source` (get one version to read it). Each version's `status` says
        whether it is enforced, in shadow or inactive. A Console session (viewer and up) or an org
        admin key (`admin` scope); agent keys get 403 `insufficient_scope` ("Agents cannot read or
        test policies. Use the Console or an admin key.").
      tags: [Policies]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/PolicyRef"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of versions.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyVersionList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createPolicyVersion
      summary: Push a new version of a policy
      description: >-
        201 with the new version, which is not active until you activate it. Versions never
        change. Content identical to an existing version (the same `version_hash`) saves nothing:
        the answer is 200 with that version. The YAML's name must be the policy's name; another
        name is 400 `validation_failed` on `source` (push it as a new policy). A source that
        doesn't compile is 400 `policy_invalid` with `diagnostics`. Bodies up to 1 MiB. An admin+
        Console session (with the `Deedglass-CSRF` header) or an org admin key; agent keys get 403
        `insufficient_scope` ("Agents cannot read or test policies. Use the Console or an admin
        key.").
      tags: [Policies]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/PolicyRef"
      requestBody:
        $ref: "#/components/requestBodies/PolicySource"
      responses:
        "201":
          description: The new version.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyVersion"
        "200":
          description: The content is identical to this existing version; nothing was saved.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyVersion"
        default:
          $ref: "#/components/responses/Error"
  /v1/policies/{id}/versions/{v}:
    get:
      operationId: getPolicyVersion
      summary: Get one version of a policy, with its source
      description: >-
        By version number or `pv_` id; the body includes `source`, the YAML exactly as pushed. A
        malformed `{v}` is 400 `validation_failed` on `v`. A Console session (viewer and up) or an
        org admin key (`admin` scope); agent keys get 403 `insufficient_scope` ("Agents cannot read
        or test policies. Use the Console or an admin key.").
      tags: [Policies]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/PolicyRef"
        - $ref: "#/components/parameters/PolicyVersionRef"
      responses:
        "200":
          description: The version, with its source.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyVersion"
        default:
          $ref: "#/components/responses/Error"
  /v1/policies/{id}/versions/{v}/activate:
    post:
      operationId: activatePolicyVersion
      summary: Enforce a version, or run it in shadow
      description: >-
        `enforce` makes the version the org's deciding policy and replaces the one enforced before
        (`previous`); `shadow` records its decisions alongside without deciding. Every instance
        picks up the change within 2 s. Every activation seals an admin deed (`deeds`); promoting
        the shadow version to enforce seals two, the shadow ending and then the version enforced.
        Enforcing the version that is already enforced, or shadowing the enforced version, is 409
        `conflict`. Enforcing a policy with the `default_allow` warning needs
        `acknowledge_warnings: ["default_allow"]`; without it the answer is 400
        `validation_failed` on `acknowledge_warnings`. An admin+ Console session (with the
        `Deedglass-CSRF` header) or an org admin key; agent keys get 403 `insufficient_scope`
        ("Agents cannot read or test policies. Use the Console or an admin key.").
      tags: [Policies]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/PolicyRef"
        - $ref: "#/components/parameters/PolicyVersionRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode, reason]
              properties:
                mode: {type: string, enum: [enforce, shadow]}
                reason: {type: string, minLength: 3, maxLength: 280, description: One line, 3 to 280 characters. It goes into the deed.}
                acknowledge_warnings:
                  type: array
                  description: Warning codes the version carries that you accept, like `default_allow`.
                  items: {type: string}
            example: {mode: enforce, reason: Guard the orders database before the pilot.}
      responses:
        "200":
          description: The activation, with the deeds that sealed it.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyActivation"
        default:
          $ref: "#/components/responses/Error"
  /v1/policies/{id}/versions/{v}/deactivate:
    post:
      operationId: deactivatePolicyVersion
      summary: Switch off the shadow policy
      description: >-
        Ends the version's shadow activation and seals an admin deed. Only the shadow version can
        be switched off: the enforced one is 409 `conflict` (activate another version instead), and
        a version that isn't the shadow policy is 409 `conflict`. The reason is required (3 to 280
        characters). An admin+ Console session (with the `Deedglass-CSRF` header) or an org admin
        key; agent keys get 403 `insufficient_scope` ("Agents cannot read or test policies. Use the
        Console or an admin key.").
      tags: [Policies]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/PolicyRef"
        - $ref: "#/components/parameters/PolicyVersionRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 3, maxLength: 280, description: One line, 3 to 280 characters. It goes into the deed.}
            example: {reason: Shadow run finished; v3 matched the review.}
      responses:
        "200":
          description: The activation, now ended, with the deed.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Deedglass-Idempotent-Replayed:
              $ref: "#/components/headers/DeedglassIdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyActivation"
        default:
          $ref: "#/components/responses/Error"
  /v1/policies/lint:
    post:
      operationId: lintPolicy
      summary: Check a policy's YAML without saving it
      description: >-
        Compiles the source and reports every error and warning. The answer is 200 even when the
        policy is invalid: `valid` says so, and `errors` lists why. Nothing is saved and nothing
        is sealed, so `Idempotency-Key` is ignored. Limited to 60 requests a minute per person or
        key (429 `rate_limited`), with a 2 s timeout and bodies up to 1 MiB. A Console session
        (viewer and up, with the `Deedglass-CSRF` header) or an org admin key (`admin` scope);
        agent keys get 403 `insufficient_scope` ("Agents cannot read or test policies. Use the
        Console or an admin key.").
      tags: [Policies]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source]
              properties:
                source: {type: string, description: The policy YAML.}
                voice: {type: boolean, default: false, description: Also check reasons against the brand voice (`reason_style` warnings).}
            example: {source: "deedglass: policy/v1\nname: postgres-safe\n…"}
      responses:
        "200":
          description: The lint result, valid or not.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyLintResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/policies/evaluate:
    post:
      operationId: evaluatePolicy
      summary: Dry-run one action against a policy
      description: >-
        Evaluates one case input against the org's active policies (the default), a stored version
        or a source, and returns the decision with its facts and, with `explain`, the trace. When a
        shadow policy is active, `shadow` holds its decision too. It never reserves usage and
        writes nothing: usage counts as zero unless the input gives it. An `agent.id` from another
        org is 404 `not_found`; leave it out to use a local agent. Limited to 60 requests a minute
        per person or key (429 `rate_limited`), with a 2 s timeout and bodies up to 1 MiB.
        `Idempotency-Key` is ignored. A Console session (viewer and up, with the `Deedglass-CSRF`
        header) or an org admin key (`admin` scope); agent keys get 403 `insufficient_scope`
        ("Agents cannot read or test policies. Use the Console or an admin key.").
      tags: [Policies]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [input]
              properties:
                policy:
                  description: Which policy decides. Leave it out for the active policies.
                  oneOf:
                    - {type: string, const: active}
                    - type: object
                      additionalProperties: false
                      required: [id, version]
                      properties:
                        id: {type: string, description: A `pol_` id or the policy's name.}
                        version: {type: integer, minimum: 1}
                    - type: object
                      additionalProperties: false
                      required: [source]
                      properties:
                        source: {type: string, description: A policy YAML, compiled for this call only.}
                input:
                  type: object
                  description: >-
                    The action, in the case-input format (docs/POLICY_LANGUAGE.md §6.2): `tool`,
                    `args` (or the `sql` shorthand), and optionally `agent`, `org`, `user`,
                    `session`, `request`, `time`, `usage` and `anomaly`.
                explain: {type: boolean, default: false, description: Include the trace.}
            example:
              input: {tool: postgres.execute, sql: "DELETE FROM public.orders"}
              explain: true
      responses:
        "200":
          description: The decision.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDecision"
        default:
          $ref: "#/components/responses/Error"
  /v1/policies/test:
    post:
      operationId: testPolicy
      summary: Run test cases against a policy
      description: >-
        Runs a cases file against a source, or against a stored version (`policy` and `version`),
        and reports each case and the rule coverage. Send `source` or `policy` with `version`, not
        both. It never reserves usage and writes nothing. Limited to 60 requests a minute per
        person or key (429 `rate_limited`), with a 2 s timeout and bodies up to 2 MiB.
        `Idempotency-Key` is ignored. A Console session (viewer and up, with the `Deedglass-CSRF`
        header) or an org admin key (`admin` scope); agent keys get 403 `insufficient_scope`
        ("Agents cannot read or test policies. Use the Console or an admin key.").
      tags: [Policies]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cases]
              properties:
                source: {type: string, description: A policy YAML. Not with policy.}
                policy: {type: string, description: A stored policy, by `pol_` id or name. Needs version.}
                version: {type: integer, minimum: 1, description: The stored version's number, with policy.}
                cases:
                  description: >-
                    A cases file as a YAML string, or a list of cases (each with `name`, `input`
                    and `expect`), or an object with `cases`.
                  oneOf:
                    - type: string
                    - type: array
                      items: {type: object}
                    - type: object
            example:
              policy: postgres-safe
              version: 3
              cases:
                - name: deletes never run
                  input: {tool: postgres.execute, sql: "DELETE FROM public.orders"}
                  expect: {decision: deny, rule: block-destructive-sql}
      responses:
        "200":
          description: The test result.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyTestResult"
        default:
          $ref: "#/components/responses/Error"
  /.well-known/oauth-protected-resource:
    get:
      operationId: getProtectedResourceMetadata
      summary: Show the protected-resource metadata for the API
      description: >-
        Public and not versioned. The RFC 9728 protected-resource metadata for the server as a
        whole. `authorization_servers` is absent on purpose: Deedglass v1 takes pre-issued API keys
        as bearer tokens and has no authorization server to list; v2 adds the org's issuer.
        Readable cross-origin and cached for an hour. It never reads the database.
      tags: [MCP]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      responses:
        "200":
          description: The metadata document.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Cache-Control:
              schema:
                type: string
                const: public, max-age=3600
            Access-Control-Allow-Origin:
              schema:
                type: string
                const: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedResourceMetadata"
              example:
                resource: https://api.deedglass.com
                resource_name: Deedglass
                bearer_methods_supported: [header]
                scopes_supported: ["actions:execute", "actions:read", "deeds:read"]
                resource_documentation: https://docs.deedglass.com/mcp/authorization
        default:
          $ref: "#/components/responses/Error"
  /.well-known/oauth-protected-resource/mcp/{connector}:
    get:
      operationId: getMCPResourceMetadata
      summary: Show the protected-resource metadata for a connector's MCP endpoint
      description: >-
        Public and not versioned. The RFC 9728 metadata for `/mcp/{connector}`, at the
        path-inserted URL that the endpoint's bearer challenges name in `resource_metadata`. The
        document is the same for every well-formed connector id and never reads the database; a
        malformed id is 404 `not_found`. `authorization_servers` is absent on purpose, as in the
        root document. Readable cross-origin and cached for an hour.
      tags: [MCP]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      parameters:
        - name: connector
          in: path
          required: true
          description: The upstream's connector name (`mcp.upstreams.<name>`), or a connector id (`con_…`) from S16.
          schema:
            type: string
            pattern: "^([a-z][a-z0-9-]{1,31}|con_[0-7][0-9a-hjkmnp-tv-z]{25})$"
      responses:
        "200":
          description: The metadata document.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Cache-Control:
              schema:
                type: string
                const: public, max-age=3600
            Access-Control-Allow-Origin:
              schema:
                type: string
                const: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedResourceMetadata"
              example:
                resource: https://api.deedglass.com/mcp/con_01k67c04kxevyex3pjyqe0t45d
                resource_name: Deedglass Gate
                bearer_methods_supported: [header]
                scopes_supported: ["actions:execute"]
                resource_documentation: https://docs.deedglass.com/mcp/authorization
        default:
          $ref: "#/components/responses/Error"
  /.well-known/oauth-protected-resource/mcp/native:
    get:
      operationId: getNativeMCPResourceMetadata
      summary: Show the protected-resource metadata for the native MCP endpoint
      description: >-
        Public and not versioned. The RFC 9728 metadata for `/mcp/native`, at the path-inserted URL
        that the endpoint's bearer challenges name in `resource_metadata`. It never reads the
        database. `authorization_servers` is absent on purpose, as in the root document. Readable
        cross-origin and cached for an hour.
      tags: [MCP]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      responses:
        "200":
          description: The metadata document.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
            Cache-Control:
              schema:
                type: string
                const: public, max-age=3600
            Access-Control-Allow-Origin:
              schema:
                type: string
                const: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedResourceMetadata"
              example:
                resource: https://api.deedglass.com/mcp/native
                resource_name: Deedglass Gate
                bearer_methods_supported: [header]
                scopes_supported: ["actions:execute"]
                resource_documentation: https://docs.deedglass.com/mcp/authorization
        default:
          $ref: "#/components/responses/Error"
  /mcp/{connector}:
    post:
      operationId: mcpConnector
      summary: Send an MCP message to an upstream MCP server through the Gate
      description: >-
        The MCP Streamable HTTP gateway (S15) for one upstream MCP server configured under
        `mcp.upstreams.<connector>` in deedglass.yaml. Deedglass runs every allowed `tools/call`
        itself (gateway mode) and holds the upstream's credentials. A POST-only JSON-RPC endpoint,
        sessionless and dual-era: 2026-07-28 requests carry `_meta`
        `io.modelcontextprotocol/protocolVersion` and the `MCP-Protocol-Version`, `Mcp-Method` and
        (for `tools/call`, `resources/read`, `prompts/get`) `Mcp-Name` headers, and any
        `Mcp-Param-*` a tool's `x-mcp-header` declares; a missing or different header is 400 with
        JSON-RPC `-32020`, an unsupported version 400 with `-32022` and `data.supported`. Legacy
        clients (2025-11-25, 2025-06-18, 2025-03-26) open with `initialize`; no `Mcp-Session-Id` is
        minted, and one sent is ignored. Notifications get 202 with no body. An unknown method is
        404 (modern) or 200 (legacy) with `-32601`. Responses are `application/json` with
        `Cache-Control: no-store`; an `Accept` without `application/json` is 406. Errors before the
        message is read are JSON-RPC errors without an id whose `data` names the Deedglass error
        `code`, `doc_url` and `request_id`: 401 with `WWW-Authenticate: Bearer realm="deedglass",
        resource_metadata="<base>/.well-known/oauth-protected-resource/mcp/<connector>",
        scope="actions:execute"`, 413 over 4 MiB, 415 for another `Content-Type`, 429 beyond 32
        requests in flight per agent. A browser `Origin` other than the server's own or one in
        `mcp.allowed_origins` gets 403. A stopped or suspended agent's `tools/call` is recorded and
        sealed, and answered as an `isError` tool result. GET and DELETE get 405 with `Allow:
        POST`. `Idempotency-Key` is ignored. An agent key with `actions:execute`. JSON-RPC is not
        modelled here; see docs/MCP.md.
      tags: [MCP]
      security: [{bearerAuth: []}]
      x-deedglass-auth: agent_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - name: connector
          in: path
          required: true
          description: The upstream's connector name (`mcp.upstreams.<name>`), or a connector id (`con_…`) from S16.
          schema:
            type: string
            pattern: "^([a-z][a-z0-9-]{1,31}|con_[0-7][0-9a-hjkmnp-tv-z]{25})$"
      requestBody:
        $ref: "#/components/requestBodies/MCPMessage"
      responses:
        "403":
          $ref: "#/components/responses/MCPOriginRefused"
        "200":
          $ref: "#/components/responses/MCPResponse"
        "202":
          description: A notification was accepted. No body.
        "400":
          $ref: "#/components/responses/MCPRequestRefused"
        default:
          $ref: "#/components/responses/Error"
  /mcp/native:
    post:
      operationId: mcpNative
      summary: Send an MCP message to the Gate's native tools
      description: >-
        Deedglass as an MCP server (S15): the org's native connectors' tools, named
        `<connector>.<tool>` (`fake.echo` in dev; `postgres.*` and others as connectors arrive),
        filtered per agent by the active policy, plus `deedglass.check_approval`. The same
        sessionless, dual-era protocol rules as `/mcp/{connector}`; `deedglass mcp serve` bridges
        stdio clients to it. An agent key with `actions:execute`.
      tags: [MCP]
      security: [{bearerAuth: []}]
      x-deedglass-auth: agent_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      requestBody:
        $ref: "#/components/requestBodies/MCPMessage"
      responses:
        "403":
          $ref: "#/components/responses/MCPOriginRefused"
        "200":
          $ref: "#/components/responses/MCPResponse"
        "202":
          description: A notification was accepted. No body.
        "400":
          $ref: "#/components/responses/MCPRequestRefused"
        default:
          $ref: "#/components/responses/Error"
  /login:
    get:
      operationId: loginPage
      summary: The sign-in page
      tags: [Pages]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      responses:
        "200":
          description: HTML, with a strict Content-Security-Policy.
          content:
            text/html:
              schema: {type: string}
        default:
          $ref: "#/components/responses/Error"
  /auth/confirm:
    get:
      operationId: confirmPage
      summary: The page a sign-in link opens
      description: >-
        The token is in the URL fragment (`#t=…`), which browsers never send to servers; the page
        shows what the link does and signs in only when the person clicks. Fetching this page uses
        nothing, so mail scanners that open links can't sign anyone in.
      tags: [Pages]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      responses:
        "200":
          description: HTML, with a strict Content-Security-Policy.
          content:
            text/html:
              schema: {type: string}
        default:
          $ref: "#/components/responses/Error"
  /app/:
    get:
      operationId: consolePage
      summary: The Console
      description: Until the Console ships, a plain page showing who is signed in.
      tags: [Pages]
      security: [{sessionCookie: []}]
      x-deedglass-auth: session
      x-deedglass-since: "2026-10-01"
      responses:
        "200":
          description: HTML.
          content:
            text/html:
              schema: {type: string}
        default:
          $ref: "#/components/responses/Error"
  /auth/assets/{file}:
    get:
      operationId: authAsset
      summary: The sign-in pages' stylesheet and script
      tags: [Pages]
      security: []
      x-deedglass-auth: public
      x-deedglass-since: "2026-10-01"
      parameters:
        - {name: file, in: path, required: true, schema: {type: string, enum: [auth.css, auth.js]}}
      responses:
        "200":
          description: CSS or JavaScript.
          content:
            text/css:
              schema: {type: string}
            text/javascript:
              schema: {type: string}
        default:
          $ref: "#/components/responses/Error"
  /v1/connectors:
    get:
      operationId: listConnectors
      summary: List connectors
      description: >-
        Live connectors, oldest id first, each with its tools, the credential's metadata (never a
        value) and the last test result. A viewer+ Console session or an org admin key.
      tags: [Connectors]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of connectors.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createConnector
      summary: Add a connector
      description: >-
        Validates and normalizes the config, checks `base_url` through the egress rules (400
        `destination_blocked` for metadata, reserved, loopback or private addresses that aren't
        allowed), and seals `connector.created` with the type, name and config hash. Names are
        `^[a-z][a-z0-9-]{1,31}$`, unique among live connectors; `deedglass`, `mcp`, `native` (and
        `fake` outside dev) are reserved. A taken name is 409 `conflict`. Credentials are set
        separately. An admin+ Console session (with `Deedglass-CSRF`) or an org admin key.
      tags: [Connectors]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, name, config]
              properties:
                type: {type: string, description: "A connector type from GET /v1/connector-types (rest in S16)."}
                name: {type: string, pattern: "^[a-z][a-z0-9-]{1,31}$"}
                description: {type: string, maxLength: 500}
                config: {type: object, description: "The type's config (docs/CONNECTORS.md). At most 64 KiB."}
      responses:
        "201":
          description: The connector, with the id of its admin deed.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"
        default:
          $ref: "#/components/responses/Error"
  /v1/connectors/{id}:
    get:
      operationId: getConnector
      summary: Get a connector
      description: By `con_…` id or by name. A viewer+ Console session or an org admin key.
      tags: [Connectors]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/ConnectorRef"
      responses:
        "200":
          description: The connector.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateConnector
      summary: Update a connector
      description: >-
        Replaces `description`, `status` (`active` or `disabled`) or the whole `config`. With
        `expected_config_hash`, a config that changed meanwhile is 409 `conflict`. A change seals
        `connector.updated`; the next call uses the new config. An admin+ Console session or an org
        admin key.
      tags: [Connectors]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/ConnectorRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                description: {type: string, maxLength: 500}
                status: {type: string, enum: [active, disabled]}
                config: {type: object}
                expected_config_hash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
      responses:
        "200":
          description: The connector after the change.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connector"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteConnector
      summary: Delete a connector
      description: >-
        Soft-deletes the connector and crypto-shreds its credential (the data key is destroyed).
        409 `conflict` while an action on it is executing. Seals `connector.deleted` (and
        `connector.credentials_removed` when it had one). An admin+ Console session or an org admin
        key.
      tags: [Connectors]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/ConnectorRef"
      responses:
        "200":
          description: The deletion.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorDeleted"
        default:
          $ref: "#/components/responses/Error"
  /v1/connectors/{id}/credentials:
    put:
      operationId: setConnectorCredentials
      summary: Store a connector's credentials
      description: >-
        Write-only. Encrypts the secret with a fresh data key (AES-256-GCM envelope,
        docs/VAULT.md) as version n+1, replacing (and crypto-shredding) the previous one, and seals
        `connector.credentials_updated` with the kind, version and key id only. The body is never
        logged or stored for replay; errors name the `param`, never a value. The kind must be one the
        type takes and match the config's `auth.kind`. An admin+ Console session or an org admin
        key. 503 `vault_unavailable` when the server has no key ring.
      tags: [Connectors]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/ConnectorRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, secret]
              properties:
                kind: {type: string, enum: [bearer, header, basic, query, dsn, fields]}
                secret:
                  type: object
                  description: "bearer {token} · header {value} · basic {username, password} · query {value} · dsn {dsn, witness_dsn?} · fields {any}. At most 16 KiB."
                  additionalProperties: {type: string}
      responses:
        "200":
          description: The credential's metadata.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteConnectorCredentials
      summary: Delete a connector's credentials
      description: >-
        Removes the credential, which crypto-shreds it, and seals `connector.credentials_removed`.
        Removing nothing answers `deleted: true` with no deed. An admin+ Console session or an org
        admin key.
      tags: [Connectors]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/ConnectorRef"
      responses:
        "200":
          description: The credential, now unset.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        default:
          $ref: "#/components/responses/Error"
  /v1/connectors/{id}/test:
    post:
      operationId: testConnector
      summary: Test a connector
      description: >-
        Answers "will this work?" without changing anything: the config, the credential, the
        destination (resolved and classified), TLS, and the config's test request (a GET or a HEAD)
        with the credential. Records the result as the connector's `health`. At most 10 runs per
        minute per connector (429 `rate_limited`). An admin+ Console session or an org admin key.
      tags: [Connectors]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
        - $ref: "#/components/parameters/CSRFWithSession"
        - $ref: "#/components/parameters/ConnectorRef"
      responses:
        "200":
          description: The checks.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorTest"
        default:
          $ref: "#/components/responses/Error"
  /v1/connector-types:
    get:
      operationId: listConnectorTypes
      summary: List connector types
      description: >-
        The types this server runs, each with its config schema and the credential kinds it takes
        (each field marked secret or not). S26 builds the Console's forms from it. A viewer+ Console
        session or an org admin key.
      tags: [Connectors]
      security: [{bearerAuth: []}, {sessionCookie: []}]
      x-deedglass-auth: session_or_key
      x-deedglass-since: "2026-10-01"
      parameters:
        - $ref: "#/components/parameters/DeedglassVersion"
      responses:
        "200":
          description: The connector types.
          headers:
            Deedglass-Request-Id:
              $ref: "#/components/headers/DeedglassRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorTypeList"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: dg_<mode>_<prefix>_<secret>
      description: >-
        An API key: `dg_live_` or `dg_test_`, an 8-character prefix, `_`, and a 32-character secret,
        all base62 (49 characters, like `dg_live_jJbEEMWk_o0Erxxf1kgtP2QjiJ79vzW31AjZqIch8`). Agent
        keys hold `actions:execute`, `actions:read` and `deeds:read` (the default) and may add
        `actions:undo`; org admin keys hold exactly `admin`. Create agent keys in Console › Agents
        and admin keys in Console › Settings. A 401 carries `WWW-Authenticate: Bearer
        realm="deedglass", error="invalid_token", error_description="…"`; a missing scope is 403
        `insufficient_scope` with `WWW-Authenticate: Bearer realm="deedglass",
        error="insufficient_scope", scope="…"`.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-deedglass_session
      description: >-
        A Console session. Requests that change state also send the `Deedglass-CSRF` header,
        matching the `__Host-deedglass_csrf` cookie.
  parameters:
    DeedglassVersion:
      name: Deedglass-Version
      in: header
      required: false
      description: >-
        The API version (YYYY-MM-DD). Leave it out to use your org's pinned version (public routes
        use the latest). An unknown version is 400 `api_version_invalid`.
      schema:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        examples: ["2026-10-01"]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        1 to 255 printable ASCII characters. A retry with the same key and body returns the stored
        response with `Deedglass-Idempotent-Replayed: true` for 24 hours.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, 1–100 (default 25).
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      required: false
      description: '`next_cursor` from the previous page, unchanged.'
      schema:
        type: string
    FromSeq:
      name: from_seq
      in: query
      required: false
      description: The first deed seq (inclusive).
      schema:
        type: integer
        minimum: 1
    ToSeq:
      name: to_seq
      in: query
      required: false
      description: The last deed seq (inclusive).
      schema:
        type: integer
        minimum: 1
    CSRF:
      name: Deedglass-CSRF
      in: header
      required: true
      description: >-
        The CSRF token from `GET /v1/me` (it equals the `__Host-deedglass_csrf` cookie). Every
        session request that changes state needs it; without it the answer is 403 `csrf_failed`.
      schema:
        type: string
    CSRFWithSession:
      name: Deedglass-CSRF
      in: header
      required: false
      description: >-
        Needed when the request uses a Console session (it changes state); without it the answer is
        403 `csrf_failed`. Not sent with an API key.
      schema:
        type: string
    AgentId:
      name: id
      in: path
      required: true
      description: The agent id (`agt_…`).
      schema:
        type: string
    ConnectorRef:
      name: id
      in: path
      required: true
      description: The connector's id (`con_…`) or its name.
      schema:
        type: string
    KeyId:
      name: id
      in: path
      required: true
      description: The API key id (`key_…`).
      schema:
        type: string
    IntentKid:
      name: kid
      in: path
      required: true
      description: The intent key's id, 32 lowercase hex characters.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
    PolicyRef:
      name: id
      in: path
      required: true
      description: A pol_ id or the policy's name.
      schema:
        type: string
    PolicyVersionRef:
      name: v
      in: path
      required: true
      description: A version number, like 3, or a pv_ id.
      schema:
        type: string
    DeedglassIntent:
      name: Deedglass-Intent
      in: header
      required: false
      description: >-
        A signed intent: base64url of the intent's JCS bytes, `.`, and base64url of the 64-byte
        Ed25519 signature. The intent follows the schema `deedglass.intent/1`; the signature input
        is `"deedglass/intent/v1\n"` followed by the `intent_hash`. Clocks may differ by up to 60 s
        either way, and an intent lives at most 5 minutes. See docs/INTENTS.md.
      schema:
        type: string
        maxLength: 4096
    DeedglassOnBehalfOf:
      name: Deedglass-On-Behalf-Of
      in: header
      required: false
      description: >-
        The end user the agent acts for, in your own ids. At most once; a malformed or repeated
        header is 422 `validation_failed`.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._~:@/+=-]{1,256}$"
    DeedglassSession:
      name: Deedglass-Session
      in: header
      required: false
      description: >-
        The conversation or session the call belongs to, in your own ids. At most once; a malformed
        or repeated header is 422 `validation_failed`.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._~:@/+=-]{1,256}$"
  headers:
    DeedglassRequestId:
      description: This request's id. Quote it to support; it matches `error.request_id`.
      schema:
        type: string
        pattern: "^req_[0-7][0-9a-hjkmnp-tv-z]{25}$"
    DeedglassVersion:
      description: The API version this response follows.
      schema:
        type: string
    DeedglassIdempotentReplayed:
      description: Present, and `true`, when the response is a stored one replayed for an Idempotency-Key.
      schema:
        type: string
        enum: ["true"]
  responses:
    Error:
      description: An error. Every error has this envelope; `doc_url` explains the code.
      headers:
        Deedglass-Request-Id:
          $ref: "#/components/headers/DeedglassRequestId"
        Deedglass-Version:
          $ref: "#/components/headers/DeedglassVersion"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    MCPOriginRefused:
      description: >-
        A browser `Origin` other than the server's own: a JSON-RPC error without an id
        (DNS-rebinding protection). A key without `actions:execute`, or a stopped or suspended
        agent, also gets 403, with the error envelope.
      headers:
        Deedglass-Request-Id:
          $ref: "#/components/headers/DeedglassRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JSONRPCError"
    MCPResponse:
      description: One JSON-RPC response (a result, or an error such as -32601 for a legacy unknown method).
      headers:
        Deedglass-Request-Id:
          $ref: "#/components/headers/DeedglassRequestId"
      content:
        application/json:
          schema:
            type: object
          example:
            jsonrpc: "2.0"
            id: 3
            result:
              resultType: complete
              content: [{type: text, text: "Echo: hello"}]
              isError: false
              _meta: {com.deedglass/action: act_01k6w4a3d5f7h9k1n3q5s7v9x1, com.deedglass/deed: deed_01k6w4a3d5f7h9k1n3q5s7v9x2}
    MCPRequestRefused:
      description: >-
        A header that doesn't match the body (-32020 HeaderMismatch), an unsupported protocol
        version (-32022 with data.supported and data.requested), a batch or a response (-32600), or
        JSON that can't be parsed (-32700).
      headers:
        Deedglass-Request-Id:
          $ref: "#/components/headers/DeedglassRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JSONRPCError"
          example:
            jsonrpc: "2.0"
            id: 3
            error: {code: -32020, message: 'Header mismatch: Mcp-Name is "echo" but the body names "delete_all". Send the same tool name in both.'}
  requestBodies:
    MCPMessage:
      required: true
      description: A JSON-RPC 2.0 message.
      content:
        application/json:
          schema:
            type: object
          example: {jsonrpc: "2.0", id: 1, method: tools/list}
    OptionalReason:
      required: false
      description: An optional reason. It goes into the deed and the Console; an agent never sees it.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              reason: {type: string, maxLength: 280, description: One line, at most 280 characters.}
          example: {reason: Refund loop in staging}
    RequiredReason:
      required: true
      description: Why it's safe now. It goes into the deed.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [reason]
            properties:
              reason: {type: string, minLength: 3, maxLength: 280, description: One line, 3 to 280 characters.}
          example: {reason: "Root cause fixed: refund threshold was 100x"}
    PolicySource:
      required: true
      description: The policy YAML, and optional notes kept with the version.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [source]
            properties:
              source: {type: string, description: The policy YAML (deedglass policy/v1), at most 256 KiB.}
              notes: {type: string, maxLength: 2000, description: Why this version exists. Kept with the version.}
          example: {source: "deedglass: policy/v1\nname: postgres-safe\n…", notes: Allow-list writes to public.orders for the pilot.}
  schemas:
    LoginRequest:
      type: object
      required: [object, email, expires_in, message]
      properties:
        object: {type: string, const: login_request}
        email: {type: string, description: The address, normalized.}
        expires_in: {type: integer, description: Seconds the link and code work for.}
        message: {type: string}
      examples:
        - object: login_request
          email: priya@acme.com
          expires_in: 900
          message: If priya@acme.com has a Deedglass account, a sign-in link and code are on their way.
    LoginPreview:
      type: object
      required: [object, purpose, email, org, role, invited_by, expires_at]
      properties:
        object: {type: string, const: login_preview}
        purpose: {type: string, enum: [login, invite]}
        email: {type: string}
        org:
          type: object
          required: [id, name]
          properties:
            id: {type: string}
            name: {type: string}
        role: {type: string, enum: [viewer, admin, owner]}
        invited_by:
          type: [object, "null"]
          required: [name, email]
          properties:
            name: {type: string}
            email: {type: string}
        expires_at: {type: string, format: date-time}
      examples:
        - object: login_preview
          purpose: login
          email: priya@acme.com
          org: {id: org_01k6h7kp6msmzrhdzwtcr3jnkp, name: Acme}
          role: owner
          invited_by: null
          expires_at: "2026-10-03T09:29:07.000Z"
    Me:
      type: object
      required: [object, user, org, membership, orgs, session, csrf_token]
      properties:
        object: {type: string, const: me}
        user:
          type: object
          required: [object, id, email, name, created_at]
          properties:
            object: {type: string, const: user}
            id: {type: string}
            email: {type: string}
            name: {type: string}
            created_at: {type: string, format: date-time}
        org:
          $ref: "#/components/schemas/Org"
        membership:
          type: object
          required: [object, id, role, status]
          properties:
            object: {type: string, const: membership}
            id: {type: string}
            role: {type: string, enum: [viewer, admin, owner]}
            status: {type: string}
        orgs:
          type: array
          items:
            type: object
            required: [id, name, role]
            properties:
              id: {type: string}
              name: {type: string}
              role: {type: string}
        session:
          type: object
          required: [id, idle_expires_at, expires_at]
          properties:
