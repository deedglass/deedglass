          source_hash: sha256:2e7d2c03a9507ae265ecf5b5356885a53393a2029d241394997265a1a25aefc6
          lang: deedglass.policy/v1
          origin: manual
          author: {object: user, id: usr_01k6c9kb2zcjsyn7b8g2k1vqvp}
          notes: Allow-list writes to public.orders for the pilot.
          rules: 12
          budgets: 2
          warnings: []
          created_at: "2026-10-06T11:38:15.000Z"
    PolicyVersionList:
      type: object
      required: [object, data, has_more, next_cursor]
