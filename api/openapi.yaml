      properties:
        object: {type: string, const: overview}
        window: {type: string, enum: [24h, 7d]}
        from: {type: string, format: date-time, description: Inclusive.}
        to: {type: string, format: date-time, description: Exclusive; the first bucket boundary at or after now (UTC).}
