          type: array
          items:
            $ref: "#/components/schemas/Membership"
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
    Labels:
      type: object
      maxProperties: 32
      description: >-
        At most 32. Keys match `^[a-z0-9][a-z0-9._/-]{0,62}$`; values are up to 128 printable
        characters. Policies match on labels, so every change seals a deed.
      propertyNames:
        pattern: "^[a-z0-9][a-z0-9._/-]{0,62}$"
      additionalProperties:
        type: string
        maxLength: 128
    Budgets:
      type: object
      additionalProperties: false
      description: >-
        An agent's limits; a limit left out means none. Money is in minor units (cents for usd,
        paise for inr). Deedglass stores and checks them now; the Gate enforces them when it ships.
      properties:
        calls_per_minute: {type: integer, minimum: 1, maximum: 1000000}
        calls_per_day: {type: integer, minimum: 1, maximum: 100000000}
        spend_per_day:
          type: object
          additionalProperties: false
          required: [amount, currency]
          properties:
            amount: {type: integer, minimum: 0, maximum: 9007199254740991, description: Minor units.}
            currency: {type: string, pattern: "^[a-z]{3}$", description: Lowercase ISO 4217, like usd or inr.}
      examples:
        - calls_per_minute: 60
          calls_per_day: 5000
          spend_per_day: {amount: 5000, currency: usd}
    Agent:
      type: object
      required: [object, id, name, description, labels, budgets, status, status_reason, status_changed_at, status_changed_by, owner, active_keys, last_used_at, created_at, updated_at, intent_mode]
      properties:
        object: {type: string, const: agent}
        id: {type: string, pattern: "^agt_[0-7][0-9a-hjkmnp-tv-z]{25}$"}
        name: {type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$", description: Unique in the org and immutable.}
        description: {type: string, maxLength: 500}
        labels:
          $ref: "#/components/schemas/Labels"
        budgets:
          $ref: "#/components/schemas/Budgets"
        status: {type: string, enum: [active, suspended, stopped]}
        status_reason: {type: [string, "null"], maxLength: 280}
        status_changed_at: {type: [string, "null"], format: date-time}
        status_changed_by: {type: [string, "null"], description: '`usr_…`, `key_…` or `operator`.'}
        owner: {type: [string, "null"], description: The person responsible (`usr_…`).}
        active_keys: {type: integer, minimum: 0, maximum: 10}
        last_used_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        intent_mode:
          type: string
          enum: ["off", optional, required]
          description: >-
            Signed intents (S09): off (headers ignored), optional (checked when sent) or required
            (every call needs one).
      examples:
        - object: agent
          id: agt_01k633rrmh3bcz2p39gg4vp46q
          name: support-bot
          description: Answers refund tickets in Zendesk
          labels: {env: prod, team: support}
          budgets: {calls_per_minute: 60, calls_per_day: 5000, spend_per_day: {amount: 5000, currency: usd}}
          status: active
          status_reason: null
          status_changed_at: null
          status_changed_by: null
          owner: usr_01k6c9kb2zcjsyn7b8g2k1vqvp
          active_keys: 0
          last_used_at: null
          created_at: "2026-10-03T10:02:11.000Z"
          updated_at: "2026-10-03T10:02:11.000Z"
          intent_mode: "off"
    AgentResult:
