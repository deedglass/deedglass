      properties:
        object: {type: string, const: policy_diagnostic, description: In the error envelope only.}
        severity: {type: string, enum: [error, warning]}
        code: {type: string, description: Snake case and stable, like `reason_missing` or `default_allow`.}
        message: {type: string, description: One sentence.}
        hint: {type: string, description: The next step.}
        file: {type: string}
        line: {type: integer, minimum: 0, description: 1-based; 0 means the whole file.}
        column: {type: integer, minimum: 0, description: 1-based, in characters.}
        end_line: {type: integer, minimum: 1}
        end_column: {type: integer, minimum: 1, description: Exclusive.}
        rule_id: {type: string}
        path: {type: string, description: 'The YAML path, like `rules[3].when`.'}
        doc_url: {type: string, format: uri}
      examples:
        - object: policy_diagnostic
          severity: warning
          code: default_allow
          message: "defaults.decision: allow lets every unmatched action run."
          hint: Deedglass recommends deny. Enforcing this policy will need an explicit acknowledgement.
          line: 4
          column: 13
          path: defaults.decision
          doc_url: https://docs.deedglass.com/policies/errors/default_allow
