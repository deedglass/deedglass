    post:
      operationId: previewApprovalLink
      summary: Show the approval behind an emailed link
      description: >-
        Public: the one-time token (from the link's `#t=` fragment) in the body is the credential
        (S22). Previewing never consumes the link. Unknown, used, voided and expired tokens all
        answer the same 401 `approval_link_invalid`. Limited to 30 a minute per client and 10 per
        token.
      tags: [Approvals]
