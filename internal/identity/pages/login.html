<h1 id="title" tabindex="-1">Sign in to Deedglass</h1>
<p id="lede" class="lede">We'll email you a link and a code. No password.</p>
<noscript><p class="noscript">Turn on JavaScript to finish signing in, or type the 6-digit code from the email at deedglass.com/login.</p></noscript>
<div class="notice">
<p id="alert" class="alert" role="alert"></p>
<button id="retry" class="btn btn-secondary" type="button" hidden>Try again</button>
</div>
<form id="email-form" novalidate hidden>
<label for="email">Work email</label>
<input id="email" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required aria-describedby="alert">
<button id="email-submit" class="btn btn-primary" type="submit">Continue</button>
</form>
<form id="code-form" novalidate hidden>
<label for="code">6-digit code</label>
<input id="code" class="code-input" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="7" spellcheck="false" required aria-describedby="lede alert">
<button id="code-submit" class="btn btn-primary" type="submit">Sign in</button>
<button id="change-email" class="btn btn-text" type="button">Use a different email</button>
</form>
</main>
