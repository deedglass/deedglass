      kind: select
      category: read
      statements: 1
      writes: false
      write_kinds: []
      tables: []
      ambiguous: false

  - id: R06
    family: read
    sql: "SELECT \"DROP\" FROM t"
    note: a quoted identifier is a name, not a keyword
    differential: true
