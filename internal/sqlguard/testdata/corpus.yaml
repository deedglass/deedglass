    sql: "DELETE FROM orders WHERE 'a'='a'"
    differential: true
    expect:
      kind: delete
      category: write
      statements: 1
      has_where: true
      unbounded_write: true
      where_trivial: true
      ambiguous: false

  - id: W15
    family: write
    sql: "UPDATE orders SET status = 'x' WHERE id=id"
    differential: true
    expect:
