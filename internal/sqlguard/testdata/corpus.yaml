      kind: select
      category: read
      statements: 1
      writes: false
      tables: [public.t]
      ambiguous: false

  - id: R07
    family: read
    sql: "SELECT * FROM orders FOR UPDATE"
    differential: true
    expect:
      kind: select
      category: read
      statements: 1
      writes: false
      locks_rows: true
      tables: [public.orders]
      ambiguous: false

  - id: R08a
    family: read
    sql: "SELECT 1;"
    differential: true
    expect:
      kind: select
      category: read
      kinds: [select]
      statements: 1
      multi: false
      ambiguous: false

  - id: R08b
    family: read
    sql: "SELECT 1; -- done"
    note: a trailing comment after the last semicolon is an empty statement
    differential: true
    expect:
      kind: select
      category: read
      kinds: [select]
      statements: 1
      multi: false
      ambiguous: false

  - id: R09
    family: read
