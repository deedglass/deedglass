      category: write
      statements: 1
      writes: true
      write_kinds: [delete]
      has_where: true
      unbounded_write: true
      where_trivial: true
      tables: [public.orders]
      ambiguous: false

  - id: W04b
    family: write
    sql: "DELETE FROM orders WHERE 1=1"
    differential: true
    expect:
