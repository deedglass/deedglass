      category: write
      statements: 1
      write_kinds: [delete]
      has_where: true
      unbounded_write: false
      where_trivial: false
      tables: [public.customers, public.orders]
      ambiguous: false

  - id: W06
    family: write
    sql: "UPDATE orders SET s='x' WHERE id=42 RETURNING old.s, new.s"
    note: RETURNING old/new needs PostgreSQL 18
    differential: true
    min_pg: 18
    expect:
      kind: update
      category: write
      statements: 1
      write_kinds: [update]
      has_where: true
      unbounded_write: false
      has_returning: true
      tables: [public.orders]
      functions: []
      ambiguous: false

  - id: W07
    family: write
    sql: "MERGE INTO orders o USING staging s ON o.id = s.id WHEN MATCHED THEN DELETE RETURNING merge_action()"
    note: MERGE ... RETURNING needs PostgreSQL 17
    differential: true
    min_pg: 17
    expect:
      kind: merge
      category: write
      statements: 1
      writes: true
      write_kinds: [delete]
      unbounded_write: false
      has_returning: true
      tables: [public.orders, public.staging]
      functions: [merge_action]
      unknown_functions: []
      ambiguous: false

  - id: W08
    family: write
    sql: "INSERT INTO orders (id, status) VALUES (42, 'new') ON CONFLICT (id) DO UPDATE SET status = excluded.status"
    differential: true
    expect:
      kind: insert
      category: write
      statements: 1
      writes: true
      write_kinds: [insert, update]
      has_where: false
      unbounded_write: false
      tables: [public.orders]
      ambiguous: false

  - id: W09
    family: write
    sql: "SELECT * INTO orders_copy FROM orders"
    note: SELECT INTO creates a table, so it is ddl; Postgres tags it SELECT
    differential: true
    expect:
      kind: select
      category: ddl
      kinds: [select]
      statements: 1
      writes: true
      write_kinds: []
      select_into: true
      tables: [public.orders, public.orders_copy]
      ambiguous: false

  - id: W10a
    family: write
    sql: "COPY orders FROM STDIN"
    note: the simple-protocol runner can't feed COPY data
    differential: false
    expect:
      kind: copy
      category: write
      statements: 1
      writes: true
      write_kinds: [copy]
      copy_program: false
      tables: [public.orders]
      ambiguous: false

  - id: W10b
    family: write
    sql: "COPY orders TO STDOUT"
    note: the simple-protocol runner can't read COPY data
    differential: false
    expect:
      kind: copy
      category: read
      statements: 1
      writes: false
      write_kinds: []
      copy_program: false
      tables: [public.orders]
      ambiguous: false

  - id: W11
    family: write
