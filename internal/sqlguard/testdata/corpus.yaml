      tables_complete: true
      ambiguous: false

  - id: R11
    family: read
    sql: "SELECT * FROM orders WHERE status = 'open' FOR SHARE"
    differential: true
    expect:
      kind: select
      category: read
      statements: 1
      writes: false
      locks_rows: true
      tables: [public.orders]
      ambiguous: false

  - id: R12
    family: read
    sql: "(SELECT 1)"
    note: a parenthesised leading statement
    differential: true
    expect:
      kind: select
      category: read
      kinds: [select]
      statements: 1
      ambiguous: false

  - id: R13
    family: read
    sql: "SELECT 1 WHERE EXISTS (SELECT 1 FROM orders)"
    note: exists is a keyword, not a function; the subquery's table is found
    differential: true
    expect:
      kind: select
      category: read
      statements: 1
      tables: [public.orders]
      tables_complete: true
      functions: []
      ambiguous: false

  - id: R14
    family: read
    sql: "SELECT * FROM generate_series(1,3)"
    note: a function in FROM makes the table list incomplete; it is not a table
    differential: true
    expect:
      kind: select
      category: read
      statements: 1
      tables: []
      tables_complete: false
      functions: [generate_series]
      unknown_functions: []
      ambiguous: false

  - id: R15
    family: read
    sql: "SELECT * FROM a.b.c"
    note: three-part name; Postgres rejects it with 0A000 (cross-database reference), not a syntax error
    differential: false
    expect:
      kind: select
      category: read
      statements: 1
      tables_complete: false
      ambiguous: false

  - id: R16
    family: read
    sql: "SELECT o.id, c.name FROM orders o JOIN customers c ON c.id = o.customer_id WHERE o.status = 'open'"
    note: aliases are not tables
    differential: true
    expect:
      kind: select
      category: read
      statements: 1
      tables: [public.customers, public.orders]
      tables_complete: true
      functions: []
      ambiguous: false

  - id: R17
    family: read
    sql: "SELECT \"Weird\"\"Name\".id FROM public.\"Weird\"\"Name\""
    note: a quoted identifier keeps its case and unescapes the doubled quote
    differential: true
    expect:
      kind: select
      category: read
      statements: 1
      tables: ["public.Weird\"Name"]
      ambiguous: false

  - id: R18
    family: read
    sql: ""
    note: the empty string
    differential: true
    expect:
      kind: empty
      category: none
      kinds: []
      statements: 0
      multi: false
      writes: false
      ambiguous: false
      reasons: []
      bytes: 0

  - id: R19
    family: read
    sql: ";;;"
    note: only semicolons
    differential: true
    expect:
      kind: empty
      category: none
      kinds: []
      statements: 0
      multi: false
      ambiguous: false

  - id: R20
    family: read
    sql: "SELECT id FROM orders WHERE id = 1"
    note: invariance pair with R21
    differential: true
    expect:
      kind: select
      category: read
      kinds: [select]
      statements: 1
      multi: false
      writes: false
      tables: [public.orders]
      ambiguous: false

  - id: R21
    family: read
    sql: "  select\n\tID\nfrom   ORDERS where id=1  "
    note: invariance pair with R20 (case and whitespace)
    differential: true
    expect:
      kind: select
      category: read
      kinds: [select]
      statements: 1
      multi: false
      writes: false
      tables: [public.orders]
      ambiguous: false

  - id: R22
    family: read
    sql: "SELECT o.id, l.name FROM orders o, LATERAL (SELECT name FROM customers c WHERE c.id = o.customer_id) l"
    differential: true
    expect:
      kind: select
      category: read
      statements: 1
      tables_complete: false
      ambiguous: false

  - id: R23
    family: read
    sql: "SELECT * FROM ROWS FROM (generate_series(1,2), generate_series(1,3))"
    differential: true
    expect:
      kind: select
      category: read
      statements: 1
      tables_complete: false
      functions: [generate_series]
      ambiguous: false

  - id: R24
    family: read
    sql: "SELECT $1"
    note: a lone parameter; Postgres rejects it with 42P02 when no value is bound
    differential: false
    expect:
      kind: select
      category: read
      statements: 1
      writes: false
      tables: []
      ambiguous: false

  - id: R25
    family: read
    sql: "SELECT count(*) FROM orders o WHERE o.total > 5 GROUP BY o.status ORDER BY 1 LIMIT 10 OFFSET 0"
    differential: true
    expect:
      kind: select
      category: read
      statements: 1
      writes: false
      write_kinds: []
      has_where: false
      unbounded_write: false
      tables: [public.orders]
      functions: [count]
      ambiguous: false

  # ---------------------------------------------------------------- write
  - id: W01
    family: write
    sql: "INSERT INTO public.support_notes (order_id, body) VALUES (42, 'Called')"
    differential: true
    expect:
      kind: insert
      category: write
      kinds: [insert]
      statements: 1
      writes: true
      write_kinds: [insert]
      has_where: false
      unbounded_write: false
      tables: [public.support_notes]
      ambiguous: false

  - id: W02
    family: write
    sql: "UPDATE orders SET status = 'shipped' WHERE id = 42"
    differential: true
    expect:
      kind: update
      category: write
      statements: 1
      writes: true
      write_kinds: [update]
      has_where: true
      unbounded_write: false
      where_trivial: false
      tables: [public.orders]
      ambiguous: false

  - id: W03
    family: write
    sql: "UPDATE orders SET status = 'shipped'"
    differential: true
    expect:
      kind: update
      category: write
      statements: 1
      writes: true
      write_kinds: [update]
      has_where: false
      unbounded_write: true
      where_trivial: false
      tables: [public.orders]
      ambiguous: false

  - id: W04a
    family: write
