      kind: select
      category: read
      kinds: [select]
      statements: 1
      writes: false
      tables: []
      tables_complete: true
      functions: []
      ambiguous: false

  - id: R05a
    family: read
    sql: "SELECT 'DROP TABLE orders'"
    note: keywords inside a string are not seen
    differential: true
    expect:
      kind: select
      category: read
      statements: 1
      writes: false
      tables: []
      ambiguous: false

  - id: R05b
    family: read
    sql: "SELECT $$ DELETE FROM x $$"
    differential: true
