# sqlguard corpus: the executable description of what Analyze reports (docs/SQLGUARD.md is the prose one).
#
# Each case is one SQL string (or a generated one, `gen`) and the facts that matter for it. Fields left
# out of `expect` are not checked. Every case sets at least kind, category, statements and ambiguous.
#
# Two runners read this file:
#   - TestCorpus (unit, pure Go):           go test ./internal/sqlguard/ -run TestCorpus
#     checks every case's `expect` against Analyze(sql, Options{}).
#   - TestCorpusDifferential (integration): make integration   (corpus_integration_test.go)
#     runs every `differential: true` case on a throwaway Postgres inside BEGIN ... ROLLBACK, after
#     resetting schema public and running `setup`, and checks that Postgres's command tags agree with
#     Analyze's kinds and statement count. Cases Postgres rejects as a syntax error (42601) must be
#     ambiguous or kind "other". server_code cases, dangerous functions, COPY ... PROGRAM and role or
#     ALTER SYSTEM statements are never run; the test refuses a case that would.
#
# Families (id prefix): read (R), write (W), cte (C), ddl (D), privilege (D04/D05/O12/P),
# server_code (S01-S04, S12+), functions (S05-S11, F), multi (M), obfuscation (O), session (SE, O13),
# transaction (TX), maintenance (MA, O14), limits (O16, L).
#
# Optional `min_pg` skips a differential case on older servers (RETURNING old/new needs 18;
# MERGE ... RETURNING needs 17). Non-ASCII and control characters are written as YAML escapes
# (\u200b, \0, \r) so nothing in this file is invisible.
version: 1

setup: |
  CREATE TABLE public.orders (id int PRIMARY KEY, status text, s text, customer_id int, total numeric);
  CREATE TABLE public.customers (id int PRIMARY KEY, name text);
  CREATE TABLE public.support_notes (order_id int, body text);
  CREATE TABLE public.order_tags (order_id int, tag text);
  CREATE TABLE public.staging (id int, status text);
  CREATE TABLE public.t (id int, "DROP" text);
  CREATE TABLE public.x (id int);
  CREATE TABLE public."Weird""Name" (id int);
  CREATE TABLE public."orders; DROP TABLE x" (id int);
  CREATE SEQUENCE public.orders_id_seq;
  CREATE MATERIALIZED VIEW public.customer_names AS SELECT id, name FROM public.customers;
  INSERT INTO public.orders VALUES (1, 'open', 'a', 1, 10), (2, 'shipped', 'b', 2, 20), (42, 'open', 'c', 1, 42);
  INSERT INTO public.customers VALUES (1, 'Asha'), (2, 'Ravi');
  INSERT INTO public.staging VALUES (1, 'closed'), (7, 'new');
  INSERT INTO public.order_tags VALUES (1, 'spam');
  INSERT INTO public.t VALUES (1, 'x');
  INSERT INTO public.x VALUES (1);
  DROP SCHEMA IF EXISTS app CASCADE;
  CREATE SCHEMA app;
  CREATE FUNCTION app.cleanup_everything() RETURNS int LANGUAGE sql AS 'SELECT 0';

cases:
  # ---------------------------------------------------------------- read
  - id: R01
    family: read
    sql: "SELECT id, status FROM public.orders WHERE id = 42"
    differential: true
    expect:
      kind: select
      category: read
      kinds: [select]
      statements: 1
      multi: false
      writes: false
      write_kinds: []
      has_where: false
      tables: [public.orders]
      tables_complete: true
      functions: []
      ambiguous: false
      reasons: []
      bytes: 50

  - id: R02
    family: read
    sql: "select * from orders limit 5"
    note: an unqualified name gets the default schema
    differential: true
    expect:
      kind: select
      category: read
      statements: 1
      writes: false
      tables: [public.orders]
      tables_complete: true
      ambiguous: false

  - id: R03
    family: read
    sql: "WITH r AS (SELECT * FROM orders) SELECT count(*) FROM r"
    note: the CTE name r is not a table
    differential: true
    expect:
      kind: select
      category: read
      statements: 1
      writes: false
      cte_write: false
      tables: [public.orders]
      functions: [count]
      unknown_functions: []
      ambiguous: false

  - id: R04a
    family: read
    sql: "TABLE orders"
    differential: true
    expect:
      kind: select
      category: read
      kinds: [select]
      statements: 1
      writes: false
      tables: [public.orders]
      ambiguous: false

  - id: R04b
    family: read
    sql: "VALUES (1),(2)"
    differential: true
