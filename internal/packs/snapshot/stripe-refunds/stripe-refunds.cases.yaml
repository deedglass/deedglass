# Test cases for stripe-refunds.yaml. Run them with:
#   deedglass policy test policies/stripe-refunds.yaml
# request.stripe is what the Stripe connector read from Stripe before the decision.
policy: stripe-refunds.yaml
defaults:
  agent: { name: support-bot, labels: { env: prod } }
  org: { timezone: Asia/Kolkata }
  time: 2026-10-10T10:00:00+05:30
cases:
  # Reads
  - name: reading a charge runs freely
    input: { tool: stripe.get_charge, args: { charge: ch_3QxZ8f2LdemoA1 } }
    expect: { decision: allow, rule: stripe-reads, verify: L0 }
  - name: listing refunds runs freely
    input: { tool: stripe.list_refunds, args: { charge: ch_3QxZ8f2LdemoA1, limit: 10 } }
    expect: { decision: allow, rule: stripe-reads }

  # Refunds without a usable amount
  - name: a refund with no amount is refused
    input: { tool: stripe.create_refund, args: { charge: ch_3QxZ8f2LdemoA1 } }
    expect: { decision: deny, rule: refunds-need-an-amount, code: policy_denied, reason_contains: "like 2000 for $20.00" }
  - name: an amount written as dollars in a string is refused
    input: { tool: stripe.create_refund, args: { charge: ch_3QxZ8f2LdemoA1, amount: "20.00" } }
    expect: { decision: deny, rule: refunds-need-an-amount }
  - name: a float amount is refused
    input: { tool: stripe.create_refund, args: { charge: ch_3QxZ8f2LdemoA1, amount: 20.5 } }
    expect: { decision: deny, rule: refunds-need-an-amount }
  - name: a zero refund is refused
    input: { tool: stripe.create_refund, args: { charge: ch_3QxZ8f2LdemoA1, amount: 0 } }
    expect: { decision: deny, rule: refunds-need-an-amount }

  # Enrichment down: never an allow
  - name: when Stripe can't be read, a small refund still waits for a person
    input: { tool: stripe.create_refund, args: { charge: ch_3QxZ8f2LdemoA1, amount: 2000 }, request: { stripe: { enriched: false } } }
    expect: { decision: require_approval, rule: refunds-need-context, reason_contains: "couldn't read the charge", notify: [slack] }

  # What's left on the charge
  - name: a refund over what is left to refund never runs
    input:
      tool: stripe.create_refund
      args: { charge: ch_3QxZ8f2LdemoA1, amount: 5000 }
      request: { stripe: { enriched: true, charge: ch_3QxZ8f2LdemoA1, currency: usd, charge_amount: 14900, amount_refunded: 12000, refundable: 2900 } }
    expect: { decision: deny, rule: refund-within-charge, reason_contains: "larger than what is left" }
  - name: refunding exactly what is left runs
    input:
      tool: stripe.create_refund
      args: { charge: ch_3QxZ8f2LdemoA1, amount: 2900 }
      request: { stripe: { enriched: true, currency: usd, charge_amount: 14900, amount_refunded: 12000, refundable: 2900 } }
    expect: { decision: allow, rule: small-refunds }

  # Disputed and foreign-currency charges
  - name: a refund on a disputed charge waits for a person
    input:
      tool: stripe.create_refund
      args: { charge: ch_3QxZ8f2LdemoA1, amount: 1000 }
      request: { stripe: { enriched: true, currency: usd, charge_amount: 14900, refundable: 14900, disputed: true } }
    expect: { decision: require_approval, rule: disputed-charges-need-approval }
  - name: a ¥5,000 refund waits for a person
    input:
      tool: stripe.create_refund
      args: { charge: ch_3QxZ8f2LdemoJP, amount: 5000 }
      request: { stripe: { enriched: true, currency: jpy, charge_amount: 10000, refundable: 10000, amount_display: "¥5,000" } }
    expect: { decision: require_approval, rule: non-usd-refunds-need-approval, verify: L1 }
  - name: a small euro refund still waits, because the cap is in dollars
    input:
      tool: stripe.create_refund
      args: { charge: ch_3QxZ8f2LdemoEU, amount: 950 }
      request: { stripe: { enriched: true, currency: eur, charge_amount: 9500, refundable: 9500 } }
    expect: { decision: require_approval, rule: non-usd-refunds-need-approval }

  # Small refunds
  - name: a $20.00 refund runs, witnessed at L1
    input:
      tool: stripe.create_refund
      args: { charge: ch_3QxZ8f2LdemoA1, amount: 2000 }
      request: { stripe: { enriched: true, currency: usd, charge_amount: 14900, refundable: 14900, amount_display: "$20.00" } }
    expect: { decision: allow, rule: small-refunds, verify: L1 }
  - name: exactly $50.00 still runs
    input:
      tool: stripe.create_refund
      args: { charge: ch_3QxZ8f2LdemoA1, amount: 5000 }
      request: { stripe: { enriched: true, currency: usd, charge_amount: 14900, refundable: 14900 } }
    expect: { decision: allow, rule: small-refunds }

  # Large refunds
  - name: $50.01 waits for a human
    input:
      tool: stripe.create_refund
      args: { charge: ch_3QxZ8f2LdemoA1, amount: 5001 }
      request: { stripe: { enriched: true, currency: usd, charge_amount: 14900, refundable: 14900 } }
    expect:
      decision: require_approval
      rule: large-refunds-need-approval
      code: approval_required
      verify: L1
      approval: { required: 1, approvers: [role:admin], expires_in: 2h }
      notify: [slack]
  - name: the $120.00 demo refund waits for a human
    input:
      tool: stripe.create_refund
      args: { charge: ch_3QxZ8f2LdemoA1, amount: 12000 }
      request: { stripe: { enriched: true, currency: usd, charge_amount: 14900, refundable: 14900, amount_display: "$120.00" } }
    expect: { decision: require_approval, rule: large-refunds-need-approval, reason_contains: "Refunds over $50.00 wait for a human" }

  # The daily cap across all agents
  - name: the 26th $20.00 refund of the day is refused and names the total
    input:
      tool: stripe.create_refund
      args: { charge: ch_3QxZ8f2LdemoA1, amount: 2000 }
      request: { stripe: { enriched: true, currency: usd, charge_amount: 500000, refundable: 450000 } }
      usage: { refunds-per-day: 50000 }
    expect:
      decision: deny
      code: budget_exceeded
      rule: "budget:refunds-per-day"
      message: "Budget \"refunds-per-day\" reached: this action would bring today's total across all agents to $520.00 of $500.00. It resets at midnight Asia/Kolkata (in 14 h)."
  - name: the 25th $20.00 refund lands exactly on the cap and runs
    input:
      tool: stripe.create_refund
      args: { charge: ch_3QxZ8f2LdemoA1, amount: 2000 }
      request: { stripe: { enriched: true, currency: usd, charge_amount: 500000, refundable: 452000 } }
      usage: { refunds-per-day: 48000 }
    expect: { decision: allow, rule: small-refunds }
  - name: a refund Stripe couldn't confirm doesn't count toward the cap, and waits
    input:
      tool: stripe.create_refund
      args: { charge: ch_3QxZ8f2LdemoA1, amount: 2000 }
      request: { stripe: { enriched: false } }
      usage: { refunds-per-day: 50000 }
    expect: { decision: require_approval, rule: refunds-need-context }
  - name: a yen refund doesn't count toward the dollar cap
    input:
      tool: stripe.create_refund
      args: { charge: ch_3QxZ8f2LdemoJP, amount: 5000 }
      request: { stripe: { enriched: true, currency: jpy, charge_amount: 10000, refundable: 10000 } }
      usage: { refunds-per-day: 50000 }
    expect: { decision: require_approval, rule: non-usd-refunds-need-approval }
  - name: reads never count against the refund cap
    input: { tool: stripe.get_charge, args: { charge: ch_3QxZ8f2LdemoA1 }, usage: { refunds-per-day: 50000 } }
    expect: { decision: allow, rule: stripe-reads }

  # Subscriptions, metadata and invoice items
  - name: cancelling a subscription waits a day for a human
    input: { tool: { name: stripe.cancel_subscription, side_effect: destructive }, args: { subscription: sub_1QdemoSub001 } }
    expect:
      decision: require_approval
      rule: cancellations-need-approval
      verify: L1
      approval: { required: 1, approvers: [role:admin], expires_in: 24h }
  - name: updating customer metadata runs, witnessed at L1
    input: { tool: stripe.update_customer_metadata, args: { customer: cus_Q2demoCust01, metadata: { tier: gold } } }
    expect: { decision: allow, rule: metadata-updates, verify: L1 }
  - name: an invoice item waits for a human
    input: { tool: stripe.create_invoice_item, args: { customer: cus_Q2demoCust01, amount: 1500, currency: usd } }
    expect: { decision: require_approval, rule: invoice-items-need-approval, approval: { expires_in: 2h } }

  # Deletes and everything else
  - name: deleting a customer never runs
    input: { tool: { name: stripe.delete_customer, side_effect: destructive }, args: { customer: cus_Q2demoCust01 } }
    expect: { decision: deny, rule: block-other-destructive, code: policy_denied, notify: [slack] }
  - name: a payout falls to the default
    input: { tool: stripe.create_payout, args: { amount: 100000, currency: usd } }
    expect: { decision: deny, rule: default, reason_contains: No rule allows this action }
  - name: a stopped agent is refused before any rule
    input: { tool: stripe.get_charge, args: { charge: ch_3QxZ8f2LdemoA1 }, agent: { status: stopped } }
    expect: { decision: deny, code: agent_stopped, rule: stop }
