deedglass: policy/v1
name: warn-secret-in-description
defaults:
  decision: deny
  reason: No rule allows this action. Add a rule in Console › Policies to allow it.
rules:
  - id: allow-stripe-reads
    description: Reads with the key dg_live_abcdefghijklmnopqrstuvwx are fine.
    match: { connector_type: stripe, side_effect: read }
    decision: allow
