deedglass: policy/v1
name: cel-string-vs-int
defaults:
  decision: deny
  reason: No rule allows this action. Add a rule in Console › Policies to allow it.
rules:
  - id: small-refunds
    match: { tool: stripe.create_refund }
    when: >
      has(args.amount) &&
      args.amount <= "5000"
    decision: allow
