deedglass: policy/v1
name: duplicate-key
defaults:
  decision: deny
  reason: No rule allows this action. Add a rule in Console › Policies to allow it.
rules:
  - id: small-refunds
    match: { tool: stripe.create_refund }
    decision: allow
    when: args.amount <= minor("50.00 usd")
    decision: deny
