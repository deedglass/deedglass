deedglass: policy/v1
name: cel-glob-not-constant
defaults:
  decision: deny
  reason: No rule allows this action. Add a rule in Console › Policies to allow it.
rules:
  - id: matching-tools
    match: { tool: "*" }
    when: >-
      tool.connector_type == "stripe" &&
      glob(tool.name, args.pattern)
    decision: allow
