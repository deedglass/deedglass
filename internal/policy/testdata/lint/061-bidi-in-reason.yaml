deedglass: policy/v1
name: bidi-in-reason
defaults:
  decision: deny
  reason: No rule allows this action. Add a rule in Console › Policies to allow it.
rules:
  - id: deny-drop
    match: { connector_type: postgres }
    when: sql.kind == "drop"
    decision: deny
    reason: DROP never runs ‮slennahc lla‬ through agents.
