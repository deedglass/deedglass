# attack-baseline · the attack suite's policy (S18). Rule order is deliberate: the specific
# refusals come before the allows. The first rule is the "permissive policy" of S18 §3.4, scoped
# to one agent: permissive-bot's SQL is allowed by policy, so the Postgres connector's own
# refusals are what stop it. One enforced policy serves every case; nothing is re-activated
# mid-run.
deedglass: policy/v1
name: attack-baseline
description: The attack suite's policy. SQL refusals first, then the allows.

defaults:
  decision: deny
  reason: No rule allows this tool. Add a rule to allow it.

rules:
  # S22's group L: three agents whose fake.echo calls wait for people. They exist only for the
  # approval cases, so no other case meets these rules.
  - id: undo-needs-approval
    description: S23's starter rule. A person's undo waits for another person's countersign.
    match: { tool: "*.undo", connector_type: postgres }
    decision: require_approval
    reason: Undoing a write changes data again, so a human confirms it first.
    approval: { approvers: [role:admin], required: 1, expires_in: 30m }
    verify: L2
  - id: approval-one-admin
    description: approval-bot's calls wait for one admin to countersign (L01, L03, L04, L06).
    match: { agent: approval-bot, tool: fake.echo }
    decision: require_approval
    reason: One admin countersigns approval-bot's calls.
    approval: { approvers: [role:admin], required: 1, expires_in: 30m }
  - id: approval-four-eyes
    description: foureyes-bot's calls wait for two different admins (L02).
    match: { agent: foureyes-bot, tool: fake.echo }
    decision: require_approval
    reason: Two different admins countersign foureyes-bot's calls.
    approval: { approvers: [role:admin], required: 2, expires_in: 30m }
  - id: approval-short-expiry
    description: expiry-bot's approvals expire after the shortest time a rule may give (L05).
    match: { agent: expiry-bot, tool: fake.echo }
    decision: require_approval
    reason: One admin countersigns expiry-bot's calls within a minute.
    approval: { approvers: [role:admin], required: 1, expires_in: 1m }
  - id: fhir-proven
    description: proven-bot's FHIR calls that build a request run, witnessed at L2 from the FHIR server's own change log (HC-P05's I05 to I08).
    match: { agent: proven-bot, connector_type: fhir }
    when: request.fhir.enriched
    decision: allow
    verify: L2
  - id: fhir-clinic
    description: clinic-bot's FHIR calls that build a request run, checked at L1 (HC-P02's group I). A type outside the connector's allowed_resource_types builds none, so the default denies it (I10).
    match: { agent: clinic-bot, connector_type: fhir }
    when: request.fhir.enriched
    decision: allow
    verify: L1
  - id: witness-writes
    description: witness-bot's single statements run and are witnessed at L2 by Postgres (S21's W cases and H08 to H11).
    match: { agent: witness-bot, tool: "postgres.*" }
    when: '!sql.multi && !sql.cte_write && !sql.ambiguous && sql.category != "unknown"'
    decision: allow
    verify: L2
  - id: permissive-postgres
    description: Allows every postgres.* call by permissive-bot, to show the connector refuses on its own.
    match: { agent: permissive-bot, tool: "postgres.*" }
    decision: allow
  - id: block-multi-statement
    match: { tool: "postgres.*" }
    when: sql.multi
    decision: deny
    reason: One statement per action. Split it into separate actions.
  - id: block-hidden-writes
    match: { tool: "postgres.*" }
    when: sql.cte_write
    decision: deny
    reason: Writes hidden inside a SELECT are never allowed. Send the write as its own statement.
  - id: block-destructive-sql
    match: { tool: "postgres.*" }
    when: sql.kind in ["drop", "truncate"] || sql.category in ["ddl", "privilege"]
    decision: deny
    reason: DROP is never allowed for agents.
  - id: block-copy
    match: { tool: "postgres.*" }
    when: sql.kind == "copy" || sql.copy_program
    decision: deny
    reason: COPY is never allowed for agents. Read rows with postgres.query instead.
  - id: block-do
    match: { tool: "postgres.*" }
    when: sql.kind == "do"
    decision: deny
    reason: Anonymous code blocks are never allowed. Call an allow-listed function instead.
  - id: block-unbounded-writes
    match: { tool: postgres.execute }
    when: sql.unbounded_write
    decision: deny
    reason: UPDATE and DELETE need a WHERE clause that names the rows to change.
  - id: deny-unclassified
    match: { tool: "postgres.*" }
    when: sql.ambiguous || sql.category == "unknown"
    decision: deny
    reason: Deedglass couldn't classify this statement, so it did not run. Send one plain statement.
  - id: allow-hostile-upstreams
    description: S34's group Q. The attacker's calls to the loopback MCP servers are allowed, so the Gate's own limits are what stop them.
    match:
      agent: attacker
      tool: [qpoison.read_file, qpoison.cleanup, qpoison.notes, qpoison.audit, qrug.read_file, qrug.write_file, qshadow-a.read_file, qshadow-b.read_file, qresults.big, qresults.deep, qslow.hang, qdown.read_file]
    decision: allow
  - id: allow-reads
    match: { tool: [postgres.query, postgres.describe, fake.echo, fs.read_file, secrets.get, pgsecret.query, orders.get, meta.get, rebind.get, redirect.meta, redirect.cross] }
    decision: allow
  - id: allow-writes
    match: { tool: [postgres.execute] }
    decision: allow
